# ============================================================
# 语义层数据模板 — 对应 MySQL data_agent 库 (dataAgent-admin-api)
# ============================================================
#
# 此文件仅作为填写参考模板，实际数据通过管理后台录入 MySQL。
# 交付流程: 参照此模板填写 Excel/CSV → 管理员通过 admin API 导入。
#
# 数据消费链路:
#   MySQL (语义层) + MySQL (业务库 DDL) → 合并 Schema → BGE-M3 编码 → Milvus 索引
#
# 对应 MySQL 表:
#   da_table            — 表语义
#   da_table_column     — 列语义 (FK → da_table.id)
#   da_table_relation   — 关联关系 (FK → da_table.id)
#   da_table_query      — 表级常见问题 (FK → da_table.id)
#   da_glossary         — 业务术语
#   da_enum_def         — 枚举定义
#   da_enum_value       — 枚举值 (FK → da_enum_def.id)
#   da_fewshot          — 全局 Few-shot 示例
#
# ============================================================

# ── 1. 表语义 (da_table) ──
table:
  name: pmt_example                      # 必填，MySQL 表名
  database_name: dwd_banking             # 必填，MySQL 库名
  display_name: 示例表                    # 中文名，出现在检索文本和 DDL 注释
  description: |                         # 表描述，越具体越好，直接影响语义召回
    这张表的业务含义、每行代表什么、核心用途。
    写清楚"谁在什么场景下用这张表查什么"。
  tags: '["标签1", "标签2", "英文别名"]'    # 业务标签，JSON 数组，补充同义词/别名
  query_tips: 已完成用 status=1           # 查询注意事项，DDL 底部输出 "-- 注意: xxx"

# ── 2. 列语义 (da_table_column) ──
# 只需填写需要补充语义的列，MySQL DDL 中已有的列名/类型会自动获取
columns:
  # --- 普通列 ---
  - name: column_a                       # 必填，列名（与 MySQL 一致）
    type: BIGINT                         # 数据类型
    display_name: 列A中文名               # 短名，DDL 注释第一段
    description: 详细说明，如取值格式       # 长描述，DDL 注释第二段
    enum_values: '[]'                    # 枚举值 JSON（也可在 da_enum_def/da_enum_value 维护）
    business_logic: 计算逻辑说明           # 仅影响列级检索文本，不出现在 DDL

  # --- 敏感列（DDL 不输出，不建索引）---
  - name: column_secret
    display_name: 手机号
    sensitive: true                       # DDL 跳过此列，检索也跳过

  # --- 技术列（DDL 输出但不建索引）---
  - name: column_json_blob
    display_name: JSON快照
    skip_index: true                      # 不参与向量检索，但 DDL 仍会输出

  # --- 渠道/编码类字段（推荐写明格式和示例值）---
  - name: channel_code
    display_name: 渠道编码
    description: 上游银行/卡组织渠道，格式为"渠道名_后缀"如 CIMB_20241017，查询时用 LIKE '渠道名%' 匹配

# ── 3. 表关联关系 (da_table_relation) ──
relations:
  - column_name: account_id              # 本表关联列
    target_table: pmt_account            # 目标表
    target_column: account_id            # 目标列
    join_type: LEFT JOIN                 # JOIN 类型

# ── 4. 表级常见问题 (da_table_query) ──
# 绑定到某张表的常见问题，同时增强该表的检索召回
common_queries:
  - question: 示例问题                    # 自然语言问题
    sql: |                               # 完整可执行 SQL
      SELECT COUNT(*) AS "数量"
      FROM dwd_banking.pmt_example
      WHERE status = 1;
    tables: '["pmt_example"]'            # 涉及的表，JSON 数组
    difficulty: easy                      # easy / medium / hard

# ── 5. 业务术语 (da_glossary) ──
glossary:
  - term: 活跃商户                        # 术语名
    definition: account_status=1 且 is_delete=0 的账户  # 业务定义
    sql_hint: "account_status = 1 AND is_delete = 0"    # SQL 片段提示
    related_tables: '["pmt_account"]'    # 关联表 JSON 数组
    related_columns: '["pmt_account.account_status", "pmt_account.is_delete"]'

# ── 6. 枚举字典 (da_enum_def + da_enum_value) ──
# 父子结构: 一个 da_enum_def 对应多个 da_enum_value
enums:
  - table_name: pmt_example
    field_name: column_a
    field_label: 列A中文名
    values:
      - code: "1000"                     # 实际存储值
        label: OptionA                    # 英文标签
        label_cn: 选项A                   # 中文标签
      - code: "2000"
        label: OptionB
        label_cn: 选项B

# ── 7. 全局 Few-shot (da_fewshot) ──
# 不绑定特定表的全局 Few-shot 示例
fewshot:
  - question: 示例问题
    sql: |
      SELECT COUNT(*) AS "数量"
      FROM dwd_banking.pmt_example
      WHERE status = 1;
    tables: '["pmt_example"]'
    difficulty: easy
