# ============================================================
# 语义层表定义模板
# ============================================================
#
# 字段消费说明（三个消费方）:
#   [索引] document_builder — 构建向量化文本，影响检索召回
#   [提示] schema_formatter — 生成 DDL 注释，LLM 直接看到
#   [哈希] index_manager    — 内容变更检测，变了自动重建索引
#
# ============================================================

# ── 表级信息 ──
table:
  name: pmt_example                    # [索引][提示][哈希] 必填，表名
  database: dwd_banking                # [提示] 库名，拼 DDL 全限定名
  display_name: 示例表                  # [索引][提示][哈希] 中文名，出现在表级向量文本和 DDL 注释
  description: |                       # [索引][提示][哈希] 表描述，越具体越好，直接影响语义召回
    这张表的业务含义、每行代表什么、核心用途。
    写清楚"谁在什么场景下用这张表查什么"。
  tags: [标签1, 标签2, 英文别名]         # [索引][哈希] 业务标签，补充同义词/别名，提升召回
  query_tips: 已完成用 status=1         # [索引][提示] 查询注意事项，DDL 底部 "-- 注意: xxx"

# ── 列定义 ──
columns:
  # --- 普通列 ---
  - name: column_a                     # [索引][提示][哈希] 必填，列名
    type: BIGINT                       # [提示][哈希] 离线模式必填；在线模式从 Doris DDL 取
    display_name: 列A中文名             # [索引][提示][哈希] 短名，DDL 注释第一段
    description: 详细说明，如取值格式    # [索引][提示] 长描述，DDL 注释第二段。列名/display_name 不够表达时用
    enum_values:                       # [索引][提示] 枚举值，DDL 注释内联 [value=label, ...]
      - {value: 1000, label: "选项A"}
      - {value: 2000, label: "选项B"}
    business_logic: 计算逻辑说明        # [索引] 仅影响列级检索文本，不出现在 DDL

  # --- 敏感列（DDL 不输出，不建索引）---
  - name: column_secret
    display_name: 手机号
    sensitive: true                    # [索引][提示] DDL 跳过此列，检索也跳过

  # --- 技术列（DDL 输出但不建索引）---
  - name: column_json_blob
    display_name: JSON快照
    skip_index: true                   # [索引] 不参与向量检索，但 DDL 仍会输出

  # --- 带实际值示例的列（推荐用于渠道/编码类字段）---
  - name: channel_code
    display_name: 渠道编码
    description: 上游银行/卡组织渠道，格式为"渠道名_后缀"如 CIMB_20241017, VISA_UQPAY20240627，查询时用 LIKE '渠道名%' 匹配

# ── 关联关系 ──
# [索引][提示] 索引文本写入"关联: xxx"，DDL 底部输出 JOIN 提示
# 同时影响关联表补全：命中本表时，关联表自动加分
relations:
  - column: account_id                 # 本表列
    target_table: pmt_account          # 目标表
    target_column: account_id          # 目标列
    join_type: LEFT JOIN               # JOIN 类型

# ── 常见问题 ──
# [索引][哈希] question 写入表级向量文本（最多 5 条），直接提升"这类问题→这张表"的召回
# 同时作为 Few-shot 示例库，检索时按语义相似度 + 表重叠 + MMR 选取
common_queries:
  - question: 示例问题                  # 自然语言问题
    sql: |                             # 完整可执行 SQL
      SELECT COUNT(*) AS "数量"
      FROM dwd_banking.pmt_example
      WHERE status = 1;
    tables: [pmt_example]              # 涉及的表（用于 Few-shot 表重叠加权）
    difficulty: easy                   # easy / medium / hard
