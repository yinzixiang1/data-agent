table:
  name: pmt_service_rate_scheme
  database: dwd_banking
  display_name: 费率方案表
  description: '平台费率方案的主表，支持多种费率类型，可适用于商户/产品/渠道。

    每行代表一个费率方案，含费率参数JSON、生效时间、倒挂允许等配置。'
  tags:
  - 费率方案
  - rate scheme
  - 计费规则
  - 多档费率
  - pmt_service_rate_scheme
  query_tips: 可用方案用 rate_status=1 AND review_status=1
columns:
- name: rsid
  display_name: 主键ID
  type: INT
  skip_index: true
- name: rate_id
  display_name: 费率ID
  type: VARCHAR(36)
  description: 费率ID
- name: rate_type
  display_name: 费率类型
  type: VARCHAR(32)
  description: 费率类型：FIXED_FEE=固定费用，FIXED_RATE=固定费率，TIERED_FEE=阶梯费用，TIERED_RATE=阶梯费率,
    MONTHLY_RATE=包月费率, BLENDED_RATE=混合费率, CAPPED_RATE=封顶费率
  enum_values:
  - FIXED_FEE
  - FIXED_RATE
  - TIERED_FEE
  - TIERED_RATE
  - MONTHLY_RATE
  - BLENDED_RATE
  - CAPPED_RATE
- name: rate_target
  display_name: 适用对象
  type: INT
  description: 适用对象：1000-merchant, 3000-product, 4000-channel
  enum_values:
  - value: 1000
    label: merchant
  - value: 3000
    label: product
  - value: 4000
    label: channel
- name: product_type
  display_name: 产品类型
  type: INT
  description: 类型：1000=VA, 2000=FX, 3000=AC, 4000=IC
  enum_values:
  - value: 1000
    label: VA
  - value: 2000
    label: FX
  - value: 3000
    label: AC
  - value: 4000
    label: IC
- name: product_code
  display_name: 产品代码
  type: VARCHAR(60)
  description: 产品代码代码
- name: auth_trade_type
  display_name: 授权代码
  type: VARCHAR(60)
  description: 授权代码
  skip_index: true
- name: scheme_name
  display_name: 方案名称
  type: VARCHAR(100)
  description: 名称
- name: scheme_params
  display_name: 费率参数JSON
  type: TEXT
  description: 费率参数-json值
  skip_index: true
- name: scheme_params_new
  display_name: 新费率参数JSON
  type: TEXT
  description: 新费率参数-json值
  skip_index: true
- name: effective_date
  display_name: 生效时间
  type: DATETIME
  description: 生效时间
- name: remark
  display_name: 备注
  type: VARCHAR(100)
- name: update_time
  display_name: 更新时间
  type: DATETIME
- name: create_time
  display_name: 创建时间
  type: DATETIME
- name: entity_id
  display_name: 实体ID
  type: VARCHAR(36)
  description: 0=系统默认, !0=指定机构/代理
- name: entity_type
  display_name: 实体类型
  type: INT
  description: 1000=普通账户；2000=License Payment Service Provider（LPSP）；2001=Technical
    Payment Service Provider（TPSP）；3000=Referral Payment Service  Provider（RPSP）
  enum_values:
  - value: 1000
    label: 普通账户
  - value: 2000
    label: LPSP
  - value: 2001
    label: TPSP
  - value: 3000
    label: RPSP
- name: short_reference_id
  display_name: 短号
  type: VARCHAR(20)
  description: 短号
- name: allow_reverse_status
  display_name: 倒挂允许
  type: TINYINT(1)
  description: 费率倒挂反转允许状态：0=默认正向费率， 1=允许倒挂反转
  enum_values:
  - value: 0
    label: 默认正向
  - value: 1
    label: 允许倒挂
- name: review_status
  display_name: 审查状态
  type: TINYINT(1)
  description: 审查状态：1=passed, 0=in_review, -1=rejected
  enum_values:
  - value: 1
    label: 通过
  - value: 0
    label: 审核中
  - value: -1
    label: 拒绝
- name: rate_status
  display_name: 状态
  type: TINYINT(1)
  description: -1:删除; 1:可用;
  enum_values:
  - value: -1
    label: 删除
  - value: 1
    label: 可用
relations:
- column: rate_id
  target_table: pmt_service_product
  target_column: rate_scheme_id
  join_type: LEFT JOIN
- column: rate_id
  target_table: pmt_service_rate_scheme_log
  target_column: rate_id
  join_type: LEFT JOIN
common_queries:
- question: 各产品的费率方案分布
  sql: "SELECT product_code AS '产品代码',\n       rate_type AS '费率类型',\n       COUNT(*)\
    \ AS '方案数'\nFROM dwd_banking.`pmt_service_rate_scheme`\nWHERE rate_status = 1\n\
    GROUP BY product_code, rate_type\nORDER BY product_code\nLIMIT 100\n"
  tables:
  - pmt_service_rate_scheme
  difficulty: easy
- question: 即将生效的费率变更(7天内)
  sql: "SELECT scheme_name AS '方案名',\n       rate_type AS '类型',\n       effective_date\
    \ AS '生效时间'\nFROM dwd_banking.`pmt_service_rate_scheme`\nWHERE effective_date\
    \ BETWEEN NOW() AND DATE_ADD(NOW(), INTERVAL 7 DAY)\n  AND rate_status = 1\nLIMIT\
    \ 100\n"
  tables:
  - pmt_service_rate_scheme
  difficulty: easy
- question: 倒挂费率方案
  sql: "SELECT scheme_name AS '方案名',\n       rate_type AS '类型',\n       entity_type\
    \ AS '适用实体类型',\n       create_time AS '创建时间'\nFROM dwd_banking.`pmt_service_rate_scheme`\n\
    WHERE allow_reverse_status = 1\n  AND rate_status = 1\nLIMIT 100\n"
  tables:
  - pmt_service_rate_scheme
  difficulty: easy
- question: 各费率类型分布
  sql: "SELECT rate_type AS '费率类型',\n       COUNT(*) AS '数量'\nFROM dwd_banking.`pmt_service_rate_scheme`\n\
    WHERE rate_status = 1\nGROUP BY rate_type\nORDER BY `数量` DESC\nLIMIT 100\n"
  tables:
  - pmt_service_rate_scheme
  difficulty: easy
