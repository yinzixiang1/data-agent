table:
  name: pmt_account_product
  database: dwd_banking
  display_name: 账户-产品关联表
  description: '商户开通的产品组合记录，包含产品代码、路由、约束、费率方案、佣金方案、币种结算配置等。

    每行代表一个 (account_id, product_code) 商户产品开通记录，是商户可用业务能力的明细。'
  tags:
  - 产品开通
  - 费率方案
  - 路由
  - 约束
  - 商户产品
  - 结算配置
  - account product
  - pmt_account_product
  query_tips: 已开通产品用 product_status=1
columns:
- name: ppid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: acc_prod_id
  display_name: 长号
  type: VARCHAR(36)
  description: 长号
- name: short_reference_id
  display_name: 短号
  type: VARCHAR(20)
  description: 短号
- name: direct_id
  display_name: 机构ID
  type: VARCHAR(36)
  description: 机构ID
- name: account_id
  display_name: 商户ID
  type: VARCHAR(36)
  description: 商户ID
- name: account_name
  display_name: 商户名
  type: VARCHAR(120)
- name: product_code
  display_name: 产品代码
  type: VARCHAR(60)
  description: 关联产品ID
- name: product_name
  display_name: 产品名称
  type: VARCHAR(100)
  description: 关联产品名称
- name: route_id
  display_name: 路由ID
  type: INT
  description: 关联路由ID
  skip_index: true
- name: route_name
  display_name: 路由名称
  type: VARCHAR(40)
  description: 关联路由名称
- name: restrict_id
  display_name: 约束ID
  type: INT
  description: 关联约束ID
  skip_index: true
- name: restrict_name
  display_name: 约束名
  type: VARCHAR(120)
  description: 关联约束名
- name: rate_scheme_id
  display_name: 费率方案ID
  type: VARCHAR(36)
  description: 费率方案ID
- name: rate_scheme_name
  display_name: 费率方案名(已废弃)
  type: VARCHAR(60)
  description: 【废弃】费率方案名
  skip_index: true
- name: auth_trade_type
  display_name: 产品交易授权类型
  type: TEXT
  description: 产品交易授权类型
  skip_index: true
- name: commission_rate_id
  display_name: 佣金方案ID
  type: INT
  description: 佣金方案ID
- name: commission_rate_name
  display_name: 佣金方案名
  type: VARCHAR(60)
  description: 佣金方案名称
- name: currency_setting_params
  display_name: 币种配置(交易/渠道/结算)
  type: TEXT
  description: 交易、渠道、结算币种
  skip_index: true
- name: settlement_period_params
  display_name: 结算规则
  type: TEXT
  description: 结算规则
  skip_index: true
- name: extend_params
  display_name: 单笔金额限制
  type: TEXT
  description: 单笔金额限制
  skip_index: true
- name: update_time
  display_name: 更新时间
  type: DATETIME
  description: 更新时间
- name: create_time
  display_name: 创建时间
  type: DATETIME
  description: 创建时间
- name: product_status
  display_name: 产品状态
  type: TINYINT(1)
  description: 产品状态：0=关闭 1=开通
  enum_values:
  - value: 0
    label: 关闭
  - value: 1
    label: 开通
relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
- column: product_code
  target_table: pmt_service_product
  target_column: product_code
  join_type: LEFT JOIN
- column: route_id
  target_table: pmt_service_route
  target_column: route_id
  join_type: LEFT JOIN
- column: rate_scheme_id
  target_table: pmt_service_rate_scheme
  target_column: rate_id
  join_type: LEFT JOIN
- column: restrict_id
  target_table: pmt_service_restrict
  target_column: restrict_id
  join_type: LEFT JOIN
common_queries:
- question: 各产品的开通商户数
  sql: "SELECT product_name AS '产品',\n       COUNT(DISTINCT account_id) AS '开通商户数'\n\
    FROM dwd_banking.`pmt_account_product`\nWHERE product_status = 1\nGROUP BY product_name\n\
    ORDER BY `开通商户数` DESC\nLIMIT 100\n"
  tables:
  - pmt_account_product
  difficulty: easy
- question: 某商户开通的所有产品
  sql: "SELECT product_code AS '产品代码',\n       product_name AS '产品名',\n       route_name\
    \ AS '路由',\n       rate_scheme_id AS '费率方案ID',\n       create_time AS '开通时间'\n\
    FROM dwd_banking.`pmt_account_product`\nWHERE account_id = ?\n  AND product_status\
    \ = 1\nLIMIT 100\n"
  tables:
  - pmt_account_product
  difficulty: easy
- question: 不同费率方案覆盖的商户数
  sql: "SELECT rate_scheme_id AS '费率方案ID',\n       COUNT(DISTINCT account_id) AS '商户数',\n\
    \       COUNT(*) AS '产品开通数'\nFROM dwd_banking.`pmt_account_product`\nWHERE product_status\
    \ = 1\nGROUP BY rate_scheme_id\nORDER BY `商户数` DESC\nLIMIT 100\n"
  tables:
  - pmt_account_product
  difficulty: medium
- question: 同时开通VA/AC/IC的商户
  sql: "SELECT a.short_account_id AS '商户短号',\n       a.account_name AS '商户名',\n  \
    \     COUNT(DISTINCT ap.product_name) AS '产品种类数'\nFROM dwd_banking.`pmt_account_product`\
    \ ap\nLEFT JOIN dwd_banking.`pmt_account` a ON ap.account_id = a.account_id\n\
    WHERE ap.product_status = 1\nGROUP BY a.short_account_id, a.account_name\nHAVING\
    \ COUNT(DISTINCT ap.product_name) >= 3\nORDER BY `产品种类数` DESC\nLIMIT 100\n"
  tables:
  - pmt_account_product
  - pmt_account
  difficulty: hard
- question: 最近30天新开通的产品
  sql: "SELECT product_name AS '产品',\n       COUNT(*) AS '新开通数'\nFROM dwd_banking.`pmt_account_product`\n\
    WHERE create_time >= DATE_SUB(NOW(), INTERVAL 30 DAY)\n  AND product_status =\
    \ 1\nGROUP BY product_name\nORDER BY `新开通数` DESC\nLIMIT 100\n"
  tables:
  - pmt_account_product
  difficulty: easy
