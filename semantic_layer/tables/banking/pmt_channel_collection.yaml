table:
  name: pmt_channel_collection
  database: dwd_banking
  display_name: 渠道资金归集订单表
  description: '渠道侧资金调拨/归集订单，用于头寸结余管理。

    每行代表一笔渠道间或house账户间的资金调拨记录，区分deposit和payout方向。'
  tags:
  - 资金调拨
  - 归集
  - 头寸
  - 渠道资金
  - channel collection
  - pmt_channel_collection
  query_tips: ''
columns:
- name: ccid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: collection_id
  display_name: 调拨订单号
  type: VARCHAR(36)
  description: 调拨订单号
- name: short_reference_id
  display_name: 订单短号
  type: VARCHAR(20)
  description: 订单短号：PTYYMMDD-XXXXXXXX
- name: collection_type
  display_name: 调拨类型
  type: SMALLINT UNSIGNED
  description: '1000: deposit; 2000: payout;'
  enum_values:
  - value: 1000
    label: deposit-入款
  - value: 2000
    label: payout-出款
- name: collection_currency
  display_name: 币种
  type: VARCHAR(3)
  description: 币种
- name: collection_amount
  display_name: 调拨金额
  type: DECIMAL(16,4)
  description: 调拨的金额
- name: collection_fee
  display_name: 手续费
  type: DECIMAL(16,4) UNSIGNED
  description: 手续费
- name: balance_amount
  display_name: 头寸结余
  type: DECIMAL(16,4)
  description: 结余,头寸的结余
- name: status
  display_name: 状态
  type: TINYINT(1) UNSIGNED
  description: 0=processing，1=completed
  enum_values:
  - value: 0
    label: 处理中
  - value: 1
    label: 已完成
- name: remark
  display_name: 备注
  type: VARCHAR(255)
- name: channel_code
  display_name: 渠道编码
  type: VARCHAR(64)
  description: 渠道编码,调拨的渠道
- name: ref_reference_id
  display_name: 关联订单ID
  type: VARCHAR(36)
  description: 关联ID 订单等
- name: ref_short_reference_id
  display_name: 关联短号
  type: VARCHAR(20)
  description: 关联短号
- name: create_time
  display_name: 创建时间
  type: DATETIME(3)
- name: update_time
  display_name: 更新时间
  type: DATETIME(3)
- name: complete_time
  display_name: 完成时间
  type: DATETIME(3)
- name: creator_id
  display_name: 创建人ID
  type: VARCHAR(36)
  description: 创建人id
- name: creator_name
  display_name: 创建人名
  type: VARCHAR(50)
  description: 创建人名
- name: delete_at
  display_name: 删除时间
  type: DATETIME
  description: 删除时间
relations:
- column: channel_code
  target_table: pmt_service_channel
  target_column: channel_code
  join_type: LEFT JOIN
common_queries:
- question: 各渠道的调拨金额(按币种)
  sql: "SELECT channel_code AS '渠道',\n       collection_currency AS '币种',\n      \
    \ SUM(collection_amount) AS '调拨总额',\n       COUNT(*) AS '笔数'\nFROM dwd_banking.`pmt_channel_collection`\n\
    WHERE delete_at IS NULL\n  AND status = 1\nGROUP BY channel_code, collection_currency\n\
    ORDER BY `调拨总额` DESC\nLIMIT 100\n"
  tables:
  - pmt_channel_collection
  difficulty: medium
- question: 处理中的归集订单
  sql: "SELECT short_reference_id AS '订单短号',\n       channel_code AS '渠道',\n     \
    \  collection_currency AS '币种',\n       collection_amount AS '金额',\n       create_time\
    \ AS '创建时间'\nFROM dwd_banking.`pmt_channel_collection`\nWHERE status = 0\n  AND\
    \ delete_at IS NULL\nORDER BY create_time\nLIMIT 100\n"
  tables:
  - pmt_channel_collection
  difficulty: easy
- question: 调拨手续费占比
  sql: "SELECT channel_code AS '渠道',\n       SUM(collection_fee) AS '手续费总额',\n   \
    \    SUM(collection_amount) AS '调拨总额',\n       ROUND(SUM(collection_fee) * 100.0\
    \ / NULLIF(SUM(collection_amount), 0), 4) AS '手续费占比%'\nFROM dwd_banking.`pmt_channel_collection`\n\
    WHERE status = 1\nGROUP BY channel_code\nLIMIT 100\n"
  tables:
  - pmt_channel_collection
  difficulty: medium
- question: 月度调拨笔数和金额
  sql: "SELECT DATE_FORMAT(create_time, '%Y-%m') AS '月份',\n       CASE collection_type\
    \ WHEN 1000 THEN 'deposit' WHEN 2000 THEN 'payout' END AS '类型',\n       COUNT(*)\
    \ AS '笔数',\n       SUM(collection_amount) AS '金额'\nFROM dwd_banking.`pmt_channel_collection`\n\
    WHERE delete_at IS NULL\nGROUP BY DATE_FORMAT(create_time, '%Y-%m'), collection_type\n\
    ORDER BY `月份` DESC\nLIMIT 100\n"
  tables:
  - pmt_channel_collection
  difficulty: medium
