table:
  name: sys_currency_pair
  database: dwd_banking
  display_name: 货币币种对表
  description: '支持的货币对配置，含可兑换标志、加点比例、锁汇时间、cut-off时间。

    每行代表一个货币对(如USDEUR)。'
  tags:
  - 货币对
  - currency pair
  - 锁汇配置
  - FX
  - cross currency
  - sys_currency_pair
  query_tips: ''
columns:
- name: prid
  display_name: 主键ID
  type: INT
  skip_index: true
- name: currency_type
  display_name: 币种类型
  type: INT
  description: 1000=fiat 2000=crypto 3000=hybird
  enum_values:
  - value: 1000
    label: fiat
  - value: 2000
    label: crypto
  - value: 3000
    label: hybrid
- name: currency_network
  display_name: 币种网络
  type: VARCHAR(24)
  description: 币种网络 fiat hybird,其他数字货币
- name: currency_pair_code
  display_name: 货币对代码
  type: VARCHAR(12)
- name: original_currency
  display_name: 原始币种
  type: VARCHAR(12)
  description: 原始币种
- name: target_currency
  display_name: 目标币种
  type: VARCHAR(12)
  description: 目标币种
- name: conversion_dates
  display_name: 不可交易日JSON
  type: TEXT
  description: fx不可交易日
  skip_index: true
- name: update_time
  display_name: 更新时间
  type: DATETIME
  description: 创建时间
- name: status
  display_name: 状态
  type: TINYINT(1)
  description: 1:可用；-1:不可用
  enum_values:
  - value: 1
    label: 可用
  - value: -1
    label: 不可用
- name: add_point_ratio
  display_name: 基础加点比例
  type: DOUBLE(10,4)
  description: 基础加点值比例：主流币种+0.004，other=0.004
- name: cut_off_time
  display_name: cut off时间(HH:MM)
  type: VARCHAR(50)
  description: 一天当中的时间配置，存在跨天情况  HH:MM 格式
- name: exchange
  display_name: 是否可兑换
  type: INT
  description: 0:不可以兑换 1:可以兑换
  enum_values:
  - value: 0
    label: 不可兑换
  - value: 1
    label: 可兑换
- name: rate_guaranteed_value
  display_name: 锁汇时长
  type: INT
  description: 0表示不锁汇
- name: rate_guaranteed_unit
  display_name: 锁汇单位
  type: VARCHAR(1)
  description: 锁汇时间单位,支持s、m、h
  enum_values:
  - s
  - m
  - h
- name: cross_currency_status
  display_name: 跨币种状态
  type: TINYINT(1)
  description: 跨币种货币对状态，1-开启，-1-关闭
  enum_values:
  - value: 1
    label: 开启
  - value: -1
    label: 关闭
- name: create_time
  display_name: 创建时间
  type: DATETIME
  description: 创建时间
common_queries:
- question: 可兑换币种对
  sql: "SELECT currency_pair_code AS '币种对',\n       original_currency AS '原始币种',\n\
    \       target_currency AS '目标币种',\n       add_point_ratio AS '加点比例'\nFROM dwd_banking.`sys_currency_pair`\n\
    WHERE exchange = 1\n  AND status = 1\nORDER BY currency_pair_code\nLIMIT 100\n"
  tables:
  - sys_currency_pair
  difficulty: easy
- question: 各币种对的锁汇时长
  sql: "SELECT currency_pair_code AS '币种对',\n       rate_guaranteed_value AS '时长',\n\
    \       rate_guaranteed_unit AS '单位'\nFROM dwd_banking.`sys_currency_pair`\nWHERE\
    \ rate_guaranteed_value > 0\n  AND status = 1\nORDER BY rate_guaranteed_value\
    \ DESC\nLIMIT 100\n"
  tables:
  - sys_currency_pair
  difficulty: easy
- question: 跨币种开启的对数
  sql: 'SELECT COUNT(*) AS ''跨币种开启数''

    FROM dwd_banking.`sys_currency_pair`

    WHERE cross_currency_status = 1

    LIMIT 100

    '
  tables:
  - sys_currency_pair
  difficulty: easy
