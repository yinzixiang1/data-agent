table:
  name: pmt_message_queue
  database: dwd_banking
  display_name: 消息队列表
  description: '系统内部消息队列，按业务线(VA/FX/AC/IC/通用)分类的消息处理表。

    每行代表一条待处理或已处理的内部消息。'
  tags:
  - 消息队列
  - message queue
  - 异步处理
  - 业务总线
  - pmt_message_queue
  query_tips: ''
columns:
- name: mid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: msg_type
  display_name: 消息类型
  type: INT
  description: 'MSG TYPE: 1000=VA, 2000=FX, 3000=AC, 4000=IC, 9000=GENERAL'
  enum_values:
  - value: 1000
    label: VA
  - value: 2000
    label: FX
  - value: 3000
    label: AC
  - value: 4000
    label: IC
  - value: 9000
    label: GENERAL
- name: msg_code
  display_name: 消息编码
  type: VARCHAR(120)
  description: 消息编码
- name: msg_body
  display_name: 消息体
  type: TEXT
  skip_index: true
- name: create_time
  display_name: 创建时间
  type: DATETIME
- name: update_time
  display_name: 更新时间
  type: DATETIME
- name: msg_status
  display_name: 消息状态
  type: INT
  description: -1处理失败 2:处理中
  enum_values:
  - value: 0
    label: 待处理
  - value: 2
    label: 处理中
  - value: -1
    label: 处理失败
- name: msg_reason
  display_name: 失败原因
  type: TEXT
  description: 对内说明原因
  skip_index: true
common_queries:
- question: 待处理消息积压量
  sql: "SELECT\n  CASE msg_type\n    WHEN 1000 THEN 'VA'\n    WHEN 2000 THEN 'FX'\n\
    \    WHEN 3000 THEN 'AC'\n    WHEN 4000 THEN 'IC'\n    WHEN 9000 THEN 'GENERAL'\n\
    \  END AS '业务线',\n  COUNT(*) AS '积压量'\nFROM dwd_banking.`pmt_message_queue`\n\
    WHERE msg_status IN (0, 2)\nGROUP BY msg_type\nORDER BY `积压量` DESC\nLIMIT 100\n"
  tables:
  - pmt_message_queue
  difficulty: medium
- question: 各业务线消息量(最近24h)
  sql: "SELECT msg_type AS '业务线',\n       msg_code AS '消息编码',\n       COUNT(*) AS\
    \ '消息数'\nFROM dwd_banking.`pmt_message_queue`\nWHERE create_time >= DATE_SUB(NOW(),\
    \ INTERVAL 24 HOUR)\nGROUP BY msg_type, msg_code\nORDER BY `消息数` DESC\nLIMIT 30\n"
  tables:
  - pmt_message_queue
  difficulty: easy
- question: 失败消息原因
  sql: "SELECT msg_code AS '消息编码',\n       COUNT(*) AS '失败数'\nFROM dwd_banking.`pmt_message_queue`\n\
    WHERE msg_status = -1\n  AND create_time >= DATE_SUB(NOW(), INTERVAL 7 DAY)\n\
    GROUP BY msg_code\nORDER BY `失败数` DESC\nLIMIT 20\n"
  tables:
  - pmt_message_queue
  difficulty: easy
