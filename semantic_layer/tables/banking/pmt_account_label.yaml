table:
  name: pmt_account_label
  database: dwd_banking
  display_name: 客户白标配置表
  description: '商户白标(white-label)产品配置，包含品牌信息、域名、邮件协议、Logo和主题色等定制化配置。

    每行代表一个商户的白标配置，支持商户自有品牌的支付门户。'
  tags:
  - 白标
  - white label
  - 品牌定制
  - 域名配置
  - 邮件SMTP
  - 商户门户
  - pmt_account_label
  query_tips: ''
columns:
- name: clid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: label_id
  display_name: Label ID
  type: VARCHAR(36)
  description: laber ID
- name: account_id
  display_name: 客户ID
  type: VARCHAR(36)
  description: 客户ID
- name: short_account_id
  display_name: 客户短号
  type: VARCHAR(20)
  description: 客户号
- name: country
  display_name: 企业注册国家
  type: VARCHAR(100)
  description: 企业注册国家/地区
- name: legal_entity_type
  display_name: 法人实体类型
  type: INT
  description: 1000=individual 2000=company
  enum_values:
  - value: 1000
    label: 个人
  - value: 2000
    label: 企业
- name: entity_individual
  display_name: 个人KYC信息(JSON)
  type: TEXT
  description: 'KYC信息{"first_name": "", "last_name": "", "date_of_birth": ""}'
  skip_index: true
- name: entity_company
  display_name: 企业实体信息(JSON)
  type: TEXT
  description: '当legal_entity_type=company：{"entity_name": "实体英文名", "entity_reg_name":
    "实体法定名", "entity_status": "实体类型", "incorporate_date": "企业注册时间", "entity_deadline":
    "企业到期时间", "vat_type": "企业税号"}'
  skip_index: true
- name: registration_address
  display_name: 注册地址(JSON)
  type: VARCHAR(2000)
  description: '注册地址：{"city": "", "state": "", "postal_code": "", "address": "", "address2":
    ""}'
  sensitive: true
- name: contact_details
  display_name: 联系方式(JSON)
  type: VARCHAR(255)
  description: 'support信息：{"email": "", "telephone": "+86100086"}'
  sensitive: true
- name: terms_policy_mode
  display_name: 条款策略模式
  type: VARCHAR(10)
  description: URL，FILE，TXT
  enum_values:
  - URL
  - FILE
  - TXT
- name: terms_policy
  display_name: 条款内容
  type: TEXT
  description: Terms and policy content
  skip_index: true
- name: site_config
  display_name: 站点配置(主题色/Logo)
  type: TEXT
  description: "站点配置：{\"logo_global_img\": \"logo图片\", \"brand_color\": \"主题色#FFFAFA\t\
    \", \"accent_color\": \"强调色\"}"
  skip_index: true
- name: domain_url
  display_name: 域名URL
  type: VARCHAR(255)
  description: domain url
- name: domain_url_list
  display_name: 历史绑定记录
  type: TEXT
  description: 历史绑定记录["", ""]
  skip_index: true
- name: domain_config
  display_name: 域名配置
  type: TEXT
  description: domain配置（预留）
  skip_index: true
- name: domain_state
  display_name: 域名激活状态
  type: TINYINT
  description: domain是否激活：0否，1是 ，2 pending
  enum_values:
  - value: 0
    label: 未激活
  - value: 1
    label: 已激活
  - value: 2
    label: pending
- name: is_custom_email_sender
  display_name: 是否自定义邮件
  type: TINYINT
  description: 是否自定义发送邮件配置：0=否，1=是
  enum_values:
  - value: 0
    label: 否
  - value: 1
    label: 是
- name: custom_email_protocol
  display_name: 邮件协议配置(SMTP)
  type: VARCHAR(255)
  description: 'EMAIL协议配置：{"protocol": "SMTP/POP3/IMAP", "host": "", "ssl_port": "465",
    "from": "", "passord": ""}'
  sensitive: true
  skip_index: true
- name: update_time
  display_name: 更新时间
  type: DATETIME
- name: create_time
  display_name: 创建时间
  type: DATETIME
- name: label_status
  display_name: 白标状态
  type: INT
  description: 白标状态：-1=关闭，0=默认，1=正常开通
  enum_values:
  - value: -1
    label: 关闭
  - value: 0
    label: 默认
  - value: 1
    label: 正常开通
relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
common_queries:
- question: 已开通白标的商户数
  sql: 'SELECT COUNT(*) AS ''开通白标商户数''

    FROM dwd_banking.`pmt_account_label`

    WHERE label_status = 1

    LIMIT 100

    '
  tables:
  - pmt_account_label
  difficulty: easy
- question: 已自定义域名的白标商户列表
  sql: "SELECT short_account_id AS '商户短号',\n       domain_url AS '域名',\n       create_time\
    \ AS '开通时间'\nFROM dwd_banking.`pmt_account_label`\nWHERE label_status = 1\n  AND\
    \ domain_state = 1\n  AND domain_url IS NOT NULL\nLIMIT 100\n"
  tables:
  - pmt_account_label
  difficulty: easy
- question: 自定义邮件发送的商户数
  sql: "SELECT COUNT(*) AS '自定义邮件商户数'\nFROM dwd_banking.`pmt_account_label`\nWHERE\
    \ is_custom_email_sender = 1\n  AND label_status = 1\nLIMIT 100\n"
  tables:
  - pmt_account_label
  difficulty: easy
- question: 各国家的白标开通量
  sql: "SELECT country AS '国家',\n       COUNT(*) AS '白标商户数'\nFROM dwd_banking.`pmt_account_label`\n\
    WHERE label_status = 1\nGROUP BY country\nORDER BY `白标商户数` DESC\nLIMIT 100\n"
  tables:
  - pmt_account_label
  difficulty: easy
- question: 域名pending的白标商户
  sql: "SELECT short_account_id AS '商户短号',\n       domain_url AS '域名',\n       create_time\
    \ AS '申请时间',\n       DATEDIFF(NOW(), create_time) AS '等待天数'\nFROM dwd_banking.`pmt_account_label`\n\
    WHERE domain_state = 2\nLIMIT 100\n"
  tables:
  - pmt_account_label
  difficulty: easy
