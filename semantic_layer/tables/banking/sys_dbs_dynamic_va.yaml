table:
  name: sys_dbs_dynamic_va
  database: dwd_banking
  display_name: DBS动态VA预备号
  description: 'DBS银行动态VA号码池。

    每行代表一个DBS VA预备号。'
  tags:
  - DBS
  - VA
  - 号码池
  - sys_dbs_dynamic_va
  query_tips: ''
columns:
- name: id
  display_name: 主键ID
  type: INT
  skip_index: true
- name: dbs_id
  display_name: DBS ID
  type: VARCHAR(20)
- name: direct_id
  display_name: 机构ID
  type: VARCHAR(36)
- name: account_id
  display_name: 账户ID
  type: VARCHAR(36)
- name: account_name
  display_name: 商户名
  type: VARCHAR(96)
- name: short_account_id
  display_name: 商户短号
  type: VARCHAR(36)
- name: used
  display_name: 是否已使用
  type: TINYINT
  description: 1:已使用
  enum_values:
  - value: 0
    label: 未使用
  - value: 1
    label: 已使用
- name: create_time
  display_name: 创建时间
  type: DATETIME
- name: update_time
  display_name: 更新时间
  type: DATETIME
relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
common_queries:
- question: DBS VA剩余号(未使用)
  sql: 'SELECT COUNT(*) AS ''未使用数''

    FROM dwd_banking.`sys_dbs_dynamic_va`

    WHERE used = 0

    LIMIT 100

    '
  tables:
  - sys_dbs_dynamic_va
  difficulty: easy
- question: 已分配商户数
  sql: 'SELECT COUNT(DISTINCT account_id) AS ''已分配商户数''

    FROM dwd_banking.`sys_dbs_dynamic_va`

    WHERE used = 1

    LIMIT 100

    '
  tables:
  - sys_dbs_dynamic_va
  difficulty: easy
