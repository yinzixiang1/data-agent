table:
  name: pmt_finance_transaction_timeline
  database: dwd_banking
  display_name: 资金交易时间线表
  description: '各类交易在生命周期中的步骤事件流(创建订单/扣款/对接渠道/响应等)。

    每行代表一次事件步骤，是订单审计追溯的关键表，区分对内/对客可见。'
  tags:
  - 时间线
  - timeline
  - 审计
  - 事件流
  - 订单生命周期
  - pmt_finance_transaction_timeline
  query_tips: ''
columns:
- name: txid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: direct_id
  display_name: 机构ID
  type: VARCHAR(36)
- name: account_id
  display_name: 账户ID
  type: VARCHAR(36)
- name: account_name
  display_name: 商户名
  type: VARCHAR(250)
- name: timeline_type
  display_name: 时间线类型
  type: SMALLINT
  description: 1000=payin, 1001=deposit, 1002=transfer in, 2000=payout, 2001=transfer
    out, 3000=conversion，4000=card purchase, 4001=card recharge, 4002=card withdraw,  8000=fee,
    8001=refund，9000=adjustment
  enum_values:
  - value: 1000
    label: payin
  - value: 1001
    label: deposit
  - value: 1002
    label: transfer in
  - value: 2000
    label: payout
  - value: 2001
    label: transfer out
  - value: 3000
    label: conversion
  - value: 4000
    label: card purchase
  - value: 4001
    label: card recharge
  - value: 4002
    label: card withdraw
  - value: 8000
    label: fee
  - value: 8001
    label: refund
  - value: 9000
    label: adjustment
- name: timeline_id
  display_name: 时间线ID
  type: VARCHAR(36)
- name: timeline_code
  display_name: 流程步骤编码
  type: VARCHAR(100)
  description: 流程步骤编码：统一根据产品提供
- name: timeline_name
  display_name: 流程步骤名称
  type: VARCHAR(255)
  description: 流程步骤名称："Create Order", "Deduct Balance" 等
- name: channel_code
  display_name: 渠道编码
  type: VARCHAR(64)
  description: 渠道code：默认空
- name: channel_flag
  display_name: 是否渠道记录
  type: SMALLINT
  description: 是否为渠道记录
  enum_values:
  - value: 0
    label: 否
  - value: 1
    label: 是
- name: req_id
  display_name: 请求ID
  type: VARCHAR(200)
  description: 请求唯一ID
- name: req_body
  display_name: 请求Body
  type: TEXT
  description: 请求body
  skip_index: true
- name: req_amount
  display_name: 请求交易金额
  type: DECIMAL(16,4)
  description: 请求交易金额
- name: resp_id
  display_name: 渠道响应ID
  type: VARCHAR(200)
  description: 渠道响应ID
- name: resp_body
  display_name: 渠道响应Body
  type: TEXT
  description: 渠道响应body
  skip_index: true
- name: resp_status
  display_name: 渠道响应状态
  type: VARCHAR(20)
  description: 渠道响应状态
- name: execute_reason
  display_name: 失败原因
  type: TEXT
  description: 对应失败原因
- name: ref_reference_id
  display_name: 关联订单长号
  type: VARCHAR(36)
  description: 关联长号id，payout_id、deposit_id
- name: ref_short_reference_id
  display_name: 关联订单短号
  type: VARCHAR(30)
  description: 关联短号id
- name: create_time
  display_name: 创建时间
  type: DATETIME
  description: 创建时间
- name: is_customer_visible
  display_name: 对客户可见
  type: SMALLINT
  description: 对客户：1=是，0否
  enum_values:
  - value: 0
    label: 否
  - value: 1
    label: 是
- name: creator_id
  display_name: 创建人ID
  type: VARCHAR(36)
  description: 如果是对渠道，空
- name: creator_name
  display_name: 创建人名
  type: VARCHAR(100)
- name: creator_ip
  display_name: 创建IP
  type: VARCHAR(255)
  description: 创建IP
  sensitive: true
relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
- column: ref_reference_id
  target_table: pmt_finance_payout
  target_column: payout_id
  join_type: LEFT JOIN
common_queries:
- question: 某订单的全流程事件
  sql: "SELECT timeline_code AS '步骤编码',\n       timeline_name AS '步骤名称',\n       channel_code\
    \ AS '渠道',\n       resp_status AS '响应状态',\n       execute_reason AS '失败原因',\n\
    \       create_time AS '时间'\nFROM dwd_banking.`pmt_finance_transaction_timeline`\n\
    WHERE ref_reference_id = ?\nORDER BY create_time\nLIMIT 100\n"
  tables:
  - pmt_finance_transaction_timeline
  difficulty: easy
- question: 各步骤平均耗时
  sql: "SELECT timeline_code AS '步骤',\n       timeline_name AS '步骤名',\n       COUNT(*)\
    \ AS '次数'\nFROM dwd_banking.`pmt_finance_transaction_timeline`\nWHERE create_time\
    \ >= DATE_SUB(NOW(), INTERVAL 7 DAY)\nGROUP BY timeline_code, timeline_name\n\
    ORDER BY `次数` DESC\nLIMIT 30\n"
  tables:
  - pmt_finance_transaction_timeline
  difficulty: medium
- question: 失败步骤分布
  sql: "SELECT timeline_code AS '步骤',\n       timeline_name AS '步骤名',\n       COUNT(*)\
    \ AS '失败次数'\nFROM dwd_banking.`pmt_finance_transaction_timeline`\nWHERE execute_reason\
    \ IS NOT NULL\n  AND execute_reason != ''\n  AND create_time >= DATE_SUB(NOW(),\
    \ INTERVAL 7 DAY)\nGROUP BY timeline_code, timeline_name\nORDER BY `失败次数` DESC\n\
    LIMIT 20\n"
  tables:
  - pmt_finance_transaction_timeline
  difficulty: medium
- question: 客户可见的事件统计
  sql: "SELECT\n  CASE timeline_type\n    WHEN 2000 THEN 'payout'\n    WHEN 1001 THEN\
    \ 'deposit'\n    WHEN 3000 THEN 'conversion'\n    ELSE '其他' END AS '业务类型',\n \
    \ COUNT(*) AS '可见事件数'\nFROM dwd_banking.`pmt_finance_transaction_timeline`\nWHERE\
    \ is_customer_visible = 1\nGROUP BY timeline_type\nORDER BY `可见事件数` DESC\nLIMIT\
    \ 100\n"
  tables:
  - pmt_finance_transaction_timeline
  difficulty: medium
