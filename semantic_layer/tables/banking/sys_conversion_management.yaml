table:
  name: sys_conversion_management
  database: dwd_banking
  display_name: 外汇配置表
  description: '外汇规则配置(FX management)，可绑定多个商户账户应用同一规则。

    每行代表一个换汇规则配置。'
  tags:
  - FX配置
  - 外汇规则
  - 换汇管理
  - conversion management
  - sys_conversion_management
  query_tips: ''
columns:
- name: fmid
  display_name: 主键ID
  type: BIGINT
  description: 主键 ID
  skip_index: true
- name: fx_management_id
  display_name: 外汇管理ID
  type: VARCHAR(36)
  description: 外汇管理ID
- name: configuration_name
  display_name: 配置名称
  type: VARCHAR(250)
  description: 配置名称
- name: configuration_params
  display_name: 配置参数JSON
  type: TEXT
  description: 配置参数
  skip_index: true
- name: remark
  display_name: 备注
  type: VARCHAR(255)
  description: 备注
- name: status
  display_name: 激活状态
  type: TINYINT(1)
  description: 该条配置的激活状态：1-Active，2-Inactive
  enum_values:
  - value: 1
    label: Active
  - value: 2
    label: Inactive
- name: number_of_accounts
  display_name: 关联账户数
  type: INT
  description: 关联账户数量
- name: create_time
  display_name: 创建时间
  type: DATETIME
- name: update_time
  display_name: 更新时间
  type: DATETIME
relations:
- column: fx_management_id
  target_table: pmt_account
  target_column: fx_management_id
  join_type: LEFT JOIN
common_queries:
- question: 启用中的FX配置
  sql: "SELECT configuration_name AS '配置名',\n       number_of_accounts AS '关联账户数',\n\
    \       create_time AS '创建时间'\nFROM dwd_banking.`sys_conversion_management`\n\
    WHERE status = 1\nORDER BY number_of_accounts DESC\nLIMIT 100\n"
  tables:
  - sys_conversion_management
  difficulty: easy
- question: 应用最广的FX配置
  sql: "SELECT configuration_name AS '配置名',\n       number_of_accounts AS '关联账户数'\n\
    FROM dwd_banking.`sys_conversion_management`\nWHERE status = 1\nORDER BY number_of_accounts\
    \ DESC\nLIMIT 5\n"
  tables:
  - sys_conversion_management
  difficulty: easy
