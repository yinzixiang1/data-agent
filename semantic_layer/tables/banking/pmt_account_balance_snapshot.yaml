table:
  name: pmt_account_balance_snapshot
  database: dwd_banking
  display_name: 法币账户余额快照表
  description: '余额账户的历史快照，按日/按时间点记录账户各类余额。

    每行代表某个时间点某个 (account_id, balance_currency, balance_type) 的余额状态，用于历史回溯、对账、资金趋势分析。'
  tags:
  - 余额快照
  - snapshot
  - 历史余额
  - 对账
  - MAS报告
  - 资金趋势
  - pmt_account_balance_snapshot
  query_tips: 按日期查询请使用 snapshot_date；多币种统一估值用 exchange_rate 换算到USD
columns:
- name: paid
  display_name: 主键ID
  type: INT
  skip_index: true
- name: direct_id
  display_name: 机构ID
  type: VARCHAR(36)
  description: 机构ID
- name: account_id
  display_name: 系统内部账户ID
  type: VARCHAR(36)
  description: 系统内部账户ID
- name: balance_id
  display_name: 余额账户ID
  type: VARCHAR(36)
  description: 余额账户ID
- name: balance_type
  display_name: 账户余额类型
  type: INT
  description: 账户余额类型 1000=VA 2000=FX(预留), 3000=AC, 4000=IC
  enum_values:
  - value: 1000
    label: VA
  - value: 2000
    label: FX
  - value: 3000
    label: AC
  - value: 4000
    label: IC
- name: balance_name
  display_name: 余额名称
  type: VARCHAR(60)
  description: 名称
- name: balance_currency
  display_name: 账户币种
  type: VARCHAR(6)
  description: 账户币种
- name: available_balance
  display_name: 可用余额
  type: DECIMAL(16,4)
  description: 当前可用余额-已完成清分和清算的资金等，可用于结算到客户银行账户
- name: pending_balance
  display_name: 处理中余额
  type: DECIMAL(16,4)
  description: 处理中余额-主要是AC待结算的资金（清分后）/PAYOUT, CONVERT
- name: processing_amount
  display_name: 扣款处理中金额
  type: DECIMAL(16,4)
  description: 扣款处理中金额
- name: reserved_balance
  display_name: 储备余额
  type: DECIMAL(16,4)
  description: 储备余额-主要用于退款、拒付和其他运营费用支出
- name: prepaid_balance
  display_name: 预付余额
  type: DECIMAL(16,4)
  description: 预付费卡专用
- name: margin_balance
  display_name: 保证金余额
  type: DECIMAL(16,4)
  description: 保证金余额-用于VM中常见的循环保证金或发卡业务中固定保证金
- name: frozen_balance
  display_name: 冻结余额
  type: DECIMAL(16,4)
  description: 冻结资金-主要在处理争议和其他风险冻结
- name: create_time
  display_name: 创建时间
  type: DATETIME(3)
- name: last_trade_time
  display_name: 最后交易时间
  type: DATETIME(3)
- name: balance_status
  display_name: 余额状态
  type: TINYINT(1)
  description: 0:default, 1:active, closed:2, processing:3
  enum_values:
  - value: 0
    label: 默认
  - value: 1
    label: 激活
  - value: 2
    label: 关闭
  - value: 3
    label: 处理中
- name: snapshot_date
  display_name: 快照日期
  type: DATE
  description: 快照日期
- name: snapshot_date_time
  display_name: 快照记录时间
  type: DATETIME
  description: 快照记录时间
- name: exchange_rate
  display_name: USD汇率
  type: DECIMAL(26,10)
  description: USD和当前币种的汇率，便于多币种统一估值
relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
- column: balance_id
  target_table: pmt_account_balance
  target_column: balance_id
  join_type: LEFT JOIN
common_queries:
- question: 某商户最近30天余额变化趋势
  sql: "SELECT snapshot_date AS '快照日期',\n       balance_currency AS '币种',\n      \
    \ SUM(available_balance) AS '可用余额'\nFROM dwd_banking.`pmt_account_balance_snapshot`\n\
    WHERE account_id = ?\n  AND snapshot_date >= DATE_SUB(CURDATE(), INTERVAL 30 DAY)\n\
    GROUP BY snapshot_date, balance_currency\nORDER BY snapshot_date, balance_currency\n\
    LIMIT 100\n"
  tables:
  - pmt_account_balance_snapshot
  difficulty: medium
- question: 某日全平台可用余额(USD估值)
  sql: "SELECT SUM(available_balance * exchange_rate) AS 'USD总余额'\nFROM dwd_banking.`pmt_account_balance_snapshot`\n\
    WHERE snapshot_date = '2026-04-01'\n  AND balance_status = 1\nLIMIT 100\n"
  tables:
  - pmt_account_balance_snapshot
  difficulty: medium
- question: 月末资金快照对账(按账户类型)
  sql: "SELECT\n  CASE balance_type\n    WHEN 1000 THEN 'VA'\n    WHEN 3000 THEN 'AC'\n\
    \    WHEN 4000 THEN 'IC'\n    WHEN 2000 THEN 'FX'\n  END AS '账户类型',\n  balance_currency\
    \ AS '币种',\n  SUM(available_balance) AS '可用余额',\n  SUM(reserved_balance) AS '储备余额'\n\
    FROM dwd_banking.`pmt_account_balance_snapshot`\nWHERE snapshot_date = LAST_DAY('2026-03-01')\n\
    GROUP BY balance_type, balance_currency\nLIMIT 100\n"
  tables:
  - pmt_account_balance_snapshot
  difficulty: medium
- question: 余额异动TOP10的商户(对比上月末)
  sql: "SELECT cur.account_id AS '账户ID',\n       a.short_account_id AS '商户短号',\n \
    \      cur.balance_currency AS '币种',\n       cur.available_balance AS '本月余额',\n\
    \       prev.available_balance AS '上月余额',\n       (cur.available_balance - prev.available_balance)\
    \ AS '变动金额'\nFROM dwd_banking.`pmt_account_balance_snapshot` cur\nJOIN dwd_banking.`pmt_account_balance_snapshot`\
    \ prev\n  ON cur.balance_id = prev.balance_id\n AND prev.snapshot_date = LAST_DAY(DATE_SUB(cur.snapshot_date,\
    \ INTERVAL 1 MONTH))\nLEFT JOIN dwd_banking.`pmt_account` a ON cur.account_id\
    \ = a.account_id\nWHERE cur.snapshot_date = LAST_DAY('2026-03-01')\nORDER BY ABS(cur.available_balance\
    \ - prev.available_balance) DESC\nLIMIT 10\n"
  tables:
  - pmt_account_balance_snapshot
  - pmt_account
  difficulty: hard
- question: 各日期点的快照记录数(检查数据完整性)
  sql: "SELECT snapshot_date AS '快照日期',\n       COUNT(*) AS '快照记录数',\n       COUNT(DISTINCT\
    \ account_id) AS '账户数'\nFROM dwd_banking.`pmt_account_balance_snapshot`\nWHERE\
    \ snapshot_date >= DATE_SUB(CURDATE(), INTERVAL 7 DAY)\nGROUP BY snapshot_date\n\
    ORDER BY snapshot_date DESC\nLIMIT 100\n"
  tables:
  - pmt_account_balance_snapshot
  difficulty: easy
