table:
  name: pmt_service_channel
  database: dwd_banking
  display_name: 网关渠道表
  description: '平台对接的所有上游渠道配置。

    每行代表一个上游渠道(网关)，含API地址、密钥、商户号、约束、费率方案、VA配置等。'
  tags:
  - 渠道配置
  - 网关
  - channel
  - 上游对接
  - pmt_service_channel
  query_tips: 启用渠道用 channel_status=1
columns:
- name: channel_id
  display_name: 渠道ID
  type: INT UNSIGNED
  skip_index: true
- name: channel_type
  display_name: 渠道类型
  type: INT
  description: 渠道类型：1000=VA, 2000=FX, 3000=AC, 4000=IC
  enum_values:
  - value: 1000
    label: VA
  - value: 2000
    label: FX
  - value: 3000
    label: AC
  - value: 4000
    label: IC
- name: channel_code
  display_name: 渠道编码
  type: VARCHAR(60)
  description: 渠道编码
- name: channel_name
  display_name: 网关名称
  type: VARCHAR(200)
  description: 网关名称
- name: channel_key
  display_name: 渠道商户号
  type: VARCHAR(100)
  description: 渠道商户号（上游颁发的）
  sensitive: true
- name: channel_secret
  display_name: 渠道密钥
  type: TEXT
  description: 渠道密钥
  sensitive: true
- name: channel_api_url
  display_name: 渠道API URL
  type: VARCHAR(250)
  description: 渠道API URL
  sensitive: true
- name: channel_params
  display_name: 其他参数JSON
  type: TEXT
  description: 其他参数:json格式
  skip_index: true
- name: va_config
  display_name: 虚拟账户配置JSON
  type: VARCHAR(4096)
  description: 虚拟账户配置 JSON
  skip_index: true
- name: va_priority
  display_name: VA优先级
  type: INT
  description: 数值越小优先级越高
- name: channel_restrict_id
  display_name: 关联约束ID
  type: INT
  description: 关联约束ID
- name: channel_restrict_name
  display_name: 关联约束名
  type: VARCHAR(60)
  description: 关联约束名字
- name: channel_rate_scheme_id
  display_name: 关联费率方案ID
  type: VARCHAR(36)
  description: 关联费率方案ID
- name: channel_rate_scheme_name
  display_name: 关联费率方案名
  type: VARCHAR(60)
  description: 关联费率方案名
- name: binded_num
  display_name: 绑定路由条数
  type: INT
  description: 绑定路由条数
- name: update_time
  display_name: 更新时间
  type: DATETIME
  description: 更新时间
- name: create_time
  display_name: 添加时间
  type: DATETIME
  description: 添加时间
- name: channel_status
  display_name: 开启状态
  type: TINYINT(1)
  description: 开启状态 0关闭 1开启
  enum_values:
  - value: 0
    label: 关闭
  - value: 1
    label: 开启
- name: available_balance
  display_name: 渠道余额
  type: DECIMAL(16,4)
  description: 渠道余额
relations:
- column: channel_restrict_id
  target_table: pmt_service_restrict
  target_column: restrict_id
  join_type: LEFT JOIN
- column: channel_rate_scheme_id
  target_table: pmt_service_rate_scheme
  target_column: rate_id
  join_type: LEFT JOIN
common_queries:
- question: 启用中的渠道数
  sql: 'SELECT COUNT(*) AS ''启用渠道数''

    FROM dwd_banking.`pmt_service_channel`

    WHERE channel_status = 1

    LIMIT 100

    '
  tables:
  - pmt_service_channel
  difficulty: easy
- question: 各类型渠道分布
  sql: "SELECT\n  CASE channel_type\n    WHEN 1000 THEN 'VA'\n    WHEN 2000 THEN 'FX'\n\
    \    WHEN 3000 THEN 'AC'\n    WHEN 4000 THEN 'IC'\n  END AS '类型',\n  COUNT(*)\
    \ AS '渠道数'\nFROM dwd_banking.`pmt_service_channel`\nWHERE channel_status = 1\n\
    GROUP BY channel_type\nLIMIT 100\n"
  tables:
  - pmt_service_channel
  difficulty: medium
- question: 渠道余额TOP10
  sql: "SELECT channel_code AS '渠道编码',\n       channel_name AS '渠道名',\n       available_balance\
    \ AS '余额'\nFROM dwd_banking.`pmt_service_channel`\nWHERE channel_status = 1\n\
    ORDER BY available_balance DESC\nLIMIT 10\n"
  tables:
  - pmt_service_channel
  difficulty: easy
- question: 各渠道绑定的路由数
  sql: "SELECT channel_code AS '渠道',\n       binded_num AS '绑定路由数'\nFROM dwd_banking.`pmt_service_channel`\n\
    WHERE channel_status = 1\nORDER BY binded_num DESC\nLIMIT 100\n"
  tables:
  - pmt_service_channel
  difficulty: easy
