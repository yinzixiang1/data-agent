table:
  name: pmt_service_channel_funds
  database: dwd_banking
  display_name: 渠道资金表
  description: '各渠道在不同币种下的资金余额(可用/处理中/储备)，含预警配置。

    每行代表一个 (channel_code, balance_currency) 余额。'
  tags:
  - 渠道余额
  - channel funds
  - 预警
  - 资金监控
  - pmt_service_channel_funds
  query_tips: ''
columns:
- name: scid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: funds_id
  display_name: 资金ID
  type: VARCHAR(36)
- name: channel_code
  display_name: 渠道编码
  type: VARCHAR(60)
  description: 渠道编码
- name: channel_name
  display_name: 渠道名称
  type: VARCHAR(200)
  description: 网关名称
- name: balance_currency
  display_name: 账户币种
  type: VARCHAR(6)
  description: 账户币种
- name: available_balance
  display_name: 可用余额
  type: DECIMAL(16,4)
  description: 渠道余额
- name: pending_balance
  display_name: 处理中金额
  type: DECIMAL(16,4)
  description: 处理中金额
- name: reserved_balance
  display_name: 储备余额
  type: DECIMAL(16,4)
  description: 储备余额
- name: create_time
  display_name: 添加时间
  type: DATETIME
  description: 添加时间
- name: sync_time
  display_name: 同步时间
  type: DATETIME(3)
  description: 同步时间
- name: update_time
  display_name: 更新时间
  type: DATETIME(3)
  description: 更新时间
- name: warning_status
  display_name: 预警开关
  type: TINYINT
  description: 预警开关：0=关，1=开
  enum_values:
  - value: 0
    label: 关
  - value: 1
    label: 开
- name: warning_info
  display_name: 预警配置信息
  type: TEXT
  description: 预警配置信息
  skip_index: true
relations:
- column: channel_code
  target_table: pmt_service_channel
  target_column: channel_code
  join_type: LEFT JOIN
common_queries:
- question: 各渠道币种余额
  sql: "SELECT channel_code AS '渠道',\n       balance_currency AS '币种',\n       available_balance\
    \ AS '可用余额',\n       pending_balance AS '处理中',\n       reserved_balance AS '储备'\n\
    FROM dwd_banking.`pmt_service_channel_funds`\nORDER BY channel_code, balance_currency\n\
    LIMIT 100\n"
  tables:
  - pmt_service_channel_funds
  difficulty: easy
- question: 已开预警的渠道
  sql: "SELECT channel_code AS '渠道',\n       balance_currency AS '币种',\n       available_balance\
    \ AS '可用余额'\nFROM dwd_banking.`pmt_service_channel_funds`\nWHERE warning_status\
    \ = 1\nLIMIT 100\n"
  tables:
  - pmt_service_channel_funds
  difficulty: easy
- question: 余额低于10000的渠道(可能需补充)
  sql: "SELECT channel_code AS '渠道',\n       balance_currency AS '币种',\n       available_balance\
    \ AS '可用余额'\nFROM dwd_banking.`pmt_service_channel_funds`\nWHERE available_balance\
    \ < 10000\nORDER BY available_balance\nLIMIT 100\n"
  tables:
  - pmt_service_channel_funds
  difficulty: easy
