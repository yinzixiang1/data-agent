table:
  name: sys_industry_mcc
  database: dwd_banking
  display_name: 行业MCC表
  description: 'MCC(Merchant Category Code)行业分类。

    每行代表一个MCC，含两级分类和风险等级，用于商户行业归类与风控分级。'
  tags:
  - 行业分类
  - MCC
  - 风控分级
  - merchant category
  - sys_industry_mcc
  query_tips: ''
columns:
- name: mid
  display_name: 主键ID
  type: INT
  skip_index: true
- name: code
  display_name: 编码
  type: VARCHAR(100)
  description: 编码
- name: class_key_l1
  display_name: 1级分类关键词
  type: VARCHAR(100)
  description: 1级分类关键词
- name: class_name_l1
  display_name: 1级分类名
  type: VARCHAR(200)
  description: 1级分类名
- name: class_key_l2
  display_name: 2级分类关键词
  type: VARCHAR(100)
  description: 2级分类关键词
- name: class_name_l2
  display_name: 2级分类名
  type: VARCHAR(200)
  description: 2级分类名
- name: mcc_code
  display_name: MCC代码
  type: VARCHAR(100)
  description: MCC代码
- name: mcc_name
  display_name: MCC名
  type: VARCHAR(200)
  description: MCC名
- name: wechat_code
  display_name: 微信代码
  type: VARCHAR(10)
  description: wechat代码
- name: risk_rating_level
  display_name: 风险等级
  type: VARCHAR(20)
  description: '风险等级: ''LOW'',''MEDIUM'',''HIGH'',''VERY_HIGH'',''MANUAL_REVIEW'',''NONE'',''NORMAL'''
  enum_values:
  - LOW
  - MEDIUM
  - HIGH
  - VERY_HIGH
  - MANUAL_REVIEW
  - NONE
  - NORMAL
- name: search_keys
  display_name: 查询关键词
  type: VARCHAR(255)
  description: 查询关键词
- name: create_time
  display_name: 创建时间
  type: DATETIME
  description: 创建时间
- name: update_time
  display_name: 更新时间
  type: DATETIME
  description: 更新时间
- name: mcc_status
  display_name: 状态
  type: TINYINT(1)
  description: 状态：-1删除，0默认关闭，1正常
  enum_values:
  - value: -1
    label: 删除
  - value: 0
    label: 默认关闭
  - value: 1
    label: 正常
- name: sort_key
  display_name: 排序键
  type: VARCHAR(6)
  description: 排序
relations:
- column: code
  target_table: pmt_account
  target_column: industry_mcc_code
  join_type: LEFT JOIN
common_queries:
- question: 各风险等级的MCC数量
  sql: "SELECT risk_rating_level AS '风险等级',\n       COUNT(*) AS 'MCC数'\nFROM dwd_banking.`sys_industry_mcc`\n\
    WHERE mcc_status = 1\nGROUP BY risk_rating_level\nLIMIT 100\n"
  tables:
  - sys_industry_mcc
  difficulty: easy
- question: 高风险行业列表
  sql: "SELECT class_name_l1 AS '1级分类',\n       class_name_l2 AS '2级分类',\n       mcc_code\
    \ AS 'MCC',\n       mcc_name AS 'MCC名'\nFROM dwd_banking.`sys_industry_mcc`\n\
    WHERE risk_rating_level IN ('HIGH', 'VERY_HIGH')\n  AND mcc_status = 1\nLIMIT\
    \ 100\n"
  tables:
  - sys_industry_mcc
  difficulty: easy
- question: 1级分类下的MCC数
  sql: "SELECT class_name_l1 AS '1级分类',\n       COUNT(*) AS 'MCC数'\nFROM dwd_banking.`sys_industry_mcc`\n\
    WHERE mcc_status = 1\nGROUP BY class_name_l1\nORDER BY `MCC数` DESC\nLIMIT 100\n"
  tables:
  - sys_industry_mcc
  difficulty: easy
