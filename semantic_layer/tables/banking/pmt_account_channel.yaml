table:
  name: pmt_account_channel
  database: dwd_banking
  display_name: 上游渠道账户关联表
  description: '商户账户在各上游渠道(Currencycloud/DBS/CIMB等)的开通和审查状态记录。

    每行代表一个 (account_id, channel_code) 的渠道账户映射，是渠道侧用户身份的桥梁。'
  tags:
  - 渠道账户
  - 渠道开通
  - 审查状态
  - KYC审查
  - 上游渠道
  - channel
  - pmt_account_channel
  query_tips: 查询已开通用 open_status=1 AND review_status=1
columns:
- name: acid
  display_name: 主键ID
  type: INT
  skip_index: true
- name: account_channel_id
  display_name: 用户渠道ID
  type: VARCHAR(36)
  description: 用户渠道ID
- name: direct_id
  display_name: 机构ID
  type: VARCHAR(36)
  description: 机构ID
- name: account_id
  display_name: 系统内部账户ID
  type: VARCHAR(36)
  description: 系统内部账户ID
- name: channel_customer_id
  display_name: 渠道客户唯一ID
  type: VARCHAR(36)
  description: 渠道唯一ID
- name: customer_data
  display_name: 客户渠道数据
  type: TEXT
  description: 客户渠道数据
  skip_index: true
- name: channel_code
  display_name: 渠道编码
  type: VARCHAR(60)
  description: 渠道编码
- name: create_time
  display_name: 创建时间
  type: DATETIME
- name: update_time
  display_name: 更新时间
  type: DATETIME
- name: open_status
  display_name: 账户开通状态
  type: INT
  description: 账号开通状态：1=开通成功，2=申请中，-1=关闭，-10=隐藏模块
  enum_values:
  - value: 0
    label: 默认
  - value: 1
    label: 开通成功
  - value: 2
    label: 申请中
  - value: -1
    label: 关闭
  - value: -10
    label: 隐藏模块
- name: file_status
  display_name: 文件状态
  type: INT
  description: 文件状态：2=pending(waiting upload), 1=completed，-1=failed
  enum_values:
  - value: 0
    label: 默认
  - value: 1
    label: 完成
  - value: 2
    label: 待上传
  - value: -1
    label: 失败
- name: review_status
  display_name: 审查状态
  type: INT
  description: 审查状态：1=通过passed, 2=审查处理中pending, 3=已提交processing，-1=失败rejected
  enum_values:
  - value: 0
    label: 默认
  - value: 1
    label: 通过
  - value: 2
    label: 处理中pending
  - value: 3
    label: 已提交processing
  - value: -1
    label: 失败rejected
- name: review_reason
  display_name: 审查原因
  type: VARCHAR(255)
  description: 审查原因
- name: rfi_status
  display_name: RFI状态
  type: INT
  description: 'RFI 状态: 0=不需要额外信息, 1=需要额外信息'
  enum_values:
  - value: 0
    label: 不需要额外信息
  - value: 1
    label: 需要额外信息
- name: execute_reason
  display_name: 内部说明
  type: TEXT
  description: 内部msg
  skip_index: true
- name: source_config_data
  display_name: 渠道源数据
  type: TEXT
  description: 渠道源数据
  skip_index: true
- name: processing_bank_details
  display_name: 处理中的Global Account
  type: TEXT
  description: 用户提交va申请后,状态为处理中的global account
  skip_index: true
relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
- column: channel_code
  target_table: pmt_service_channel
  target_column: channel_code
  join_type: LEFT JOIN
common_queries:
- question: 各渠道的开通商户数
  sql: "SELECT channel_code AS '渠道',\n       COUNT(*) AS '开通商户数'\nFROM dwd_banking.`pmt_account_channel`\n\
    WHERE open_status = 1\nGROUP BY channel_code\nORDER BY `开通商户数` DESC\nLIMIT 100\n"
  tables:
  - pmt_account_channel
  difficulty: easy
- question: 各渠道审查通过率
  sql: "SELECT channel_code AS '渠道',\n       ROUND(SUM(CASE WHEN review_status = 1\
    \ THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 2) AS '通过率%',\n       COUNT(*) AS '总数'\n\
    FROM dwd_banking.`pmt_account_channel`\nGROUP BY channel_code\nORDER BY `通过率%`\
    \ DESC\nLIMIT 100\n"
  tables:
  - pmt_account_channel
  difficulty: medium
- question: pending状态超过7天的渠道申请
  sql: "SELECT account_id AS '账户ID',\n       channel_code AS '渠道',\n       review_status\
    \ AS '审查状态',\n       create_time AS '申请时间',\n       DATEDIFF(NOW(), create_time)\
    \ AS '已等待天数'\nFROM dwd_banking.`pmt_account_channel`\nWHERE review_status IN (2,\
    \ 3)\n  AND create_time < DATE_SUB(NOW(), INTERVAL 7 DAY)\nORDER BY create_time\n\
    LIMIT 100\n"
  tables:
  - pmt_account_channel
  difficulty: medium
- question: 各渠道RFI需求量
  sql: "SELECT channel_code AS '渠道',\n       SUM(CASE WHEN rfi_status = 1 THEN 1 ELSE\
    \ 0 END) AS '需要RFI数',\n       COUNT(*) AS '总申请数'\nFROM dwd_banking.`pmt_account_channel`\n\
    GROUP BY channel_code\nORDER BY `需要RFI数` DESC\nLIMIT 100\n"
  tables:
  - pmt_account_channel
  difficulty: medium
- question: 审查失败的商户和原因
  sql: "SELECT a.short_account_id AS '商户短号',\n       ac.channel_code AS '渠道',\n  \
    \     ac.review_reason AS '失败原因',\n       ac.create_time AS '申请时间'\nFROM dwd_banking.`pmt_account_channel`\
    \ ac\nLEFT JOIN dwd_banking.`pmt_account` a ON ac.account_id = a.account_id\n\
    WHERE ac.review_status = -1\nORDER BY ac.create_time DESC\nLIMIT 50\n"
  tables:
  - pmt_account_channel
  - pmt_account
  difficulty: hard
