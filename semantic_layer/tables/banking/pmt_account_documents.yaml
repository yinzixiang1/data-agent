table:
  name: pmt_account_documents
  database: dwd_banking
  display_name: 账户资料表
  description: '商户上传的KYC/KYB材料以及交易订单的文档资料。

    每行代表一个上传文档，覆盖账户类、受益人类、付款人类、存款/代付/汇兑类，包含文档审核状态。'
  tags:
  - KYC文档
  - KYB材料
  - 资料审核
  - 文档上传
  - document
  - pmt_account_documents
  query_tips: 已审核通过用 review_status=1；未删除用 docs_status != -1
columns:
- name: did
  display_name: 主键ID
  type: INT
  skip_index: true
- name: docs_id
  display_name: 文档长ID
  type: VARCHAR(36)
  description: 长ID
- name: direct_id
  display_name: 机构ID
  type: VARCHAR(36)
  description: 父ID（常用于机构模式）
- name: account_id
  display_name: 系统内部账户ID
  type: VARCHAR(36)
  description: 系统内部账户ID
- name: short_account_id
  display_name: 商户短号
  type: VARCHAR(20)
  description: 商户短号
- name: account_name
  display_name: 商户短名
  type: VARCHAR(250)
  description: 商户短名
- name: docs_main_type
  display_name: 文档主类型
  type: INT
  description: 1000=account，1001=beneficiary，1002=payer，2000=deposit，2001=payout，3000=conversion
  enum_values:
  - value: 1000
    label: 账户
  - value: 1001
    label: 受益人
  - value: 1002
    label: 付款人
  - value: 2000
    label: 存款
  - value: 2001
    label: 代付
  - value: 3000
    label: 汇兑
- name: docs_sub_type
  display_name: 文档子类型
  type: INT
  description: 二级类型，0其他文档。更多docs_sub_type.go
- name: docs_type_name
  display_name: 类型名
  type: VARCHAR(255)
  description: 类型名
- name: docs_file_type
  display_name: 文件资料类型
  type: VARCHAR(45)
  description: '资料类型: '
- name: docs_file_name
  display_name: 原始文件名
  type: VARCHAR(255)
  description: 原始文件名
- name: docs_file_path
  display_name: 文件存储路径
  type: VARCHAR(255)
  description: 文件存储路径
  sensitive: true
- name: docs_file_size
  display_name: 文件大小
  type: VARCHAR(50)
  description: 文件大小：0kb
- name: short_reference_id
  display_name: 文件短号
  type: VARCHAR(20)
  description: 文件短号
- name: creator_id
  display_name: 创建人ID
  type: VARCHAR(36)
- name: creator_name
  display_name: 创建人名
  type: VARCHAR(65)
- name: create_time
  display_name: 创建时间
  type: DATETIME
- name: update_time
  display_name: 更新时间
  type: DATETIME
- name: ref_reference_id
  display_name: 关联订单ID
  type: VARCHAR(36)
  description: 关联ID 订单等
- name: ref_short_reference_id
  display_name: 关联订单短号
  type: VARCHAR(20)
  description: 短号
- name: batch_id
  display_name: 批次号
  type: VARCHAR(32)
  description: 批次号
- name: review_status
  display_name: 审核状态
  type: TINYINT(1)
  description: ' -1:审核失败；0:pending；1:审核成功'
  enum_values:
  - value: 0
    label: 待审核
  - value: 1
    label: 审核通过
  - value: -1
    label: 审核失败
- name: review_reason
  display_name: 拒绝原因
  type: VARCHAR(200)
  description: 拒绝原因
- name: docs_status
  display_name: 文档状态
  type: TINYINT(1)
  description: 状态：0 pending(waiting upload), 1 completed  -1 failed
  enum_values:
  - value: 0
    label: 待上传
  - value: 1
    label: 上传完成
  - value: -1
    label: 上传失败
- name: storage_location
  display_name: 存储位置
  type: TINYINT(1)
  description: 1:cloud;2:local;3:cloud+local
  enum_values:
  - value: 1
    label: 云端
  - value: 2
    label: 本地
  - value: 3
    label: 云端+本地
- name: channel_flag
  display_name: 渠道标记
  type: TINYINT(1)
- name: remark
  display_name: 文件备注
  type: VARCHAR(255)
  description: 文件备注
- name: oss_bucket
  display_name: S3 Bucket
  type: VARCHAR(30)
  description: s3 bucket
  skip_index: true
relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
- column: ref_reference_id
  target_table: pmt_finance_payout
  target_column: payout_id
  join_type: LEFT JOIN
common_queries:
- question: 待审核的文档数量(按文档类型)
  sql: "SELECT\n  CASE docs_main_type\n    WHEN 1000 THEN '账户'\n    WHEN 1001 THEN\
    \ '受益人'\n    WHEN 1002 THEN '付款人'\n    WHEN 2000 THEN '存款'\n    WHEN 2001 THEN\
    \ '代付'\n    WHEN 3000 THEN '汇兑'\n  END AS '文档类型',\n  COUNT(*) AS '待审核数'\nFROM\
    \ dwd_banking.`pmt_account_documents`\nWHERE review_status = 0\n  AND docs_status\
    \ = 1\nGROUP BY docs_main_type\nORDER BY `待审核数` DESC\nLIMIT 100\n"
  tables:
  - pmt_account_documents
  difficulty: medium
- question: 各类型文档的审核通过率
  sql: "SELECT\n  CASE docs_main_type\n    WHEN 1000 THEN '账户'\n    WHEN 1001 THEN\
    \ '受益人'\n    WHEN 1002 THEN '付款人'\n    WHEN 2000 THEN '存款'\n    WHEN 2001 THEN\
    \ '代付'\n    WHEN 3000 THEN '汇兑'\n  END AS '类型',\n  ROUND(SUM(CASE WHEN review_status\
    \ = 1 THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 2) AS '通过率%'\nFROM dwd_banking.`pmt_account_documents`\n\
    WHERE review_status != 0\nGROUP BY docs_main_type\nLIMIT 100\n"
  tables:
  - pmt_account_documents
  difficulty: medium
- question: 某商户上传的文档列表
  sql: "SELECT short_reference_id AS '文件短号',\n       docs_type_name AS '类型',\n   \
    \    docs_file_name AS '文件名',\n       review_status AS '审核状态',\n       create_time\
    \ AS '上传时间'\nFROM dwd_banking.`pmt_account_documents`\nWHERE short_account_id\
    \ = ?\nORDER BY create_time DESC\nLIMIT 100\n"
  tables:
  - pmt_account_documents
  difficulty: easy
- question: 文档审核平均耗时(已审核)
  sql: "SELECT\n  CASE docs_main_type\n    WHEN 1000 THEN '账户'\n    WHEN 2001 THEN\
    \ '代付'\n    ELSE '其他' END AS '类型',\n  AVG(TIMESTAMPDIFF(HOUR, create_time, update_time))\
    \ AS '平均耗时(小时)'\nFROM dwd_banking.`pmt_account_documents`\nWHERE review_status\
    \ IN (1, -1)\n  AND update_time IS NOT NULL\nGROUP BY docs_main_type\nLIMIT 100\n"
  tables:
  - pmt_account_documents
  difficulty: medium
- question: 最近一周上传量
  sql: "SELECT DATE(create_time) AS '日期',\n       COUNT(*) AS '上传数'\nFROM dwd_banking.`pmt_account_documents`\n\
    WHERE create_time >= DATE_SUB(NOW(), INTERVAL 7 DAY)\nGROUP BY DATE(create_time)\n\
    ORDER BY `日期` DESC\nLIMIT 100\n"
  tables:
  - pmt_account_documents
  difficulty: easy
