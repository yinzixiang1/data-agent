table:
  name: pmt_message_notification
  database: dwd_banking
  display_name: 商户消息通知表
  description: '平台对商户的Email/SMS通知发送记录。

    每行代表一次通知发送，含通知类型、参数、内容、SQS回执、验证状态。'
  tags:
  - 通知
  - 邮件
  - message notification
  - SMS
  - SQS
  - pmt_message_notification
  query_tips: ''
columns:
- name: mnid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: notification_id
  display_name: 通知ID
  type: VARCHAR(36)
  description: 通知ID
- name: sqs_receipt_time
  display_name: SQS回执时间
  type: DATETIME
  description: SQS回执的时间
- name: sqs_receipt_body
  display_name: SQS回执Body
  type: TEXT
  description: SQS回执的消息体
  skip_index: true
- name: direct_id
  display_name: 机构ID
  type: VARCHAR(36)
- name: account_id
  display_name: 账户ID
  type: VARCHAR(36)
- name: user_id
  display_name: 用户ID
  type: VARCHAR(36)
- name: notification_type
  display_name: 通知类型
  type: VARCHAR(120)
  description: 名字即关联相应的模板文件(sys_notification_template.tpl_code)
- name: notification_params
  display_name: 通知参数(KV)
  type: TEXT
  description: 通知参数KV模式
  skip_index: true
- name: notification_remark
  display_name: 记录原因
  type: VARCHAR(250)
  description: 记录原因
- name: notification_content
  display_name: 发送内容
  type: LONGTEXT
  description: 发送内容
  skip_index: true
- name: notification_hash
  display_name: 通知hash
  type: VARCHAR(36)
  description: 用于验证邮箱/修改密码等特殊用途
- name: create_time
  display_name: 创建时间
  type: DATETIME
- name: update_time
  display_name: 更新时间
  type: DATETIME
- name: short_account_id
  display_name: 商户短号
  type: VARCHAR(20)
- name: notification_verified
  display_name: 验证状态
  type: TINYINT(1)
  description: 0=default, 1=verified, -1=failed
  enum_values:
  - value: 0
    label: default
  - value: 1
    label: verified
  - value: -1
    label: failed
- name: notification_status
  display_name: 通知状态
  type: TINYINT(1)
  description: 0=pending，1=success, -1=failed
  enum_values:
  - value: 0
    label: pending
  - value: 1
    label: success
  - value: -1
    label: failed
- name: batch_id
  display_name: 批次号
  type: VARCHAR(32)
  description: 批次号
- name: reference_table_name
  display_name: 关联对象表
  type: VARCHAR(255)
  description: 对象object表
- name: email_no
  display_name: 邮箱
  type: VARCHAR(120)
  sensitive: true
- name: email_cc
  display_name: 抄送
  type: VARCHAR(255)
  description: 自定义通知邮件
  sensitive: true
relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
- column: notification_type
  target_table: sys_notification_template
  target_column: tpl_code
  join_type: LEFT JOIN
common_queries:
- question: 通知发送成功率
  sql: "SELECT\n  ROUND(SUM(CASE WHEN notification_status = 1 THEN 1 ELSE 0 END) *\
    \ 100.0 / COUNT(*), 2) AS '成功率%',\n  SUM(CASE WHEN notification_status = 1 THEN\
    \ 1 ELSE 0 END) AS '成功数',\n  SUM(CASE WHEN notification_status = -1 THEN 1 ELSE\
    \ 0 END) AS '失败数'\nFROM dwd_banking.`pmt_message_notification`\nWHERE create_time\
    \ >= DATE_SUB(NOW(), INTERVAL 30 DAY)\nLIMIT 100\n"
  tables:
  - pmt_message_notification
  difficulty: medium
- question: 各类通知发送量
  sql: "SELECT notification_type AS '通知类型',\n       COUNT(*) AS '发送数',\n       SUM(CASE\
    \ WHEN notification_status = 1 THEN 1 ELSE 0 END) AS '成功数'\nFROM dwd_banking.`pmt_message_notification`\n\
    WHERE create_time >= DATE_SUB(NOW(), INTERVAL 30 DAY)\nGROUP BY notification_type\n\
    ORDER BY `发送数` DESC\nLIMIT 30\n"
  tables:
  - pmt_message_notification
  difficulty: medium
- question: 失败通知统计
  sql: "SELECT notification_type AS '通知类型',\n       COUNT(*) AS '失败数'\nFROM dwd_banking.`pmt_message_notification`\n\
    WHERE notification_status = -1\n  AND create_time >= DATE_SUB(NOW(), INTERVAL\
    \ 7 DAY)\nGROUP BY notification_type\nORDER BY `失败数` DESC\nLIMIT 100\n"
  tables:
  - pmt_message_notification
  difficulty: easy
- question: 邮件验证通过率
  sql: "SELECT\n  ROUND(SUM(CASE WHEN notification_verified = 1 THEN 1 ELSE 0 END)\
    \ * 100.0 / COUNT(*), 2) AS '验证率%'\nFROM dwd_banking.`pmt_message_notification`\n\
    WHERE notification_type LIKE '%verify%'\n  AND notification_verified IN (1, -1)\n\
    LIMIT 100\n"
  tables:
  - pmt_message_notification
  difficulty: medium
