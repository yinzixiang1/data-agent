table:
  name: pmt_finance_adjustment
  database: dwd_banking
  display_name: 调账记录表
  description: '财务对账户余额的人工调整(差额/冲正加扣款)。

    每行代表一笔调账操作，保留调整前后余额、原因、审核状态。'
  tags:
  - 调账
  - adjustment
  - 财务调整
  - 冲正
  - 差额加扣款
  - pmt_finance_adjustment
  query_tips: ''
columns:
- name: abid
  display_name: 主键ID
  type: BIGINT UNSIGNED
  skip_index: true
- name: direct_id
  display_name: 机构ID
  type: VARCHAR(36)
- name: account_id
  display_name: 账户ID
  type: VARCHAR(36)
  description: 调整前账户ID
- name: account_name
  display_name: 账户名
  type: VARCHAR(200)
  description: 调整前账户名
- name: adjustment_id
  display_name: 调账单号
  type: VARCHAR(36)
  description: 调账单号UUID
- name: adjustment_type
  display_name: 调账类型
  type: INT
  description: 调账类型：9001-差额加款 9002-差额扣款 9003-冲正加款 9004-冲正扣款
  enum_values:
  - value: 9001
    label: 差额加款
  - value: 9002
    label: 差额扣款
  - value: 9003
    label: 冲正加款
  - value: 9004
    label: 冲正扣款
- name: balance_type
  display_name: 余额类型
  type: INT
  description: 账户余额类型 1000=VA 2000=FX(预留), 3000=AC, 4000=IC
  enum_values:
  - value: 1000
    label: VA
  - value: 2000
    label: FX
  - value: 3000
    label: AC
  - value: 4000
    label: IC
- name: balance_currency
  display_name: 调整币种
  type: VARCHAR(3)
  description: 调整币种
- name: before_available_balance
  display_name: 调账前余额
  type: DECIMAL(16,4)
  description: 调账前账户余额
- name: adjustment_amount
  display_name: 调账金额
  type: DECIMAL(16,4)
  description: 调账金额
- name: adjusted_available_balance
  display_name: 调账后余额
  type: DECIMAL(16,4)
  description: 调账后账户余额
- name: short_account_id
  display_name: 商户短ID
  type: VARCHAR(20)
  description: 商户短ID
- name: short_reference_id
  display_name: 调账短单号
  type: VARCHAR(20)
  description: 调账短单号
- name: reference_type
  display_name: 关联类型
  type: INT
  description: 关联类型：1000=payin, 1001=deposit, 2000=payout, 2001=transfer, 3000=conversion，4000=card
    fee, 4001=card charge，8000=fee, 9000=adjustment
  enum_values:
  - value: 1000
    label: payin
  - value: 1001
    label: deposit
  - value: 2000
    label: payout
  - value: 2001
    label: transfer
  - value: 3000
    label: conversion
  - value: 4000
    label: card fee
  - value: 4001
    label: card charge
  - value: 8000
    label: fee
  - value: 9000
    label: adjustment
- name: reference_id
  display_name: 关联ID
  type: VARCHAR(48)
  description: 关联ID
- name: adjustment_reason
  display_name: 调账原因
  type: VARCHAR(200)
  description: 调账原因
- name: creator_id
  display_name: 创建人ID
  type: VARCHAR(36)
- name: creator_name
  display_name: 创建人名
  type: VARCHAR(100)
- name: create_time
  display_name: 创建时间
  type: DATETIME
  description: 创建时间
- name: update_time
  display_name: 更新时间
  type: DATETIME
  description: 更新时间
- name: review_status
  display_name: 审查状态
  type: TINYINT(1)
  description: 审查状态：1=passed, 0=in_review, -1=rejected
  enum_values:
  - value: 1
    label: 通过
  - value: 0
    label: 审核中
  - value: -1
    label: 拒绝
- name: adjustment_status
  display_name: 调账状态
  type: TINYINT(1)
  description: 调账状态 0=默认 1=成功 -1=失败
  enum_values:
  - value: 0
    label: 默认
  - value: 1
    label: 成功
  - value: -1
    label: 失败
relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
common_queries:
- question: 月度调账总笔数和金额
  sql: "SELECT DATE_FORMAT(create_time, '%Y-%m') AS '月份',\n       COUNT(*) AS '笔数',\n\
    \       SUM(adjustment_amount) AS '调账总额'\nFROM dwd_banking.`pmt_finance_adjustment`\n\
    WHERE adjustment_status = 1\nGROUP BY DATE_FORMAT(create_time, '%Y-%m')\nORDER\
    \ BY `月份` DESC\nLIMIT 100\n"
  tables:
  - pmt_finance_adjustment
  difficulty: easy
- question: 各调账类型分布
  sql: "SELECT\n  CASE adjustment_type\n    WHEN 9001 THEN '差额加款'\n    WHEN 9002 THEN\
    \ '差额扣款'\n    WHEN 9003 THEN '冲正加款'\n    WHEN 9004 THEN '冲正扣款'\n  END AS '调账类型',\n\
    \  COUNT(*) AS '笔数',\n  SUM(adjustment_amount) AS '总金额'\nFROM dwd_banking.`pmt_finance_adjustment`\n\
    WHERE adjustment_status = 1\nGROUP BY adjustment_type\nORDER BY `笔数` DESC\nLIMIT\
    \ 100\n"
  tables:
  - pmt_finance_adjustment
  difficulty: medium
- question: 调账审核拒绝率
  sql: "SELECT\n  ROUND(SUM(CASE WHEN review_status = -1 THEN 1 ELSE 0 END) * 100.0\
    \ / COUNT(*), 2) AS '拒绝率%',\n  COUNT(*) AS '总数'\nFROM dwd_banking.`pmt_finance_adjustment`\n\
    WHERE review_status IN (1, -1)\nLIMIT 100\n"
  tables:
  - pmt_finance_adjustment
  difficulty: medium
- question: 调账金额TOP商户
  sql: "SELECT account_name AS '商户名',\n       short_account_id AS '短号',\n       SUM(adjustment_amount)\
    \ AS '调账总额',\n       COUNT(*) AS '笔数'\nFROM dwd_banking.`pmt_finance_adjustment`\n\
    WHERE adjustment_status = 1\nGROUP BY account_name, short_account_id\nORDER BY\
    \ `调账总额` DESC\nLIMIT 10\n"
  tables:
  - pmt_finance_adjustment
  difficulty: easy
- question: 待审核的调账
  sql: "SELECT short_reference_id AS '调账短号',\n       account_name AS '商户',\n     \
    \  adjustment_amount AS '金额',\n       balance_currency AS '币种',\n       create_time\
    \ AS '创建时间'\nFROM dwd_banking.`pmt_finance_adjustment`\nWHERE review_status =\
    \ 0\nORDER BY create_time\nLIMIT 100\n"
  tables:
  - pmt_finance_adjustment
  difficulty: easy
