table:
  name: pmt_finance_adjustment
  database: dwd_banking
  display_name: 调账记录表
  description: |
    财务对账户余额的人工调整(差额/冲正加扣款)。
    每行代表一笔调账操作，保留调整前后余额、原因、审核状态。
  tags: [调账, adjustment, 财务调整, 冲正, 差额加扣款]

columns:
  - name: abid
    display_name: 主键ID
    skip_index: true

  - name: direct_id
    display_name: 机构ID

  - name: account_id
    display_name: 账户ID

  - name: account_name
    display_name: 账户名

  - name: adjustment_id
    display_name: 调账单号

  - name: adjustment_type
    display_name: 调账类型
    enum_values:
      - {value: 9001, label: "差额加款"}
      - {value: 9002, label: "差额扣款"}
      - {value: 9003, label: "冲正加款"}
      - {value: 9004, label: "冲正扣款"}

  - name: balance_type
    display_name: 余额类型
    enum_values:
      - {value: 1000, label: "VA"}
      - {value: 2000, label: "FX"}
      - {value: 3000, label: "AC"}
      - {value: 4000, label: "IC"}

  - name: balance_currency
    display_name: 调整币种

  - name: before_available_balance
    display_name: 调账前余额

  - name: adjustment_amount
    display_name: 调账金额

  - name: adjusted_available_balance
    display_name: 调账后余额

  - name: short_account_id
    display_name: 商户短ID

  - name: short_reference_id
    display_name: 调账短单号

  - name: reference_type
    display_name: 关联类型
    enum_values:
      - {value: 1000, label: "payin"}
      - {value: 1001, label: "deposit"}
      - {value: 2000, label: "payout"}
      - {value: 2001, label: "transfer"}
      - {value: 3000, label: "conversion"}
      - {value: 4000, label: "card fee"}
      - {value: 4001, label: "card charge"}
      - {value: 8000, label: "fee"}
      - {value: 9000, label: "adjustment"}

  - name: reference_id
    display_name: 关联ID

  - name: adjustment_reason
    display_name: 调账原因

  - name: creator_id
    display_name: 创建人ID

  - name: creator_name
    display_name: 创建人名

  - name: review_status
    display_name: 审查状态
    enum_values:
      - {value: 1, label: "通过"}
      - {value: 0, label: "审核中"}
      - {value: -1, label: "拒绝"}

  - name: adjustment_status
    display_name: 调账状态
    enum_values:
      - {value: 0, label: "默认"}
      - {value: 1, label: "成功"}
      - {value: -1, label: "失败"}

  - name: create_time
    display_name: 创建时间

  - name: update_time
    display_name: 更新时间

relations:
  - column: account_id
    target_table: pmt_account
    target_column: account_id
    join_type: LEFT JOIN

common_queries:
  - question: 月度调账总笔数和金额
    sql: |
      SELECT DATE_FORMAT(create_time, '%Y-%m') AS "月份",
             COUNT(*) AS "笔数",
             SUM(adjustment_amount) AS "调账总额"
      FROM dwd_banking.pmt_finance_adjustment
      WHERE adjustment_status = 1
      GROUP BY DATE_FORMAT(create_time, '%Y-%m')
      ORDER BY "月份" DESC;
    tables: [pmt_finance_adjustment]
    difficulty: easy

  - question: 各调账类型分布
    sql: |
      SELECT
        CASE adjustment_type
          WHEN 9001 THEN '差额加款'
          WHEN 9002 THEN '差额扣款'
          WHEN 9003 THEN '冲正加款'
          WHEN 9004 THEN '冲正扣款'
        END AS "调账类型",
        COUNT(*) AS "笔数",
        SUM(adjustment_amount) AS "总金额"
      FROM dwd_banking.pmt_finance_adjustment
      WHERE adjustment_status = 1
      GROUP BY adjustment_type
      ORDER BY "笔数" DESC;
    tables: [pmt_finance_adjustment]
    difficulty: medium

  - question: 调账审核拒绝率
    sql: |
      SELECT
        ROUND(SUM(CASE WHEN review_status = -1 THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 2) AS "拒绝率%",
        COUNT(*) AS "总数"
      FROM dwd_banking.pmt_finance_adjustment
      WHERE review_status IN (1, -1);
    tables: [pmt_finance_adjustment]
    difficulty: medium

  - question: 调账金额TOP商户
    sql: |
      SELECT account_name AS "商户名",
             short_account_id AS "短号",
             SUM(adjustment_amount) AS "调账总额",
             COUNT(*) AS "笔数"
      FROM dwd_banking.pmt_finance_adjustment
      WHERE adjustment_status = 1
      GROUP BY account_name, short_account_id
      ORDER BY "调账总额" DESC
      LIMIT 10;
    tables: [pmt_finance_adjustment]
    difficulty: easy

  - question: 待审核的调账
    sql: |
      SELECT short_reference_id AS "调账短号",
             account_name AS "商户",
             adjustment_amount AS "金额",
             balance_currency AS "币种",
             create_time AS "创建时间"
      FROM dwd_banking.pmt_finance_adjustment
      WHERE review_status = 0
      ORDER BY create_time;
    tables: [pmt_finance_adjustment]
    difficulty: easy
