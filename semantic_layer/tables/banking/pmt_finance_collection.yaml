table:
  name: pmt_finance_collection
  database: dwd_banking
  display_name: 资金归集记录表
  description: '平台内部资金归集流水(to house / to client)，覆盖deposit/payout/payout refund等场景。

    每行代表一次内部资金调拨，关联CC house/client账户。'
  tags:
  - 资金归集
  - finance collection
  - house
  - client
  - 内部资金
  - pmt_finance_collection
  query_tips: ''
columns:
- name: pcid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: collection_id
  display_name: 归集ID
  type: VARCHAR(36)
- name: direct_id
  display_name: 机构ID
  type: VARCHAR(36)
- name: account_id
  display_name: 账户ID
  type: VARCHAR(36)
- name: account_name
  display_name: 商户名
  type: VARCHAR(250)
- name: currency
  display_name: 币种
  type: VARCHAR(6)
- name: amount
  display_name: 金额
  type: DECIMAL(16,2)
- name: reason
  display_name: 原因
  type: VARCHAR(200)
- name: collection_type
  display_name: 归集类型
  type: INT
  description: '1000: deposit; 2000: payout; 2001:payout refund'
  enum_values:
  - value: 0
    label: 默认
  - value: 1000
    label: deposit
  - value: 2000
    label: payout
  - value: 2001
    label: payout refund
- name: inbound_type
  display_name: 入向类型
  type: INT
  description: '1000: to house; 2000: to client'
  enum_values:
  - value: 0
    label: 默认
  - value: 1000
    label: to house
  - value: 2000
    label: to client
- name: ref_cc_client_id
  display_name: CC客户ID
  type: VARCHAR(40)
- name: ref_cc_house_id
  display_name: CC house ID
  type: VARCHAR(40)
- name: channel_code
  display_name: 渠道编码
  type: VARCHAR(64)
- name: channel_resp_id
  display_name: 渠道响应ID
  type: VARCHAR(100)
- name: channel_resp_status
  display_name: 渠道响应状态
  type: VARCHAR(20)
- name: channel_resp_body
  display_name: 渠道响应Body
  type: TEXT
  skip_index: true
- name: short_account_id
  display_name: 账户短号
  type: VARCHAR(20)
  description: account id短号
- name: reference_id
  display_name: 关联订单ID
  type: VARCHAR(36)
  description: 关联原始订单 长单号
- name: short_reference_id
  display_name: 关联订单短号
  type: VARCHAR(20)
  description: 关联原始订单 短单号
- name: complete_time
  display_name: 完成时间
  type: DATETIME
- name: update_time
  display_name: 更新时间
  type: DATETIME
- name: create_time
  display_name: 创建时间
  type: DATETIME
- name: status
  display_name: 状态
  type: TINYINT(1)
  description: '-1: failed，1:successful, 2: processing'
  enum_values:
  - value: -1
    label: 失败
  - value: 1
    label: 成功
  - value: 2
    label: 处理中
relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
- column: channel_code
  target_table: pmt_service_channel
  target_column: channel_code
  join_type: LEFT JOIN
common_queries:
- question: 各类型归集金额
  sql: "SELECT\n  CASE collection_type\n    WHEN 1000 THEN 'deposit'\n    WHEN 2000\
    \ THEN 'payout'\n    WHEN 2001 THEN 'payout refund'\n    ELSE 'default' END AS\
    \ '归集类型',\n  currency AS '币种',\n  SUM(amount) AS '总金额',\n  COUNT(*) AS '笔数'\n\
    FROM dwd_banking.`pmt_finance_collection`\nWHERE status = 1\nGROUP BY collection_type,\
    \ currency\nORDER BY `总金额` DESC\nLIMIT 100\n"
  tables:
  - pmt_finance_collection
  difficulty: medium
- question: 归集失败率
  sql: "SELECT channel_code AS '渠道',\n       ROUND(SUM(CASE WHEN status = -1 THEN\
    \ 1 ELSE 0 END) * 100.0 / COUNT(*), 2) AS '失败率%',\n       COUNT(*) AS '总笔数'\n\
    FROM dwd_banking.`pmt_finance_collection`\nGROUP BY channel_code\nORDER BY `失败率%`\
    \ DESC\nLIMIT 100\n"
  tables:
  - pmt_finance_collection
  difficulty: medium
- question: 处理中的归集订单
  sql: "SELECT collection_id AS '归集ID',\n       account_name AS '商户',\n       currency\
    \ AS '币种',\n       amount AS '金额',\n       create_time AS '创建时间'\nFROM dwd_banking.`pmt_finance_collection`\n\
    WHERE status = 2\nORDER BY create_time\nLIMIT 100\n"
  tables:
  - pmt_finance_collection
  difficulty: easy
- question: house vs client流向占比
  sql: "SELECT\n  CASE inbound_type WHEN 1000 THEN 'to house' WHEN 2000 THEN 'to client'\
    \ END AS '流向',\n  currency AS '币种',\n  SUM(amount) AS '总金额'\nFROM dwd_banking.`pmt_finance_collection`\n\
    WHERE status = 1\nGROUP BY inbound_type, currency\nORDER BY currency, `总金额` DESC\n\
    LIMIT 100\n"
  tables:
  - pmt_finance_collection
  difficulty: medium
