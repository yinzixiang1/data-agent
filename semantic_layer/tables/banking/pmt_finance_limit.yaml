table:
  name: pmt_finance_limit
  database: dwd_banking
  display_name: 资金限额配置表
  description: '商户按交易类型(payin/deposit/payout/transfer/conversion等)配置的限额。

    每行代表一个 (account_id, limit_type) 限额配置，区分日/月/年/总额，包含同名/非同名出款的细分限额。'
  tags:
  - 限额
  - limit
  - 风控限额
  - 交易额度
  - 同名非同名
  - pmt_finance_limit
  query_tips: ''
columns:
- name: flid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: limit_id
  display_name: 限额ID
  type: VARCHAR(36)
  description: UUID
- name: direct_id
  display_name: 机构ID
  type: VARCHAR(36)
- name: account_id
  display_name: 账户ID
  type: VARCHAR(36)
- name: short_account_id
  display_name: 商户短号
  type: VARCHAR(30)
- name: account_name
  display_name: 商户名
  type: VARCHAR(250)
- name: daily_amount
  display_name: 已用日额
  type: DECIMAL(16,4)
  description: 日交易金额
- name: monthly_amount
  display_name: 已用月额
  type: DECIMAL(16,4)
  description: 月交易金额
- name: year_amount
  display_name: 已用年额
  type: DECIMAL(16,4)
  description: 年交易金额
- name: total_amount
  display_name: 已用总额
  type: DECIMAL(16,4)
  description: 总总金额
- name: limit_type
  display_name: 限额类型
  type: INT
  description: 1000=payin, 1001=deposit, 1002=transfer in,  2000=payout, 2001=transfer
    out, 3000=conversion，8000=fee, 8001=refund，9000=adjustment
  enum_values:
  - value: 1000
    label: payin
  - value: 1001
    label: deposit
  - value: 1002
    label: transfer in
  - value: 2000
    label: payout
  - value: 2001
    label: transfer out
  - value: 3000
    label: conversion
  - value: 8000
    label: fee
  - value: 8001
    label: refund
  - value: 9000
    label: adjustment
- name: limit_daily_amount
  display_name: 日限金额
  type: DECIMAL(16,4)
  description: 日限金额
- name: limit_monthly_amount
  display_name: 月限金额
  type: DECIMAL(16,4)
  description: 月限金额
- name: limit_year_amount
  display_name: 年限金额
  type: DECIMAL(16,4)
  description: 年限金额
- name: limit_total_amount
  display_name: 总限金额
  type: DECIMAL(16,4)
  description: 总限金额
- name: diff_limit_per_amount
  display_name: 非同名单笔限额
  type: DECIMAL(16,4)
  description: 非同名出款/入账单笔限额
- name: diff_limit_daily_amount
  display_name: 非同名日累计
  type: DECIMAL(16,4)
  description: 非同名出款/入账日累计限额
- name: diff_limit_monthly_amount
  display_name: 非同名月累计
  type: DECIMAL(16,4)
  description: 非同名出款/入账月累计限额
- name: diff_limit_year_amount
  display_name: 非同名年累计
  type: DECIMAL(16,4)
  description: 非同名出款/入账年累计限额
- name: same_limit_per_amount
  display_name: 同名单笔限额
  type: DECIMAL(16,4)
  description: 同名出款/入账单笔限额
- name: same_limit_daily_amount
  display_name: 同名日累计
  type: DECIMAL(16,4)
  description: 同名出款/入账日累计限额
- name: same_limit_monthly_amount
  display_name: 同名月累计
  type: DECIMAL(16,4)
  description: 同名出款/入账月累计限额
- name: same_limit_year_amount
  display_name: 同名年累计
  type: DECIMAL(16,4)
  description: 同名出款/入账年累计限额
- name: create_time
  display_name: 创建时间
  type: DATETIME
  description: 创建时间
- name: update_time
  display_name: 更新时间
  type: DATETIME
  description: 更新时间
- name: update_id
  display_name: 更新人ID
  type: VARCHAR(36)
  description: 更新者ID
- name: update_name
  display_name: 更新人名
  type: VARCHAR(240)
  description: 更新者名
relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
common_queries:
- question: 接近限额的商户(日额>80%)
  sql: "SELECT account_name AS '商户',\n       short_account_id AS '短号',\n       limit_type\
    \ AS '限额类型',\n       daily_amount AS '已用日额',\n       limit_daily_amount AS '日限',\n\
    \       ROUND(daily_amount * 100.0 / NULLIF(limit_daily_amount, 0), 2) AS '使用率%'\n\
    FROM dwd_banking.`pmt_finance_limit`\nWHERE limit_daily_amount > 0\n  AND daily_amount\
    \ / limit_daily_amount > 0.8\nORDER BY `使用率%` DESC\nLIMIT 100\n"
  tables:
  - pmt_finance_limit
  difficulty: medium
- question: 各交易类型限额分布
  sql: "SELECT\n  CASE limit_type\n    WHEN 1001 THEN 'deposit'\n    WHEN 2000 THEN\
    \ 'payout'\n    WHEN 3000 THEN 'conversion'\n    ELSE '其他' END AS '限额类型',\n  COUNT(*)\
    \ AS '配置数',\n  AVG(limit_daily_amount) AS '平均日限'\nFROM dwd_banking.`pmt_finance_limit`\n\
    GROUP BY limit_type\nLIMIT 100\n"
  tables:
  - pmt_finance_limit
  difficulty: medium
- question: payout限额最高的TOP10商户
  sql: "SELECT account_name AS '商户',\n       short_account_id AS '短号',\n       limit_daily_amount\
    \ AS '日限',\n       limit_monthly_amount AS '月限'\nFROM dwd_banking.`pmt_finance_limit`\n\
    WHERE limit_type = 2000\nORDER BY limit_daily_amount DESC\nLIMIT 10\n"
  tables:
  - pmt_finance_limit
  difficulty: easy
- question: 同名 vs 非同名出款限额差异
  sql: "SELECT account_name AS '商户',\n       same_limit_per_amount AS '同名单笔',\n  \
    \     diff_limit_per_amount AS '非同名单笔',\n       ROUND((diff_limit_per_amount -\
    \ same_limit_per_amount) * 100.0 / NULLIF(same_limit_per_amount, 0), 2) AS '差异%'\n\
    FROM dwd_banking.`pmt_finance_limit`\nWHERE limit_type = 2000\n  AND same_limit_per_amount\
    \ > 0\n  AND diff_limit_per_amount > 0\nLIMIT 100\n"
  tables:
  - pmt_finance_limit
  difficulty: medium
