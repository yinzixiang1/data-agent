table:
  name: sys_cimb_va
  database: dwd_banking
  display_name: CIMB VA预备号
  description: 'CIMB银行的虚拟账户号码池，用于商户VA分配前的号段管理。

    每行代表一个VA预备号。'
  tags:
  - CIMB
  - VA号段
  - 预备号池
  - sys_cimb_va
  query_tips: ''
columns:
- name: vaid
  display_name: 主键ID
  type: INT
  skip_index: true
- name: master_account
  display_name: 主账户
  type: VARCHAR(12)
  description: Master Account
- name: client_id
  display_name: Client ID
  type: VARCHAR(4)
  description: Client ID=101701
- name: purpose_code
  display_name: purpose code
  type: CHAR(2)
  description: purpose code
- name: va_prefix
  display_name: VA前缀
  type: VARCHAR(6)
  description: 6位固定值101701
- name: va_segment
  display_name: VA号段
  type: VARCHAR(2)
  description: 特殊号段：6
- name: va_random_number
  display_name: VA随机数
  type: VARCHAR(12)
  description: 6位随机整数：group identifier
- name: va_biller_reference
  display_name: VA biller reference
  type: VARCHAR(6)
  description: 4位 biller reference
- name: va_reference_number
  display_name: VA卡号(17位)
  type: VARCHAR(25)
  description: 组合成17位卡号
- name: direct_id
  display_name: 机构ID
  type: VARCHAR(36)
- name: account_id
  display_name: 账户ID
  type: VARCHAR(36)
- name: account_name
  display_name: 商户名
  type: VARCHAR(255)
- name: short_account_id
  display_name: 商户短号
  type: VARCHAR(36)
- name: status
  display_name: 状态
  type: TINYINT
  description: '0: default; 2:pending; 1:actived'
  enum_values:
  - value: 0
    label: 默认
  - value: 2
    label: pending
  - value: 1
    label: actived
- name: update_time
  display_name: 更新时间
  type: DATETIME
relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
common_queries:
- question: CIMB VA剩余号段(未分配)
  sql: "SELECT COUNT(*) AS '剩余VA数'\nFROM dwd_banking.`sys_cimb_va`\nWHERE status =\
    \ 0\n  AND account_id IS NULL\nLIMIT 100\n"
  tables:
  - sys_cimb_va
  difficulty: easy
- question: 已分配商户的VA数
  sql: "SELECT COUNT(DISTINCT account_id) AS '已分配商户数',\n       COUNT(*) AS '已分配VA数'\n\
    FROM dwd_banking.`sys_cimb_va`\nWHERE status = 1\nLIMIT 100\n"
  tables:
  - sys_cimb_va
  difficulty: easy
- question: 各状态VA分布
  sql: "SELECT\n  CASE status WHEN 0 THEN '默认' WHEN 1 THEN 'actived' WHEN 2 THEN 'pending'\
    \ END AS '状态',\n  COUNT(*) AS '数量'\nFROM dwd_banking.`sys_cimb_va`\nGROUP BY status\n\
    LIMIT 100\n"
  tables:
  - sys_cimb_va
  difficulty: easy
