table:
  name: sys_bank_branch
  database: dwd_banking
  display_name: 银行联行号表
  description: '银行联行号(Branch Code)主数据。

    每行代表一个银行支行，含银行代码、银行名、支行名、省市区、地址等。'
  tags:
  - 银行数据
  - 联行号
  - branch code
  - 主数据
  - sys_bank_branch
  query_tips: ''
columns:
- name: id
  display_name: 主键ID
  type: BIGINT
  description: 主键ID
  skip_index: true
- name: bank_code
  display_name: 银行代码
  type: VARCHAR(36)
  description: 银行代码
- name: bank_name
  display_name: 银行名称
  type: VARCHAR(100)
  description: 银行名称
- name: bank_numeric_code
  display_name: 银行数字代码
  type: VARCHAR(10)
  description: 银行数字代码
- name: bank_address
  display_name: 注册地址
  type: VARCHAR(255)
  description: 注册地址
- name: branch_code
  display_name: 联行号
  type: VARCHAR(20)
  description: 联行号（12位，唯一）
- name: branch_name
  display_name: 联行名称
  type: VARCHAR(200)
  description: 联行名称
- name: province
  display_name: 省
  type: VARCHAR(50)
  description: 省
- name: city
  display_name: 市
  type: VARCHAR(50)
  description: 市
- name: district
  display_name: 区/县
  type: VARCHAR(50)
  description: 区/县
- name: region_code
  display_name: 区域代码
  type: VARCHAR(10)
  description: 区域代码
- name: ext_info
  display_name: 扩展属性JSON
  type: JSON
  description: 扩展属性（存储非核心业务信息，如支行类型、营业时间等）
  skip_index: true
- name: status
  display_name: 状态
  type: TINYINT
  description: 状态：1=启用，0=禁用
  enum_values:
  - value: 1
    label: 启用
  - value: 0
    label: 禁用
- name: create_time
  display_name: 创建时间
  type: DATETIME
  description: 创建时间
- name: update_time
  display_name: 更新时间
  type: DATETIME
  description: 更新时间
common_queries:
- question: 某银行的支行数
  sql: "SELECT bank_name AS '银行',\n       COUNT(*) AS '支行数'\nFROM dwd_banking.`sys_bank_branch`\n\
    WHERE status = 1\nGROUP BY bank_name\nORDER BY `支行数` DESC\nLIMIT 20\n"
  tables:
  - sys_bank_branch
  difficulty: easy
- question: 各省银行支行分布
  sql: "SELECT province AS '省',\n       COUNT(*) AS '支行数'\nFROM dwd_banking.`sys_bank_branch`\n\
    WHERE status = 1\nGROUP BY province\nORDER BY `支行数` DESC\nLIMIT 100\n"
  tables:
  - sys_bank_branch
  difficulty: easy
- question: 启用中的联行号数量
  sql: 'SELECT COUNT(*) AS ''启用联行号数''

    FROM dwd_banking.`sys_bank_branch`

    WHERE status = 1

    LIMIT 100

    '
  tables:
  - sys_bank_branch
  difficulty: easy
