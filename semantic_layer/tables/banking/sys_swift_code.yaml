table:
  name: sys_swift_code
  database: dwd_banking
  display_name: Swift Code表
  description: 'SWIFT/BIC银行代码主数据。

    每行代表一个SWIFT银行，含中英文银行名、地址、运营地址、支行地址。'
  tags:
  - SWIFT
  - BIC
  - 银行主数据
  - 跨境支付
  - sys_swift_code
  query_tips: ''
columns:
- name: scid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: swift_code
  display_name: SWIFT码(11位)
  type: VARCHAR(11)
  description: 11位swift code
- name: bic_code
  display_name: BIC码(8位)
  type: VARCHAR(8)
  description: 8位code
- name: branch_code
  display_name: 支行码(3位)
  type: VARCHAR(3)
  description: 3位code，默认XXX
- name: bank_name
  display_name: 银行英文全名
  type: VARCHAR(255)
  description: Full legal name
- name: bank_name_zh
  display_name: 银行中文名
  type: VARCHAR(255)
- name: bank_name_data
  display_name: 各渠道银行名映射
  type: TEXT
  description: 映射各渠道bank_name
  skip_index: true
- name: country_code
  display_name: 国家代码
  type: VARCHAR(2)
- name: state
  display_name: 州/省
  type: VARCHAR(255)
- name: bank_address
  display_name: 注册地址
  type: VARCHAR(255)
  description: 注册地址
- name: operational_address
  display_name: 运营地址
  type: VARCHAR(255)
  description: 运营地址
- name: bank_city
  display_name: 城市
  type: VARCHAR(255)
  description: 城市
- name: branch_address
  display_name: 支行地址
  type: VARCHAR(255)
  description: 支行地址
- name: postal_code
  display_name: 邮编
  type: VARCHAR(255)
- name: bank_reg_time
  display_name: 银行注册时间
  type: DATETIME
  description: 银行注册时间
- name: bank_last_time
  display_name: 最后更新时间
  type: DATETIME
  description: 最后更新时间
- name: create_time
  display_name: 创建时间
  type: DATETIME
  description: 系统创建时间
- name: update_time
  display_name: 更新时间
  type: DATETIME
- name: status
  display_name: 状态
  type: TINYINT
  description: 状态：-1删除，0=关闭，1=启用
  enum_values:
  - value: -1
    label: 删除
  - value: 0
    label: 关闭
  - value: 1
    label: 启用
- name: remarks
  display_name: 备注
  type: VARCHAR(255)
  description: 备注
common_queries:
- question: 某SWIFT对应银行
  sql: "SELECT swift_code AS 'SWIFT',\n       bank_name AS '银行名',\n       bank_name_zh\
    \ AS '中文名',\n       country_code AS '国家',\n       bank_city AS '城市'\nFROM dwd_banking.`sys_swift_code`\n\
    WHERE swift_code = ?\nLIMIT 100\n"
  tables:
  - sys_swift_code
  difficulty: easy
- question: 某国SWIFT银行数
  sql: "SELECT country_code AS '国家',\n       COUNT(*) AS 'SWIFT数'\nFROM dwd_banking.`sys_swift_code`\n\
    WHERE status = 1\nGROUP BY country_code\nORDER BY `SWIFT数` DESC\nLIMIT 20\n"
  tables:
  - sys_swift_code
  difficulty: easy
- question: 失效SWIFT
  sql: "SELECT swift_code AS 'SWIFT',\n       bank_name AS '银行',\n       remarks AS\
    \ '备注'\nFROM dwd_banking.`sys_swift_code`\nWHERE status IN (-1, 0)\nLIMIT 100\n"
  tables:
  - sys_swift_code
  difficulty: easy
