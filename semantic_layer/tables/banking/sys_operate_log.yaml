table:
  name: sys_operate_log
  database: dwd_banking
  display_name: 系统操作日志表
  description: '后台/管理员操作日志，记录请求路径、参数、变更前数据、IP、UA、关联类型。

    每行代表一次操作记录。'
  tags:
  - 操作日志
  - 审计
  - 后台操作
  - operate log
  - sys_operate_log
  query_tips: ''
columns:
- name: lid
  display_name: 主键ID
  type: BIGINT
  description: 主键
  skip_index: true
- name: log_id
  display_name: 操作日志ID
  type: VARCHAR(36)
  description: 操作日志Id
- name: type
  display_name: 动作类型
  type: VARCHAR(60)
  description: 动作类型：INSERT=创建，UPDATE=更新，DELETE=删除
  enum_values:
  - INSERT
  - UPDATE
  - DELETE
- name: uri
  display_name: 请求路径
  type: VARCHAR(255)
  description: 请求路径
- name: params
  display_name: 请求参数
  type: LONGTEXT
  description: 请求参数
  skip_index: true
- name: original_data
  display_name: 变更前数据
  type: LONGTEXT
  description: 变更前数据
  skip_index: true
- name: events
  display_name: 事件结果
  type: TEXT
  description: 事件结果
  skip_index: true
- name: ip
  display_name: 请求IP
  type: VARCHAR(64)
  description: 请求ip
  sensitive: true
- name: user_agent
  display_name: 浏览器agent
  type: TEXT
  description: 浏览器agent
  skip_index: true
- name: reference_type
  display_name: 关联类型
  type: INT
  description: 关联类型：0=普通日志，1000=客户account，1001=kyc/kyb审核，2000=财务审核，9000=配置
  enum_values:
  - value: 0
    label: 普通日志
  - value: 1000
    label: 客户account
  - value: 1001
    label: kyc/kyb审核
  - value: 2000
    label: 财务审核
  - value: 9000
    label: 配置
- name: reference_id
  display_name: 关联ID
  type: VARCHAR(64)
  description: 关联ID
- name: reference_data
  display_name: 关联数据JSON
  type: TEXT
  description: 关联数据json
  skip_index: true
- name: creator_id
  display_name: 创建人ID
  type: VARCHAR(36)
  description: 创建人id
- name: creator_name
  display_name: 创建人名
  type: VARCHAR(50)
  description: 创建人名
- name: create_time
  display_name: 创建时间
  type: DATETIME(3)
  description: 创建时间
- name: operate_status
  display_name: 操作状态
  type: VARCHAR(10)
  description: 操作状态：FAILED=失败，COMPLETE=完成
  enum_values:
  - FAILED
  - COMPLETE
common_queries:
- question: 某管理员的操作历史
  sql: "SELECT type AS '动作',\n       uri AS '路径',\n       reference_type AS '关联类型',\n\
    \       operate_status AS '状态',\n       create_time AS '时间'\nFROM dwd_banking.`sys_operate_log`\n\
    WHERE creator_id = ?\nORDER BY create_time DESC\nLIMIT 100\n"
  tables:
  - sys_operate_log
  difficulty: easy
- question: 配置变更次数(按操作人,最近30天)
  sql: "SELECT creator_name AS '操作人',\n       COUNT(*) AS '变更次数'\nFROM dwd_banking.`sys_operate_log`\n\
    WHERE reference_type = 9000\n  AND create_time >= DATE_SUB(NOW(), INTERVAL 30\
    \ DAY)\nGROUP BY creator_name\nORDER BY `变更次数` DESC\nLIMIT 100\n"
  tables:
  - sys_operate_log
  difficulty: medium
- question: 某资源的修改历史
  sql: "SELECT type AS '动作',\n       creator_name AS '操作人',\n       create_time AS\
    \ '时间'\nFROM dwd_banking.`sys_operate_log`\nWHERE reference_id = ?\nORDER BY create_time\n\
    LIMIT 100\n"
  tables:
  - sys_operate_log
  difficulty: easy
- question: 失败操作分布
  sql: "SELECT uri AS '路径',\n       COUNT(*) AS '失败次数'\nFROM dwd_banking.`sys_operate_log`\n\
    WHERE operate_status = 'FAILED'\n  AND create_time >= DATE_SUB(NOW(), INTERVAL\
    \ 7 DAY)\nGROUP BY uri\nORDER BY `失败次数` DESC\nLIMIT 20\n"
  tables:
  - sys_operate_log
  difficulty: easy
