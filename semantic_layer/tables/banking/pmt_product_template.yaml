table:
  name: pmt_product_template
  database: dwd_banking
  display_name: 产品模板表
  description: '给商户开通产品的快捷模板。

    每行代表一个产品模板，定义类型(VA/FX/AC/IC)等基础信息。'
  tags:
  - 产品模板
  - product template
  - 快捷开通
  - pmt_product_template
  query_tips: ''
columns:
- name: ptid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: template_id
  display_name: 模板长ID
  type: VARCHAR(36)
  description: 唯一长ID
- name: short_template_id
  display_name: 模板短ID
  type: VARCHAR(25)
  description: 唯一短ID
- name: template_name
  display_name: 模板名
  type: VARCHAR(150)
  description: 模板名
- name: template_type
  display_name: 模板类型
  type: INT
  description: 类型：1000=VA, 2000=FX, 3000=AC, 4000=IC
  enum_values:
  - value: 1000
    label: VA
  - value: 2000
    label: FX
  - value: 3000
    label: AC
  - value: 4000
    label: IC
- name: template_desc
  display_name: 模板描述
  type: VARCHAR(255)
  description: 模板描述
- name: status
  display_name: 状态
  type: INT
  description: 状态：0-关闭，1-开启
  enum_values:
  - value: 0
    label: 关闭
  - value: 1
    label: 开启
- name: update_time
  display_name: 更新时间
  type: DATETIME
  description: 更新时间
- name: create_id
  display_name: 创建人ID
  type: VARCHAR(36)
- name: create_name
  display_name: 创建人名
  type: VARCHAR(180)
  description: 创建者
- name: create_time
  display_name: 创建时间
  type: DATETIME
  description: 创建时间
relations:
- column: template_id
  target_table: pmt_product_template_code
  target_column: template_id
  join_type: LEFT JOIN
common_queries:
- question: 各类型产品模板数量
  sql: "SELECT\n  CASE template_type\n    WHEN 1000 THEN 'VA'\n    WHEN 2000 THEN\
    \ 'FX'\n    WHEN 3000 THEN 'AC'\n    WHEN 4000 THEN 'IC'\n  END AS '类型',\n  COUNT(*)\
    \ AS '模板数'\nFROM dwd_banking.`pmt_product_template`\nWHERE status = 1\nGROUP BY\
    \ template_type\nLIMIT 100\n"
  tables:
  - pmt_product_template
  difficulty: easy
- question: 启用中的模板列表
  sql: "SELECT short_template_id AS '短号',\n       template_name AS '模板名',\n      \
    \ template_type AS '类型',\n       template_desc AS '描述',\n       create_time AS\
    \ '创建时间'\nFROM dwd_banking.`pmt_product_template`\nWHERE status = 1\nORDER BY\
    \ create_time DESC\nLIMIT 100\n"
  tables:
  - pmt_product_template
  difficulty: easy
