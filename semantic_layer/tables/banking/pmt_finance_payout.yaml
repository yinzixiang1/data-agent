table:
  name: pmt_finance_payout
  database: dwd_banking
  display_name: 账户代付表
  description: '商户发起的代付/出金交易，是平台核心出款表。

    每行代表一笔代付订单，含source/target金额币种、受益人、汇率锁定、渠道、退款状态、风险等级、MT103等完整信息。'
  tags:
  - 代付
  - payout
  - 出金
  - 转账
  - 跨境支付
  - 出款
  - pmt_finance_payout
  query_tips: 已完成代付用 payout_status=1；查询客户实际出账金额用 source_amount
columns:
- name: poid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: payout_id
  display_name: 代付ID
  type: VARCHAR(36)
- name: direct_id
  display_name: 机构ID
  type: VARCHAR(36)
- name: account_id
  display_name: 账户ID
  type: VARCHAR(36)
- name: account_name
  display_name: 商户名
  type: VARCHAR(250)
- name: source_amount
  display_name: 源金额(出账金额)
  type: DECIMAL(16,4)
- name: source_currency
  display_name: 源币种
  type: VARCHAR(6)
- name: target_amount
  display_name: 目标金额(到账金额)
  type: DECIMAL(16,4)
- name: target_currency
  display_name: 目标币种
  type: VARCHAR(6)
- name: fee_amount
  display_name: 手续费
  type: DECIMAL(16,4)
  description: 手续费
- name: fee_paid_by
  display_name: 费用承担方
  type: VARCHAR(10)
  description: shared, our
  enum_values:
  - shared
  - our
- name: guaranteed_rate
  display_name: 锁汇汇率
  type: DECIMAL(16,4)
- name: guaranteed_date
  display_name: 锁汇时间
  type: DATETIME
  description: 保证费率时间
- name: beneficiary_id
  display_name: 受益人ID
  type: VARCHAR(36)
  description: 受益人ID
- name: beneficiary_name
  display_name: 受益人名
  type: VARCHAR(120)
  sensitive: true
- name: beneficiary_body
  display_name: 受益人快照
  type: TEXT
  description: 受益人快照
  skip_index: true
- name: payer_id
  display_name: 付款人ID
  type: VARCHAR(36)
  description: 付款人ID，如果为0，就是当前账户（机构/商户）。
- name: payout_date
  display_name: 转账时间
  type: DATETIME
  description: 转账时间
- name: purpose_code
  display_name: 转账用途代码
  type: VARCHAR(200)
  description: Purpose of transfer
- name: payout_reason
  display_name: 代付原因
  type: VARCHAR(200)
- name: payout_reference
  display_name: 银行附言
  type: VARCHAR(100)
  description: 渠道交易附言，收款行可见
- name: channel_code
  display_name: 渠道编码
  type: VARCHAR(64)
- name: channel_code_before
  display_name: 切换前渠道
  type: VARCHAR(64)
- name: channel_req_body
  display_name: 渠道请求Body
  type: TEXT
  description: '渠道下发信息: {"settlement_amount": "", "payment_purpose": "", "industry_type":
    "", "docs_id": ""}'
  skip_index: true
- name: channel_resp_id
  display_name: 渠道响应ID
  type: VARCHAR(100)
- name: channel_resp_status
  display_name: 渠道响应状态
  type: VARCHAR(20)
- name: channel_resp_body
  display_name: 渠道响应Body
  type: TEXT
  skip_index: true
- name: execute_reason
  display_name: 失败原因
  type: TEXT
  description: '[内部]对应失败原因'
- name: mt103_id
  display_name: MT103 ID
  type: VARCHAR(36)
  description: mt103 id
- name: submission
  display_name: MT103内容
  type: TEXT
  description: mt103
  skip_index: true
- name: short_account_id
  display_name: 商户短号
  type: VARCHAR(20)
  description: '短ACCOUNT ID '
- name: short_reference_id
  display_name: 代付短号
  type: VARCHAR(20)
- name: unique_request_id
  display_name: 客户端幂等键
  type: VARCHAR(36)
  description: User-generated idempotency key.
- name: payment_scope
  display_name: 支付范围
  type: VARCHAR(36)
  description: internal, domestic, cross-border
  enum_values:
  - internal
  - domestic
  - cross-border
- name: payment_internal_info
  display_name: 内部支付信息
  type: VARCHAR(255)
  description: '为payout internal做信息存储，方便校对 '
- name: creator_id
  display_name: 创建人ID
  type: VARCHAR(36)
- name: creator_name
  display_name: 创建人名
  type: VARCHAR(100)
- name: creator_ip
  display_name: 创建人IP
  type: VARCHAR(255)
  description: 创建IP
  sensitive: true
- name: transaction_id
  display_name: 交易流水ID
  type: VARCHAR(36)
- name: create_time
  display_name: 创建时间
  type: DATETIME(3)
- name: update_time
  display_name: 更新时间
  type: DATETIME
- name: complete_time
  display_name: 完成时间
  type: DATETIME
  description: 渠道完成1次，退款成功1次
- name: debit_status
  display_name: 扣款状态
  type: INT
  description: 扣款状态 -1=异常 0=默认 1=已扣款
  enum_values:
  - value: -1
    label: 异常
  - value: 0
    label: 默认
  - value: 1
    label: 已扣款
- name: refund_status
  display_name: 退款状态
  type: INT
  description: -1=REFUND_FAILURE-退款失败，0=NOT_NEED_REFUND-默认状态, 1=REFUND_SUCCESS-退款成功,
    2=REFUND_APPROVE-退款审核, 3=REFUND_REFUSE-退款拒绝
  enum_values:
  - value: -1
    label: 退款失败
  - value: 0
    label: 默认
  - value: 1
    label: 退款成功
  - value: 2
    label: 退款审核
  - value: 3
    label: 退款拒绝
- name: refund_reason
  display_name: 退款原因
  type: VARCHAR(1000)
  description: 退款原因
- name: review_status
  display_name: 审查状态
  type: TINYINT(1)
  description: 审查状态：1=passed, 0=in_review, -1=rejected
  enum_values:
  - value: 1
    label: 通过
  - value: 0
    label: 审核中
  - value: -1
    label: 拒绝
- name: payout_status
  display_name: 代付状态
  type: TINYINT(1)
  description: 状态：-1=失败，0=pending，1=completed，2=已提交渠道，3=客户挂起(可取消)，9=提交渠道失败
  enum_values:
  - value: -1
    label: 失败
  - value: 0
    label: pending
  - value: 1
    label: completed
  - value: 2
    label: 已提交渠道
  - value: 3
    label: 客户挂起
  - value: 9
    label: 提交渠道失败
- name: status_type
  display_name: 状态类型
  type: VARCHAR(15)
  description: 状态类型（标记流转来源）：normal（原生状态），reverse（逆向回退）
  enum_values:
  - normal
  - reverse
- name: payout_way
  display_name: 创建方式
  type: INT
  description: 0-商户端创建 1-接口创建
  enum_values:
  - value: 0
    label: 商户端
  - value: 1
    label: 接口
- name: risk_level
  display_name: 风险等级
  type: INT
  description: 0=无风险，>0风险等级，数值越大风险越高
- name: risk_remark
  display_name: 风险备注
  type: TEXT
  description: 风险备注
  skip_index: true
- name: payment_mode
  display_name: 支付模式
  type: VARCHAR(36)
  description: house, client
  enum_values:
  - house
  - client
- name: quote_id
  display_name: 报价ID
  type: VARCHAR(36)
- name: money_movement
  display_name: 跨业务线标记
  type: TINYINT(1)
  description: 状态：1=跨业务线转账，0=正常payout
  enum_values:
  - value: 0
    label: 正常payout
  - value: 1
    label: 跨业务线转账
- name: channel_customer_number
  display_name: 渠道商户号
  type: VARCHAR(50)
  description: 渠道商户号
- name: exchange_rate
  display_name: USD汇率
  type: DECIMAL(26,10)
  description: USD和当前币种的汇率
- name: remark
  display_name: 备注
  type: TEXT
  description: 备注(渠道重新上送)
  skip_index: true
relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
- column: beneficiary_id
  target_table: pmt_payment_beneficiary
  target_column: beneficiary_id
  join_type: LEFT JOIN
- column: quote_id
  target_table: pmt_conversion_quotes
  target_column: quote_id
  join_type: LEFT JOIN
- column: channel_code
  target_table: pmt_service_channel
  target_column: channel_code
  join_type: LEFT JOIN
- column: transaction_id
  target_table: pmt_finance_transactions
  target_column: transaction_id
  join_type: LEFT JOIN
common_queries:
- question: 月度代付总额(按币种)
  sql: "SELECT DATE_FORMAT(create_time, '%Y-%m') AS '月份',\n       source_currency\
    \ AS '币种',\n       COUNT(*) AS '笔数',\n       SUM(source_amount) AS '源金额总和',\n\
    \       SUM(target_amount) AS '目标金额总和'\nFROM dwd_banking.`pmt_finance_payout`\n\
    WHERE payout_status = 1\nGROUP BY DATE_FORMAT(create_time, '%Y-%m'), source_currency\n\
    ORDER BY `月份` DESC, `源金额总和` DESC\nLIMIT 100\n"
  tables:
  - pmt_finance_payout
  difficulty: medium
- question: 代付成功率
  sql: "SELECT\n  ROUND(SUM(CASE WHEN payout_status = 1 THEN 1 ELSE 0 END) * 100.0\
    \ / COUNT(*), 2) AS '成功率%',\n  SUM(CASE WHEN payout_status = 1 THEN 1 ELSE 0 END)\
    \ AS '成功数',\n  SUM(CASE WHEN payout_status = -1 THEN 1 ELSE 0 END) AS '失败数',\n\
    \  COUNT(*) AS '总数'\nFROM dwd_banking.`pmt_finance_payout`\nWHERE create_time\
    \ >= DATE_SUB(NOW(), INTERVAL 30 DAY)\nLIMIT 100\n"
  tables:
  - pmt_finance_payout
  difficulty: medium
- question: 代付退款率(按渠道)
  sql: "SELECT channel_code AS '渠道',\n       COUNT(*) AS '总笔数',\n       SUM(CASE WHEN\
    \ refund_status = 1 THEN 1 ELSE 0 END) AS '退款成功数',\n       ROUND(SUM(CASE WHEN\
    \ refund_status = 1 THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 2) AS '退款率%'\nFROM\
    \ dwd_banking.`pmt_finance_payout`\nWHERE payout_status IN (1, -1)\nGROUP BY channel_code\n\
    ORDER BY `退款率%` DESC\nLIMIT 100\n"
  tables:
  - pmt_finance_payout
  difficulty: medium
- question: 高风险代付订单
  sql: "SELECT short_reference_id AS '代付短号',\n       account_name AS '商户',\n     \
    \  source_amount AS '金额',\n       source_currency AS '币种',\n       risk_level\
    \ AS '风险等级',\n       risk_remark AS '风险备注'\nFROM dwd_banking.`pmt_finance_payout`\n\
    WHERE risk_level > 0\n  AND payout_status NOT IN (1, -1)\nORDER BY risk_level\
    \ DESC\nLIMIT 100\n"
  tables:
  - pmt_finance_payout
  difficulty: easy
- question: pending超过24h的代付
  sql: "SELECT short_reference_id AS '短号',\n       account_name AS '商户',\n       source_amount\
    \ AS '金额',\n       source_currency AS '币种',\n       channel_code AS '渠道',\n  \
    \     create_time AS '创建时间',\n       TIMESTAMPDIFF(HOUR, create_time, NOW()) AS\
    \ '已等待小时'\nFROM dwd_banking.`pmt_finance_payout`\nWHERE payout_status IN (0, 2)\n\
    \  AND create_time < DATE_SUB(NOW(), INTERVAL 24 HOUR)\nLIMIT 100\n"
  tables:
  - pmt_finance_payout
  difficulty: medium
