table:
  name: pmt_conversion_connect
  database: dwd_banking
  display_name: 汇兑关联表
  description: '关联汇兑订单(主要用于split/parent-child拆单的关系记录)。

    每行代表一个 (conversion_id, ref_reference_id) 关联关系。'
  tags:
  - 汇兑关联
  - 拆单
  - 父子单
  - conversion connect
  - pmt_conversion_connect
  query_tips: ''
columns:
- name: id
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: conversion_id
  display_name: 汇兑ID
  type: VARCHAR(36)
- name: short_reference_id
  display_name: 汇兑短号
  type: VARCHAR(20)
- name: account_name
  display_name: 商户名
  type: VARCHAR(255)
  description: account_name
- name: account_id
  display_name: 账户ID
  type: VARCHAR(36)
  description: account_id
- name: client_rate
  display_name: 客户汇率
  type: VARCHAR(36)
- name: fixed_side
  display_name: 固定边
  type: VARCHAR(6)
  description: Which currency side is fixed - the buy or sell one.
- name: buy_amount
  display_name: 买入金额
  type: VARCHAR(36)
- name: buy_currency
  display_name: 买入币种
  type: VARCHAR(3)
- name: currency_pair
  display_name: 币种对
  type: VARCHAR(6)
  description: 交易对
- name: sell_amount
  display_name: 卖出金额
  type: VARCHAR(36)
- name: sell_currency
  display_name: 卖出币种
  type: VARCHAR(3)
- name: conversion_date
  display_name: 汇兑日期
  type: DATETIME
- name: conversion_reason
  display_name: 汇兑原因
  type: VARCHAR(100)
- name: conversion_remark
  display_name: 汇兑备注
  type: TEXT
  skip_index: true
- name: create_time
  display_name: 创建时间
  type: DATETIME
- name: update_time
  display_name: 更新时间
  type: DATETIME
- name: settlement_time
  display_name: 结算截止时间
  type: DATETIME
  description: 结算截止时间
- name: conversion_status
  display_name: 汇兑状态
  type: TINYINT(1)
  description: 0=AWAITING_FUNDS, -1=CLOSED, 2=FUNDS_ARRIVED, 3=SENT_TO_CHANNEL, 1=TRADE_SETTLED
  enum_values:
  - value: 0
    label: AWAITING_FUNDS
  - value: -1
    label: CLOSED
  - value: 2
    label: FUNDS_ARRIVED
  - value: 3
    label: SENT_TO_CHANNEL
  - value: 1
    label: TRADE_SETTLED
- name: ref_reference_id
  display_name: 关联conversion_id
  type: VARCHAR(36)
  description: 关联的conversion_id
- name: ref_short_reference_id
  display_name: 关联短号
  type: VARCHAR(20)
relations:
- column: conversion_id
  target_table: pmt_conversion
  target_column: conversion_id
  join_type: LEFT JOIN
- column: ref_reference_id
  target_table: pmt_conversion
  target_column: conversion_id
  join_type: LEFT JOIN
common_queries:
- question: 拆单的子单分布
  sql: "SELECT ref_reference_id AS '父汇兑ID',\n       COUNT(*) AS '子单数'\nFROM dwd_banking.`pmt_conversion_connect`\n\
    GROUP BY ref_reference_id\nORDER BY `子单数` DESC\nLIMIT 20\n"
  tables:
  - pmt_conversion_connect
  difficulty: easy
- question: 关联汇兑链路
  sql: "SELECT short_reference_id AS '汇兑短号',\n       ref_short_reference_id AS '关联汇兑短号',\n\
    \       currency_pair AS '币种对',\n       buy_amount AS '买入金额'\nFROM dwd_banking.`pmt_conversion_connect`\n\
    WHERE ref_reference_id = ?\nLIMIT 100\n"
  tables:
  - pmt_conversion_connect
  difficulty: easy
