table:
  name: pmt_product_template_code
  database: dwd_banking
  display_name: 产品模板下产品组表
  description: '产品模板与具体产品代码的多对多映射，含路由、约束、授权交易类型。

    每行代表一个 (template_id, product_code) 关联。'
  tags:
  - 模板产品组
  - template code
  - 产品配置
  - pmt_product_template_code
  query_tips: ''
columns:
- name: pttid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: template_id
  display_name: 模板长ID
  type: VARCHAR(36)
  description: 唯一长ID
- name: short_template_id
  display_name: 模板短ID
  type: VARCHAR(25)
  description: 唯一短ID
- name: product_code
  display_name: 产品代码
  type: VARCHAR(60)
  description: 关联产品ID
- name: product_name
  display_name: 产品名
  type: VARCHAR(40)
  description: 关联产品名称
- name: update_time
  display_name: 更新时间
  type: DATETIME
  description: 更新时间
- name: create_time
  display_name: 创建时间
  type: DATETIME
  description: 创建时间
- name: status
  display_name: 状态
  type: INT
  description: 状态：0-关闭，1-开启
  enum_values:
  - value: 0
    label: 关闭
  - value: 1
    label: 开启
- name: route_id
  display_name: 路由ID
  type: INT
  description: 关联路由ID
  skip_index: true
- name: route_name
  display_name: 路由名
  type: VARCHAR(40)
  description: 关联路由名称
- name: restrict_id
  display_name: 约束ID
  type: INT
  description: 关联约束ID
  skip_index: true
- name: restrict_name
  display_name: 约束名
  type: VARCHAR(40)
  description: 关联约束名
- name: auth_trade_type
  display_name: 授权交易类型
  type: TEXT
  description: 产品交易授权类型
  skip_index: true
relations:
- column: template_id
  target_table: pmt_product_template
  target_column: template_id
  join_type: LEFT JOIN
- column: product_code
  target_table: pmt_service_product
  target_column: product_code
  join_type: LEFT JOIN
common_queries:
- question: 各模板包含的产品数
  sql: "SELECT t.template_name AS '模板名',\n       COUNT(*) AS '产品数'\nFROM dwd_banking.`pmt_product_template_code`\
    \ tc\nLEFT JOIN dwd_banking.`pmt_product_template` t ON tc.template_id = t.template_id\n\
    WHERE tc.status = 1\nGROUP BY t.template_name\nORDER BY `产品数` DESC\nLIMIT 100\n"
  tables:
  - pmt_product_template_code
  - pmt_product_template
  difficulty: medium
- question: 模板覆盖的产品组合
  sql: "SELECT short_template_id AS '模板短号',\n       product_code AS '产品代码',\n    \
    \   product_name AS '产品名',\n       route_name AS '路由'\nFROM dwd_banking.`pmt_product_template_code`\n\
    WHERE template_id = ?\nLIMIT 100\n"
  tables:
  - pmt_product_template_code
  difficulty: easy
