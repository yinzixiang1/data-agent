table:
  name: sys_schedule_job
  database: dwd_banking
  display_name: 定时任务表
  description: '系统定时任务配置(永久/临时)。

    每行代表一个定时任务，含cron表达式、方法名、参数、状态。'
  tags:
  - 定时任务
  - cron
  - 调度
  - schedule job
  - sys_schedule_job
  query_tips: ''
columns:
- name: job_id
  display_name: 任务ID
  type: BIGINT
  description: 任务id
  skip_index: true
- name: job_type
  display_name: 任务类型
  type: INT
  description: 1=永久任务, 0=临时任务
  enum_values:
  - value: 0
    label: 临时任务
  - value: 1
    label: 永久任务
- name: method_name
  display_name: 方法名
  type: VARCHAR(100)
  description: 方法名
- name: params
  display_name: 参数
  type: VARCHAR(10000)
  description: 参数
  skip_index: true
- name: cron_expression
  display_name: cron表达式
  type: VARCHAR(100)
  description: cron表达式
- name: status
  display_name: 任务状态
  type: TINYINT
  description: 任务状态  -1：删除；0：暂停；1：正常
  enum_values:
  - value: -1
    label: 删除
  - value: 0
    label: 暂停
  - value: 1
    label: 正常
- name: remark
  display_name: 备注
  type: VARCHAR(255)
  description: 备注
- name: create_time
  display_name: 创建时间
  type: DATETIME
  description: 创建时间
- name: update_time
  display_name: 更新时间
  type: DATETIME
  description: 更新时间
common_queries:
- question: 启用中的定时任务
  sql: "SELECT method_name AS '方法',\n       cron_expression AS 'cron',\n       remark\
    \ AS '备注'\nFROM dwd_banking.`sys_schedule_job`\nWHERE status = 1\nORDER BY method_name\n\
    LIMIT 100\n"
  tables:
  - sys_schedule_job
  difficulty: easy
- question: 永久任务 vs 临时任务
  sql: "SELECT\n  CASE job_type WHEN 1 THEN '永久' WHEN 0 THEN '临时' END AS '类型',\n \
    \ COUNT(*) AS '数量'\nFROM dwd_banking.`sys_schedule_job`\nWHERE status = 1\nGROUP\
    \ BY job_type\nLIMIT 100\n"
  tables:
  - sys_schedule_job
  difficulty: medium
- question: 暂停的任务列表
  sql: "SELECT method_name AS '方法',\n       cron_expression AS 'cron',\n       update_time\
    \ AS '暂停时间'\nFROM dwd_banking.`sys_schedule_job`\nWHERE status = 0\nLIMIT 100\n"
  tables:
  - sys_schedule_job
  difficulty: easy
