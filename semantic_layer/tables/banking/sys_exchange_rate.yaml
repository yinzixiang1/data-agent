table:
  name: sys_exchange_rate
  database: dwd_banking
  display_name: 法币/数字货币汇率表(最新报价)
  description: '系统使用的最新汇率(每币种对仅一条最新记录)。

    每行代表一个 (currency_pair, rate_source) 最新汇率，含买卖价、加点、源数据。'
  tags:
  - 汇率
  - FX
  - 实时报价
  - exchange rate
  - 加点
  - sys_exchange_rate
  query_tips: 启用汇率用 rate_status=1
columns:
- name: crid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: currency_type
  display_name: 币种类型
  type: INT
  description: 1000=fiat 2000=crypto
  enum_values:
  - value: 1000
    label: fiat
  - value: 2000
    label: crypto
- name: currency_network
  display_name: 币种网络
  type: VARCHAR(24)
  description: CurrencyCloud/GEP/NIUM等
- name: currency_pair
  display_name: 币种对
  type: VARCHAR(20)
  description: 'eg.: USDEUR'
- name: sell_currency
  display_name: 卖出币种
  type: VARCHAR(12)
  description: 原始币种
- name: sell_price_original
  display_name: 源卖出汇率
  type: DECIMAL(16,10)
  description: 源卖出汇率（未加成）
- name: sell_price
  display_name: 系统卖出汇率
  type: DECIMAL(26,10)
  description: 卖出汇率（系统）
- name: sell_mark_up
  display_name: 卖出加点
  type: DECIMAL(32,16)
  description: 卖出渠道加点
- name: buy_currency
  display_name: 买入币种
  type: VARCHAR(12)
  description: 目标币种
- name: buy_price_original
  display_name: 源买入汇率
  type: DECIMAL(26,10)
  description: 源买入汇率（未加成）
- name: buy_price
  display_name: 系统买入汇率
  type: DECIMAL(26,10)
  description: 买入汇率（系统）
- name: buy_mark_up
  display_name: 买入加点
  type: DECIMAL(32,16)
  description: 买入渠道加点
- name: add_point_ratio
  display_name: 加点比例
  type: DOUBLE(10,4)
  description: 加点值比例
- name: channel_code
  display_name: 渠道代码
  type: VARCHAR(30)
  description: 渠道代码
- name: rate_source
  display_name: 汇率源
  type: VARCHAR(60)
- name: create_time
  display_name: 创建时间
  type: DATETIME
  description: 创建时间
- name: sync_time
  display_name: 同步时间(timestamp)
  type: BIGINT
  description: 汇率同步时间
- name: rate_status
  display_name: 状态
  type: TINYINT(1)
  description: 1:可用；-1:不可用
  enum_values:
  - value: 1
    label: 可用
  - value: -1
    label: 不可用
relations:
- column: currency_pair
  target_table: sys_currency_pair
  target_column: currency_pair_code
  join_type: LEFT JOIN
common_queries:
- question: 当前USDXXX汇率
  sql: "SELECT currency_pair AS '币种对',\n       buy_price AS '买入价',\n       sell_price\
    \ AS '卖出价',\n       rate_source AS '汇率源',\n       create_time AS '更新时间'\nFROM\
    \ dwd_banking.`sys_exchange_rate`\nWHERE sell_currency = 'USD'\n  AND rate_status\
    \ = 1\nORDER BY currency_pair\nLIMIT 100\n"
  tables:
  - sys_exchange_rate
  difficulty: easy
- question: 各渠道汇率差异
  sql: "SELECT currency_pair AS '币种对',\n       channel_code AS '渠道',\n       buy_price\
    \ AS '买入价',\n       sell_price AS '卖出价'\nFROM dwd_banking.`sys_exchange_rate`\n\
    WHERE currency_pair = ?\n  AND rate_status = 1\nORDER BY channel_code\nLIMIT 100\n"
  tables:
  - sys_exchange_rate
  difficulty: easy
- question: 加点比例分布
  sql: "SELECT currency_pair AS '币种对',\n       AVG(add_point_ratio) AS '平均加点比例'\n\
    FROM dwd_banking.`sys_exchange_rate`\nWHERE rate_status = 1\nGROUP BY currency_pair\n\
    ORDER BY `平均加点比例` DESC\nLIMIT 20\n"
  tables:
  - sys_exchange_rate
  difficulty: medium
