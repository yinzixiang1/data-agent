table:
  name: sys_notification_template
  database: dwd_banking
  display_name: 系统通知模版表
  description: 'Email/SMS通知模版主数据。

    每行代表一个通知模板，含主题、正文、参数、域名、模板模式(service/market/otp)。'
  tags:
  - 通知模版
  - 邮件模版
  - SMS模版
  - notification template
  - sys_notification_template
  query_tips: ''
columns:
- name: tid
  display_name: 主键ID
  type: INT
  skip_index: true
- name: tpl_type
  display_name: 模版类型
  type: INT
  description: 1000=EMAIL, 2000=SMS
  enum_values:
  - value: 1000
    label: EMAIL
  - value: 2000
    label: SMS
- name: tpl_mode
  display_name: 通知模板方式
  type: VARCHAR(100)
  description: 通知模板方式：service=服务，market=营销，otp=OTP
  enum_values:
  - service
  - market
  - otp
- name: tpl_code
  display_name: 模版代码
  type: VARCHAR(60)
- name: tpl_subject
  display_name: 模版主题
  type: VARCHAR(250)
- name: tpl_body
  display_name: 模版正文
  type: TEXT
  skip_index: true
- name: tpl_params
  display_name: 参数集
  type: VARCHAR(255)
  description: body中参数集
  skip_index: true
- name: tpl_domain
  display_name: 可打开域名
  type: VARCHAR(255)
  description: 可打开域名
- name: tpl_status
  display_name: 状态
  type: TINYINT(1)
  description: 状态：-1删除，0关闭，1开启
  enum_values:
  - value: -1
    label: 删除
  - value: 0
    label: 关闭
  - value: 1
    label: 开启
- name: created_at
  display_name: 创建时间
  type: DATETIME
- name: updated_at
  display_name: 更新时间
  type: DATETIME
- name: created_id
  display_name: 创建ID
  type: VARCHAR(100)
  description: 创建ID
- name: created_name
  display_name: 创建名
  type: VARCHAR(120)
  description: 创建名
- name: metadata
  display_name: 扩展元数据
  type: TEXT
  description: 扩展元数据
  skip_index: true
relations:
- column: tpl_code
  target_table: pmt_message_notification
  target_column: notification_type
  join_type: LEFT JOIN
- column: tpl_code
  target_table: sys_notification_tpl_code
  target_column: tpl_code
  join_type: LEFT JOIN
common_queries:
- question: 启用中的模版列表
  sql: "SELECT\n  CASE tpl_type WHEN 1000 THEN 'EMAIL' WHEN 2000 THEN 'SMS' END AS\
    \ '类型',\n  tpl_mode AS '模式',\n  tpl_code AS '模版代码',\n  tpl_subject AS '主题'\nFROM\
    \ dwd_banking.`sys_notification_template`\nWHERE tpl_status = 1\nORDER BY tpl_type,\
    \ tpl_mode\nLIMIT 100\n"
  tables:
  - sys_notification_template
  difficulty: easy
- question: 模版调用次数(按使用频率)
  sql: "SELECT t.tpl_code AS '模版',\n       t.tpl_subject AS '主题',\n       COUNT(n.notification_id)\
    \ AS '调用次数'\nFROM dwd_banking.`sys_notification_template` t\nLEFT JOIN dwd_banking.`pmt_message_notification`\
    \ n ON t.tpl_code = n.notification_type\nWHERE t.tpl_status = 1\n  AND n.create_time\
    \ >= DATE_SUB(NOW(), INTERVAL 30 DAY)\nGROUP BY t.tpl_code, t.tpl_subject\nORDER\
    \ BY `调用次数` DESC\nLIMIT 20\n"
  tables:
  - sys_notification_template
  - pmt_message_notification
  difficulty: hard
- question: 各类型模板数
  sql: "SELECT\n  CASE tpl_type WHEN 1000 THEN 'EMAIL' WHEN 2000 THEN 'SMS' END AS\
    \ '类型',\n  tpl_mode AS '模式',\n  COUNT(*) AS '模板数'\nFROM dwd_banking.`sys_notification_template`\n\
    WHERE tpl_status = 1\nGROUP BY tpl_type, tpl_mode\nLIMIT 100\n"
  tables:
  - sys_notification_template
  difficulty: medium
