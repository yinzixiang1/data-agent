table:
  name: pmt_account_relationship
  database: dwd_banking
  display_name: 个人与企业关系表
  description: '维护个人账户与企业账户的对应关系，标记是否为默认关联。

    每行代表一个 (source_account_id, target_account_id) 关系，用于法人/UBO相关业务场景。'
  tags:
  - 账户关系
  - 个人企业
  - 法人
  - UBO
  - account relationship
  - pmt_account_relationship
  query_tips: ''
columns:
- name: arid
  display_name: 主键ID
  type: INT
  skip_index: true
- name: source_account_id
  display_name: 源账户ID
  type: VARCHAR(36)
- name: target_account_id
  display_name: 目标账户ID
  type: VARCHAR(36)
- name: is_default
  display_name: 是否默认
  type: TINYINT(1)
  description: 是否为默认
  enum_values:
  - value: 0
    label: 否
  - value: 1
    label: 是
relations:
- column: source_account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
- column: target_account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
common_queries:
- question: 某法人控制的所有企业账户
  sql: "SELECT a.short_account_id AS '企业商户号',\n       a.legal_entity_name AS '企业名',\n\
    \       ar.is_default AS '是否默认'\nFROM dwd_banking.`pmt_account_relationship` ar\n\
    LEFT JOIN dwd_banking.`pmt_account` a ON ar.target_account_id = a.account_id\n\
    WHERE ar.source_account_id = ?\nLIMIT 100\n"
  tables:
  - pmt_account_relationship
  - pmt_account
  difficulty: medium
- question: 默认关联的账户对数量
  sql: 'SELECT COUNT(*) AS ''默认关联对数''

    FROM dwd_banking.`pmt_account_relationship`

    WHERE is_default = 1

    LIMIT 100

    '
  tables:
  - pmt_account_relationship
  difficulty: easy
- question: 关联个人最多的企业TOP10
  sql: "SELECT target_account_id AS '企业账户ID',\n       COUNT(*) AS '关联个人数'\nFROM dwd_banking.`pmt_account_relationship`\n\
    GROUP BY target_account_id\nORDER BY `关联个人数` DESC\nLIMIT 10\n"
  tables:
  - pmt_account_relationship
  difficulty: easy
