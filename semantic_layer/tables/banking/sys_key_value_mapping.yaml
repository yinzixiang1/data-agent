table:
  name: sys_key_value_mapping
  database: dwd_banking
  display_name: 通用键值映射表
  description: '简单的Key-Value映射(渠道字段映射、状态码映射等)。

    每行代表一个映射项。'
  tags:
  - 映射表
  - key value mapping
  - 字段映射
  - sys_key_value_mapping
  query_tips: ''
columns:
- name: id
  display_name: 主键ID
  type: INT
  skip_index: true
- name: mapping_key
  display_name: 映射键
  type: VARCHAR(255)
  description: 映射的键
  sensitive: true
- name: mapping_value
  display_name: 映射值
  type: VARCHAR(500)
  description: 映射的值
  sensitive: true
- name: description
  display_name: 描述
  type: TEXT
- name: created_at
  display_name: 创建时间
  type: DATETIME
  description: 创建时间
- name: updated_at
  display_name: 更新时间
  type: DATETIME
common_queries:
- question: 某Key的所有映射值
  sql: "SELECT mapping_value AS '值',\n       description AS '描述'\nFROM dwd_banking.`sys_key_value_mapping`\n\
    WHERE mapping_key = ?\nLIMIT 100\n"
  tables:
  - sys_key_value_mapping
  difficulty: easy
- question: 映射数量统计
  sql: "SELECT mapping_key AS '键',\n       COUNT(*) AS '映射数'\nFROM dwd_banking.`sys_key_value_mapping`\n\
    GROUP BY mapping_key\nORDER BY `映射数` DESC\nLIMIT 100\n"
  tables:
  - sys_key_value_mapping
  difficulty: easy
