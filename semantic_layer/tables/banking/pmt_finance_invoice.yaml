table:
  name: pmt_finance_invoice
  database: dwd_banking
  display_name: 账户Invoice表
  description: '商户费用发票，按周期(invoice_period)生成的明细Invoice。

    每行代表一个商户的发票记录，含费用项、税、金额、扣款状态。'
  tags:
  - 发票
  - invoice
  - 账单
  - 计费
  - 费用
  - pmt_finance_invoice
  query_tips: ''
columns:
- name: ivid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: direct_id
  display_name: 机构ID
  type: VARCHAR(36)
- name: account_id
  display_name: 账户ID
  type: VARCHAR(36)
- name: short_account_id
  display_name: 商户短号
  type: VARCHAR(20)
  description: 商户短号
- name: account_name
  display_name: 商户名
  type: VARCHAR(200)
- name: account_address
  display_name: 商户地址
  type: VARCHAR(255)
  sensitive: true
- name: invoice_id
  display_name: Invoice长ID
  type: VARCHAR(36)
  description: invoice编号
- name: short_invoice_id
  display_name: Invoice短ID
  type: VARCHAR(20)
  description: invoice短编号
- name: invoice_type
  display_name: Invoice类型
  type: INT
  description: 类型 1000=VA 2000=FX(预留), 3000=AC, 4000=IC
  enum_values:
  - value: 1000
    label: VA
  - value: 2000
    label: FX
  - value: 3000
    label: AC
  - value: 4000
    label: IC
- name: invoice_date
  display_name: 发票日期
  type: DATETIME
  description: 日期
- name: invoice_email
  display_name: 邮箱
  type: VARCHAR(255)
  description: 邮箱
  sensitive: true
- name: currency
  display_name: 币种
  type: VARCHAR(3)
  description: 币种
- name: invoice_period
  display_name: 发票期限
  type: VARCHAR(7)
  description: 发票期限
- name: items
  display_name: 收费明细数组
  type: TEXT
  description: 收费明细数组[pmt_service_invoice_scheme]
  skip_index: true
- name: invoice_amount
  display_name: 发票总金额
  type: DECIMAL(16,4)
  description: 总费
- name: debit_status
  display_name: 扣款状态
  type: INT
  description: 扣款状态 -1=异常，0=默认，1=已扣款
  enum_values:
  - value: -1
    label: 异常
  - value: 0
    label: 默认
  - value: 1
    label: 已扣款
- name: invoice_status
  display_name: Invoice状态
  type: INT
  description: 状态：-1=作废，0=默认草稿，1=正常
  enum_values:
  - value: -1
    label: 作废
  - value: 0
    label: 草稿
  - value: 1
    label: 正常
- name: file_path
  display_name: 文件路径
  type: VARCHAR(255)
  description: 文件存储路径
  sensitive: true
- name: create_time
  display_name: 创建时间
  type: DATETIME
  description: 创建时间
- name: review_status
  display_name: 审查状态
  type: TINYINT(1)
  description: 审查状态：1=passed，0=in_review，-1=rejected
  enum_values:
  - value: 1
    label: 通过
  - value: 0
    label: 审核中
  - value: -1
    label: 拒绝
- name: update_time
  display_name: 更新时间
  type: DATETIME
- name: invoice_way
  display_name: 来源
  type: TINYINT
  description: 来源 0:后台提交 1:定时生成
  enum_values:
  - value: 0
    label: 后台提交
  - value: 1
    label: 定时生成
relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
common_queries:
- question: 月度Invoice总额
  sql: "SELECT DATE_FORMAT(invoice_date, '%Y-%m') AS '月份',\n       currency AS '币种',\n\
    \       SUM(invoice_amount) AS '总金额',\n       COUNT(*) AS 'Invoice数'\nFROM dwd_banking.`pmt_finance_invoice`\n\
    WHERE invoice_status = 1\nGROUP BY DATE_FORMAT(invoice_date, '%Y-%m'), currency\n\
    ORDER BY `月份` DESC\nLIMIT 100\n"
  tables:
  - pmt_finance_invoice
  difficulty: medium
- question: 已扣款 vs 未扣款Invoice
  sql: "SELECT\n  CASE debit_status\n    WHEN 1 THEN '已扣款'\n    WHEN 0 THEN '未扣款'\n\
    \    WHEN -1 THEN '扣款异常'\n  END AS '扣款状态',\n  currency AS '币种',\n  SUM(invoice_amount)\
    \ AS '总金额',\n  COUNT(*) AS '数量'\nFROM dwd_banking.`pmt_finance_invoice`\nWHERE\
    \ invoice_status = 1\nGROUP BY debit_status, currency\nORDER BY `总金额` DESC\nLIMIT\
    \ 100\n"
  tables:
  - pmt_finance_invoice
  difficulty: medium
- question: 异常扣款Invoice
  sql: "SELECT short_invoice_id AS 'Invoice短号',\n       short_account_id AS '商户短号',\n\
    \       account_name AS '商户',\n       invoice_amount AS '金额',\n       currency\
    \ AS '币种',\n       create_time AS '创建时间'\nFROM dwd_banking.`pmt_finance_invoice`\n\
    WHERE debit_status = -1\nLIMIT 100\n"
  tables:
  - pmt_finance_invoice
  difficulty: easy
- question: 各类型Invoice占比
  sql: "SELECT\n  CASE invoice_type\n    WHEN 1000 THEN 'VA'\n    WHEN 2000 THEN 'FX'\n\
    \    WHEN 3000 THEN 'AC'\n    WHEN 4000 THEN 'IC'\n  END AS 'Invoice类型',\n  COUNT(*)\
    \ AS '数量',\n  SUM(invoice_amount) AS '总金额'\nFROM dwd_banking.`pmt_finance_invoice`\n\
    WHERE invoice_status = 1\nGROUP BY invoice_type\nLIMIT 100\n"
  tables:
  - pmt_finance_invoice
  difficulty: medium
