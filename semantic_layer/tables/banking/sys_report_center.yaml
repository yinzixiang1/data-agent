table:
  name: sys_report_center
  database: dwd_banking
  display_name: HUB报告生成记录表
  description: '后台/HUB集中报告生成记录，含MAS报告、余额快照报告等系统级报告。

    每行代表一次报告生成请求。'
  tags:
  - HUB报告
  - MAS报告
  - 系统报表
  - report center
  - sys_report_center
  query_tips: ''
columns:
- name: rid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: report_id
  display_name: 报告长ID
  type: VARCHAR(36)
  description: 长号
- name: short_reference_id
  display_name: 报告短号
  type: VARCHAR(36)
  description: 短号
- name: report_type
  display_name: 报告类型
  type: VARCHAR(250)
  description: 0=默认其他, 1000=payin, 1001=deposit, 2000=payout, 2001=transfer, 3000=conversion,
    7001=mas_report, 7002=balance_snapshot, 8000=fee, 8001=refund, 9000=adjustment
- name: currency
  display_name: 币种
  type: VARCHAR(255)
  description: 币种
- name: file_name
  display_name: 文件名
  type: VARCHAR(255)
- name: file_format
  display_name: 文件格式
  type: VARCHAR(10)
  description: 文件类型 csv excel pdf
  enum_values:
  - csv
  - excel
  - pdf
- name: file_path
  display_name: 文件路径
  type: VARCHAR(255)
  description: 文件存储路径，服务器 or NAS
  sensitive: true
- name: creator_id
  display_name: 创建人ID
  type: VARCHAR(36)
  description: 创建人id
- name: creator_name
  display_name: 创建人名
  type: VARCHAR(50)
  description: 创建人名
- name: create_time
  display_name: 创建时间
  type: DATETIME
- name: update_time
  display_name: 更新时间
  type: DATETIME
- name: expire_time
  display_name: 文件过期时间
  type: DATETIME
  description: 文件过期时间默认7天
- name: report_to_email
  display_name: 报告邮箱
  type: VARCHAR(255)
  description: 报告邮箱
  sensitive: true
- name: report_parameters
  display_name: 查询参数JSON
  type: TEXT
  description: ' {\n        "from_create_time”: "2022-02-22",\n        "to_create_time":
    "2022-02-25",\n        "transaction_type": "conversion"\n}'
  skip_index: true
- name: report_status
  display_name: 报告状态
  type: TINYINT(1)
  description: -1=failed, 0=pending,1=success
  enum_values:
  - value: -1
    label: failed
  - value: 0
    label: pending
  - value: 1
    label: success
common_queries:
- question: 报告生成成功率
  sql: "SELECT\n  ROUND(SUM(CASE WHEN report_status = 1 THEN 1 ELSE 0 END) * 100.0\
    \ / COUNT(*), 2) AS '成功率%',\n  COUNT(*) AS '总数'\nFROM dwd_banking.`sys_report_center`\n\
    WHERE create_time >= DATE_SUB(NOW(), INTERVAL 30 DAY)\nLIMIT 100\n"
  tables:
  - sys_report_center
  difficulty: medium
- question: MAS报告生成量
  sql: "SELECT DATE_FORMAT(create_time, '%Y-%m') AS '月份',\n       COUNT(*) AS 'MAS报告数'\n\
    FROM dwd_banking.`sys_report_center`\nWHERE report_type = '7001'\nGROUP BY DATE_FORMAT(create_time,\
    \ '%Y-%m')\nORDER BY `月份` DESC\nLIMIT 100\n"
  tables:
  - sys_report_center
  difficulty: medium
- question: 各类型报告耗时
  sql: "SELECT report_type AS '报告类型',\n       AVG(TIMESTAMPDIFF(SECOND, create_time,\
    \ update_time)) AS '平均耗时(秒)'\nFROM dwd_banking.`sys_report_center`\nWHERE report_status\
    \ = 1\n  AND update_time IS NOT NULL\nGROUP BY report_type\nLIMIT 100\n"
  tables:
  - sys_report_center
  difficulty: medium
