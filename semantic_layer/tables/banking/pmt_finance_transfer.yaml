table:
  name: pmt_finance_transfer
  database: dwd_banking
  display_name: 账户内部转账表
  description: '同一商户内多账户间(VA/AC/IC)或跨账户间的内部转账记录。

    每行代表一笔转账，会有source/target两条对应记录(out/in)。'
  tags:
  - 内部转账
  - transfer
  - 账户互转
  - account transfer
  query_tips: ''
columns:
- name: ptid
  display_name: 主键ID
  skip_index: true
- name: direct_id
  display_name: 机构ID
- name: transfer_id
  display_name: 转账ID
- name: source_account_id
  display_name: 源账户ID
- name: short_account_id
  display_name: 源账户短号
- name: source_account_name
  display_name: 源账户名
- name: source_balance_type
  display_name: 源余额类型
  enum_values:
  - value: 1000
    label: VA
  - value: 2000
    label: FX
  - value: 3000
    label: AC
  - value: 4000
    label: IC
- name: target_account_id
  display_name: 目标账户ID
- name: target_account_name
  display_name: 目标账户名
- name: target_balance_type
  display_name: 目标余额类型
  enum_values:
  - value: 1000
    label: VA
  - value: 2000
    label: FX
  - value: 3000
    label: AC
  - value: 4000
    label: IC
- name: transfer_currency
  display_name: 转账币种
- name: transfer_amount
  display_name: 转账金额
- name: fee_amount
  display_name: 手续费
- name: transfer_reason
  display_name: 转账原因
- name: transfer_scope
  display_name: 转账范围
  enum_values:
  - out
  - in
- name: short_reference_id
  display_name: 转账短号
- name: unique_request_id
  display_name: 客户端幂等键
- name: client_idempotency_key
  display_name: 客户端幂等键(durable)
- name: client_request_fingerprint
  display_name: 请求指纹sha256
  skip_index: true
- name: creator_id
  display_name: 创建人ID
- name: creator_name
  display_name: 创建人名
- name: transaction_id
  display_name: 交易记录ID
- name: debit_status
  display_name: 扣款状态
  enum_values:
  - value: -1
    label: 异常
  - value: 0
    label: 默认
  - value: 1
    label: 已扣款
- name: review_status
  display_name: 审查状态
  enum_values:
  - value: 1
    label: 通过
  - value: 0
    label: 审核中
  - value: -1
    label: 拒绝
- name: transfer_status
  display_name: 转账状态
  enum_values:
  - value: -1
    label: 失败
  - value: 1
    label: 成功
- name: ref_reference_id
  display_name: 关联ID
- name: complete_time
  display_name: 完成时间
- name: create_time
  display_name: 创建时间
- name: update_time
  display_name: 更新时间
relations:
- column: source_account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
- column: target_account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
- column: transaction_id
  target_table: pmt_finance_transactions
  target_column: transaction_id
  join_type: LEFT JOIN
common_queries:
- question: 月度内部转账金额
  sql: "SELECT DATE_FORMAT(create_time, '%Y-%m') AS \"月份\",\n       transfer_currency\
    \ AS \"币种\",\n       COUNT(*) AS \"转账笔数\",\n       SUM(transfer_amount) AS \"\
    总金额\"\nFROM dwd_banking.pmt_finance_transfer\nWHERE transfer_status = 1\n  AND\
    \ transfer_scope = 'out'\nGROUP BY DATE_FORMAT(create_time, '%Y-%m'), transfer_currency\n\
    ORDER BY \"月份\" DESC;"
  tables:
  - pmt_finance_transfer
  difficulty: medium
- question: 跨账户类型(VA→AC等)的转账分布
  sql: "SELECT\n  CASE source_balance_type WHEN 1000 THEN 'VA' WHEN 3000 THEN 'AC'\
    \ WHEN 4000 THEN 'IC' END AS \"源类型\",\n  CASE target_balance_type WHEN 1000 THEN\
    \ 'VA' WHEN 3000 THEN 'AC' WHEN 4000 THEN 'IC' END AS \"目标类型\",\n  COUNT(*) AS\
    \ \"笔数\"\nFROM dwd_banking.pmt_finance_transfer\nWHERE transfer_status = 1\n \
    \ AND transfer_scope = 'out'\nGROUP BY source_balance_type, target_balance_type\n\
    ORDER BY \"笔数\" DESC;"
  tables:
  - pmt_finance_transfer
  difficulty: medium
- question: 转账失败原因
  sql: "SELECT short_reference_id AS \"短号\",\n       source_account_name AS \"源账户\"\
    ,\n       target_account_name AS \"目标账户\",\n       transfer_amount AS \"金额\",\n\
    \       transfer_currency AS \"币种\",\n       create_time AS \"创建时间\"\nFROM dwd_banking.pmt_finance_transfer\n\
    WHERE transfer_status = -1\n  AND transfer_scope = 'out'\nORDER BY create_time\
    \ DESC\nLIMIT 50;"
  tables:
  - pmt_finance_transfer
  difficulty: easy
- question: 转账金额TOP10商户
  sql: "SELECT short_account_id AS \"商户短号\",\n       source_account_name AS \"商户名\"\
    ,\n       SUM(transfer_amount) AS \"转账总额\",\n       COUNT(*) AS \"笔数\"\nFROM dwd_banking.pmt_finance_transfer\n\
    WHERE transfer_status = 1\n  AND transfer_scope = 'out'\nGROUP BY short_account_id,\
    \ source_account_name\nORDER BY \"转账总额\" DESC\nLIMIT 10;"
  tables:
  - pmt_finance_transfer
  difficulty: easy
