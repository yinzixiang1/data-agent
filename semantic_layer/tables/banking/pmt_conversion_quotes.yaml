table:
  name: pmt_conversion_quotes
  database: dwd_banking
  display_name: 汇兑报价表
  description: '锁汇/即时报价记录。

    每行代表一次客户询价产生的报价(含正反向汇率、有效期)，用于汇率追溯和锁汇凭证。'
  tags:
  - 报价
  - 锁汇
  - 汇率
  - FX quote
  - lockfx
  - 询价
  - pmt_conversion_quotes
  query_tips: 当前有效报价用 valid_to >= UNIX_TIMESTAMP(NOW())*1000
columns:
- name: cqid
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: quote_id
  display_name: 报价ID
  type: VARCHAR(36)
- name: currency_pair
  display_name: 币种对
  type: VARCHAR(8)
  description: 交易对
- name: sell_currency
  display_name: 卖出币种
  type: VARCHAR(6)
- name: sell_amount
  display_name: 卖出金额
  type: DECIMAL(16,2)
- name: buy_currency
  display_name: 买入币种
  type: VARCHAR(6)
- name: buy_amount
  display_name: 买入金额
  type: DECIMAL(16,2)
- name: direct_rate
  display_name: 正向汇率
  type: DECIMAL(16,6)
  description: 正向汇率
- name: inverse_rate
  display_name: 反向汇率
  type: DECIMAL(16,6)
  description: 反向汇率
- name: core_rate
  display_name: 平台核心汇率
  type: DECIMAL(16,6)
- name: client_rate
  display_name: 客户汇率
  type: DECIMAL(16,6)
- name: mid_market_rate
  display_name: 中间价
  type: DECIMAL(16,6)
- name: create_time
  display_name: 创建时间
  type: DATETIME
- name: settlement_time
  display_name: 清算日期
  type: DATETIME
  description: 清算日期
- name: valid_from
  display_name: 有效期开始(timestamp)
  type: BIGINT
  description: 有效期from
- name: valid_to
  display_name: 有效期结束(timestamp)
  type: BIGINT
  description: 有效期end
- name: channel_code
  display_name: 渠道代码
  type: VARCHAR(30)
  description: 渠道代码
- name: transaction_type
  display_name: 交易类型
  type: VARCHAR(50)
  description: conversion / payout
relations:
- column: quote_id
  target_table: pmt_conversion
  target_column: quote_id
  join_type: LEFT JOIN
common_queries:
- question: 报价转化率(报价→订单)
  sql: "SELECT q.transaction_type AS '交易类型',\n       COUNT(DISTINCT q.quote_id) AS\
    \ '报价数',\n       COUNT(DISTINCT c.quote_id) AS '已成交报价',\n       ROUND(COUNT(DISTINCT\
    \ c.quote_id) * 100.0 / COUNT(DISTINCT q.quote_id), 2) AS '转化率%'\nFROM dwd_banking.`pmt_conversion_quotes`\
    \ q\nLEFT JOIN dwd_banking.`pmt_conversion` c ON q.quote_id = c.quote_id\nWHERE\
    \ q.create_time >= DATE_SUB(NOW(), INTERVAL 30 DAY)\nGROUP BY q.transaction_type\n\
    LIMIT 100\n"
  tables:
  - pmt_conversion_quotes
  - pmt_conversion
  difficulty: hard
- question: 各币种对锁汇时长
  sql: "SELECT currency_pair AS '币种对',\n       AVG((valid_to - valid_from) / 1000)\
    \ AS '平均锁汇秒数',\n       COUNT(*) AS '报价数'\nFROM dwd_banking.`pmt_conversion_quotes`\n\
    WHERE valid_from IS NOT NULL\n  AND valid_to IS NOT NULL\nGROUP BY currency_pair\n\
    LIMIT 100\n"
  tables:
  - pmt_conversion_quotes
  difficulty: medium
- question: 平均加点比例(client vs mid)
  sql: "SELECT currency_pair AS '币种对',\n       AVG(ABS(client_rate - mid_market_rate)\
    \ / mid_market_rate * 100) AS '平均加点比例%'\nFROM dwd_banking.`pmt_conversion_quotes`\n\
    WHERE mid_market_rate > 0\nGROUP BY currency_pair\nORDER BY `平均加点比例%` DESC\nLIMIT\
    \ 100\n"
  tables:
  - pmt_conversion_quotes
  difficulty: medium
- question: 报价数量(按渠道按交易类型,最近24h)
  sql: "SELECT channel_code AS '渠道',\n       transaction_type AS '类型',\n       COUNT(*)\
    \ AS '报价数'\nFROM dwd_banking.`pmt_conversion_quotes`\nWHERE create_time >= DATE_SUB(NOW(),\
    \ INTERVAL 24 HOUR)\nGROUP BY channel_code, transaction_type\nORDER BY `报价数` DESC\n\
    LIMIT 100\n"
  tables:
  - pmt_conversion_quotes
  difficulty: easy
