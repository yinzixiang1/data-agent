table:
  name: pmt_account_balance
  database: dwd_banking
  display_name: 法币账户余额表
  description: |
    记录每个商户账户在不同币种、不同账户类型(VA/AC/IC/FX)下的多维度余额。
    每行代表一个 (account_id, balance_currency, balance_type) 组合，是平台资金状况的实时快照。
  tags: [余额, balance, 资金, VA, AC, IC, FX, 多币种, 可用余额, 储备余额]
  query_tips: 查询活跃余额需带 balance_status=1；多币种汇总需关联 sys_exchange_rate 换算到USD

columns:
  - name: paid
    display_name: 主键ID
    skip_index: true

  - name: direct_id
    display_name: 机构ID

  - name: account_id
    display_name: 系统内部账户ID

  - name: balance_id
    display_name: 余额账户ID
    description: 余额唯一标识

  - name: balance_type
    display_name: 账户余额类型
    enum_values:
      - {value: 1000, label: "VA-虚拟账户"}
      - {value: 2000, label: "FX-外汇(预留)"}
      - {value: 3000, label: "AC-收单"}
      - {value: 4000, label: "IC-发卡"}

  - name: balance_name
    display_name: 余额名称

  - name: balance_currency
    display_name: 账户币种
    description: 3位ISO 4217币种代码

  - name: available_balance
    display_name: 可用余额
    description: 已完成清分清算的资金，可用于结算

  - name: pending_balance
    display_name: 处理中余额
    description: 主要是AC待结算资金或PAYOUT/CONVERT中

  - name: reserved_balance
    display_name: 储备余额
    description: 用于退款、拒付和其他运营费用支出

  - name: prepaid_balance
    display_name: 预付余额
    description: 预付费卡专用

  - name: margin_balance
    display_name: 保证金余额
    description: 用于VM循环保证金或发卡固定保证金

  - name: frozen_balance
    display_name: 冻结资金
    description: 主要在处理争议和其他风险冻结时使用

  - name: processing_amount
    display_name: 扣款处理中金额

  - name: balance_status
    display_name: 余额状态
    enum_values:
      - {value: 0, label: "默认"}
      - {value: 1, label: "激活"}
      - {value: 2, label: "关闭"}
      - {value: 3, label: "处理中"}

  - name: create_time
    display_name: 创建时间

  - name: last_trade_time
    display_name: 最后交易时间

relations:
  - column: account_id
    target_table: pmt_account
    target_column: account_id
    join_type: LEFT JOIN
    description: 关联商户账户

  - column: balance_currency
    target_table: sys_currency_code
    target_column: currency_code
    join_type: LEFT JOIN

common_queries:
  - question: 各币种的总可用余额
    sql: |
      SELECT balance_currency AS "币种",
             SUM(available_balance) AS "总可用余额",
             COUNT(DISTINCT account_id) AS "账户数"
      FROM dwd_banking.pmt_account_balance
      WHERE balance_status = 1
      GROUP BY balance_currency
      ORDER BY "总可用余额" DESC;
    tables: [pmt_account_balance]
    difficulty: easy

  - question: 哪些商户有冻结资金？
    sql: |
      SELECT b.account_id AS "账户ID",
             a.short_account_id AS "商户短号",
             a.account_name AS "商户名",
             b.balance_currency AS "币种",
             b.frozen_balance AS "冻结金额"
      FROM dwd_banking.pmt_account_balance b
      LEFT JOIN dwd_banking.pmt_account a ON b.account_id = a.account_id
      WHERE b.frozen_balance > 0
      ORDER BY b.frozen_balance DESC;
    tables: [pmt_account_balance, pmt_account]
    difficulty: hard

  - question: 储备余额排名前10的商户
    sql: |
      SELECT a.short_account_id AS "商户短号",
             a.account_name AS "商户名",
             b.balance_currency AS "币种",
             b.reserved_balance AS "储备余额"
      FROM dwd_banking.pmt_account_balance b
      LEFT JOIN dwd_banking.pmt_account a ON b.account_id = a.account_id
      WHERE b.reserved_balance > 0
      ORDER BY b.reserved_balance DESC
      LIMIT 10;
    tables: [pmt_account_balance, pmt_account]
    difficulty: hard

  - question: 各账户类型(VA/AC/IC)的余额分布
    sql: |
      SELECT
        CASE balance_type
          WHEN 1000 THEN 'VA'
          WHEN 2000 THEN 'FX'
          WHEN 3000 THEN 'AC'
          WHEN 4000 THEN 'IC'
        END AS "账户类型",
        balance_currency AS "币种",
        SUM(available_balance) AS "可用余额",
        SUM(pending_balance) AS "处理中余额",
        SUM(reserved_balance) AS "储备余额"
      FROM dwd_banking.pmt_account_balance
      WHERE balance_status = 1
      GROUP BY balance_type, balance_currency
      ORDER BY balance_type, "可用余额" DESC;
    tables: [pmt_account_balance]
    difficulty: medium

  - question: 全平台处理中的资金总量(各币种)
    sql: |
      SELECT balance_currency AS "币种",
             SUM(pending_balance + processing_amount) AS "处理中总量"
      FROM dwd_banking.pmt_account_balance
      WHERE balance_status = 1
      GROUP BY balance_currency
      ORDER BY "处理中总量" DESC;
    tables: [pmt_account_balance]
    difficulty: easy
