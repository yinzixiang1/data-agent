relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
- column: beneficiary_id
  target_table: pmt_finance_payout
  target_column: beneficiary_id
  join_type: LEFT JOIN
common_queries:
- question: 各商户的受益人数量
  sql: "SELECT a.short_account_id AS '商户短号',\n       a.account_name AS '商户名',\n  \
    \     COUNT(*) AS '受益人数'\nFROM dwd_banking.`pmt_payment_beneficiary` b\nLEFT JOIN\
    \ dwd_banking.`pmt_account` a ON b.account_id = a.account_id\nWHERE b.beneficiary_status\
    \ = 1\n  AND b.deleted_at IS NULL\nGROUP BY a.short_account_id, a.account_name\n\
    ORDER BY `受益人数` DESC\nLIMIT 20\n"
  tables:
  - pmt_payment_beneficiary
  - pmt_account
  difficulty: medium
- question: KYC验证通过率
  sql: "SELECT\n  ROUND(SUM(CASE WHEN verification_status = 1 THEN 1 ELSE 0 END) *\
    \ 100.0 / COUNT(*), 2) AS '通过率%'\nFROM dwd_banking.`pmt_payment_beneficiary`\n\
    WHERE deleted_at IS NULL\n  AND verification_status IN (1, -1)\nLIMIT 100\n"
  tables:
  - pmt_payment_beneficiary
  difficulty: medium
- question: 黑名单受益人列表
  sql: "SELECT short_reference_id AS '短号',\n       beneficiary_nickname AS '昵称',\n\
    \       bank_country_code AS '银行国家',\n       account_currency_code AS '币种'\nFROM\
    \ dwd_banking.`pmt_payment_beneficiary`\nWHERE risk_flag = 2\n  AND deleted_at\
    \ IS NULL\nLIMIT 100\n"
  tables:
  - pmt_payment_beneficiary
  difficulty: easy
- question: 受益人地区分布
  sql: "SELECT bank_country_code AS '银行国家',\n       COUNT(*) AS '受益人数'\nFROM dwd_banking.`pmt_payment_beneficiary`\n\
    WHERE deleted_at IS NULL\n  AND beneficiary_status = 1\nGROUP BY bank_country_code\n\
    ORDER BY `受益人数` DESC\nLIMIT 100\n"
  tables:
  - pmt_payment_beneficiary
  difficulty: easy
- question: 个人 vs 企业受益人占比
  sql: "SELECT\n  CASE entity_type WHEN 1000 THEN '个人' WHEN 2000 THEN '企业' END AS\
    \ '类型',\n  COUNT(*) AS '数量'\nFROM dwd_banking.`pmt_payment_beneficiary`\nWHERE\
    \ deleted_at IS NULL\nGROUP BY entity_type\nLIMIT 100\n"
  tables:
  - pmt_payment_beneficiary
  difficulty: easy
