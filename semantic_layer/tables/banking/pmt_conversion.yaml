table:
  name: pmt_conversion
  database: dwd_banking
  display_name: 汇兑订单表
  description: '商户发起的对客汇兑订单，是FX业务的核心交易表。

    每行代表一笔商户汇兑订单，含买卖金额、币种、汇率、对冲状态、加款/转账状态等全生命周期信息。'
  tags:
  - 汇兑
  - FX
  - conversion
  - 对冲
  - 报价
  - 商户交易
  - 换汇
  - pmt_conversion
  query_tips: 已成交用 conversion_status=1；查询客户实际汇率用 client_rate
columns:
- name: pcid
  display_name: 主键ID
  type: INT
  skip_index: true
- name: direct_id
  display_name: 机构ID
  type: VARCHAR(36)
- name: account_id
  display_name: 账户ID
  type: VARCHAR(36)
- name: account_name
  display_name: 商户名
  type: VARCHAR(250)
- name: conversion_id
  display_name: 汇兑长ID
  type: VARCHAR(36)
- name: core_rate
  display_name: 平台核心定价
  type: DECIMAL(16,6)
  description: 综合多个市场价格的平台核心定价
- name: client_rate
  display_name: 客户汇率
  type: DECIMAL(16,6)
  description: 面向客户的执行汇率
- name: fixed_side
  display_name: 固定边
  type: VARCHAR(6)
  description: 哪一边币种是固定的(buy/sell)
- name: buy_amount
  display_name: 买入金额
  type: DECIMAL(16,2)
- name: buy_currency
  display_name: 买入币种
  type: VARCHAR(3)
- name: currency_pair
  display_name: 币种对
  type: VARCHAR(6)
  description: 交易对
- name: sell_amount
  display_name: 卖出金额
  type: DECIMAL(16,2)
- name: sell_currency
  display_name: 卖出币种
  type: VARCHAR(3)
- name: mid_market_rate
  display_name: 中间价
  type: DECIMAL(16,6)
- name: conversion_date
  display_name: 汇兑日期
  type: DATETIME
- name: conversion_reason
  display_name: 汇兑原因
  type: VARCHAR(100)
- name: short_account_id
  display_name: 商户短号
  type: VARCHAR(20)
- name: short_reference_id
  display_name: 汇兑短号
  type: VARCHAR(20)
- name: unique_request_id
  display_name: 客户端幂等键
  type: VARCHAR(36)
  description: User-generated idempotency key.
- name: quote_id
  display_name: 报价ID
  type: VARCHAR(36)
- name: lockfx_quote_id
  display_name: LockFX报价ID
  type: VARCHAR(36)
  description: LockFX quote id
- name: creator_id
  display_name: 创建人ID
  type: VARCHAR(36)
  description: 创建人ID
- name: creator_name
  display_name: 创建人名
  type: VARCHAR(100)
  description: 创建人名
- name: channel_resp_id
  display_name: 渠道响应ID
  type: VARCHAR(36)
- name: channel_resp_status
  display_name: 渠道响应状态
  type: VARCHAR(20)
- name: channel_resp_body
  display_name: 渠道响应Body
  type: TEXT
  skip_index: true
- name: execute_reason
  display_name: 失败原因
  type: TEXT
  description: 对应失败原因
- name: transaction_id
  display_name: 交易流水ID
  type: VARCHAR(36)
  description: 交易流水ID
- name: parent_split_cid
  display_name: 关联父订单ID
  type: VARCHAR(36)
  description: 关联父ID
- name: sub_split_cids
  display_name: 子订单ID列表
  type: TEXT
  description: 关联子订单ID list
  skip_index: true
- name: hedged_amount
  display_name: 已对冲金额
  type: DECIMAL(16,2)
  description: 已对冲金额
- name: create_time
  display_name: 创建时间
  type: DATETIME
- name: update_time
  display_name: 更新时间
  type: DATETIME
- name: settlement_time
  display_name: 结算截止时间
  type: DATETIME
  description: 结算截止时间
- name: complete_time
  display_name: 完成时间
  type: DATETIME
- name: review_status
  display_name: 审查状态
  type: TINYINT(1)
  description: 审查状态：1=passed, 0=in_review, -1=rejected
  enum_values:
  - value: 1
    label: 通过
  - value: 0
    label: 审核中
  - value: -1
    label: 拒绝
- name: conversion_status
  display_name: 汇兑状态
  type: TINYINT(1)
  description: 0=AWAITING_FUNDS, -1=CLOSED, 2=FUNDS_ARRIVED, 3=SENT_TO_CHANNEL, 1=TRADE_SETTLED
  enum_values:
  - value: 0
    label: AWAITING_FUNDS-等待入款
  - value: -1
    label: CLOSED-关闭
  - value: 2
    label: FUNDS_ARRIVED-资金已到
  - value: 3
    label: SENT_TO_CHANNEL-已提交渠道
  - value: 1
    label: TRADE_SETTLED-已成交
- name: conversion_flag
  display_name: 汇兑标记
  type: INT
  description: 1000=order hedging;2000=channel conversion;3000=other
  enum_values:
  - value: 1000
    label: order hedging
  - value: 2000
    label: channel conversion
  - value: 3000
    label: other
- name: hedge_status
  display_name: 对冲状态
  type: INT
  description: 对冲状态, 1:对冲完成 2:部分对冲 0:未对冲
  enum_values:
  - value: 0
    label: 未对冲
  - value: 1
    label: 对冲完成
  - value: 2
    label: 部分对冲
- name: credit_status
  display_name: 加款状态
  type: INT
  description: 加款状态 1:加款成功 -1:加款失败
  enum_values:
  - value: 0
    label: 未加款
  - value: 1
    label: 加款成功
  - value: -1
    label: 加款失败
- name: transfer_to_house_status
  display_name: 转入house状态
  type: INT
- name: transfer_to_client_status
  display_name: 转入client状态
  type: INT
  description: transfer status, 1:success, -1:failed, 2:processing. 用于内部消息判断使用
  enum_values:
  - value: 0
    label: 未处理
  - value: 1
    label: 成功
  - value: -1
    label: 失败
  - value: 2
    label: 处理中
- name: conversion_way
  display_name: 创建方式
  type: INT
  description: 0-默认(商户端创建) 1-接口创建 2-跨币种payout自动创建'
  enum_values:
  - value: 0
    label: 商户端创建
  - value: 1
    label: 接口创建
  - value: 2
    label: 跨币种payout自动创建
- name: channel_code
  display_name: 渠道编码
  type: VARCHAR(64)
  description: 渠道编码
- name: ref_reference_id
  display_name: 关联订单ID
  type: VARCHAR(36)
  description: 关联订单ID
- name: ref_short_reference_id
  display_name: 关联订单短ID
  type: VARCHAR(20)
  description: 关联订单短ID
- name: settle_mode
  display_name: 结算模式
  type: TINYINT
  description: 0=人工审核 1=自动审核
  enum_values:
  - value: 0
    label: 人工审核
  - value: 1
    label: 自动审核
relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
- column: quote_id
  target_table: pmt_conversion_quotes
  target_column: quote_id
  join_type: LEFT JOIN
- column: channel_code
  target_table: pmt_service_channel
  target_column: channel_code
  join_type: LEFT JOIN
- column: transaction_id
  target_table: pmt_finance_transactions
  target_column: transaction_id
  join_type: LEFT JOIN
common_queries:
- question: 月度汇兑成交额(按币种对)
  sql: "SELECT DATE_FORMAT(create_time, '%Y-%m') AS '月份',\n       currency_pair AS\
    \ '币种对',\n       COUNT(*) AS '笔数',\n       SUM(buy_amount) AS '买入总额',\n      \
    \ SUM(sell_amount) AS '卖出总额'\nFROM dwd_banking.`pmt_conversion`\nWHERE conversion_status\
    \ = 1\nGROUP BY DATE_FORMAT(create_time, '%Y-%m'), currency_pair\nORDER BY `月份`\
    \ DESC, `笔数` DESC\nLIMIT 100\n"
  tables:
  - pmt_conversion
  difficulty: medium
- question: 汇率收益统计(spread = client_rate - core_rate)
  sql: "SELECT currency_pair AS '币种对',\n       COUNT(*) AS '笔数',\n       AVG(client_rate\
    \ - core_rate) AS '平均加点',\n       SUM((client_rate - core_rate) * sell_amount)\
    \ AS '总加点收益'\nFROM dwd_banking.`pmt_conversion`\nWHERE conversion_status = 1\n\
    GROUP BY currency_pair\nORDER BY `总加点收益` DESC\nLIMIT 20\n"
  tables:
  - pmt_conversion
  difficulty: hard
- question: 对冲完成率
  sql: "SELECT\n  CASE hedge_status\n    WHEN 0 THEN '未对冲'\n    WHEN 1 THEN '对冲完成'\n\
    \    WHEN 2 THEN '部分对冲'\n  END AS '对冲状态',\n  COUNT(*) AS '数量'\nFROM dwd_banking.`pmt_conversion`\n\
    WHERE conversion_status = 1\nGROUP BY hedge_status\nLIMIT 100\n"
  tables:
  - pmt_conversion
  difficulty: medium
- question: 待对冲订单(已成交未对冲)
  sql: "SELECT short_reference_id AS '汇兑短号',\n       account_name AS '商户',\n     \
    \  currency_pair AS '币种对',\n       buy_amount AS '买入金额',\n       create_time AS\
    \ '创建时间'\nFROM dwd_banking.`pmt_conversion`\nWHERE conversion_status = 1\n  AND\
    \ hedge_status = 0\nLIMIT 100\n"
  tables:
  - pmt_conversion
  difficulty: easy
- question: 各渠道汇兑量和成交量
  sql: "SELECT channel_code AS '渠道',\n       COUNT(*) AS '总笔数',\n       SUM(CASE WHEN\
    \ conversion_status = 1 THEN 1 ELSE 0 END) AS '已成交',\n       ROUND(SUM(CASE WHEN\
    \ conversion_status = 1 THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 2) AS '成交率%'\n\
    FROM dwd_banking.`pmt_conversion`\nGROUP BY channel_code\nORDER BY `总笔数` DESC\n\
    LIMIT 100\n"
  tables:
  - pmt_conversion
  difficulty: medium
