table:
  name: uqpay_rfi
  database: dwd_banking
  display_name: UqPay RFI表
  description: '平台对客户主动发起的RFI(Request For Information)请求。

    每行代表一次RFI请求，覆盖onboarding和transaction场景。'
  tags:
  - RFI
  - 信息补充
  - request for information
  - onboarding
  - transaction
  - uqpay_rfi
  query_tips: ''
columns:
- name: rid
  display_name: 主键ID
  type: INT
  skip_index: true
- name: rfi_id
  display_name: RFI ID
  type: VARCHAR(36)
- name: account_id
  display_name: 账户ID
  type: VARCHAR(36)
  description: AccountId
- name: questions
  display_name: 问题数组JSON
  type: TEXT
  description: RFI问题（数组）
  skip_index: true
- name: answer
  display_name: 回答数组JSON
  type: TEXT
  description: RFI回答（数组）
  skip_index: true
- name: customer_id
  display_name: 客户ID
  type: VARCHAR(36)
  description: 客户ID
- name: create_time
  display_name: 创建时间
  type: DATETIME
  description: 创建时间
- name: update_time
  display_name: 更新时间
  type: DATETIME
  description: 更新时间
- name: rfi_status
  display_name: RFI状态
  type: VARCHAR(20)
  description: 状态：拒绝(REJECTED), 通过(APPROVED), 已提交(SUBMITTED_PENDING)，待处理(ACTION_REQUIRED)
  enum_values:
  - REJECTED
  - APPROVED
  - SUBMITTED_PENDING
  - ACTION_REQUIRED
- name: short_reference_id
  display_name: 短号
  type: VARCHAR(64)
  description: 短号
- name: rfi_type
  display_name: RFI类型
  type: VARCHAR(100)
  description: RFI类型：onboarding，transaction
  enum_values:
  - onboarding
  - transaction
- name: business_code
  display_name: 业务代码
  type: SMALLINT
  description: 1000=Banking，2000=Foreign，3000=Acquiring，4000=Issuing，5000=Ramp
  enum_values:
  - value: 1000
    label: Banking
  - value: 2000
    label: Foreign
  - value: 3000
    label: Acquiring
  - value: 4000
    label: Issuing
  - value: 5000
    label: Ramp
- name: ref_reference_id
  display_name: 关联长号
  type: VARCHAR(36)
  description: 关联长号
- name: ref_short_reference_id
  display_name: 关联短号
  type: VARCHAR(30)
  description: 关联短号
relations:
- column: account_id
  target_table: pmt_account
  target_column: account_id
  join_type: LEFT JOIN
common_queries:
- question: 待客户回复的RFI数
  sql: 'SELECT COUNT(*) AS ''待回复RFI数''

    FROM dwd_banking.`uqpay_rfi`

    WHERE rfi_status = ''ACTION_REQUIRED''

    LIMIT 100

    '
  tables:
  - uqpay_rfi
  difficulty: easy
- question: 各业务类型RFI分布
  sql: "SELECT\n  CASE business_code\n    WHEN 1000 THEN 'Banking'\n    WHEN 2000\
    \ THEN 'Foreign'\n    WHEN 3000 THEN 'Acquiring'\n    WHEN 4000 THEN 'Issuing'\n\
    \    WHEN 5000 THEN 'Ramp'\n  END AS '业务',\n  rfi_type AS '类型',\n  COUNT(*) AS\
    \ '数量'\nFROM dwd_banking.`uqpay_rfi`\nGROUP BY business_code, rfi_type\nORDER\
    \ BY business_code\nLIMIT 100\n"
  tables:
  - uqpay_rfi
  difficulty: medium
- question: RFI拒绝率
  sql: "SELECT\n  ROUND(SUM(CASE WHEN rfi_status = 'REJECTED' THEN 1 ELSE 0 END) *\
    \ 100.0 / COUNT(*), 2) AS '拒绝率%'\nFROM dwd_banking.`uqpay_rfi`\nWHERE rfi_status\
    \ IN ('APPROVED', 'REJECTED')\nLIMIT 100\n"
  tables:
  - uqpay_rfi
  difficulty: medium
- question: onboarding阶段RFI耗时
  sql: "SELECT AVG(TIMESTAMPDIFF(HOUR, create_time, update_time)) AS '平均耗时(小时)'\n\
    FROM dwd_banking.`uqpay_rfi`\nWHERE rfi_type = 'onboarding'\n  AND rfi_status\
    \ IN ('APPROVED', 'REJECTED')\n  AND update_time IS NOT NULL\nLIMIT 100\n"
  tables:
  - uqpay_rfi
  difficulty: medium
- question: 各状态RFI分布
  sql: "SELECT rfi_status AS '状态',\n       COUNT(*) AS '数量'\nFROM dwd_banking.`uqpay_rfi`\n\
    GROUP BY rfi_status\nLIMIT 100\n"
  tables:
  - uqpay_rfi
  difficulty: easy
