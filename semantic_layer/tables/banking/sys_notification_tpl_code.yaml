table:
  name: sys_notification_tpl_code
  database: dwd_banking
  display_name: 系统通知模版代码表
  description: '通知模版代码字典(模版编码-描述)，配合模版模式分组。

    每行代表一个 (tpl_code, tpl_mode) 模版代码定义。'
  tags:
  - 模版代码
  - 字典
  - notification tpl code
  - sys_notification_tpl_code
  query_tips: ''
columns:
- name: tid
  display_name: 主键ID
  type: INT
  skip_index: true
- name: tpl_mode
  display_name: 通知模板方式
  type: VARCHAR(100)
  description: 通知模板方式：service=服务，market=营销，opt=OTP
  enum_values:
  - service
  - market
  - otp
- name: tpl_code
  display_name: 通知模板代码
  type: VARCHAR(60)
  description: 通知模板代码
- name: tpl_remark
  display_name: 代码备注
  type: VARCHAR(255)
  description: 代码备注
- name: created_at
  display_name: 创建时间
  type: DATETIME
  description: 创建时间
- name: updated_at
  display_name: 更新时间
  type: DATETIME
  description: 更新时间
relations:
- column: tpl_code
  target_table: sys_notification_template
  target_column: tpl_code
  join_type: LEFT JOIN
common_queries:
- question: 各模式下的模版代码
  sql: "SELECT tpl_mode AS '模式',\n       tpl_code AS '代码',\n       tpl_remark AS '备注'\n\
    FROM dwd_banking.`sys_notification_tpl_code`\nORDER BY tpl_mode, tpl_code\nLIMIT\
    \ 100\n"
  tables:
  - sys_notification_tpl_code
  difficulty: easy
- question: 各模式代码数
  sql: "SELECT tpl_mode AS '模式',\n       COUNT(*) AS '代码数'\nFROM dwd_banking.`sys_notification_tpl_code`\n\
    GROUP BY tpl_mode\nLIMIT 100\n"
  tables:
  - sys_notification_tpl_code
  difficulty: easy
