table:
  name: sys_country_holiday
  database: dwd_banking
  display_name: 国家公共节假日表
  description: '各国节假日数据，区分银行假日和交易假日，影响资金结算和金融市场操作。

    每行代表一个国家某天的假日。'
  tags:
  - 节假日
  - 银行日
  - 结算日历
  - holiday
  - sys_country_holiday
  query_tips: ''
columns:
- name: id
  display_name: 主键ID
  type: BIGINT
  skip_index: true
- name: country_code
  display_name: 国家代码
  type: VARCHAR(3)
  description: 国家地区编码
- name: currency_code
  display_name: 币种代码
  type: VARCHAR(3)
  description: ISO 4217币种代码
- name: holiday_year
  display_name: 假日年份
  type: INT
- name: holiday_date
  display_name: 假日日期
  type: DATE
  description: 假日日期
- name: holiday_name
  display_name: 假日名
  type: VARCHAR(100)
  description: 假日名
- name: holiday_type
  display_name: 假日类型
  type: TINYINT(1)
  description: 类型(1=固定，2=农历，3=调休，4=宗教，5=政治)
  enum_values:
  - value: 1
    label: 固定
  - value: 2
    label: 农历
  - value: 3
    label: 调休
  - value: 4
    label: 宗教
  - value: 5
    label: 政治
- name: is_official
  display_name: 是否官方
  type: TINYINT(1)
  description: 是否官方假日
  enum_values:
  - value: 0
    label: 否
  - value: 1
    label: 是
- name: description
  display_name: 描述
  type: VARCHAR(255)
  description: 描述
- name: is_banking_holiday
  display_name: 是否银行假日
  type: TINYINT(1)
  description: 是否银行假日(影响资金结算)
  enum_values:
  - value: 0
    label: 否
  - value: 1
    label: 是
- name: is_trading_holiday
  display_name: 是否交易假日
  type: TINYINT(1)
  description: 是否交易假日(影响金融市场)
  enum_values:
  - value: 0
    label: 否
  - value: 1
    label: 是
- name: create_time
  display_name: 创建时间
  type: DATETIME
- name: update_time
  display_name: 更新时间
  type: DATETIME
- name: creator_id
  display_name: 创建者ID
  type: VARCHAR(36)
  description: 创建者ID
- name: creator_name
  display_name: 创建者名
  type: VARCHAR(240)
  description: 创建者名
common_queries:
- question: 某国2026年银行假日
  sql: "SELECT holiday_date AS '日期',\n       holiday_name AS '假日名',\n       description\
    \ AS '描述'\nFROM dwd_banking.`sys_country_holiday`\nWHERE country_code = ?\n  AND\
    \ holiday_year = 2026\n  AND is_banking_holiday = 1\nORDER BY holiday_date\nLIMIT\
    \ 100\n"
  tables:
  - sys_country_holiday
  difficulty: easy
- question: 影响结算的假日(本月)
  sql: "SELECT country_code AS '国家',\n       currency_code AS '币种',\n       holiday_date\
    \ AS '日期',\n       holiday_name AS '假日名'\nFROM dwd_banking.`sys_country_holiday`\n\
    WHERE is_banking_holiday = 1\n  AND holiday_date BETWEEN DATE_FORMAT(NOW(), '%Y-%m-01')\
    \ AND LAST_DAY(NOW())\nORDER BY holiday_date\nLIMIT 100\n"
  tables:
  - sys_country_holiday
  difficulty: medium
- question: 各类型假日数量
  sql: "SELECT\n  CASE holiday_type\n    WHEN 1 THEN '固定'\n    WHEN 2 THEN '农历'\n\
    \    WHEN 3 THEN '调休'\n    WHEN 4 THEN '宗教'\n    WHEN 5 THEN '政治'\n  END AS '类型',\n\
    \  COUNT(*) AS '数量'\nFROM dwd_banking.`sys_country_holiday`\nWHERE holiday_year\
    \ = 2026\nGROUP BY holiday_type\nLIMIT 100\n"
  tables:
  - sys_country_holiday
  difficulty: medium
