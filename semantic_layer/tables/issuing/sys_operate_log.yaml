table:
  name: "sys_operate_log"
  database: "dwd_banking"
  display_name: "系统操作日志"
  description: |
    这张表记录系统侧的系统操作日志。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "操作", "日志", "sys_operate_log"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "log_id"
    type: "varchar(36)"
    display_name: "操作日志Id"
    description: "操作日志Id"

  - name: "type"
    type: "varchar(60)"
    display_name: "动作类型"
    description: "动作类型：INSERT=创建，UPDATE=更新，DELETE=删除"

  - name: "params"
    type: "text"
    display_name: "请求参数"
    description: "请求参数"
    skip_index: true

  - name: "original_data"
    type: "text"
    display_name: "变更前数据"
    description: "变更前数据"
    skip_index: true

  - name: "events"
    type: "text"
    display_name: "事件结果"
    description: "事件结果"
    skip_index: true

  - name: "user_agent"
    type: "text"
    display_name: "浏览器agent"
    description: "浏览器agent"
    skip_index: true

  - name: "reference_type"
    type: "int"
    display_name: "实体类型 2=KYB/KYC类，1000=商户类"
    description: "实体类型 2=KYB/KYC类，1000=商户类，2000=财务类，9000=配置类"
    enum_values:
      - {value: 2, label: "KYB/KYC类"}
      - {value: 1000, label: "商户类"}
      - {value: 2000, label: "财务类"}
      - {value: 9000, label: "配置类"}

  - name: "operate_type"
    type: "tinyint"
    display_name: "操作类型"
    description: "操作类型"

  - name: "reference_id"
    type: "varchar(50)"
    display_name: "关联id"
    description: "关联id"

  - name: "reference_data"
    type: "text"
    display_name: "关联数据json"
    description: "关联数据json"
    skip_index: true

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "创建人id"
    description: "创建人id"

  - name: "create_time"
    type: "datetime(3)"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime(3)"
    display_name: "更新时间"
    description: "更新时间"

  - name: "operate_status"
    type: "varchar(10)"
    display_name: "操作状态"
    description: "操作状态：FAILED=失败，COMPLETE=完成"

  - name: "operate_desc"
    type: "text"
    display_name: "【废弃】操作动作描述"
    description: "【废弃】操作动作描述"
    skip_index: true

relations: []

common_queries:
  - question: "系统操作日志有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_operate_log`;
    tables: ["sys_operate_log"]
    difficulty: "easy"
  - question: "最近30天系统操作日志每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_operate_log`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["sys_operate_log"]
    difficulty: "easy"
  - question: "系统操作日志按状态分布"
    sql: |
      SELECT
          operate_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`sys_operate_log`
      GROUP BY operate_status
      ORDER BY COUNT(*) DESC;
    tables: ["sys_operate_log"]
    difficulty: "easy"

