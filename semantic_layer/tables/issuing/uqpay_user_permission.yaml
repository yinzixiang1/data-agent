table:
  name: "uqpay_user_permission"
  database: "dwd_banking"
  display_name: "用户权限表"
  description: |
    这张表记录用户权限相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uqpay", "用户", "权限", "uqpay_user_permission"]
  query_tips: "时间范围优先使用 update_time 字段。"

columns:
  - name: "user_id"
    type: "varchar(36)"
    display_name: "用户id"
    description: "用户权限表字段 user_id。"

  - name: "role_id"
    type: "varchar(36)"
    display_name: "角色ID"
    description: "角色ID"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "用户权限表字段 update_time。"

  - name: "permission_status"
    type: "tinyint(1)"
    display_name: "权限status"
    description: "用户权限表字段 permission_status。"

relations: []

common_queries:
  - question: "用户权限表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_user_permission`;
    tables: ["uqpay_user_permission"]
    difficulty: "easy"
  - question: "最近30天用户权限表每天新增多少"
    sql: |
      SELECT DATE(update_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_user_permission`
      WHERE update_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(update_time)
      ORDER BY DATE(update_time) DESC;
    tables: ["uqpay_user_permission"]
    difficulty: "easy"
  - question: "用户权限表按状态分布"
    sql: |
      SELECT
          permission_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uqpay_user_permission`
      GROUP BY permission_status
      ORDER BY COUNT(*) DESC;
    tables: ["uqpay_user_permission"]
    difficulty: "easy"
  - question: "用户权限表按user_id分布最多的是哪些"
    sql: |
      SELECT user_id AS "user_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_user_permission`
      WHERE user_id IS NOT NULL AND user_id != ''
      GROUP BY user_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uqpay_user_permission"]
    difficulty: "easy"

