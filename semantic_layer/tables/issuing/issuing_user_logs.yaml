relations: []

common_queries:
  - question: "发卡用户日志有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_user_logs`;
    tables: ["issuing_user_logs"]
    difficulty: "easy"
  - question: "最近30天发卡用户日志每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_user_logs`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_user_logs"]
    difficulty: "easy"
  - question: "发卡用户日志按状态分布"
    sql: |
      SELECT
          operate_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_user_logs`
      GROUP BY operate_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_user_logs"]
    difficulty: "easy"
  - question: "发卡用户日志按user_id分布最多的是哪些"
    sql: |
      SELECT user_id AS "user_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_user_logs`
      WHERE user_id IS NOT NULL AND user_id != ''
      GROUP BY user_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_user_logs"]
    difficulty: "easy"

