table:
  name: "banking_transaction_stats"
  database: "dwd_banking"
  display_name: "收付款交易统计表"
  description: |
    这张表记录支付/银行账户业务中的收付款交易统计。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["交易", "银行账户", "统计", "banking_transaction_stats"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "stats_type"
    type: "varchar(50)"
    display_name: "统计type"
    description: "收付款交易统计表字段 stats_type。"

  - name: "target_type"
    type: "varchar(20)"
    display_name: "对象 ACCOUNT"
    description: "对象 ACCOUNT "

  - name: "currency"
    type: "varchar(10)"
    display_name: "币种"
    description: "收付款交易统计表字段 currency。"

  - name: "total_amount"
    type: "decimal(18,2)"
    display_name: "当前统计总金额"
    description: "当前统计总金额"

  - name: "total_amount_history"
    type: "decimal(18,2)"
    display_name: "历史统计总金额"
    description: "历史统计总金额"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "收付款交易统计表字段 create_time。"

relations: []

common_queries:
  - question: "收付款交易统计表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`banking_transaction_stats`;
    tables: ["banking_transaction_stats"]
    difficulty: "easy"
  - question: "最近30天收付款交易统计表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`banking_transaction_stats`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["banking_transaction_stats"]
    difficulty: "easy"
  - question: "收付款交易统计表按币种汇总金额"
    sql: |
      SELECT currency AS "币种", COUNT(*) AS "笔数", SUM(total_amount) AS "金额"
      FROM dwd_banking.`banking_transaction_stats`
      GROUP BY currency
      ORDER BY SUM(total_amount) DESC;
    tables: ["banking_transaction_stats"]
    difficulty: "medium"

