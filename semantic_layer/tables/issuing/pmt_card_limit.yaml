table:
  name: "pmt_card_limit"
  database: "dwd_banking"
  display_name: "卡额度/余额表"
  description: |
    这张表记录支付/银行账户业务中的卡额度/余额。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "卡片", "额度", "pmt_card_limit"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "卡额度/余额表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "卡额度/余额表字段 account_id。"

  - name: "card_id"
    type: "varchar(36)"
    display_name: "卡片ID"
    description: "卡额度/余额表字段 card_id。"

  - name: "card_limit_id"
    type: "varchar(36)"
    display_name: "卡片额度id"
    description: "卡额度/余额表字段 card_limit_id。"

  - name: "card_limit_type"
    type: "smallint"
    display_name: "限额类型"
    description: "限额类型：1000=banking限额模式，card_limit 默认值0，完全依赖spend control来控制卡，2000=SAAS限额模式"
    enum_values:
      - {value: 1000, label: "banking限额模式,card_limit 默认值0,完全依赖spend control来控制卡"}
      - {value: 2000, label: "SAAS限额模式"}

  - name: "total_refund_amount"
    type: "decimal(16,4)"
    display_name: "在一定时间内，退还给卡持有者的总金额"
    description: "在一定时间内，退还给卡持有者的总金额"

  - name: "total_posted_amount"
    type: "decimal(16,4)"
    display_name: "已经完成并入账的交易总金额"
    description: "已经完成并入账的交易总金额"

  - name: "total_unsettled_amount"
    type: "decimal(16,4)"
    display_name: "已经发生但尚未完成结算的交易金额"
    description: "已经发生但尚未完成结算的交易金额"

  - name: "total_settlement_amount"
    type: "decimal(16,4)"
    display_name: "考虑退款后，实际结算的交易金额"
    description: "考虑退款后，实际结算的交易金额"

  - name: "total_transaction_amount"
    type: "decimal(16,4)"
    display_name: "在一定时间内，通过卡进行的所有交易的总金额"
    description: "在一定时间内，通过卡进行的所有交易的总金额"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "settle_amount"
    type: "decimal(16,4)"
    display_name: "废弃"
    description: "废弃"

  - name: "refund_amount"
    type: "decimal(16,4)"
    display_name: "废弃"
    description: "废弃"

relations: []

common_queries:
  - question: "卡额度/余额表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_card_limit`;
    tables: ["pmt_card_limit"]
    difficulty: "easy"
  - question: "最近30天卡额度/余额表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_card_limit`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_card_limit"]
    difficulty: "easy"
  - question: "卡额度/余额表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_card_limit`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_card_limit"]
    difficulty: "easy"

