table:
  name: "tmp_sunrate_legacy_kyc"
  database: "dwd_banking"
  display_name: "SUNRATE legacy KYC import temp table表"
  description: |
    这张表是 SUNRATE legacy KYC import temp table 的备份、历史、临时或迁移留存数据表。
    每行代表源表在特定历史时点或迁移批次中的一条记录。
    除非问题明确要求查历史备份数据，NL2SQL 应优先选择对应的正式业务表。
  tags: ["临时", "sunrate", "legacy", "kyc", "tmp_sunrate_legacy_kyc"]
  query_tips: "该表名体现备份、历史、临时或 copy 用途，默认不作为用户查询首选主表。"

columns:
  - name: "id"
    type: "bigint unsigned"
    display_name: "主键ID"
    description: "SUNRATE legacy KYC import temp table表字段 id。"

  - name: "card_token"
    type: "varchar(64)"
    display_name: "maps to issuing_card.car"
    description: "maps to issuing_card.card_id"
    sensitive: true

  - name: "id_number"
    type: "varchar(128)"
    display_name: "identification number fr"
    description: "identification number from excel"
    sensitive: true

  - name: "address"
    type: "varchar(512)"
    display_name: "raw address from excel"
    description: "raw address from excel, not used in current flow"
    sensitive: true
    skip_index: true

  - name: "status"
    type: "tinyint"
    display_name: "状态"
    description: "0 = not triggered, 1 = triggered"
    enum_values:
      - {value: 0, label: "not triggered"}
      - {value: 1, label: "triggered"}

relations: []

common_queries:
  - question: "SUNRATE legacy KYC import temp table表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`tmp_sunrate_legacy_kyc`;
    tables: ["tmp_sunrate_legacy_kyc"]
    difficulty: "easy"
  - question: "SUNRATE legacy KYC import temp table表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN 0 THEN 'not triggered'
            WHEN 1 THEN 'triggered'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`tmp_sunrate_legacy_kyc`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["tmp_sunrate_legacy_kyc"]
    difficulty: "medium"
  - question: "SUNRATE legacy KYC import temp table表按主键倒序查看最新记录"
    sql: |
      SELECT *
      FROM dwd_banking.`tmp_sunrate_legacy_kyc`
      ORDER BY id DESC
      LIMIT 100;
    tables: ["tmp_sunrate_legacy_kyc"]
    difficulty: "easy"

