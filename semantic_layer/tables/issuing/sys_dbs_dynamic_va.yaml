table:
  name: "sys_dbs_dynamic_va"
  database: "dwd_banking"
  display_name: "动态VA预备号表"
  description: |
    这张表记录系统侧的动态VA预备号。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "dbs", "dynamic", "虚拟账户", "sys_dbs_dynamic_va"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "id"
    type: "int"
    display_name: "主键ID"
    description: "动态VA预备号表字段 id。"

  - name: "dbs_id"
    type: "varchar(20)"
    display_name: "dbsid"
    description: "动态VA预备号表字段 dbs_id。"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "动态VA预备号表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "动态VA预备号表字段 account_id。"

  - name: "short_account_id"
    type: "varchar(36)"
    display_name: "账户短号"
    description: "动态VA预备号表字段 short_account_id。"

  - name: "used"
    type: "tinyint"
    display_name: "1"
    description: "1:已使用"
    enum_values:
      - {value: 1, label: "已使用"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "动态VA预备号表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "动态VA预备号表字段 update_time。"

relations: []

common_queries:
  - question: "动态VA预备号表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_dbs_dynamic_va`;
    tables: ["sys_dbs_dynamic_va"]
    difficulty: "easy"
  - question: "最近30天动态VA预备号表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_dbs_dynamic_va`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["sys_dbs_dynamic_va"]
    difficulty: "easy"
  - question: "动态VA预备号表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_dbs_dynamic_va`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["sys_dbs_dynamic_va"]
    difficulty: "easy"

