table:
  name: "uq_user"
  database: "dwd_banking"
  display_name: "客户-用户表"
  description: |
    这张表记录客户-用户相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uq", "用户", "uq_user"]
  query_tips: "时间范围优先使用 register_time 字段。"

columns:
  - name: "user_id"
    type: "varchar(36)"
    display_name: "用户id"
    description: "客户-用户表字段 user_id。"

  - name: "master_id"
    type: "varchar(36)"
    display_name: "上级ID"
    description: "上级ID"

  - name: "customer_id"
    type: "varchar(36)"
    display_name: "关联customer_id"
    description: "关联customer_id"

  - name: "first_name"
    type: "varchar(60)"
    display_name: "firstname"
    description: "客户-用户表字段 first_name。"
    sensitive: true

  - name: "last_name"
    type: "varchar(60)"
    display_name: "lastname"
    description: "客户-用户表字段 last_name。"
    sensitive: true

  - name: "email"
    type: "varchar(120)"
    display_name: "邮箱"
    description: "客户-用户表字段 email。"
    sensitive: true

  - name: "password"
    type: "varchar(32)"
    display_name: "password"
    description: "客户-用户表字段 password。"
    sensitive: true

  - name: "role_id"
    type: "varchar(36)"
    display_name: "角色ID"
    description: "角色ID"

  - name: "date_of_birth"
    type: "date"
    display_name: "dateofbirth"
    description: "客户-用户表字段 date_of_birth。"
    sensitive: true

  - name: "security"
    type: "varchar(200)"
    display_name: "安全设置 {\"2fa_type\""
    description: "安全设置 {\"2fa_type\":\"authenticator\", \"2fa_secret\":\"12345678\", \"2fa_status\":0}"
    sensitive: true

  - name: "is_owner"
    type: "tinyint(1)"
    display_name: "0-no"
    description: "0-no, 1=yes"
    enum_values:
      - {value: 0, label: "no"}
      - {value: 1, label: "yes"}

  - name: "short_customer_id"
    type: "varchar(20)"
    display_name: "short客户id"
    description: "客户-用户表字段 short_customer_id。"

  - name: "ref_cc_contact_id"
    type: "varchar(36)"
    display_name: "关联CC的操作员id"
    description: "关联CC的操作员id"

  - name: "execute_reason"
    type: "text"
    display_name: "对应失败原因"
    description: "对应失败原因"
    skip_index: true

  - name: "status"
    type: "tinyint(1)"
    display_name: "状态"
    description: "-1=冻结 0=未验证 1=正常&已验证"
    enum_values:
      - {value: -1, label: "冻结"}
      - {value: 0, label: "未验证"}
      - {value: 1, label: "正常&已验证"}

relations: []

common_queries:
  - question: "客户-用户表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_user`;
    tables: ["uq_user"]
    difficulty: "easy"
  - question: "最近30天客户-用户表每天新增多少"
    sql: |
      SELECT DATE(register_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_user`
      WHERE register_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(register_time)
      ORDER BY DATE(register_time) DESC;
    tables: ["uq_user"]
    difficulty: "easy"
  - question: "客户-用户表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN -1 THEN '冻结'
            WHEN 0 THEN '未验证'
            WHEN 1 THEN '正常&已验证'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uq_user`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["uq_user"]
    difficulty: "medium"
  - question: "客户-用户表按user_id分布最多的是哪些"
    sql: |
      SELECT user_id AS "user_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_user`
      WHERE user_id IS NOT NULL AND user_id != ''
      GROUP BY user_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uq_user"]
    difficulty: "easy"

