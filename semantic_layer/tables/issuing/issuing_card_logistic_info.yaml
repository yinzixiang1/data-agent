table:
  name: "issuing_card_logistic_info"
  database: "dwd_banking"
  display_name: "物理卡物流信息表"
  description: |
    这张表记录 UQPAY 发卡业务中的物理卡物流信息。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "卡片", "物流", "信息", "issuing_card_logistic_info"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "card_id"
    type: "varchar(36)"
    display_name: "卡片ID"
    description: "card_id"

  - name: "card_holder_id"
    type: "varchar(36)"
    display_name: "持卡人ID"
    description: "持卡人ID"

  - name: "delivery_address"
    type: "text"
    display_name: "用于物理卡收货地址"
    description: "用于物理卡收货地址"
    sensitive: true
    skip_index: true

  - name: "delivery_status"
    type: "int"
    display_name: "发货状态 1 pending 2 Complet"
    description: "发货状态 1 pending 2 Completed"

  - name: "operator_id"
    type: "varchar(36)"
    display_name: "操作人id"
    description: "操作人id"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "物理卡物流信息表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "物理卡物流信息表字段 update_time。"

relations: []

common_queries:
  - question: "物理卡物流信息表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_logistic_info`;
    tables: ["issuing_card_logistic_info"]
    difficulty: "easy"
  - question: "最近30天物理卡物流信息表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_logistic_info`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_card_logistic_info"]
    difficulty: "easy"
  - question: "物理卡物流信息表按状态分布"
    sql: |
      SELECT
          delivery_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_card_logistic_info`
      GROUP BY delivery_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_card_logistic_info"]
    difficulty: "easy"
  - question: "物理卡物流信息表按card_id分布最多的是哪些"
    sql: |
      SELECT card_id AS "card_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_logistic_info`
      WHERE card_id IS NOT NULL AND card_id != ''
      GROUP BY card_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_card_logistic_info"]
    difficulty: "easy"

