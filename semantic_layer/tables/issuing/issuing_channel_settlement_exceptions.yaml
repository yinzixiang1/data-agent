table:
  name: "issuing_channel_settlement_exceptions"
  database: "dwd_banking"
  display_name: "结算异常表"
  description: |
    这张表记录 UQPAY 发卡业务中的结算异常。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "渠道", "清算", "异常", "issuing_channel_settlement_exceptions"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "id"
    type: "bigint"
    display_name: "主键ID"
    description: "自增主键，记录ID"

  - name: "exception_id"
    type: "varchar(128)"
    display_name: "UUID"
    description: "UUID"

  - name: "settlement_id"
    type: "bigint"
    display_name: "结算文件id"
    description: "结算文件id"

  - name: "uq_transaction_id"
    type: "varchar(128)"
    display_name: "系统内交易id"
    description: "系统内交易id"

  - name: "exception_type"
    type: "varchar(128)"
    display_name: "异常类型"
    description: "异常类型"

  - name: "resolved_status"
    type: "tinyint"
    display_name: "解决状态 0-System processing"
    description: "解决状态 0-System processing, 1-Manual, 2-Processing, 3-Completed"
    enum_values:
      - {value: 0, label: "System processing"}
      - {value: 1, label: "Manual"}
      - {value: 2, label: "Processing"}
      - {value: 3, label: "Completed"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

relations:
  - column: "uq_transaction_id"
    target_table: "issuing_card_transactions"
    target_column: "transaction_id"
    join_type: "LEFT JOIN"
    description: "渠道清算异常按 UQ 交易号关联卡交易，来源 uqpay-task/internal/repository/store/issuing_channel_settlement_exceptions.go"

common_queries:
  - question: "结算异常表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_settlement_exceptions`;
    tables: ["issuing_channel_settlement_exceptions"]
    difficulty: "easy"
  - question: "最近30天结算异常表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_settlement_exceptions`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_channel_settlement_exceptions"]
    difficulty: "easy"
  - question: "结算异常表按状态分布"
    sql: |
      SELECT
          CASE resolved_status
            WHEN 0 THEN 'System processing'
            WHEN 1 THEN 'Manual'
            WHEN 2 THEN 'Processing'
            WHEN 3 THEN 'Completed'
            ELSE CONCAT('其他:', CAST(resolved_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_channel_settlement_exceptions`
      GROUP BY resolved_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_channel_settlement_exceptions"]
    difficulty: "medium"

review_required:
  - "通用问题由字段结构自动生成，建议数仓补充真实高频问法和标准 SQL。"

