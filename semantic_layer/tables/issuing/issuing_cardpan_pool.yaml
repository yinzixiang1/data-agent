table:
  name: "issuing_cardpan_pool"
  database: "dwd_banking"
  display_name: "客户卡池【可优化】表"
  description: |
    这张表记录 UQPAY 发卡业务中的客户卡池【可优化】。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "卡片", "cardpan", "池", "issuing_cardpan_pool"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "客户卡池【可优化】表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "客户卡池【可优化】表字段 account_id。"

  - name: "card_type"
    type: "smallint"
    display_name: "卡类型"
    description: "Card type - 1000=PREPAID 2000=DEBIT"
    enum_values:
      - {value: 1000, label: "PREPAID"}
      - {value: 2000, label: "DEBIT"}

  - name: "physical_card_type"
    type: "smallint"
    display_name: "Physical card type - 100"
    description: "Physical card type - 1000=regular 2000=co-brand"
    enum_values:
      - {value: 1000, label: "regular"}
      - {value: 2000, label: "co-brand"}

  - name: "form_factor"
    type: "int"
    display_name: "卡介质类型"
    description: "1000=VIRTUAL, 2000=PHYSICAL 3000=BOTH"
    enum_values:
      - {value: 1000, label: "VIRTUAL"}
      - {value: 2000, label: "PHYSICAL"}
      - {value: 3000, label: "BOTH"}

  - name: "card_scheme"
    type: "smallint"
    display_name: "卡组织"
    description: "卡品牌 1000=VISA  2000=MASTER"
    enum_values:
      - {value: 1000, label: "VISA"}
      - {value: 2000, label: "MASTER"}

  - name: "card_number"
    type: "varchar(36)"
    display_name: "卡号"
    description: "客户卡池【可优化】表字段 card_number。"
    sensitive: true

  - name: "pan_encrypted"
    type: "varchar(128)"
    display_name: "加密PAN"
    description: "加密的PAN number"
    sensitive: true

  - name: "pan_hash"
    type: "varchar(64)"
    display_name: "PAN哈希"
    description: "PAN sha256 hash值"
    sensitive: true

  - name: "mask_card_number"
    type: "varchar(36)"
    display_name: "脱敏卡号"
    description: "脱敏后的card number"
    sensitive: true

  - name: "card_cvv2"
    type: "varchar(6)"
    display_name: "卡CVV2"
    description: "卡失效时间"
    sensitive: true

  - name: "card_expire_date"
    type: "varchar(8)"
    display_name: "卡有效期"
    description: "MM/YY format"
    sensitive: true

  - name: "card_expire_date_encrypted"
    type: "varchar(128)"
    display_name: "加密卡有效期"
    description: "加密的卡面有效期"
    sensitive: true

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "客户卡池【可优化】表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "客户卡池【可优化】表字段 update_time。"

  - name: "card_status"
    type: "tinyint"
    display_name: "卡状态"
    description: "0=未使用，1=已使用"
    enum_values:
      - {value: 0, label: "PENDING/待开通"}
      - {value: 1, label: "ACTIVE/正常"}
      - {value: -1, label: "FROZEN/冻结"}
      - {value: -2, label: "BLOCKED/阻断"}
      - {value: -3, label: "LOST/丢失"}
      - {value: -4, label: "STOLEN/被盗"}
      - {value: -5, label: "CANCELLED/已注销"}
      - {value: -6, label: "PRE_CANCEL/预注销"}
      - {value: -9, label: "FAILED/失败"}

  - name: "batch_id"
    type: "varchar(36)"
    display_name: "批次号"
    description: "批次号"

  - name: "task_id"
    type: "varchar(36)"
    display_name: "任务号"
    description: "任务号"

relations: []

common_queries:
  - question: "客户卡池【可优化】表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_cardpan_pool`;
    tables: ["issuing_cardpan_pool"]
    difficulty: "easy"
  - question: "最近30天客户卡池【可优化】表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_cardpan_pool`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_cardpan_pool"]
    difficulty: "easy"
  - question: "客户卡池【可优化】表按状态分布"
    sql: |
      SELECT
          CASE card_status
            WHEN 0 THEN 'PENDING/待开通'
            WHEN 1 THEN 'ACTIVE/正常'
            WHEN -1 THEN 'FROZEN/冻结'
            WHEN -2 THEN 'BLOCKED/阻断'
            WHEN -3 THEN 'LOST/丢失'
            WHEN -4 THEN 'STOLEN/被盗'
            WHEN -5 THEN 'CANCELLED/已注销'
            WHEN -6 THEN 'PRE_CANCEL/预注销'
            WHEN -9 THEN 'FAILED/失败'
            ELSE CONCAT('其他:', CAST(card_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_cardpan_pool`
      GROUP BY card_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_cardpan_pool"]
    difficulty: "medium"
  - question: "客户卡池【可优化】表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_cardpan_pool`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_cardpan_pool"]
    difficulty: "easy"

