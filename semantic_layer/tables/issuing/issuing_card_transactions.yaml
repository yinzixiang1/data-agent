table:
  name: "issuing_card_transactions"
  database: "dwd_banking"
  display_name: "发卡卡片交易表"
  description: |
    这张表记录 UQPAY 发卡业务中的发卡卡片交易。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "卡片", "交易", "issuing_card_transactions"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "card_id"
    type: "varchar(36)"
    display_name: "卡片ID"
    description: "发卡卡片交易表字段 card_id。"

  - name: "direct_id"
    type: "varchar(255)"
    display_name: "直属账户ID"
    description: "2.0待删除"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "发卡卡片交易表字段 account_id。"

  - name: "parent_account_id"
    type: "varchar(36)"
    display_name: "父级ACID"
    description: "父级ACID"

  - name: "card_holder_id"
    type: "varchar(36)"
    display_name: "持卡人ID"
    description: "发卡卡片交易表字段 card_holder_id。"

  - name: "transaction_id"
    type: "varchar(36)"
    display_name: "系统内TXID"
    description: "系统内TXID"

  - name: "main_transaction_type"
    type: "int"
    display_name: "主交易类型"
    description: "主交易类型 参考LARK编码表"

  - name: "transaction_type"
    type: "int"
    display_name: "交易类型"
    description: "子交易类型,参考LARK编码表"

  - name: "sub_transaction_type"
    type: "int"
    display_name: "子交易类型"
    description: "子交易类型"

  - name: "card_number"
    type: "varchar(36)"
    display_name: "卡号"
    description: "蒙遮卡号 4001-35xx-xxxx-1950"
    sensitive: true

  - name: "pan_hash"
    type: "varchar(64)"
    display_name: "PAN哈希"
    description: "PAN sha256 hash值"
    sensitive: true

  - name: "mask_card_number"
    type: "varchar(36)"
    display_name: "脱敏卡号"
    description: "脱敏后的card number"
    sensitive: true

  - name: "billing_amount"
    type: "decimal(16,4)"
    display_name: "账单交易金额"
    description: "账单交易金额	"

  - name: "billing_currency"
    type: "varchar(4)"
    display_name: "账单交易币种"
    description: "账单交易币种	"

  - name: "transaction_amount"
    type: "decimal(16,4)"
    display_name: "交易金额"
    description: "交易金额"

  - name: "transaction_currency"
    type: "varchar(4)"
    display_name: "交易币种"
    description: "交易币种"

  - name: "cumulative_amount"
    type: "decimal(16,2)"
    display_name: "累计批准的总金额，适用于增量授权"
    description: "累计批准的总金额，适用于增量授权"

  - name: "txn_basic_currency"
    type: "varchar(6)"
    display_name: "txnbasic币种"
    description: "发卡卡片交易表字段 txn_basic_currency。"

  - name: "txn_markup_currency"
    type: "varchar(4)"
    display_name: "2.0待删除"
    description: "2.0待删除"

  - name: "balance_transaction_id"
    type: "varchar(255)"
    display_name: "2.0待删除"
    description: "2.0待删除"

  - name: "merchant_id"
    type: "varchar(255)"
    display_name: "merchantid"
    description: "发卡卡片交易表字段 merchant_id。"

  - name: "network_transaction_id"
    type: "varchar(64)"
    display_name: "卡组交易id"
    description: "卡组交易id"

  - name: "channel_billing_amount"
    type: "decimal(15,4)"
    display_name: "渠道billingamount"
    description: "发卡卡片交易表字段 channel_billing_amount。"

  - name: "channel_billing_currency"
    type: "varchar(4)"
    display_name: "渠道billing币种"
    description: "发卡卡片交易表字段 channel_billing_currency。"

  - name: "channel_resp_body"
    type: "text"
    display_name: "2.0待删除"
    description: "2.0待删除"
    skip_index: true

  - name: "channel_transaction_id"
    type: "varchar(255)"
    display_name: "2.0待删除"
    description: "2.0待删除"

  - name: "create_time"
    type: "datetime(3)"
    display_name: "创建时间"
    description: "发卡卡片交易表字段 create_time。"

  - name: "related_transaction_id"
    type: "varchar(48)"
    display_name: "待验证删除 关联交易id"
    description: "待验证删除 关联交易id,用于冲正 退款原始交易关联"

  - name: "posted_status"
    type: "smallint"
    display_name: "交易是否已经入账 -1=失败，1=成功"
    description: "交易是否已经入账 -1=失败，1=成功"
    enum_values:
      - {value: -1, label: "失败"}
      - {value: 1, label: "成功"}

  - name: "settlement_status"
    type: "tinyint"
    display_name: "结算状态 0=UNSETTLED，1=SETTL"
    description: "结算状态 0=UNSETTLED，1=SETTLED, 2=RELEASED"
    enum_values:
      - {value: 0, label: "UNSETTLED"}
      - {value: 1, label: "SETTLED"}
      - {value: 2, label: "RELEASED"}

  - name: "short_account_id"
    type: "varchar(20)"
    display_name: "账户短号"
    description: "account短号"

  - name: "short_reference_id"
    type: "varchar(36)"
    display_name: "系统短号ID"
    description: "系统短号ID"

  - name: "reversal_status"
    type: "tinyint"
    display_name: "冲正状态"
    description: "冲正状态, 默认状态0, 1: 已冲正"
    enum_values:
      - {value: 1, label: "已冲正"}

  - name: "reconciliation_status"
    type: "tinyint"
    display_name: "对账状态"
    description: "对账状态, 默认0, 已对账:1"

  - name: "debit_credit_status"
    type: "varchar(255)"
    display_name: "是否完成Debit/Credit"
    description: "是否完成Debit/Credit, 默认0, 已完成: 1"

  - name: "transaction_status"
    type: "smallint"
    display_name: "参考LARK编码表"
    description: "参考LARK编码表"
    enum_values:
      - {value: -2, label: "已删除"}
      - {value: -1, label: "失败"}
      - {value: 0, label: "处理中/待处理"}
      - {value: 1, label: "完成/成功"}

  - name: "stip_status"
    type: "smallint"
    display_name: "stip 状态"
    description: "stip 状态"

  - name: "wallet_type"
    type: "varchar(64)"
    display_name: "钱包类型"
    description: "钱包类型"

  - name: "wallet_id"
    type: "varchar(32)"
    display_name: "钱包ID"
    description: "钱包ID"

  - name: "ref_token_id"
    type: "varchar(36)"
    display_name: "关联token id"
    description: "关联token id"
    sensitive: true

  - name: "ref_token_status"
    type: "int"
    display_name: "1000"
    description: "1000:TokenState Actived,1001:TokenState_Pending,1002:TokenState_Suspended,1003:TokenState Deactived,1004:TokenState_PendingDeactive,99999:TokenState_Unkonwn"
    sensitive: true

relations: []

common_queries:
  - question: "发卡卡片交易表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_transactions`;
    tables: ["issuing_card_transactions"]
    difficulty: "easy"
  - question: "最近30天发卡卡片交易表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_transactions`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_card_transactions"]
    difficulty: "easy"
  - question: "发卡卡片交易表按状态分布"
    sql: |
      SELECT
          CASE settlement_status
            WHEN 0 THEN 'UNSETTLED'
            WHEN 1 THEN 'SETTLED'
            WHEN 2 THEN 'RELEASED'
            ELSE CONCAT('其他:', CAST(settlement_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_card_transactions`
      GROUP BY settlement_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_card_transactions"]
    difficulty: "medium"
  - question: "发卡卡片交易表按币种汇总金额"
    sql: |
      SELECT transaction_currency AS "币种", COUNT(*) AS "笔数", SUM(transaction_amount) AS "金额"
      FROM dwd_banking.`issuing_card_transactions`
      GROUP BY transaction_currency
      ORDER BY SUM(transaction_amount) DESC;
    tables: ["issuing_card_transactions"]
    difficulty: "medium"
  - question: "发卡卡片交易表按card_id分布最多的是哪些"
    sql: |
      SELECT card_id AS "card_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_transactions`
      WHERE card_id IS NOT NULL AND card_id != ''
      GROUP BY card_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_card_transactions"]
    difficulty: "easy"

