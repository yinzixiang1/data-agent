table:
  name: "uq_customer_owners"
  database: "dwd_banking"
  display_name: "UQ-客户权益人表"
  description: |
    这张表记录UQ-客户权益人相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uq", "客户", "受益人", "uq_customer_owners"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "master_id"
    type: "varchar(36)"
    display_name: "上级ID"
    description: "上级ID"

  - name: "customer_id"
    type: "varchar(36)"
    display_name: "客户ID"
    description: "客户ID"

  - name: "short_customer_id"
    type: "varchar(20)"
    display_name: "客户号"
    description: "客户号"

  - name: "owners_id"
    type: "varchar(36)"
    display_name: "权益人ID"
    description: "权益人ID"

  - name: "owners_type"
    type: "int"
    display_name: "权益类型"
    description: "权益类型：1000=董事Director，2000=受益人Beneficial owner（有股份），3000=董事&受益人，4000申请人"
    enum_values:
      - {value: 1000, label: "董事Director"}
      - {value: 2000, label: "受益人Beneficial owner（有股份）"}
      - {value: 3000, label: "董事&受益人,4000申请人"}

  - name: "legal_entity_type"
    type: "int"
    display_name: "法律实体类型"
    description: "1000=individual，2000=company"
    enum_values:
      - {value: 1000, label: "individual"}
      - {value: 2000, label: "company"}

  - name: "legal_first_name"
    type: "varchar(120)"
    display_name: "legal_entity_type= indiv"
    description: "legal_entity_type= individual时填写"
    sensitive: true

  - name: "legal_last_name"
    type: "varchar(255)"
    display_name: "legal_entity_type= indiv"
    description: "legal_entity_type= individual时填写"
    sensitive: true

  - name: "legal_date_of_birth"
    type: "date"
    display_name: "legal_entity_type= indiv"
    description: "legal_entity_type= individual时填写"
    sensitive: true

  - name: "identification_type"
    type: "int"
    display_name: "证件类型"
    description: "1000-passport, 1001-Drivers License; 1002=National ID；"
    sensitive: true

  - name: "identification_value"
    type: "varchar(48)"
    display_name: "identification_type值"
    description: "identification_type值"
    sensitive: true

  - name: "address"
    type: "varchar(255)"
    display_name: "address"
    description: "UQ-客户权益人表字段 address。"
    sensitive: true

  - name: "address2"
    type: "varchar(255)"
    display_name: "地址2"
    description: "地址2"
    sensitive: true

  - name: "email"
    type: "varchar(40)"
    display_name: "邮箱"
    description: "邮箱号"
    sensitive: true

  - name: "owners_status"
    type: "tinyint(1)"
    display_name: "-1=冻结 0=默认 1=正常"
    description: "-1=冻结 0=默认 1=正常"
    enum_values:
      - {value: -1, label: "冻结"}
      - {value: 0, label: "默认"}
      - {value: 1, label: "正常"}

  - name: "attach_status"
    type: "tinyint(1)"
    display_name: "是否有附件"
    description: "是否有附件"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

  - name: "ref_info_id"
    type: "varchar(36)"
    display_name: "关联info ID"
    description: "关联info ID"
    skip_index: true

  - name: "is_deleted"
    type: "tinyint(1)"
    display_name: "是否删除"
    description: "是否删除:0默认，1=删除，2=正常"
    enum_values:
      - {value: 1, label: "删除"}
      - {value: 2, label: "正常"}

  - name: "ext_applicant_check"
    type: "text"
    display_name: "sumsub申请人内容"
    description: "sumsub申请人内容：{\"applicant_id\": \"\", \"idv_reason\": \"\", \"idv_status\": \"\"}"
    skip_index: true

relations: []

common_queries:
  - question: "UQ-客户权益人表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_owners`;
    tables: ["uq_customer_owners"]
    difficulty: "easy"
  - question: "最近30天UQ-客户权益人表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_owners`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uq_customer_owners"]
    difficulty: "easy"
  - question: "UQ-客户权益人表按状态分布"
    sql: |
      SELECT
          CASE owners_status
            WHEN -1 THEN '冻结'
            WHEN 0 THEN '默认'
            WHEN 1 THEN '正常'
            ELSE CONCAT('其他:', CAST(owners_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uq_customer_owners`
      GROUP BY owners_status
      ORDER BY COUNT(*) DESC;
    tables: ["uq_customer_owners"]
    difficulty: "medium"
  - question: "UQ-客户权益人表按customer_id分布最多的是哪些"
    sql: |
      SELECT customer_id AS "customer_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_owners`
      WHERE customer_id IS NOT NULL AND customer_id != ''
      GROUP BY customer_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uq_customer_owners"]
    difficulty: "easy"

