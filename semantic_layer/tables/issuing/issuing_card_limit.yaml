table:
  name: "issuing_card_limit"
  database: "dwd_banking"
  display_name: "发卡卡片额度表"
  description: |
    这张表记录 UQPAY 发卡业务中的发卡卡片额度。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "卡片", "额度", "issuing_card_limit"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "发卡卡片额度表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "发卡卡片额度表字段 account_id。"

  - name: "card_id"
    type: "varchar(36)"
    display_name: "卡片ID"
    description: "发卡卡片额度表字段 card_id。"

  - name: "total_limit"
    type: "decimal(16,4)"
    display_name: "总额度，只受card recharge/with"
    description: "总额度，只受card recharge/withdraw影响"
    skip_index: true

  - name: "card_limit_id"
    type: "varchar(36)"
    display_name: "卡片额度id"
    description: "发卡卡片额度表字段 card_limit_id。"

  - name: "card_limit_type"
    type: "smallint"
    display_name: "限额类型"
    description: "限额类型：1000=banking模式，4000=Issuing模式，card_limit 默认值0，完全依赖spend control来控制卡"
    enum_values:
      - {value: 1000, label: "banking模式"}
      - {value: 4000, label: "Issuing模式,card_limit 默认值0,完全依赖spend control来控制卡"}

  - name: "total_refund_amount"
    type: "decimal(16,4)"
    display_name: "在一定时间内，退还给卡持有者的总金额"
    description: "在一定时间内，退还给卡持有者的总金额"

  - name: "total_posted_amount"
    type: "decimal(16,4)"
    display_name: "已经完成并入账的交易总金额"
    description: "已经完成并入账的交易总金额"

  - name: "total_unsettled_amount"
    type: "decimal(16,4)"
    display_name: "已经发生但尚未完成结算的交易金额"
    description: "已经发生但尚未完成结算的交易金额"

  - name: "total_settlement_amount"
    type: "decimal(16,4)"
    display_name: "考虑退款后，实际结算的交易金额"
    description: "考虑退款后，实际结算的交易金额"

  - name: "total_transaction_amount"
    type: "decimal(16,4)"
    display_name: "在一定时间内，通过卡进行的所有交易的总金额"
    description: "在一定时间内，通过卡进行的所有交易的总金额"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "settle_amount"
    type: "decimal(16,4)"
    display_name: "废弃"
    description: "废弃"

  - name: "refund_amount"
    type: "decimal(16,4)"
    display_name: "废弃"
    description: "废弃"

relations: []

common_queries:
  - question: "发卡卡片额度表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_limit`;
    tables: ["issuing_card_limit"]
    difficulty: "easy"
  - question: "最近30天发卡卡片额度表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_limit`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_card_limit"]
    difficulty: "easy"
  - question: "发卡卡片额度表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_limit`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_card_limit"]
    difficulty: "easy"

