table:
  name: "issuing_card_token_log"
  database: "dwd_banking"
  display_name: "Token后台操作日志表"
  description: |
    这张表记录 UQPAY 发卡业务中的Token后台操作日志。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "卡片", "钱包令牌", "日志", "issuing_card_token_log"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "token_id"
    type: "varchar(36)"
    display_name: "任务ID"
    description: "任务ID"
    sensitive: true

  - name: "token_action"
    type: "tinyint"
    display_name: "1=call_center_activate \\"
    description: "1=call_center_activate \\n2=token_deactive \\n3=token_suspend \\n4=token_resume \\n5=token_query_by_pan \\n6=token_query"
    sensitive: true

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "创建人id"
    description: "创建人id"

  - name: "create_time"
    type: "datetime(3)"
    display_name: "创建时间"
    description: "创建时间"

relations: []

common_queries:
  - question: "Token后台操作日志表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_token_log`;
    tables: ["issuing_card_token_log"]
    difficulty: "easy"
  - question: "最近30天Token后台操作日志表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_token_log`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_card_token_log"]
    difficulty: "easy"
  - question: "Token后台操作日志表最近创建的记录有哪些"
    sql: |
      SELECT *
      FROM dwd_banking.`issuing_card_token_log`
      ORDER BY create_time DESC
      LIMIT 100;
    tables: ["issuing_card_token_log"]
    difficulty: "easy"

review_required:
