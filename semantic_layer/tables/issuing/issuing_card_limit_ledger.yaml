table:
  name: "issuing_card_limit_ledger"
  database: "dwd_banking"
  display_name: "卡额度账本表"
  description: |
    这张表记录 UQPAY 发卡业务中的卡额度账本。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "卡片", "额度", "账本", "issuing_card_limit_ledger"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "card_id"
    type: "varchar(36)"
    display_name: "卡片ID"
    description: "卡ID"

  - name: "ledger_id"
    type: "varchar(36)"
    display_name: "账本ID"
    description: "账本ID"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "卡额度账本表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "卡额度账本表字段 account_id。"

  - name: "card_type"
    type: "smallint"
    display_name: "卡类型"
    description: "1000=预付费卡账户，2000=借记卡账户"
    enum_values:
      - {value: 1000, label: "预付费卡账户"}
      - {value: 2000, label: "借记卡账户"}

  - name: "card_number"
    type: "varchar(24)"
    display_name: "卡号"
    description: "卡额度账本表字段 card_number。"
    sensitive: true

  - name: "pan_hash"
    type: "varchar(64)"
    display_name: "PAN哈希"
    description: "PAN sha256 hash值"
    sensitive: true

  - name: "mask_card_number"
    type: "varchar(36)"
    display_name: "脱敏卡号"
    description: "脱敏后的card number"
    sensitive: true

  - name: "transaction_type"
    type: "smallint"
    display_name: "交易类型"
    description: "交易类型 参考LARK编码表"

  - name: "transaction_amount"
    type: "decimal(16,4)"
    display_name: "交易金额"
    description: "交易金额"

  - name: "transaction_currency"
    type: "varchar(4)"
    display_name: "交易币种"
    description: "交易币种"

  - name: "billing_amount"
    type: "decimal(16,4)"
    display_name: "billingamount"
    description: "卡额度账本表字段 billing_amount。"

  - name: "billing_currency"
    type: "varchar(4)"
    display_name: "billing币种"
    description: "卡额度账本表字段 billing_currency。"

  - name: "ref_transaction_id"
    type: "varchar(36)"
    display_name: "关联原始交易订单ID"
    description: "关联原始交易订单ID"

  - name: "short_ref_transaction_id"
    type: "varchar(36)"
    display_name: "短号关联交易id"
    description: "短号关联交易id"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "卡额度账本表字段 create_time。"

  - name: "transaction_status"
    type: "smallint"
    display_name: "参考LARK编码表"
    description: "参考LARK编码表"
    enum_values:
      - {value: -2, label: "已删除"}
      - {value: -1, label: "失败"}
      - {value: 0, label: "处理中/待处理"}
      - {value: 1, label: "完成/成功"}

relations: []

common_queries:
  - question: "卡额度账本表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_limit_ledger`;
    tables: ["issuing_card_limit_ledger"]
    difficulty: "easy"
  - question: "最近30天卡额度账本表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_limit_ledger`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_card_limit_ledger"]
    difficulty: "easy"
  - question: "卡额度账本表按状态分布"
    sql: |
      SELECT
          CASE transaction_status
            WHEN -2 THEN '已删除'
            WHEN -1 THEN '失败'
            WHEN 0 THEN '处理中/待处理'
            WHEN 1 THEN '完成/成功'
            ELSE CONCAT('其他:', CAST(transaction_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_card_limit_ledger`
      GROUP BY transaction_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_card_limit_ledger"]
    difficulty: "medium"
  - question: "卡额度账本表按币种汇总金额"
    sql: |
      SELECT transaction_currency AS "币种", COUNT(*) AS "笔数", SUM(transaction_amount) AS "金额"
      FROM dwd_banking.`issuing_card_limit_ledger`
      GROUP BY transaction_currency
      ORDER BY SUM(transaction_amount) DESC;
    tables: ["issuing_card_limit_ledger"]
    difficulty: "medium"
  - question: "卡额度账本表按card_id分布最多的是哪些"
    sql: |
      SELECT card_id AS "card_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_limit_ledger`
      WHERE card_id IS NOT NULL AND card_id != ''
      GROUP BY card_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_card_limit_ledger"]
    difficulty: "easy"

