table:
  name: "sys_notification_template"
  database: "dwd_banking"
  display_name: "系统通知模版表"
  description: |
    这张表记录系统侧的系统通知模版。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "通知", "模板", "sys_notification_template"]
  query_tips: "时间范围优先使用 updated_at 字段。"

columns:
  - name: "tpl_type"
    type: "int"
    display_name: "1000=EMAIL"
    description: "1000=EMAIL, 2000=SMS"
    sensitive: true

  - name: "tpl_mode"
    type: "varchar(100)"
    display_name: "通知模板方式"
    description: "通知模板方式:service=服务,market=营销,otp=OTP"
    sensitive: true

  - name: "tpl_body"
    type: "text"
    display_name: "tplbody"
    description: "系统通知模版表字段 tpl_body。"
    skip_index: true

  - name: "tpl_params"
    type: "varchar(255)"
    display_name: "body中参数集"
    description: "body中参数集"
    skip_index: true

  - name: "tpl_status"
    type: "tinyint(1)"
    display_name: "状态"
    description: "状态：-1删除，0关闭，1开启"

  - name: "created_id"
    type: "varchar(100)"
    display_name: "创建ID"
    description: "创建ID"

  - name: "metadata"
    type: "varchar(200)"
    display_name: "元数据"
    description: "元数据"
    skip_index: true

relations: []

common_queries:
  - question: "系统通知模版表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_notification_template`;
    tables: ["sys_notification_template"]
    difficulty: "easy"
  - question: "最近30天系统通知模版表每天新增多少"
    sql: |
      SELECT DATE(updated_at) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_notification_template`
      WHERE updated_at >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(updated_at)
      ORDER BY DATE(updated_at) DESC;
    tables: ["sys_notification_template"]
    difficulty: "easy"
  - question: "系统通知模版表按状态分布"
    sql: |
      SELECT
          tpl_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`sys_notification_template`
      GROUP BY tpl_status
      ORDER BY COUNT(*) DESC;
    tables: ["sys_notification_template"]
    difficulty: "easy"

review_required:
