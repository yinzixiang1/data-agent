table:
  name: "pmt_payment_method"
  database: "dwd_banking"
  display_name: "VAFX支付方式表"
  description: |
    这张表记录支付/银行账户业务中的VAFX支付方式。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "方式", "pmt_payment_method"]
  query_tips: "按业务主键、状态字段和创建时间过滤可减少扫描范围。"

columns:
  - name: "currency_code"
    type: "varchar(3)"
    display_name: "币种code"
    description: "VAFX支付方式表字段 currency_code。"

  - name: "payment_method"
    type: "int"
    display_name: "1000=local"
    description: "1000=local, 2000=swift"
    enum_values:
      - {value: 1000, label: "local"}
      - {value: 2000, label: "swift"}

  - name: "status"
    type: "tinyint(1)"
    display_name: "状态"
    description: "VAFX支付方式表字段 status。"

  - name: "validation_field"
    type: "text"
    display_name: "验证字段"
    description: "验证字段"
    skip_index: true

relations: []

common_queries:
  - question: "VAFX支付方式表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_payment_method`;
    tables: ["pmt_payment_method"]
    difficulty: "easy"
  - question: "VAFX支付方式表按状态分布"
    sql: |
      SELECT
          status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_payment_method`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_payment_method"]
    difficulty: "easy"
  - question: "VAFX支付方式表按币种汇总金额"
    sql: |
      SELECT currency_code AS "币种", COUNT(*) AS "笔数", SUM(transfer_fee) AS "金额"
      FROM dwd_banking.`pmt_payment_method`
      GROUP BY currency_code
      ORDER BY SUM(transfer_fee) DESC;
    tables: ["pmt_payment_method"]
    difficulty: "medium"

