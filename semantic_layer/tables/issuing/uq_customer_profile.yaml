table:
  name: "uq_customer_profile"
  database: "dwd_banking"
  display_name: "UQ-客户资料存档表"
  description: |
    这张表记录UQ-客户资料存档相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uq", "客户", "档案", "uq_customer_profile"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "master_id"
    type: "varchar(36)"
    display_name: "上级ID"
    description: "上级ID"

  - name: "customer_id"
    type: "varchar(36)"
    display_name: "客户ID"
    description: "客户ID"

  - name: "short_customer_id"
    type: "varchar(20)"
    display_name: "客户号"
    description: "客户号"

  - name: "customer_profile_id"
    type: "varchar(36)"
    display_name: "客户资料ID"
    description: "客户资料ID"

  - name: "short_reference_id"
    type: "varchar(20)"
    display_name: "客户资料短号"
    description: "客户资料短号"

  - name: "profile_tags"
    type: "int"
    display_name: "资料标记"
    description: "资料标记：0=默认，2000=主业务类资料，3000=子业务类资料，4000=业务方式类资料"
    enum_values:
      - {value: 0, label: "默认"}
      - {value: 2000, label: "主业务类资料"}
      - {value: 3000, label: "子业务类资料"}
      - {value: 4000, label: "业务方式类资料"}

  - name: "profile_option"
    type: "tinyint"
    display_name: "资料是否必填 0=否，1是"
    description: "资料是否必填 0=否，1是"
    enum_values:
      - {value: 0, label: "否,1是"}

  - name: "target_data"
    type: "longtext"
    display_name: "资料属性数据值"
    description: "资料属性数据值"
    skip_index: true

  - name: "attach_config_id"
    type: "varchar(36)"
    display_name: "attach配置ID"
    description: "attach配置ID"

  - name: "attach_status"
    type: "int"
    display_name: "是否有资料附件"
    description: "是否有资料附件：0无，1有"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "UQ-客户资料存档表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "UQ-客户资料存档表字段 update_time。"

  - name: "review_status"
    type: "tinyint"
    display_name: "审查状态"
    description: "审查状态：0默认进行中；-1=rejected；2=pending；1=审核成功；"
    enum_values:
      - {value: -1, label: "rejected"}
      - {value: 2, label: "pending"}
      - {value: 1, label: "审核成功"}

relations: []

common_queries:
  - question: "UQ-客户资料存档表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_profile`;
    tables: ["uq_customer_profile"]
    difficulty: "easy"
  - question: "最近30天UQ-客户资料存档表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_profile`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uq_customer_profile"]
    difficulty: "easy"
  - question: "UQ-客户资料存档表按状态分布"
    sql: |
      SELECT
          attach_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uq_customer_profile`
      GROUP BY attach_status
      ORDER BY COUNT(*) DESC;
    tables: ["uq_customer_profile"]
    difficulty: "easy"
  - question: "UQ-客户资料存档表按customer_id分布最多的是哪些"
    sql: |
      SELECT customer_id AS "customer_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_profile`
      WHERE customer_id IS NOT NULL AND customer_id != ''
      GROUP BY customer_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uq_customer_profile"]
    difficulty: "easy"

