table:
  name: "pmt_developer_webhook_events"
  database: "dwd_banking"
  display_name: "Webhooks事件表"
  description: |
    这张表记录支付/银行账户业务中的Webhooks事件。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "开发者", "Webhook", "事件", "pmt_developer_webhook_events"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
