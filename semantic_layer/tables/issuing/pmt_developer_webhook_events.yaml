    type: "varchar(36)"
    display_name: "账户ID"
    description: "账户 uuid"

  - name: "short_account_id"
    type: "varchar(20)"
    display_name: "账户短号"
    description: "短ACCOUNT ID "

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "Webhooks事件表字段 direct_id。"

  - name: "event_id"
    type: "varchar(36)"
    display_name: "event uuid"
    description: "event uuid"

  - name: "event_type"
    type: "varchar(100)"
    display_name: "event 类型"
    description: "event 类型"

  - name: "event_payload"
    type: "text"
    display_name: "webhook payload"
    description: "webhook payload, 和接口调用 response 相同"
    skip_index: true

  - name: "webhook_id"
    type: "varchar(36)"
    display_name: "webhook uuid"
    description: "webhook uuid"

  - name: "re_event_id"
    type: "varchar(36)"
    display_name: "重发原ID"
    description: "重发原ID"

  - name: "http_resp_body"
    type: "text"
    display_name: "客户端响应内容，在非200状态下，有就记录"
    description: "客户端响应内容，在非200状态下，有就记录"
    skip_index: true

  - name: "http_resp_error"
    type: "text"
    display_name: "记录我们内部错误异常"
    description: "记录我们内部错误异常"
    skip_index: true

  - name: "short_reference_id"
    type: "varchar(20)"
    display_name: "短ID"
    description: "短ID"

  - name: "ref_reference_id"
    type: "varchar(36)"
    display_name: "相应订单关联ID"
    description: "相应订单关联ID"

  - name: "ref_short_reference_id"
    type: "varchar(20)"
    display_name: "相应订单关联短ID"
    description: "相应订单关联短ID"

  - name: "update_time"
    type: "datetime(3)"
    display_name: "更新时间"
    description: "修改时间"

  - name: "create_time"
    type: "datetime(3)"
    display_name: "创建时间"
    description: "创建时间"

  - name: "event_status"
    type: "tinyint"
    display_name: "-1=Failed"
    description: "-1=Failed, 0=Default, 1=Success, 2=Processing"
    enum_values:
      - {value: -1, label: "Failed"}
      - {value: 0, label: "Default"}
      - {value: 1, label: "Success"}
      - {value: 2, label: "Processing"}

relations: []

common_queries:
  - question: "Webhooks事件表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_developer_webhook_events`;
    tables: ["pmt_developer_webhook_events"]
    difficulty: "easy"
  - question: "最近30天Webhooks事件表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_developer_webhook_events`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_developer_webhook_events"]
    difficulty: "easy"
  - question: "Webhooks事件表按状态分布"
    sql: |
      SELECT
          CASE event_status
            WHEN -1 THEN 'Failed'
            WHEN 0 THEN 'Default'
            WHEN 1 THEN 'Success'
            WHEN 2 THEN 'Processing'
            ELSE CONCAT('其他:', CAST(event_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_developer_webhook_events`
      GROUP BY event_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_developer_webhook_events"]
    difficulty: "medium"
  - question: "Webhooks事件表按account_id分布最多的是哪些"
    sql: |
      SELECT account_id AS "account_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_developer_webhook_events`
      WHERE account_id IS NOT NULL AND account_id != ''
      GROUP BY account_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_developer_webhook_events"]
    difficulty: "easy"

