table:
  name: "uqpay_config_profile"
  database: "dwd_banking"
  display_name: "资料配置表"
  description: |
    这张表记录资料配置相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uqpay", "配置", "档案", "uqpay_config_profile"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "profile_id"
    type: "varchar(36)"
    display_name: "资料ID"
    description: "资料ID"

  - name: "profile_type"
    type: "int"
    display_name: "资料类型，VA=1000"
    description: "资料类型，VA=1000, FX=2000, AC=3000, IC=4000, RP=5000"

  - name: "profile_tags"
    type: "int"
    display_name: "资料标记"
    description: "资料标记：0=默认，1000=基础文件，2000=主业务类资料，3000=子业务类资料，4000=业务方式类资料"
    enum_values:
      - {value: 0, label: "默认"}
      - {value: 1000, label: "基础文件"}
      - {value: 2000, label: "主业务类资料"}
      - {value: 3000, label: "子业务类资料"}
      - {value: 4000, label: "业务方式类资料"}

  - name: "profile_name_regional"
    type: "text"
    display_name: "资料名分地区{\"SG\""
    description: "资料名分地区{\"SG\": \"Applicant"
    skip_index: true

  - name: "profile_option"
    type: "tinyint"
    display_name: "资料是否必填 0=否，1是"
    description: "资料是否必填 0=否，1是"
    enum_values:
      - {value: 0, label: "否,1是"}

  - name: "profile_attr"
    type: "varchar(255)"
    display_name: "资料属性"
    description: "资料属性：input、file、select、radio、checkbox、textarea、group_address、group_object、group_file"
    sensitive: true

  - name: "attach_status"
    type: "int"
    display_name: "是否需要附件上传 0否，1是"
    description: "是否需要附件上传 0否，1是"

  - name: "sort_order"
    type: "int"
    display_name: "排序 0=默认"
    description: "排序 0=默认"
    enum_values:
      - {value: 0, label: "默认"}

  - name: "profile_status"
    type: "int"
    display_name: "资料状态0=默认，1=可用，-1=关闭"
    description: "资料状态0=默认，1=可用，-1=关闭"
    enum_values:
      - {value: 0, label: "默认"}
      - {value: 1, label: "可用"}
      - {value: -1, label: "关闭"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "资料配置表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "资料配置表字段 update_time。"

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "创建者ID"
    description: "创建者ID"

relations: []

common_queries:
  - question: "资料配置表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_config_profile`;
    tables: ["uqpay_config_profile"]
    difficulty: "easy"
  - question: "最近30天资料配置表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_config_profile`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uqpay_config_profile"]
    difficulty: "easy"
  - question: "资料配置表按状态分布"
    sql: |
      SELECT
          attach_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uqpay_config_profile`
      GROUP BY attach_status
      ORDER BY COUNT(*) DESC;
    tables: ["uqpay_config_profile"]
    difficulty: "easy"

