table:
  name: "pmt_account_company_rfi"
  database: "dwd_banking"
  display_name: "支付账户企业补件表"
  description: |
    这张表记录支付/银行账户业务中的支付账户企业补件。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "账户", "企业", "补件", "pmt_account_company_rfi"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "父ID（常用于机构模式）"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "系统内部账户ID"

  - name: "rfi_id"
    type: "varchar(36)"
    display_name: "补件id"
    description: "支付账户企业补件表字段 rfi_id。"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "支付账户企业补件表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "支付账户企业补件表字段 update_time。"

  - name: "rfi_request"
    type: "text"
    display_name: "渠道请求的内容"
    description: "渠道请求的内容"
    skip_index: true

  - name: "rfi_data"
    type: "longtext"
    display_name: "自定义的中间内容"
    description: "自定义的中间内容"
    skip_index: true

  - name: "rfi_response"
    type: "longtext"
    display_name: "上送渠道的内容"
    description: "上送渠道的内容"
    skip_index: true

  - name: "status"
    type: "int"
    display_name: "状态"
    description: "-1=failed, 0=pending, 1=succeed, 2=ready to send"
    enum_values:
      - {value: -1, label: "failed"}
      - {value: 0, label: "pending"}
      - {value: 1, label: "succeed"}
      - {value: 2, label: "ready to send"}

relations: []

common_queries:
  - question: "支付账户企业补件表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_company_rfi`;
    tables: ["pmt_account_company_rfi"]
    difficulty: "easy"
  - question: "最近30天支付账户企业补件表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_company_rfi`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_account_company_rfi"]
    difficulty: "easy"
  - question: "支付账户企业补件表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN -1 THEN 'failed'
            WHEN 0 THEN 'pending'
            WHEN 1 THEN 'succeed'
            WHEN 2 THEN 'ready to send'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_account_company_rfi`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_account_company_rfi"]
    difficulty: "medium"
  - question: "支付账户企业补件表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_company_rfi`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_account_company_rfi"]
    difficulty: "easy"

