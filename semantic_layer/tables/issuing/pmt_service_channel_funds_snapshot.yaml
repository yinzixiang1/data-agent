table:
  name: "pmt_service_channel_funds_snapshot"
  database: "dwd_banking"
  display_name: "渠道自己表"
  description: |
    这张表记录支付/银行账户业务中的渠道自己。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "渠道", "服务", "funds", "快照", "pmt_service_channel_funds_snapshot"]
  query_tips: "时间范围优先使用 snapshot_date 字段。"

columns:
  - name: "balance_currency"
    type: "varchar(6)"
    display_name: "账户币种"
    description: "账户币种"

relations: []

common_queries:
  - question: "渠道自己表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_service_channel_funds_snapshot`;
    tables: ["pmt_service_channel_funds_snapshot"]
    difficulty: "easy"
  - question: "最近30天渠道自己表每天新增多少"
    sql: |
      SELECT DATE(snapshot_date) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_service_channel_funds_snapshot`
      WHERE snapshot_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(snapshot_date)
      ORDER BY DATE(snapshot_date) DESC;
    tables: ["pmt_service_channel_funds_snapshot"]
    difficulty: "easy"
  - question: "渠道自己表按币种汇总金额"
    sql: |
      SELECT balance_currency AS "币种", COUNT(*) AS "笔数", SUM(available_balance) AS "金额"
      FROM dwd_banking.`pmt_service_channel_funds_snapshot`
      GROUP BY balance_currency
      ORDER BY SUM(available_balance) DESC;
    tables: ["pmt_service_channel_funds_snapshot"]
    difficulty: "medium"

