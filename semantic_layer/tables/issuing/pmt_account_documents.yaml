table:
  name: "pmt_account_documents"
  database: "dwd_banking"
  display_name: "账户资料表"
  description: |
    这张表记录支付/银行账户业务中的账户资料。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "账户", "文件", "pmt_account_documents"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "docs_id"
    type: "varchar(36)"
    display_name: "长ID"
    description: "长ID"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "父ID（常用于机构模式）"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "系统内部账户ID"

  - name: "short_account_id"
    type: "varchar(36)"
    display_name: "账户短号"
    description: "商户短号"

  - name: "docs_main_type"
    type: "int"
    display_name: "1000=account，1001=benefi"
    description: "1000=account，1001=beneficiary，1002=payer，2000=deposit，2001=payout，3000=conversion"
    enum_values:
      - {value: 1000, label: "account"}
      - {value: 1001, label: "beneficiary"}
      - {value: 1002, label: "payer"}
      - {value: 2000, label: "deposit"}
      - {value: 2001, label: "payout"}
      - {value: 3000, label: "conversion"}

  - name: "docs_sub_type"
    type: "int"
    display_name: "二级类型"
    description: "二级类型"

  - name: "docs_type_name"
    type: "varchar(255)"
    display_name: "类型名"
    description: "类型名"

  - name: "docs_file_type"
    type: "varchar(45)"
    display_name: "资料类型"
    description: "资料类型: "

  - name: "short_reference_id"
    type: "varchar(36)"
    display_name: "文件短号"
    description: "文件短号"

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "creatorid"
    description: "账户资料表字段 creator_id。"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "账户资料表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "账户资料表字段 update_time。"

  - name: "ref_reference_id"
    type: "varchar(36)"
    display_name: "关联ID 订单等"
    description: "关联ID 订单等"

  - name: "ref_short_reference_id"
    type: "varchar(36)"
    display_name: "短号"
    description: "短号"

  - name: "batch_id"
    type: "varchar(36)"
    display_name: "批次号"
    description: "批次号"

  - name: "review_status"
    type: "tinyint(1)"
    display_name: "-1"
    description: " -1:审核失败；0:pending；1:审核成功"
    enum_values:
      - {value: -1, label: "审核失败"}
      - {value: 0, label: "pending"}
      - {value: 1, label: "审核成功"}

  - name: "docs_status"
    type: "tinyint(1)"
    display_name: "状态"
    description: "状态：0 pending(waiting upload), 1 completed  -1 failed"

  - name: "storage_location"
    type: "tinyint(1)"
    display_name: "1"
    description: "1:cloud;2:local;3:cloud+local"
    enum_values:
      - {value: 1, label: "cloud"}
      - {value: 2, label: "local"}
      - {value: 3, label: "cloud+local"}

relations: []

common_queries:
  - question: "账户资料表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_documents`;
    tables: ["pmt_account_documents"]
    difficulty: "easy"
  - question: "最近30天账户资料表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_documents`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_account_documents"]
    difficulty: "easy"
  - question: "账户资料表按状态分布"
    sql: |
      SELECT
          CASE review_status
            WHEN -1 THEN '审核失败'
            WHEN 0 THEN 'pending'
            WHEN 1 THEN '审核成功'
            ELSE CONCAT('其他:', CAST(review_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_account_documents`
      GROUP BY review_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_account_documents"]
    difficulty: "medium"
  - question: "账户资料表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_documents`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_account_documents"]
    difficulty: "easy"

