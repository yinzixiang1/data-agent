table:
  name: "sys_uqpay_sqs"
  database: "dwd_banking"
  display_name: "sqs消息队列表"
  description: |
    这张表记录系统侧的sqs消息队列。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "uqpay", "SQS", "sys_uqpay_sqs"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "sqs_msg_id"
    type: "varchar(120)"
    display_name: "消息id"
    description: "消息id"

  - name: "sqs_payload"
    type: "text"
    display_name: "SQSpayload"
    description: "sqs消息队列表字段 sqs_payload。"
    skip_index: true

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "sqs消息队列表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "sqs消息队列表字段 update_time。"

  - name: "sqs_status"
    type: "int"
    display_name: "-1处理失败 1"
    description: "-1处理失败 1:处理成功"
    enum_values:
      - {value: 1, label: "处理成功"}

  - name: "sqs_reason"
    type: "text"
    display_name: "执行错误说明原因"
    description: "执行错误说明原因"
    skip_index: true

relations: []

common_queries:
  - question: "sqs消息队列表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_uqpay_sqs`;
    tables: ["sys_uqpay_sqs"]
    difficulty: "easy"
  - question: "最近30天sqs消息队列表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_uqpay_sqs`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["sys_uqpay_sqs"]
    difficulty: "easy"
  - question: "sqs消息队列表按状态分布"
    sql: |
      SELECT
          CASE sqs_status
            WHEN 1 THEN '处理成功'
            ELSE CONCAT('其他:', CAST(sqs_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`sys_uqpay_sqs`
      GROUP BY sqs_status
      ORDER BY COUNT(*) DESC;
    tables: ["sys_uqpay_sqs"]
    difficulty: "medium"

review_required:
