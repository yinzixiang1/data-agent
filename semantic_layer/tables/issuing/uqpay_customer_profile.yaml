table:
  name: "uqpay_customer_profile"
  database: "dwd_banking"
  display_name: "客户资料库表"
  description: |
    这张表记录客户资料库相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uqpay", "客户", "档案", "uqpay_customer_profile"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "parent_id"
    type: "varchar(36)"
    display_name: "上级ID"
    description: "上级ID"

  - name: "profile_id"
    type: "varchar(36)"
    display_name: "资料ID"
    description: "资料ID"

  - name: "profile_type"
    type: "varchar(5)"
    display_name: "KYC、KYB"
    description: "KYC、KYB"

  - name: "business_code"
    type: "smallint"
    display_name: "1000= Banking，2000=Forei"
    description: "1000= Banking，2000=Foreign，3000=Acquiring，4000=Issuing，5000=Ramp"
    enum_values:
      - {value: 1000, label: "Banking"}
      - {value: 2000, label: "Foreign"}
      - {value: 3000, label: "Acquiring"}
      - {value: 4000, label: "Issuing"}
      - {value: 5000, label: "Ramp"}

  - name: "entity_type"
    type: "smallint"
    display_name: "主体类型"
    description: "1000=individual 2000=company"
    enum_values:
      - {value: 1000, label: "individual"}
      - {value: 2000, label: "company"}

  - name: "identification_type"
    type: "smallint"
    display_name: "证件类型"
    description: "1000=passport, 1001=Drivers License，1002=National ID，2000=UEN"
    sensitive: true

  - name: "identification_value"
    type: "varchar(255)"
    display_name: "identification_type值"
    description: "identification_type值"
    sensitive: true

  - name: "identification_issue_country"
    type: "varchar(10)"
    display_name: "对应证书签发国"
    description: "对应证书签发国"
    sensitive: true

  - name: "identification_issue_date"
    type: "varchar(10)"
    display_name: "对应证书签发时间 Format"
    description: "对应证书签发时间 Format：YYYY-MM-DD"
    sensitive: true

  - name: "identification_expiry_date"
    type: "varchar(10)"
    display_name: "对应证书过期时间 Format"
    description: "对应证书过期时间 Format：YYYY-MM-DD"
    sensitive: true

  - name: "profile_body"
    type: "text"
    display_name: "客户资料body"
    description: "客户资料body"
    skip_index: true

  - name: "profile_status"
    type: "varchar(20)"
    display_name: "profile状态"
    description: "profile状态：已过期(EXPIRED)，不通过(REJECTED)，审查中(UNDER_REVIEW)，已通过(APPROVED)，豁免(EXEMPTED)，待处理(ACTION_REQUIRED)"

  - name: "create_time"
    type: "datetime(3)"
    display_name: "创建时间"
    description: "创建时间"

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "creatorid"
    description: "客户资料库表字段 creator_id。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "最后更新时间"

  - name: "update_id"
    type: "varchar(36)"
    display_name: "管理后台管理ID"
    description: "管理后台管理ID"

  - name: "aml_check_id"
    type: "varchar(36)"
    display_name: "关联aml_check_id"
    description: "关联aml_check_id"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "关联account ID"

  - name: "customer_id"
    type: "varchar(36)"
    display_name: "客户ID"
    description: "客户ID：如果是KYC不填，KYB必填"

relations: []

common_queries:
  - question: "客户资料库表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_customer_profile`;
    tables: ["uqpay_customer_profile"]
    difficulty: "easy"
  - question: "最近30天客户资料库表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_customer_profile`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uqpay_customer_profile"]
    difficulty: "easy"
  - question: "客户资料库表按状态分布"
    sql: |
      SELECT
          profile_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uqpay_customer_profile`
      GROUP BY profile_status
      ORDER BY COUNT(*) DESC;
    tables: ["uqpay_customer_profile"]
    difficulty: "easy"
  - question: "客户资料库表按account_id分布最多的是哪些"
    sql: |
      SELECT account_id AS "account_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_customer_profile`
      WHERE account_id IS NOT NULL AND account_id != ''
      GROUP BY account_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uqpay_customer_profile"]
    difficulty: "easy"

