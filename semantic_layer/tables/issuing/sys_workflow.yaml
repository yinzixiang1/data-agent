table:
  name: "sys_workflow"
  database: "dwd_banking"
  display_name: "系统工作流记录表"
  description: |
    这张表记录系统侧的系统工作流记录。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "工作流", "sys_workflow"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "flow_id"
    type: "varchar(64)"
    display_name: "流ID"
    description: "流ID"

  - name: "short_reference_id"
    type: "varchar(36)"
    display_name: "短号"
    description: "短号"

  - name: "flow_type"
    type: "int"
    display_name: "流类型，1000=商户类，2000=财务类，90"
    description: "流类型，1000=商户类，2000=财务类，9000=配置类，9001=批量邮件类"
    enum_values:
      - {value: 1000, label: "商户类"}
      - {value: 2000, label: "财务类"}
      - {value: 9000, label: "配置类"}
      - {value: 9001, label: "批量邮件类"}

  - name: "reference_id"
    type: "varchar(48)"
    display_name: "关联ID，唯一与creator_id"
    description: "关联ID，唯一与creator_id"

  - name: "reference_params"
    type: "text"
    display_name: "参数"
    description: "参数"
    skip_index: true

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

  - name: "creator_id"
    type: "varchar(60)"
    display_name: "创建者ID"
    description: "创建者ID"

  - name: "review_status"
    type: "tinyint(1)"
    display_name: "最后审查状态"
    description: "最后审查状态：1=passed, 0=in_review, -1=rejected"
    enum_values:
      - {value: 1, label: "passed"}
      - {value: 0, label: "in_review"}
      - {value: -1, label: "rejected"}

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "account 相关workflow"

relations: []

common_queries:
  - question: "系统工作流记录表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_workflow`;
    tables: ["sys_workflow"]
    difficulty: "easy"
  - question: "最近30天系统工作流记录表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_workflow`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["sys_workflow"]
    difficulty: "easy"
  - question: "系统工作流记录表按状态分布"
    sql: |
      SELECT
          CASE review_status
            WHEN 1 THEN 'passed'
            WHEN 0 THEN 'in_review'
            WHEN -1 THEN 'rejected'
            ELSE CONCAT('其他:', CAST(review_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`sys_workflow`
      GROUP BY review_status
      ORDER BY COUNT(*) DESC;
    tables: ["sys_workflow"]
    difficulty: "medium"
  - question: "系统工作流记录表按account_id分布最多的是哪些"
    sql: |
      SELECT account_id AS "account_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_workflow`
      WHERE account_id IS NOT NULL AND account_id != ''
      GROUP BY account_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["sys_workflow"]
    difficulty: "easy"

