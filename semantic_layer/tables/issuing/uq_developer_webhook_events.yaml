relations: []

common_queries:
  - question: "Webhooks事件表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_developer_webhook_events`;
    tables: ["uq_developer_webhook_events"]
    difficulty: "easy"
  - question: "最近30天Webhooks事件表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_developer_webhook_events`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uq_developer_webhook_events"]
    difficulty: "easy"
  - question: "Webhooks事件表按状态分布"
    sql: |
      SELECT
          CASE event_status
            WHEN -1 THEN 'Failed'
            WHEN 0 THEN 'Default'
            WHEN 1 THEN 'Success'
            WHEN 2 THEN 'Processing'
            ELSE CONCAT('其他:', CAST(event_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uq_developer_webhook_events`
      GROUP BY event_status
      ORDER BY COUNT(*) DESC;
    tables: ["uq_developer_webhook_events"]
    difficulty: "medium"
  - question: "Webhooks事件表按customer_id分布最多的是哪些"
    sql: |
      SELECT customer_id AS "customer_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_developer_webhook_events`
      WHERE customer_id IS NOT NULL AND customer_id != ''
      GROUP BY customer_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uq_developer_webhook_events"]
    difficulty: "easy"

