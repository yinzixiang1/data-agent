table:
  name: "pmt_user_permission"
  database: "dwd_banking"
  display_name: "商户-用户权限表"
  description: |
    这张表记录支付/银行账户业务中的商户-用户权限。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "用户", "权限", "pmt_user_permission"]
  query_tips: "时间范围优先使用 update_time 字段。"

columns:
  - name: "account_id"
    type: "varchar(255)"
    display_name: "账户ID"
    description: "账户ID"

  - name: "role_id"
    type: "varchar(36)"
    display_name: "角色ID"
    description: "角色ID"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "商户-用户权限表字段 update_time。"

  - name: "permission_status"
    type: "tinyint(1)"
    display_name: "权限status"
    description: "商户-用户权限表字段 permission_status。"

relations: []

common_queries:
  - question: "商户-用户权限表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_user_permission`;
    tables: ["pmt_user_permission"]
    difficulty: "easy"
  - question: "最近30天商户-用户权限表每天新增多少"
    sql: |
      SELECT DATE(update_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_user_permission`
      WHERE update_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(update_time)
      ORDER BY DATE(update_time) DESC;
    tables: ["pmt_user_permission"]
    difficulty: "easy"
  - question: "商户-用户权限表按状态分布"
    sql: |
      SELECT
          permission_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_user_permission`
      GROUP BY permission_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_user_permission"]
    difficulty: "easy"
  - question: "商户-用户权限表按account_id分布最多的是哪些"
    sql: |
      SELECT account_id AS "account_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_user_permission`
      WHERE account_id IS NOT NULL AND account_id != ''
      GROUP BY account_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_user_permission"]
    difficulty: "easy"

