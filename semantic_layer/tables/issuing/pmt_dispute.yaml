table:
  name: "pmt_dispute"
  database: "dwd_banking"
  display_name: "争议记录表"
  description: |
    这张表记录支付/银行账户业务中的争议记录。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "拒付", "pmt_dispute"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "dispute_id"
    type: "varchar(36)"
    display_name: "ID"
    description: "ID"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "父ID（常用于机构模式）"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "系统内部账户ID"

  - name: "short_account_id"
    type: "varchar(20)"
    display_name: "账户短号"
    description: "商户短号"

  - name: "short_reference_id"
    type: "varchar(20)"
    display_name: "短号"
    description: "短号"

  - name: "dispute_type"
    type: "int"
    display_name: "1000=payin"
    description: "1000=payin, 1001=deposit, 2000=payout, 2001=transfer, 3000=conversion，4000=card fee, 4001= card charge，8000=fee, 9000=adjustment"
    enum_values:
      - {value: 1000, label: "payin"}
      - {value: 1001, label: "deposit"}
      - {value: 2000, label: "payout"}
      - {value: 2001, label: "transfer"}
      - {value: 3000, label: "conversion"}
      - {value: 4000, label: "card fee"}
      - {value: 4001, label: "card charge"}
      - {value: 8000, label: "fee"}
      - {value: 9000, label: "adjustment"}

  - name: "dispute_amount"
    type: "decimal(16,4)"
    display_name: "金额"
    description: "金额"

  - name: "dispute_currency"
    type: "varchar(10)"
    display_name: "币种"
    description: "币种"

  - name: "dispute_remark"
    type: "text"
    display_name: "拒付remark"
    description: "争议记录表字段 dispute_remark。"
    skip_index: true

  - name: "dispute_documents"
    type: "text"
    display_name: "所需文件内容"
    description: "所需文件内容"
    skip_index: true

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "creatorid"
    description: "争议记录表字段 creator_id。"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "争议记录表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "争议记录表字段 update_time。"

  - name: "ref_reference_id"
    type: "varchar(36)"
    display_name: "关联ID 订单等"
    description: "关联ID 订单等"

  - name: "ref_short_reference_id"
    type: "varchar(20)"
    display_name: "关联短号"
    description: "关联短号"

  - name: "document_status"
    type: "tinyint(1)"
    display_name: "0-等待上传，1=完成上传"
    description: "0-等待上传，1=完成上传"
    enum_values:
      - {value: 0, label: "等待上传"}
      - {value: 1, label: "完成上传"}

  - name: "dispute_status"
    type: "tinyint(1)"
    display_name: "状态"
    description: "状态：-1拒绝，0默认创建，1 批准"

relations: []

common_queries:
  - question: "争议记录表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_dispute`;
    tables: ["pmt_dispute"]
    difficulty: "easy"
  - question: "最近30天争议记录表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_dispute`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_dispute"]
    difficulty: "easy"
  - question: "争议记录表按状态分布"
    sql: |
      SELECT
          CASE document_status
            WHEN 0 THEN '等待上传'
            WHEN 1 THEN '完成上传'
            ELSE CONCAT('其他:', CAST(document_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_dispute`
      GROUP BY document_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_dispute"]
    difficulty: "medium"
  - question: "争议记录表按币种汇总金额"
    sql: |
      SELECT dispute_currency AS "币种", COUNT(*) AS "笔数", SUM(dispute_amount) AS "金额"
      FROM dwd_banking.`pmt_dispute`
      GROUP BY dispute_currency
      ORDER BY SUM(dispute_amount) DESC;
    tables: ["pmt_dispute"]
    difficulty: "medium"
  - question: "争议记录表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_dispute`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_dispute"]
    difficulty: "easy"

review_required:
