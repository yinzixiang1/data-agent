table:
  name: "pmt_card"
  database: "dwd_banking"
  display_name: "卡表"
  description: |
    这张表记录支付/银行账户业务中的卡。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "卡片", "pmt_card"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "card_id"
    type: "varchar(36)"
    display_name: "卡片ID"
    description: "卡表字段 card_id。"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "卡表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "卡表字段 account_id。"

  - name: "card_holder_id"
    type: "varchar(36)"
    display_name: "持卡人ID"
    description: "卡表字段 card_holder_id。"

  - name: "card_type"
    type: "smallint"
    display_name: "卡类型"
    description: "Card type - 1000=PREPAID 2000=DEBIT"
    enum_values:
      - {value: 1000, label: "PREPAID"}
      - {value: 2000, label: "DEBIT"}

  - name: "card_scheme"
    type: "smallint"
    display_name: "卡组织"
    description: "卡品牌 1000=VISA  2000=MASTER"
    enum_values:
      - {value: 1000, label: "VISA"}
      - {value: 2000, label: "MASTER"}

  - name: "form_factor"
    type: "smallint"
    display_name: "卡介质类型"
    description: "1000=VIRTUAL, 2000=PHYSICAL"
    enum_values:
      - {value: 1000, label: "VIRTUAL"}
      - {value: 2000, label: "PHYSICAL"}

  - name: "card_number"
    type: "varchar(24)"
    display_name: "卡号"
    description: "卡表字段 card_number。"
    sensitive: true

  - name: "card_cvv2"
    type: "varchar(4)"
    display_name: "卡CVV2"
    description: "卡表字段 card_cvv2。"
    sensitive: true

  - name: "card_currency"
    type: "varchar(4)"
    display_name: "default SGD"
    description: "default SGD"

  - name: "settle_currency"
    type: "varchar(3)"
    display_name: "结算币种"
    description: "结算币种, 默认SGD"

  - name: "card_expire_date"
    type: "varchar(10)"
    display_name: "卡有效期"
    description: "MM/YY format"
    sensitive: true

  - name: "spending_controls"
    type: "text"
    display_name: "卡控制规则\"limits\""
    description: "卡控制规则\"limits\": {\"currency\": \"SGD\",\"spendingLimits\": [{\"interval\": \"MONTHLY\",\"amount\": 1000,},{\"interval\": \"PER_TRANSACTION\",\"amount\": 75000,}],},"
    skip_index: true

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "卡表字段 update_time。"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "卡表字段 create_time。"

  - name: "channel_card_id"
    type: "varchar(220)"
    display_name: "渠道卡ID，全局唯一关联。"
    description: "渠道卡ID，全局唯一关联。"

  - name: "activation_status"
    type: "tinyint"
    display_name: "实体卡激活状态"
    description: "物理卡激活 -1=FAILED, 0=PENDING, 1=ACTIVATED"
    enum_values:
      - {value: -1, label: "FAILED"}
      - {value: 0, label: "PENDING"}
      - {value: 1, label: "ACTIVATED"}

  - name: "card_status"
    type: "tinyint"
    display_name: "卡状态"
    description: "0=PENDING，1=ACTIVE，-1=INACTIVE，-2=BLOCKED，-3=LOST，-4=STOLEN，-5=CLOSED，-8=后台冻结, -9=FAILED"
    enum_values:
      - {value: 0, label: "PENDING"}
      - {value: 1, label: "ACTIVE"}
      - {value: -1, label: "INACTIVE"}
      - {value: -2, label: "BLOCKED"}
      - {value: -3, label: "LOST"}
      - {value: -4, label: "STOLEN"}
      - {value: -5, label: "CLOSED"}
      - {value: -8, label: "后台冻结"}
      - {value: -9, label: "FAILED"}

relations: []

common_queries:
  - question: "卡表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_card`;
    tables: ["pmt_card"]
    difficulty: "easy"
  - question: "最近30天卡表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_card`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_card"]
    difficulty: "easy"
  - question: "卡表按状态分布"
    sql: |
      SELECT
          CASE card_status
            WHEN 0 THEN 'PENDING'
            WHEN 1 THEN 'ACTIVE'
            WHEN -1 THEN 'INACTIVE'
            WHEN -2 THEN 'BLOCKED'
            WHEN -3 THEN 'LOST'
            WHEN -4 THEN 'STOLEN'
            WHEN -5 THEN 'CLOSED'
            WHEN -8 THEN '后台冻结'
            WHEN -9 THEN 'FAILED'
            ELSE CONCAT('其他:', CAST(card_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_card`
      GROUP BY card_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_card"]
    difficulty: "medium"
  - question: "卡表按card_id分布最多的是哪些"
    sql: |
      SELECT card_id AS "card_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_card`
      WHERE card_id IS NOT NULL AND card_id != ''
      GROUP BY card_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_card"]
    difficulty: "easy"

