table:
  name: "uq_customer"
  database: "dwd_banking"
  display_name: "UQ-客户表"
  description: |
    这张表记录UQ-客户相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uq", "客户", "uq_customer"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "master_id"
    type: "varchar(36)"
    display_name: "上级客户ID"
    description: "上级客户ID"

  - name: "customer_id"
    type: "varchar(36)"
    display_name: "客户ID"
    description: "客户ID"

  - name: "short_customer_id"
    type: "varchar(20)"
    display_name: "客户号"
    description: "客户号"

  - name: "customer_type"
    type: "int"
    display_name: "1000=CUSTOMER，1001=SUB，2"
    description: "1000=CUSTOMER，1001=SUB，2000=MERCHANT，3000=FI，3001=KA"
    enum_values:
      - {value: 1000, label: "CUSTOMER"}
      - {value: 1001, label: "SUB"}
      - {value: 2000, label: "MERCHANT"}
      - {value: 3000, label: "FI"}
      - {value: 3001, label: "KA"}

  - name: "customer_status"
    type: "int"
    display_name: "客户状态"
    description: "客户状态：-1关闭，0:default, 1:active, 2:inactive"
    enum_values:
      - {value: 0, label: "default"}
      - {value: 1, label: "active"}
      - {value: 2, label: "inactive"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "最后更新时间"

  - name: "customer_email"
    type: "varchar(255)"
    display_name: "客户主邮箱号"
    description: "客户主邮箱号（允许重复）"
    sensitive: true

  - name: "api_trading_status"
    type: "tinyint"
    display_name: "API交易状态"
    description: "1:启用；-1:禁用"
    enum_values:
      - {value: 1, label: "启用"}
      - {value: -1, label: "禁用"}

  - name: "allow_sub_customer_login"
    type: "tinyint"
    display_name: "是否允许子商户登录；1=允许，2=不允许"
    description: "是否允许子商户登录；1=允许，2=不允许"
    enum_values:
      - {value: 1, label: "允许"}
      - {value: 2, label: "不允许"}

  - name: "exemption_status"
    type: "tinyint"
    display_name: "是否免审创建"
    description: "是否免审创建：0否，1是"

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "创建者ID"
    description: "创建者ID（来源admin、webapp、api方式有）"

  - name: "external_id"
    type: "varchar(50)"
    display_name: "外部ID记录存储"
    description: "外部ID记录存储"

  - name: "meta_data_config"
    type: "text"
    display_name: "元数据配置信息"
    description: "元数据配置信息：{\"white_label_status\" : \"1\", \"allow_sub_idv\": \"0\"}"
    skip_index: true

  - name: "ext_applicant_id"
    type: "varchar(64)"
    display_name: "sumsub唯一申请人标识符"
    description: "sumsub唯一申请人标识符"

  - name: "sync_to_uqpay"
    type: "int"
    display_name: "同步到uqpay_customer表标记"
    description: "同步到uqpay_customer表标记：0=未同步，1=已同步，2=同步中，-1=同步失败"
    enum_values:
      - {value: 0, label: "未同步"}
      - {value: 1, label: "已同步"}
      - {value: 2, label: "同步中"}
      - {value: -1, label: "同步失败"}

relations: []

common_queries:
  - question: "UQ-客户表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer`;
    tables: ["uq_customer"]
    difficulty: "easy"
  - question: "最近30天UQ-客户表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uq_customer"]
    difficulty: "easy"
  - question: "UQ-客户表按状态分布"
    sql: |
      SELECT
          CASE customer_status
            WHEN 0 THEN 'default'
            WHEN 1 THEN 'active'
            WHEN 2 THEN 'inactive'
            ELSE CONCAT('其他:', CAST(customer_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uq_customer`
      GROUP BY customer_status
      ORDER BY COUNT(*) DESC;
    tables: ["uq_customer"]
    difficulty: "medium"
  - question: "UQ-客户表按customer_id分布最多的是哪些"
    sql: |
      SELECT customer_id AS "customer_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer`
      WHERE customer_id IS NOT NULL AND customer_id != ''
      GROUP BY customer_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uq_customer"]
    difficulty: "easy"

