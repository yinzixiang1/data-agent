table:
  name: "issuing_reconciliation_batches"
  database: "dwd_banking"
  display_name: "对账批次表"
  description: |
    这张表记录 UQPAY 发卡业务中的对账批次。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "对账", "批次", "issuing_reconciliation_batches"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "id"
    type: "bigint"
    display_name: "主键ID"
    description: "自增主键，批次ID"

  - name: "batch_status"
    type: "smallint"
    display_name: "批次状态"
    description: "批次状态"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

  - name: "notes"
    type: "text"
    display_name: "备注信息"
    description: "备注信息"
    skip_index: true

relations: []

common_queries:
  - question: "对账批次表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_reconciliation_batches`;
    tables: ["issuing_reconciliation_batches"]
    difficulty: "easy"
  - question: "最近30天对账批次表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_reconciliation_batches`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_reconciliation_batches"]
    difficulty: "easy"
  - question: "对账批次表按状态分布"
    sql: |
      SELECT
          batch_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_reconciliation_batches`
      GROUP BY batch_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_reconciliation_batches"]
    difficulty: "easy"

