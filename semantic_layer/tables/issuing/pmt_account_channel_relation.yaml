table:
  name: "pmt_account_channel_relation"
  database: "dwd_banking"
  display_name: "account渠道关联表"
  description: |
    这张表记录支付/银行账户业务中的account渠道关联。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "渠道", "账户", "relation", "pmt_account_channel_relation"]
  query_tips: "按业务主键、状态字段和创建时间过滤可减少扫描范围。"

columns:
  - name: "id"
    type: "bigint"
    display_name: "主键ID"
    description: "account渠道关联表字段 id。"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "account渠道关联表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "系统内部账户ID"

  - name: "currency"
    type: "varchar(6)"
    display_name: "币种"
    description: "account渠道关联表字段 currency。"

  - name: "channel_customer_id"
    type: "varchar(36)"
    display_name: "渠道唯一ID"
    description: "渠道唯一ID"

  - name: "channel_account_id"
    type: "varchar(40)"
    display_name: "渠道账户id"
    description: "account渠道关联表字段 channel_account_id。"

  - name: "channel_account_type"
    type: "varchar(36)"
    display_name: "rail"
    description: "rail: DEPOSIT, PAYMENT"

relations: []

common_queries:
  - question: "account渠道关联表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_channel_relation`;
    tables: ["pmt_account_channel_relation"]
    difficulty: "easy"
  - question: "account渠道关联表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_channel_relation`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_account_channel_relation"]
    difficulty: "easy"
  - question: "account渠道关联表按主键倒序查看最新记录"
    sql: |
      SELECT *
      FROM dwd_banking.`pmt_account_channel_relation`
      ORDER BY id DESC
      LIMIT 100;
    tables: ["pmt_account_channel_relation"]
    difficulty: "easy"

