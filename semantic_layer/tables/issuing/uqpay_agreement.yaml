table:
  name: "uqpay_agreement"
  database: "dwd_banking"
  display_name: "客户协议表"
  description: |
    这张表记录客户协议相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uqpay", "协议", "uqpay_agreement"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "agreement_id"
    type: "varchar(36)"
    display_name: "协议ID"
    description: "协议ID"

  - name: "agreement_status"
    type: "tinyint"
    display_name: "协议状态"
    description: "协议状态：0:default, 1:active, 2:inactive"
    enum_values:
      - {value: 0, label: "default"}
      - {value: 1, label: "active"}
      - {value: 2, label: "inactive"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "create_id"
    type: "varchar(36)"
    display_name: "创建者"
    description: "创建者"

relations: []

common_queries:
  - question: "客户协议表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_agreement`;
    tables: ["uqpay_agreement"]
    difficulty: "easy"
  - question: "最近30天客户协议表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_agreement`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uqpay_agreement"]
    difficulty: "easy"
  - question: "客户协议表按状态分布"
    sql: |
      SELECT
          CASE agreement_status
            WHEN 0 THEN 'default'
            WHEN 1 THEN 'active'
            WHEN 2 THEN 'inactive'
            ELSE CONCAT('其他:', CAST(agreement_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uqpay_agreement`
      GROUP BY agreement_status
      ORDER BY COUNT(*) DESC;
    tables: ["uqpay_agreement"]
    difficulty: "medium"

review_required:
