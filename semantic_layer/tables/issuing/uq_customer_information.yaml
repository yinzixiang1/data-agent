table:
  name: "uq_customer_information"
  database: "dwd_banking"
  display_name: "UQ-客户基础资料表"
  description: |
    这张表记录UQ-客户基础资料相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uq", "客户", "资料", "uq_customer_information"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
