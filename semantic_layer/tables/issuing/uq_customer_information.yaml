    type: "varchar(36)"
    display_name: "上级ID"
    description: "上级ID"

  - name: "customer_id"
    type: "varchar(36)"
    display_name: "客户ID"
    description: "客户ID"

  - name: "short_customer_id"
    type: "varchar(20)"
    display_name: "客户号"
    description: "客户号"

  - name: "info_id"
    type: "varchar(36)"
    display_name: "资料ID"
    description: "资料ID"
    skip_index: true

  - name: "short_reference_id"
    type: "varchar(36)"
    display_name: "短号"
    description: "短号"

  - name: "entity_individual"
    type: "text"
    display_name: "KYC信息{\"first_name\""
    description: "KYC信息{\"first_name\": \"\", \"last_name\": \"\", \"date_of_birth\": \"\"}"
    sensitive: true
    skip_index: true

  - name: "contact_details"
    type: "varchar(255)"
    display_name: "联系信息"
    description: "联系信息：{\"email\": \"\", \"telephone\": \"+86100086\"}"
    sensitive: true

  - name: "legal_entity_type"
    type: "int"
    display_name: "法律实体类型"
    description: "1000=individual 2000=company"
    enum_values:
      - {value: 1000, label: "individual"}
      - {value: 2000, label: "company"}

  - name: "identification_type"
    type: "int"
    display_name: "证件类型"
    description: "当legal_entity_type=individual：1000-passport, 1001-Drivers License，1002-National ID"
    sensitive: true

  - name: "identification_value"
    type: "varchar(255)"
    display_name: "当legal_entity_type=indiv"
    description: "当legal_entity_type=individual：identification_type值"
    sensitive: true

  - name: "entity_company"
    type: "text"
    display_name: "当legal_entity_type=compa"
    description: "当legal_entity_type=company：{\"entity_name\": \"实体英文名\", \"entity_reg_name\": \"实体法定名\", \"entity_status\": \"实体类型\", \"incorporate_date\": \"企业注册时间\", \"entity_deadline\": \"企业到期时间\", \"vat_type\": \"企业税号\"}"
    skip_index: true

  - name: "registration_address"
    type: "varchar(2000)"
    display_name: "企业注册地址"
    description: "企业注册地址：{\"city\": \"\", \"state\": \"\", \"postal_code\": \"\", \"address\": \"\", \"address2\": \"\"}"
    sensitive: true

  - name: "trading_address"
    type: "text"
    display_name: "发生交易地址"
    description: "发生交易地址：[{\"address\":\"gao sha\",\"city\":\"shao yang\", \"state\": \"\", \"postal_code\":\"00000\",\"country\":\"AF\"}]"
    sensitive: true
    skip_index: true

  - name: "business_operation"
    type: "text"
    display_name: "经营情况"
    description: "经营情况:{\"turnover_currency\": \"SGD\", \"turnover_monthly\": \"月营业额范围\", \"turnover_monthly_code\": \"TM001\", \"business_scale\": \"规模\", \"business_scale_code\": \"BS001\"}"
    skip_index: true

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

  - name: "verification_status"
    type: "tinyint"
    display_name: "KYC/KYB认证状态"
    description: "KYC/KYB结果状态：-1=REJECT, 0=DEFAULT, 1=APPROVED, 2=PENDING, 4=EXPIRE"
    enum_values:
      - {value: -1, label: "REJECT"}
      - {value: 0, label: "DEFAULT"}
      - {value: 1, label: "APPROVED"}
      - {value: 2, label: "PENDING"}
      - {value: 4, label: "EXPIRE"}

  - name: "last_bus_type"
    type: "int"
    display_name: "最后通过业务类型存档 0=默认不确认业务，VA="
    description: "最后通过业务类型存档 0=默认不确认业务，VA=1000, FX=2000, AC=3000, IC=4000"
    enum_values:
      - {value: 0, label: "默认不确认业务,VA=1000, FX=2000, AC=3000, IC=4000"}

  - name: "last_log_info_id"
    type: "varchar(36)"
    display_name: "log ID"
    description: "log ID"
    skip_index: true

  - name: "external_id"
    type: "varchar(50)"
    display_name: "外部ID记录存储"
    description: "外部ID记录存储"

  - name: "idv_status"
    type: "tinyint"
    display_name: "IDV结果状态"
    description: "IDV结果状态：-1=REJECT, 0=DEFAULT, 1=APPROVED, 2=PENDING"
    enum_values:
      - {value: -1, label: "REJECT"}
      - {value: 0, label: "DEFAULT"}
      - {value: 1, label: "APPROVED"}
      - {value: 2, label: "PENDING"}

  - name: "ext_applicant_check"
    type: "text"
    display_name: "sumsub申请内容"
    description: "sumsub申请内容：{\"applicant_id\": \"\", \"idv_reason\": \"\", \"idv_status\": \"-2=RETRY -1=REJECT, 0=DEFAULT, 1=APPROVED, 2=PENDING\"}"
    enum_values:
      - {value: -2, label: "RETRY"}
      - {value: -1, label: "REJECT"}
      - {value: 0, label: "DEFAULT"}
      - {value: 1, label: "APPROVED"}
      - {value: 2, label: "PENDING\"}"}
    skip_index: true

relations: []

common_queries:
  - question: "UQ-客户基础资料表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_information`;
    tables: ["uq_customer_information"]
    difficulty: "easy"
  - question: "最近30天UQ-客户基础资料表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_information`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uq_customer_information"]
    difficulty: "easy"
  - question: "UQ-客户基础资料表按状态分布"
    sql: |
      SELECT
          CASE verification_status
            WHEN -1 THEN 'REJECT'
            WHEN 0 THEN 'DEFAULT'
            WHEN 1 THEN 'APPROVED'
            WHEN 2 THEN 'PENDING'
            WHEN 4 THEN 'EXPIRE'
            ELSE CONCAT('其他:', CAST(verification_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uq_customer_information`
      GROUP BY verification_status
      ORDER BY COUNT(*) DESC;
    tables: ["uq_customer_information"]
    difficulty: "medium"
  - question: "UQ-客户基础资料表按customer_id分布最多的是哪些"
    sql: |
      SELECT customer_id AS "customer_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_information`
      WHERE customer_id IS NOT NULL AND customer_id != ''
      GROUP BY customer_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uq_customer_information"]
    difficulty: "easy"

