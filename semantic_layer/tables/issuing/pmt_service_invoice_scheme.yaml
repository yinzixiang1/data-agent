table:
  name: "pmt_service_invoice_scheme"
  database: "dwd_banking"
  display_name: "invoice配置表"
  description: |
    这张表记录支付/银行账户业务中的invoice配置。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "服务", "账单", "scheme", "pmt_service_invoice_scheme"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "scheme_id"
    type: "varchar(36)"
    display_name: "唯一ID"
    description: "唯一ID"

  - name: "scheme_type"
    type: "int"
    display_name: "类型 1000=VA 2000=FX"
    description: "类型 1000=VA 2000=FX(预留), 3000=AC, 4000=IC"
    enum_values:
      - {value: 1000, label: "VA"}
      - {value: 2000, label: "FX(预留)"}
      - {value: 3000, label: "AC"}
      - {value: 4000, label: "IC"}

  - name: "currency"
    type: "varchar(3)"
    display_name: "币种"
    description: "币种"

  - name: "fee_type"
    type: "varchar(30)"
    display_name: "收取的费用类型"
    description: "收取的费用类型：FIXED_FEE=按每笔收取固定费用，RATE_FEE=百分比费用；OTHER=除按每笔固定收取费用的"

  - name: "tax_is_control"
    type: "smallint"
    display_name: "税收值控制"
    description: "税收值控制：0=不可操作，1=可操作"
    enum_values:
      - {value: 0, label: "不可操作"}
      - {value: 1, label: "可操作"}

  - name: "is_discount"
    type: "smallint"
    display_name: "优惠值控制"
    description: "优惠值控制：0=不可操作，1=可操作"
    enum_values:
      - {value: 0, label: "不可操作"}
      - {value: 1, label: "可操作"}

  - name: "discount_type"
    type: "varchar(255)"
    display_name: "优惠类型"
    description: "优惠类型：RATE=百分比优惠，FIXED=固定金额优惠"

  - name: "discount_amount"
    type: "double(10,4)"
    display_name: "优惠值"
    description: "优惠值"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "invoice配置表字段 update_time。"

  - name: "scheme_status"
    type: "int"
    display_name: "状态"
    description: "状态：-1=废弃，0=关闭，1=可用"
    enum_values:
      - {value: -1, label: "废弃"}
      - {value: 0, label: "关闭"}
      - {value: 1, label: "可用"}

relations: []

common_queries:
  - question: "invoice配置表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_service_invoice_scheme`;
    tables: ["pmt_service_invoice_scheme"]
    difficulty: "easy"
  - question: "最近30天invoice配置表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_service_invoice_scheme`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_service_invoice_scheme"]
    difficulty: "easy"
  - question: "invoice配置表按状态分布"
    sql: |
      SELECT
          CASE scheme_status
            WHEN -1 THEN '废弃'
            WHEN 0 THEN '关闭'
            WHEN 1 THEN '可用'
            ELSE CONCAT('其他:', CAST(scheme_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_service_invoice_scheme`
      GROUP BY scheme_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_service_invoice_scheme"]
    difficulty: "medium"
  - question: "invoice配置表按币种汇总金额"
    sql: |
      SELECT currency AS "币种", COUNT(*) AS "笔数", SUM(fee_rate) AS "金额"
      FROM dwd_banking.`pmt_service_invoice_scheme`
      GROUP BY currency
      ORDER BY SUM(fee_rate) DESC;
    tables: ["pmt_service_invoice_scheme"]
    difficulty: "medium"

