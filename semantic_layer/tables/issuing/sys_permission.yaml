table:
  name: "sys_permission"
  database: "dwd_banking"
  display_name: "系统权限表"
  description: |
    这张表记录系统侧的系统权限。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "权限", "sys_permission"]
  query_tips: "时间范围优先使用 update_time 字段。"

columns:
  - name: "permission_type"
    type: "int"
    display_name: "权限组分类"
    description: "权限组分类：1000=admin，2000=operate，3000=develop"
    enum_values:
      - {value: 1000, label: "admin"}
      - {value: 2000, label: "operate"}
      - {value: 3000, label: "develop"}

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "系统权限表字段 update_time。"

  - name: "permission_status"
    type: "tinyint"
    display_name: "权限status"
    description: "系统权限表字段 permission_status。"

relations: []

common_queries:
  - question: "系统权限表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_permission`;
    tables: ["sys_permission"]
    difficulty: "easy"
  - question: "最近30天系统权限表每天新增多少"
    sql: |
      SELECT DATE(update_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_permission`
      WHERE update_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(update_time)
      ORDER BY DATE(update_time) DESC;
    tables: ["sys_permission"]
    difficulty: "easy"
  - question: "系统权限表按状态分布"
    sql: |
      SELECT
          permission_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`sys_permission`
      GROUP BY permission_status
      ORDER BY COUNT(*) DESC;
    tables: ["sys_permission"]
    difficulty: "easy"

