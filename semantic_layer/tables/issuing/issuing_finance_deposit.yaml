table:
  name: "issuing_finance_deposit"
  database: "dwd_banking"
  display_name: "存款表"
  description: |
    这张表记录 UQPAY 发卡业务中的存款。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "资金", "入金", "issuing_finance_deposit"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "存款表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "存款表字段 account_id。"

  - name: "deposit_id"
    type: "varchar(36)"
    display_name: "入金id"
    description: "存款表字段 deposit_id。"

  - name: "deposit_currency"
    type: "varchar(4)"
    display_name: "币种"
    description: "币种"

  - name: "deposit_amount"
    type: "decimal(16,4)"
    display_name: "金额"
    description: "金额"

  - name: "channel_resp_id"
    type: "varchar(48)"
    display_name: "渠道响应唯一ID"
    description: "渠道响应唯一ID(短)"

  - name: "channel_related_id"
    type: "varchar(36)"
    display_name: "关联CC的related_entity_id，便"
    description: "关联CC的related_entity_id，便于查询sender"

  - name: "channel_related_info"
    type: "text"
    display_name: "主要存sender"
    description: "主要存sender：{\"sender_name\":\"\",\"sender_country\":\"\",\"sender_account_number\":\"\",\"receiver_account_number\":\"\",\"sender_swift_code\":\"\"}"
    skip_index: true

  - name: "channel_related_status"
    type: "int"
    display_name: "sender验证状态"
    description: "sender验证状态：-1=验证失败 0=待验证，1=验证成功"
    enum_values:
      - {value: -1, label: "验证失败"}
      - {value: 0, label: "待验证"}
      - {value: 1, label: "验证成功"}

  - name: "channel_resp_status"
    type: "varchar(20)"
    display_name: "上游返回状态"
    description: "上游返回状态"

  - name: "channel_resp_body"
    type: "text"
    display_name: "上游返回报文"
    description: "上游返回报文"
    skip_index: true

  - name: "execute_reason"
    type: "text"
    display_name: "对应失败原因"
    description: "对应失败原因"
    skip_index: true

  - name: "short_reference_id"
    type: "varchar(36)"
    display_name: "shortreferenceid"
    description: "存款表字段 short_reference_id。"

  - name: "short_account_id"
    type: "varchar(20)"
    display_name: "账户短号"
    description: "存款表字段 short_account_id。"

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "creatorid"
    description: "存款表字段 creator_id。"

  - name: "transaction_id"
    type: "varchar(36)"
    display_name: "交易id"
    description: "存款表字段 transaction_id。"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "存款表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "存款表字段 update_time。"

  - name: "review_status"
    type: "tinyint(1)"
    display_name: "审查状态"
    description: "审查状态：1=passed, 0=in_review, -1=rejected,-2=failed"
    enum_values:
      - {value: 1, label: "passed"}
      - {value: 0, label: "in_review"}
      - {value: -1, label: "rejected"}
      - {value: -2, label: "failed"}

  - name: "deposit_status"
    type: "tinyint(1)"
    display_name: "0"
    description: "0: pending，1: completed, -1=failed,2=return,3=retuen success,4=Processing"
    enum_values:
      - {value: 0, label: "pending"}
      - {value: 1, label: "completed"}
      - {value: -1, label: "failed"}
      - {value: 2, label: "return"}
      - {value: 3, label: "retuen success"}
      - {value: 4, label: "Processing"}

  - name: "message_related_id"
    type: "int"
    display_name: "关联message queue id"
    description: "关联message queue id"

relations: []

common_queries:
  - question: "存款表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_finance_deposit`;
    tables: ["issuing_finance_deposit"]
    difficulty: "easy"
  - question: "最近30天存款表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_finance_deposit`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_finance_deposit"]
    difficulty: "easy"
  - question: "存款表按状态分布"
    sql: |
      SELECT
          CASE channel_related_status
            WHEN -1 THEN '验证失败'
            WHEN 0 THEN '待验证'
            WHEN 1 THEN '验证成功'
            ELSE CONCAT('其他:', CAST(channel_related_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_finance_deposit`
      GROUP BY channel_related_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_finance_deposit"]
    difficulty: "medium"
  - question: "存款表按币种汇总金额"
    sql: |
      SELECT deposit_currency AS "币种", COUNT(*) AS "笔数", SUM(deposit_amount) AS "金额"
      FROM dwd_banking.`issuing_finance_deposit`
      GROUP BY deposit_currency
      ORDER BY SUM(deposit_amount) DESC;
    tables: ["issuing_finance_deposit"]
    difficulty: "medium"
  - question: "存款表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_finance_deposit`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_finance_deposit"]
    difficulty: "easy"

