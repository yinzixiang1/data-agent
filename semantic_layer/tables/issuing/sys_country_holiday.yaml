table:
  name: "sys_country_holiday"
  database: "dwd_banking"
  display_name: "国家公共节假日表"
  description: |
    这张表记录系统侧的国家公共节假日。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "国家", "假期", "sys_country_holiday"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "id"
    type: "bigint"
    display_name: "主键ID"
    description: "国家公共节假日表字段 id。"

  - name: "currency_code"
    type: "varchar(3)"
    display_name: "ISO 4217币种代码"
    description: "ISO 4217币种代码"

  - name: "holiday_type"
    type: "tinyint(1)"
    display_name: "类型"
    description: "类型(1=固定，2=农历，3=调休，4=宗教，5=政治)"
    enum_values:
      - {value: 1, label: "固定"}
      - {value: 2, label: "农历"}
      - {value: 3, label: "调休"}
      - {value: 4, label: "宗教"}
      - {value: 5, label: "政治)"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "国家公共节假日表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "国家公共节假日表字段 update_time。"

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "创建者ID"
    description: "创建者ID"

relations: []

common_queries:
  - question: "国家公共节假日表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_country_holiday`;
    tables: ["sys_country_holiday"]
    difficulty: "easy"
  - question: "最近30天国家公共节假日表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_country_holiday`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["sys_country_holiday"]
    difficulty: "easy"
  - question: "国家公共节假日表最近创建的记录有哪些"
    sql: |
      SELECT *
      FROM dwd_banking.`sys_country_holiday`
      ORDER BY create_time DESC
      LIMIT 100;
    tables: ["sys_country_holiday"]
    difficulty: "easy"

