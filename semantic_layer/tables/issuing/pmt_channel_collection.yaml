table:
  name: "pmt_channel_collection"
  database: "dwd_banking"
  display_name: "支付渠道收款表"
  description: |
    这张表记录支付/银行账户业务中的支付渠道收款。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "渠道", "收款", "pmt_channel_collection"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "collection_id"
    type: "varchar(36)"
    display_name: "调拨订单号"
    description: "调拨订单号"

  - name: "short_reference_id"
    type: "varchar(20)"
    display_name: "订单短号"
    description: "订单短号：PTYYMMDD-XXXXXXXX"

  - name: "collection_type"
    type: "smallint unsigned"
    display_name: "1000"
    description: "1000: deposit; 2000: payout;"
    enum_values:
      - {value: 1000, label: "deposit"}
      - {value: 2000, label: "payout"}

  - name: "collection_currency"
    type: "varchar(3)"
    display_name: "币种"
    description: "币种"

  - name: "collection_amount"
    type: "decimal(16,4)"
    display_name: "调拨的金额"
    description: "调拨的金额"

  - name: "balance_amount"
    type: "decimal(16,4)"
    display_name: "结余"
    description: "结余,头寸的结余"

  - name: "status"
    type: "tinyint(1) unsigned zerofill"
    display_name: "状态"
    description: "0=processing，1=completed"
    enum_values:
      - {value: 0, label: "processing"}
      - {value: 1, label: "completed"}

  - name: "ref_reference_id"
    type: "varchar(36)"
    display_name: "关联ID 订单等"
    description: "关联ID 订单等"

  - name: "ref_short_reference_id"
    type: "varchar(20)"
    display_name: "关联短号"
    description: "关联短号"

  - name: "create_time"
    type: "datetime(3)"
    display_name: "创建时间"
    description: "支付渠道收款表字段 create_time。"

  - name: "update_time"
    type: "datetime(3)"
    display_name: "更新时间"
    description: "支付渠道收款表字段 update_time。"

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "创建人id"
    description: "创建人id"

relations: []

common_queries:
  - question: "支付渠道收款表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_channel_collection`;
    tables: ["pmt_channel_collection"]
    difficulty: "easy"
  - question: "最近30天支付渠道收款表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_channel_collection`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_channel_collection"]
    difficulty: "easy"
  - question: "支付渠道收款表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN 0 THEN 'processing'
            WHEN 1 THEN 'completed'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_channel_collection`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_channel_collection"]
    difficulty: "medium"
  - question: "支付渠道收款表按币种汇总金额"
    sql: |
      SELECT collection_currency AS "币种", COUNT(*) AS "笔数", SUM(balance_amount) AS "金额"
      FROM dwd_banking.`pmt_channel_collection`
      GROUP BY collection_currency
      ORDER BY SUM(balance_amount) DESC;
    tables: ["pmt_channel_collection"]
    difficulty: "medium"

review_required:
