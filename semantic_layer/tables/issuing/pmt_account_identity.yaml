table:
  name: "pmt_account_identity"
  database: "dwd_banking"
  display_name: "系统附件表"
  description: |
    这张表记录支付/银行账户业务中的系统附件。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "账户", "身份", "pmt_account_identity"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "id"
    type: "int"
    display_name: "主键ID"
    description: "系统附件表字段 id。"

  - name: "identity_id"
    type: "varchar(36)"
    display_name: "身份id"
    description: "系统附件表字段 identity_id。"
    sensitive: true

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "系统附件表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "系统附件表字段 account_id。"

  - name: "account_type"
    type: "int"
    display_name: "账户类型"
    description: "1000=personal, 2000=business, 3000=direct, 3001=indirect, 3002=agent"
    enum_values:
      - {value: 1000, label: "personal"}
      - {value: 2000, label: "business"}
      - {value: 3000, label: "direct"}
      - {value: 3001, label: "indirect"}
      - {value: 3002, label: "agent"}

  - name: "identity_type"
    type: "varchar(45)"
    display_name: "验证类型"
    description: "验证类型: KYB,KYC,AVATAR,..."
    sensitive: true

  - name: "identity_path"
    type: "text"
    display_name: "身份path"
    description: "系统附件表字段 identity_path。"
    sensitive: true
    skip_index: true

  - name: "identity_refuse"
    type: "varchar(200)"
    display_name: "身份refuse"
    description: "系统附件表字段 identity_refuse。"
    sensitive: true

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "creatorid"
    description: "系统附件表字段 creator_id。"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "系统附件表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "系统附件表字段 update_time。"

  - name: "identity_status"
    type: "tinyint(1)"
    display_name: "0"
    description: "0:审核中 1:审核成功 -1:审核失败"
    sensitive: true

relations: []

common_queries:
  - question: "系统附件表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_identity`;
    tables: ["pmt_account_identity"]
    difficulty: "easy"
  - question: "最近30天系统附件表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_identity`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_account_identity"]
    difficulty: "easy"
  - question: "系统附件表按状态分布"
    sql: |
      SELECT
          identity_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_account_identity`
      GROUP BY identity_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_account_identity"]
    difficulty: "easy"
  - question: "系统附件表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_identity`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_account_identity"]
    difficulty: "easy"

