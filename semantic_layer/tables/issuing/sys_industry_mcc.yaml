table:
  name: "sys_industry_mcc"
  database: "dwd_banking"
  display_name: "MCC表"
  description: |
    这张表记录系统侧的MCC。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "行业", "MCC", "sys_industry_mcc"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

  - name: "mcc_status"
    type: "tinyint(1)"
    display_name: "状态"
    description: "状态：-1删除，0默认关闭，1正常"

relations: []

common_queries:
  - question: "MCC表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_industry_mcc`;
    tables: ["sys_industry_mcc"]
    difficulty: "easy"
  - question: "最近30天MCC表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_industry_mcc`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["sys_industry_mcc"]
    difficulty: "easy"
  - question: "MCC表按状态分布"
    sql: |
      SELECT
          mcc_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`sys_industry_mcc`
      GROUP BY mcc_status
      ORDER BY COUNT(*) DESC;
    tables: ["sys_industry_mcc"]
    difficulty: "easy"

