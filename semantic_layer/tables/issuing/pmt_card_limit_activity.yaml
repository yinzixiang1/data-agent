table:
  name: "pmt_card_limit_activity"
  database: "dwd_banking"
  display_name: "卡余额变动表"
  description: |
    这张表记录支付/银行账户业务中的卡余额变动。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "卡片", "额度", "流水", "pmt_card_limit_activity"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "card_id"
    type: "varchar(36)"
    display_name: "卡片ID"
    description: "卡ID"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "卡余额变动表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "卡余额变动表字段 account_id。"

  - name: "card_number"
    type: "varchar(24)"
    display_name: "卡号"
    description: "卡余额变动表字段 card_number。"
    sensitive: true

  - name: "transaction_type"
    type: "int"
    display_name: "交易类型"
    description: "交易类型"

  - name: "card_type"
    type: "smallint"
    display_name: "卡类型"
    description: "1000=预付费卡账户，2000=借记卡账户"
    enum_values:
      - {value: 1000, label: "预付费卡账户"}
      - {value: 2000, label: "借记卡账户"}

  - name: "transaction_amount"
    type: "decimal(16,4)"
    display_name: "交易金额"
    description: "交易金额"

  - name: "transaction_currency"
    type: "varchar(4)"
    display_name: "交易币种"
    description: "交易币种"

  - name: "ref_transaction_id"
    type: "varchar(36)"
    display_name: "关联原始交易订单ID"
    description: "关联原始交易订单ID"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "卡余额变动表字段 create_time。"

relations: []

common_queries:
  - question: "卡余额变动表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_card_limit_activity`;
    tables: ["pmt_card_limit_activity"]
    difficulty: "easy"
  - question: "最近30天卡余额变动表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_card_limit_activity`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_card_limit_activity"]
    difficulty: "easy"
  - question: "卡余额变动表按币种汇总金额"
    sql: |
      SELECT transaction_currency AS "币种", COUNT(*) AS "笔数", SUM(transaction_amount) AS "金额"
      FROM dwd_banking.`pmt_card_limit_activity`
      GROUP BY transaction_currency
      ORDER BY SUM(transaction_amount) DESC;
    tables: ["pmt_card_limit_activity"]
    difficulty: "medium"
  - question: "卡余额变动表按card_id分布最多的是哪些"
    sql: |
      SELECT card_id AS "card_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_card_limit_activity`
      WHERE card_id IS NOT NULL AND card_id != ''
      GROUP BY card_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_card_limit_activity"]
    difficulty: "easy"

