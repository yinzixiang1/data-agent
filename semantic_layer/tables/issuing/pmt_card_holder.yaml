table:
  name: "pmt_card_holder"
  database: "dwd_banking"
  display_name: "持卡人表"
  description: |
    这张表记录支付/银行账户业务中的持卡人。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "卡片", "持卡人", "pmt_card_holder"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "user_id"
    type: "varchar(36)"
    display_name: "用户id"
    description: "持卡人表字段 user_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "持卡人表字段 account_id。"

  - name: "card_holder_id"
    type: "varchar(36)"
    display_name: "持卡人ID"
    description: "持卡人表字段 card_holder_id。"

  - name: "email"
    type: "varchar(250)"
    display_name: "邮箱"
    description: "持卡人表字段 email。"
    sensitive: true

  - name: "first_name"
    type: "varchar(120)"
    display_name: "firstname"
    description: "持卡人表字段 first_name。"
    sensitive: true

  - name: "last_name"
    type: "varchar(120)"
    display_name: "lastname"
    description: "持卡人表字段 last_name。"
    sensitive: true

  - name: "date_birth"
    type: "datetime"
    display_name: "datebirth"
    description: "持卡人表字段 date_birth。"
    sensitive: true

  - name: "phone_number"
    type: "varchar(48)"
    display_name: "phone卡号"
    description: "持卡人表字段 phone_number。"
    sensitive: true

  - name: "residential_address"
    type: "text"
    display_name: "居住地址"
    description: "居住地址"
    sensitive: true
    skip_index: true

  - name: "delivery_address"
    type: "text"
    display_name: "用于物理卡收货地址"
    description: "用于物理卡收货地址"
    sensitive: true
    skip_index: true

  - name: "identification"
    type: "text"
    display_name: "KYC身份认证，备用 \"identificati"
    description: "KYC身份认证，备用 \"identification\": {\\n            \"country\": \"US\",\\n            \"expiry_date\": \"2030-08-28\",\\n            \"number\": \"001238243\",\\n            \"type\": \"ID_CARD\"\\n        },"
    sensitive: true
    skip_index: true

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "持卡人表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "持卡人表字段 update_time。"

  - name: "card_holder_status"
    type: "tinyint"
    display_name: "-1=FAILED"
    description: "-1=FAILED, 0-PENDING, 1-SUCCESS, 2-INCOMPLETE "
    enum_values:
      - {value: -1, label: "FAILED"}
      - {value: 0, label: "PENDING"}
      - {value: 1, label: "SUCCESS"}
      - {value: 2, label: "INCOMPLETE"}

relations: []

common_queries:
  - question: "持卡人表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_card_holder`;
    tables: ["pmt_card_holder"]
    difficulty: "easy"
  - question: "最近30天持卡人表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_card_holder`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_card_holder"]
    difficulty: "easy"
  - question: "持卡人表按状态分布"
    sql: |
      SELECT
          CASE card_holder_status
            WHEN -1 THEN 'FAILED'
            WHEN 0 THEN 'PENDING'
            WHEN 1 THEN 'SUCCESS'
            WHEN 2 THEN 'INCOMPLETE'
            ELSE CONCAT('其他:', CAST(card_holder_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_card_holder`
      GROUP BY card_holder_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_card_holder"]
    difficulty: "medium"
  - question: "持卡人表按user_id分布最多的是哪些"
    sql: |
      SELECT user_id AS "user_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_card_holder`
      WHERE user_id IS NOT NULL AND user_id != ''
      GROUP BY user_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_card_holder"]
    difficulty: "easy"

