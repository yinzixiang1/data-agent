table:
  name: "sys_report_center"
  database: "dwd_banking"
  display_name: "HUB报告生成记录表"
  description: |
    这张表记录系统侧的HUB报告生成记录。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "报表", "center", "sys_report_center"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "report_id"
    type: "varchar(36)"
    display_name: "长号"
    description: "长号"

  - name: "short_reference_id"
    type: "varchar(36)"
    display_name: "短号"
    description: "短号"

  - name: "report_type"
    type: "varchar(250)"
    display_name: "0=默认其他，1000=payin"
    description: "0=默认其他，1000=payin, 1001=deposit, 1002=transfer in, 2000=payout, 2001=transfer out, 3000=conversion, 7000=report（70001=mas_report, 7002=balance_snapshot_report）, 8000=fee, 8001=refund, 9000=adjustment"
    enum_values:
      - {value: 0, label: "默认其他"}
      - {value: 1000, label: "payin"}
      - {value: 1001, label: "deposit"}
      - {value: 1002, label: "transfer in"}
      - {value: 2000, label: "payout"}
      - {value: 2001, label: "transfer out"}
      - {value: 3000, label: "conversion"}
      - {value: 7000, label: "report（"}
      - {value: 70001, label: "mas_report"}
      - {value: 7002, label: "balance_snapshot_report）"}
      - {value: 8000, label: "fee"}
      - {value: 8001, label: "refund"}
      - {value: 9000, label: "adjustment"}

  - name: "currency"
    type: "varchar(255)"
    display_name: "币种"
    description: "币种"

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "创建人id"
    description: "创建人id"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "HUB报告生成记录表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "HUB报告生成记录表字段 update_time。"

  - name: "report_to_email"
    type: "varchar(255)"
    display_name: "报告邮箱"
    description: "报告邮箱"
    sensitive: true

  - name: "report_parameters"
    type: "text"
    display_name: "{\\n        \"from_create_"
    description: " {\\n        \"from_create_time”: \"2022-02-22\",\\n        \"to_create_time\": \"2022-02-25\",\\n        \"transaction_type\": \"conversion\"\\n}"
    skip_index: true

  - name: "report_status"
    type: "tinyint(1)"
    display_name: "-1=failed"
    description: "-1=failed, 0=pending,1=success"
    enum_values:
      - {value: -1, label: "failed"}
      - {value: 0, label: "pending"}
      - {value: 1, label: "success"}

relations: []

common_queries:
  - question: "HUB报告生成记录表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_report_center`;
    tables: ["sys_report_center"]
    difficulty: "easy"
  - question: "最近30天HUB报告生成记录表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_report_center`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["sys_report_center"]
    difficulty: "easy"
  - question: "HUB报告生成记录表按状态分布"
    sql: |
      SELECT
          CASE report_status
            WHEN -1 THEN 'failed'
            WHEN 0 THEN 'pending'
            WHEN 1 THEN 'success'
            ELSE CONCAT('其他:', CAST(report_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`sys_report_center`
      GROUP BY report_status
      ORDER BY COUNT(*) DESC;
    tables: ["sys_report_center"]
    difficulty: "medium"

review_required:
