table:
  name: "issuing_card_generate_number"
  database: "dwd_banking"
  display_name: "制卡数据表"
  description: |
    这张表记录 UQPAY 发卡业务中的制卡数据。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "卡片", "生成", "卡号", "issuing_card_generate_number"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "master_id"
    type: "varchar(36)"
    display_name: "master id"
    description: "master id"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "账户ID"

  - name: "batch_id"
    type: "varchar(36)"
    display_name: "批次号"
    description: "批次号"

  - name: "task_id"
    type: "varchar(36)"
    display_name: "任务号"
    description: "任务号"

  - name: "card_scheme"
    type: "smallint"
    display_name: "卡组织"
    description: "卡品牌 1000=VISA  2000=MASTER"
    enum_values:
      - {value: 1000, label: "VISA"}
      - {value: 2000, label: "MASTER"}

  - name: "bin_mode"
    type: "tinyint"
    display_name: "二级卡bin模式，0=PUBLIC"
    description: "二级卡bin模式，0=PUBLIC, 1=PRIVATE"
    enum_values:
      - {value: 0, label: "PUBLIC"}
      - {value: 1, label: "PRIVATE"}

  - name: "card_form"
    type: "smallint"
    display_name: "1000=VIRTUAL"
    description: "1000=VIRTUAL, 2000=PHYSICAL"
    enum_values:
      - {value: 1000, label: "VIRTUAL"}
      - {value: 2000, label: "PHYSICAL"}

  - name: "card_type"
    type: "smallint"
    display_name: "卡类型"
    description: "Card type - 1000=PREPAID 2000=DEBIT"
    enum_values:
      - {value: 1000, label: "PREPAID"}
      - {value: 2000, label: "DEBIT"}

  - name: "make_card_type"
    type: "varchar(10)"
    display_name: "制卡类型"
    description: "制卡类型：BB:Basic Black, CB:Co Brand Black, BW: Basic White, CW: Co Brand White"

  - name: "physical_card_type"
    type: "smallint"
    display_name: "Physical card type - 100"
    description: "Physical card type - 1000=regular 2000=co-brand"
    enum_values:
      - {value: 1000, label: "regular"}
      - {value: 2000, label: "co-brand"}

  - name: "request_numbers"
    type: "varchar(30)"
    display_name: "card sub bin请求的卡号数量"
    description: "card sub bin请求的卡号数量"
    skip_index: true

  - name: "generated_status"
    type: "tinyint"
    display_name: "卡号生成状态。0-Pending 1- Proc"
    description: "卡号生成状态。0-Pending 1- Processing 2-Completed 3-Failed "
    enum_values:
      - {value: 0, label: "Pending"}
      - {value: 1, label: "Processing"}
      - {value: 2, label: "Completed"}
      - {value: 3, label: "Failed"}

  - name: "transfer_method"
    type: "tinyint"
    display_name: "- 1 SFTP"
    description: "- 1 SFTP, 2 Email"
    sensitive: true

  - name: "email_address"
    type: "varchar(255)"
    display_name: "Email"
    description: "Email"
    sensitive: true

  - name: "created_status"
    type: "tinyint"
    display_name: "制卡数据生成状态。0-Pending 1- Pr"
    description: "制卡数据生成状态。0-Pending 1- Processing 2-Completed 3-Failed "
    enum_values:
      - {value: 0, label: "Pending"}
      - {value: 1, label: "Processing"}
      - {value: 2, label: "Completed"}
      - {value: 3, label: "Failed"}

  - name: "transfer_status"
    type: "tinyint"
    display_name: "制卡数据传给卡厂的传输状态。0-Pending-"
    description: "制卡数据传给卡厂的传输状态。0-Pending- 1-Processing -2-Success -3Failed \\n"
    enum_values:
      - {value: 0, label: "Pending-"}
      - {value: 1, label: "Processing"}
      - {value: -2, label: "Success -3Failed \\n"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "任务创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "任务更新时间"

relations: []

common_queries:
  - question: "制卡数据表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_generate_number`;
    tables: ["issuing_card_generate_number"]
    difficulty: "easy"
  - question: "最近30天制卡数据表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_generate_number`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_card_generate_number"]
    difficulty: "easy"
  - question: "制卡数据表按状态分布"
    sql: |
      SELECT
          CASE generated_status
            WHEN 0 THEN 'Pending'
            WHEN 1 THEN 'Processing'
            WHEN 2 THEN 'Completed'
            WHEN 3 THEN 'Failed'
            ELSE CONCAT('其他:', CAST(generated_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_card_generate_number`
      GROUP BY generated_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_card_generate_number"]
    difficulty: "medium"
  - question: "制卡数据表按account_id分布最多的是哪些"
    sql: |
      SELECT account_id AS "account_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_generate_number`
      WHERE account_id IS NOT NULL AND account_id != ''
      GROUP BY account_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_card_generate_number"]
    difficulty: "easy"

