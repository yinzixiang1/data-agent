table:
  name: "pmt_finance_payout"
  database: "dwd_banking"
  display_name: "付款订单表"
  description: |
    这张表记录支付/银行账户业务中的付款订单。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "资金", "付款", "pmt_finance_payout"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "payout_id"
    type: "varchar(36)"
    display_name: "付款id"
    description: "付款订单表字段 payout_id。"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "付款订单表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "付款订单表字段 account_id。"

  - name: "source_amount"
    type: "decimal(16,4)"
    display_name: "sourceamount"
    description: "付款订单表字段 source_amount。"

  - name: "source_currency"
    type: "varchar(6)"
    display_name: "source币种"
    description: "付款订单表字段 source_currency。"

  - name: "target_amount"
    type: "decimal(16,4)"
    display_name: "targetamount"
    description: "付款订单表字段 target_amount。"

  - name: "target_currency"
    type: "varchar(6)"
    display_name: "target币种"
    description: "付款订单表字段 target_currency。"

  - name: "fee_amount"
    type: "decimal(16,4)"
    display_name: "手续费"
    description: "手续费"

  - name: "beneficiary_id"
    type: "varchar(36)"
    display_name: "受益人ID"
    description: "受益人ID"

  - name: "beneficiary_body"
    type: "text"
    display_name: "受益人快照"
    description: "受益人快照"
    skip_index: true

  - name: "payer_id"
    type: "varchar(36)"
    display_name: "付款人ID，如果为0，就是当前账户"
    description: "付款人ID，如果为0，就是当前账户（机构/商户）。"

  - name: "channel_req_body"
    type: "text"
    display_name: "渠道下发信息"
    description: "渠道下发信息: {\"settlement_amount\": \"\", \"payment_purpose\": \"\", \"industry_type\": \"\", \"docs_id\": \"\"}"
    skip_index: true

  - name: "channel_resp_id"
    type: "varchar(100)"
    display_name: "渠道respid"
    description: "付款订单表字段 channel_resp_id。"

  - name: "channel_resp_status"
    type: "varchar(20)"
    display_name: "渠道respstatus"
    description: "付款订单表字段 channel_resp_status。"

  - name: "channel_resp_body"
    type: "text"
    display_name: "渠道respbody"
    description: "付款订单表字段 channel_resp_body。"
    skip_index: true

  - name: "execute_reason"
    type: "text"
    display_name: "[内部]对应失败原因"
    description: "[内部]对应失败原因"
    skip_index: true

  - name: "mt103_id"
    type: "varchar(36)"
    display_name: "mt103 id"
    description: "mt103 id"

  - name: "submission"
    type: "text"
    display_name: "mt103"
    description: "mt103"
    skip_index: true

  - name: "short_account_id"
    type: "varchar(20)"
    display_name: "账户短号"
    description: "短ACCOUNT ID "

  - name: "short_reference_id"
    type: "varchar(20)"
    display_name: "shortreferenceid"
    description: "付款订单表字段 short_reference_id。"

  - name: "unique_request_id"
    type: "varchar(36)"
    display_name: "User-generated idempoten"
    description: "User-generated idempotency key."
    skip_index: true

  - name: "payment_internal_info"
    type: "varchar(255)"
    display_name: "为payout internal做信息存储，方便"
    description: "为payout internal做信息存储，方便校对 "
    skip_index: true

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "creatorid"
    description: "付款订单表字段 creator_id。"

  - name: "transaction_id"
    type: "varchar(36)"
    display_name: "交易id"
    description: "付款订单表字段 transaction_id。"

  - name: "create_time"
    type: "datetime(3)"
    display_name: "创建时间"
    description: "付款订单表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "付款订单表字段 update_time。"

  - name: "debit_status"
    type: "int"
    display_name: "扣款状态 -1=异常 0=默认 1=已扣款"
    description: "扣款状态 -1=异常 0=默认 1=已扣款"
    enum_values:
      - {value: -1, label: "异常"}
      - {value: 0, label: "默认"}
      - {value: 1, label: "已扣款"}

  - name: "refund_status"
    type: "int"
    display_name: "退款状态"
    description: "-1=REFUND_FAILURE-退款失败，0=NOT_NEED_REFUND-默认状态, 1=REFUND_SUCCESS-退款成功, 2=REFUND_APPROVE-退款审核, 3=REFUND_REFUSE-退款拒绝"
    enum_values:
      - {value: -1, label: "REFUND_FAILURE-退款失败"}
      - {value: 0, label: "NOT_NEED_REFUND-默认状态"}
      - {value: 1, label: "REFUND_SUCCESS-退款成功"}
      - {value: 2, label: "REFUND_APPROVE-退款审核"}
      - {value: 3, label: "REFUND_REFUSE-退款拒绝"}

  - name: "review_status"
    type: "tinyint(1)"
    display_name: "审查状态"
    description: "审查状态：1=passed, 0=in_review, -1=rejected"
    enum_values:
      - {value: 1, label: "passed"}
      - {value: 0, label: "in_review"}
      - {value: -1, label: "rejected"}

  - name: "payout_status"
    type: "tinyint(1)"
    display_name: "状态"
    description: "状态：-1=失败，0=pending，1=completed，2=已提交渠道，3=客户挂起(可取消)，9=提交渠道失败"
    enum_values:
      - {value: -1, label: "失败"}
      - {value: 0, label: "pending"}
      - {value: 1, label: "completed"}
      - {value: 2, label: "已提交渠道"}
      - {value: 3, label: "客户挂起(可取消)"}
      - {value: 9, label: "提交渠道失败"}

  - name: "status_type"
    type: "varchar(15)"
    display_name: "状态类型"
    description: "状态类型（标记流转来源）：normal（原生状态），reverse（逆向回退）"

  - name: "payout_way"
    type: "int"
    display_name: "0-商户端创建 1-接口创建"
    description: "0-商户端创建 1-接口创建"
    enum_values:
      - {value: 0, label: "商户端创建"}
      - {value: 1, label: "接口创建"}

  - name: "risk_level"
    type: "int"
    display_name: "风险等级 0=无风险"
    description: "风险等级 0=无风险,>0风险等级,数值越大，风险越高"
    enum_values:
      - {value: 0, label: "无风险,>0风险等级,数值越大,风险越高"}

  - name: "risk_remark"
    type: "text"
    display_name: "风险备注"
    description: "风险备注"
    skip_index: true

relations:
  - column: "payer_id"
    target_table: "pmt_payment_payer"
    target_column: "payer_id"
    join_type: "LEFT JOIN"
    description: "付款报表按 payer_id 关联付款方，来源 uqpay-task/internal/repository/store/finance_payout_store.go"
  - column: "account_id"
    target_table: "pmt_account"
    target_column: "account_id"
    join_type: "LEFT JOIN"
    description: "付款报表按 account_id 关联账户，来源 uqpay-task/internal/repository/store/finance_payout_store.go"

common_queries:
  - question: "付款订单表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_payout`;
    tables: ["pmt_finance_payout"]
    difficulty: "easy"
  - question: "最近30天付款订单表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_payout`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_finance_payout"]
    difficulty: "easy"
  - question: "付款订单表按状态分布"
    sql: |
      SELECT
          channel_resp_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_finance_payout`
      GROUP BY channel_resp_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_finance_payout"]
    difficulty: "easy"
  - question: "付款订单表按币种汇总金额"
    sql: |
      SELECT source_currency AS "币种", COUNT(*) AS "笔数", SUM(fee_amount) AS "金额"
      FROM dwd_banking.`pmt_finance_payout`
      GROUP BY source_currency
      ORDER BY SUM(fee_amount) DESC;
    tables: ["pmt_finance_payout"]
    difficulty: "medium"
  - question: "付款订单表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_payout`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_finance_payout"]
    difficulty: "easy"

review_required: []

code_sources:
  - "uqpay-task/internal/repository/store/finance_payout_store.go"
  - "uqpay-issuing-admincp-api/internal/domain/entity/pmt_finance_payout.go"
  - "uqpay-issuing-admincp-api/internal/repo/finace_payout_repo.go"
  - "uqpay-issuing-admincp-api/internal/service/pdf_service.go"
  - "uqpay-issuing-admincp-api/internal/service/pmt_account_documents_service.go"
  - "uqpay-issuing-admincp-api/internal/service/pmt_finance_payout_service.go"
  - "uqpay-issuing-admincp-api/internal/service/pmt_finance_refund_service.go"
  - "uqpay-issuing-admincp-api/internal/service/pmt_payment_payer_service.go"
