table:
  name: "sys_currency_code"
  database: "dwd_banking"
  display_name: "系统币种表"
  description: |
    这张表记录系统侧的系统币种。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "币种", "code", "sys_currency_code"]
  query_tips: "时间范围优先使用 update_time 字段。"

columns:
  - name: "currency_type"
    type: "int"
    display_name: "币种类型 1000=fiat 2000=cryp"
    description: "币种类型 1000=fiat 2000=crypto"
    enum_values:
      - {value: 1000, label: "fiat"}
      - {value: 2000, label: "crypto"}

  - name: "currency_name"
    type: "varchar(60)"
    display_name: "币种name"
    description: "系统币种表字段 currency_name。"

  - name: "currency_code"
    type: "varchar(8)"
    display_name: "币种code"
    description: "系统币种表字段 currency_code。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "创建/更新时间"

  - name: "currency_status"
    type: "tinyint(1)"
    display_name: "币种status"
    description: "系统币种表字段 currency_status。"

  - name: "currency_symbol"
    type: "varchar(10)"
    display_name: "币种符号"
    description: "币种符号"

relations: []

common_queries:
  - question: "系统币种表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_currency_code`;
    tables: ["sys_currency_code"]
    difficulty: "easy"
  - question: "最近30天系统币种表每天新增多少"
    sql: |
      SELECT DATE(update_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_currency_code`
      WHERE update_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(update_time)
      ORDER BY DATE(update_time) DESC;
    tables: ["sys_currency_code"]
    difficulty: "easy"
  - question: "系统币种表按状态分布"
    sql: |
      SELECT
          currency_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`sys_currency_code`
      GROUP BY currency_status
      ORDER BY COUNT(*) DESC;
    tables: ["sys_currency_code"]
    difficulty: "easy"

review_required:
