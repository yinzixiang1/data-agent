table:
  name: "pmt_account"
  database: "dwd_banking"
  display_name: "商户账户表"
  description: |
    这张表记录支付/银行账户业务中的商户账户。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "账户", "pmt_account"]
  query_tips: "查询业务有效数据时通常需要增加 is_delete = 0。时间范围优先使用 create_time 字段。"

columns:
  - name: "customer_id"
    type: "varchar(36)"
    display_name: "客户ID"
    description: "客户ID"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "父ID（常用于机构模式）"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "系统内部账户ID"

  - name: "account_type"
    type: "int"
    display_name: "账户类型"
    description: "1000=普通账户；2000=License Payment Service Provider（LPSP）；2001=Technical Payment Service Provider（TPSP）；3000=Referral Payment Service  Provider（RPSP）"
    enum_values:
      - {value: 1000, label: "普通账户"}
      - {value: 2000, label: "License Payment Service Provider（LPSP）"}
      - {value: 2001, label: "Technical Payment Service Provider（TPSP）"}
      - {value: 3000, label: "Referral Payment Service  Provider（RPSP）"}

  - name: "legal_entity_type"
    type: "int"
    display_name: "法律实体类型"
    description: "1000=individual 2000=company"
    enum_values:
      - {value: 1000, label: "individual"}
      - {value: 2000, label: "company"}

  - name: "legal_first_name"
    type: "varchar(120)"
    display_name: "legal_entity_type= indiv"
    description: "legal_entity_type= individual时填写"
    sensitive: true

  - name: "legal_last_name"
    type: "varchar(255)"
    display_name: "legal_entity_type= indiv"
    description: "legal_entity_type= individual时填写"
    sensitive: true

  - name: "legal_date_of_birth"
    type: "date"
    display_name: "legal_entity_type= indiv"
    description: "legal_entity_type= individual时填写"
    sensitive: true

  - name: "identification_type"
    type: "int"
    display_name: "证件类型"
    description: "1000-passport, 1001-Drivers License; 1002=National ID， 2000-Incorporation number"
    sensitive: true

  - name: "identification_value"
    type: "varchar(48)"
    display_name: "identificationvalue"
    description: "商户账户表字段 identification_value。"
    sensitive: true

  - name: "identification_issue_date"
    type: "varchar(10)"
    display_name: "对应证书签发时间 Format"
    description: "对应证书签发时间 Format：YYYY-MM-DD"
    sensitive: true

  - name: "identification_expiry_date"
    type: "varchar(10)"
    display_name: "对应证书过期时间 Format"
    description: "对应证书过期时间 Format：YYYY-MM-DD"
    sensitive: true

  - name: "industry_mcc_info"
    type: "text"
    display_name: "行业属性"
    description: "行业属性"
    skip_index: true

  - name: "business_owners"
    type: "text"
    display_name: "企业权益人"
    description: "企业权益人"
    skip_index: true

  - name: "address"
    type: "varchar(255)"
    display_name: "address"
    description: "商户账户表字段 address。"
    sensitive: true

  - name: "trading_address"
    type: "text"
    display_name: "tradingaddress"
    description: "商户账户表字段 trading_address。"
    sensitive: true
    skip_index: true

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "商户账户表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "商户账户表字段 update_time。"

  - name: "short_account_id"
    type: "varchar(36)"
    display_name: "账户短号"
    description: "商户短号"

  - name: "ref_bnb_sub_email"
    type: "varchar(200)"
    display_name: "refbnbsubemail"
    description: "商户账户表字段 ref_bnb_sub_email。"
    sensitive: true

  - name: "ref_cc_account_id"
    type: "varchar(36)"
    display_name: "关联CC ID"
    description: "关联CC ID"

  - name: "ref_dbs_account_id"
    type: "varchar(36)"
    display_name: "关联DBS ID"
    description: "关联DBS ID"

  - name: "verification_status"
    type: "tinyint(1)"
    display_name: "KYC/KYB认证状态"
    description: "KYC/KYB 认证状态 -1=拒绝, 2=pending, 1=approved"
    enum_values:
      - {value: -1, label: "拒绝"}
      - {value: 0, label: "默认/未认证"}
      - {value: 1, label: "已通过"}
      - {value: 2, label: "审核中"}

  - name: "api_trading_status"
    type: "tinyint(1)"
    display_name: "API交易状态"
    description: "1：启用；-1:禁用"
    enum_values:
      - {value: 1, label: "启用"}
      - {value: -1, label: "禁用"}

  - name: "account_status"
    type: "tinyint(1)"
    display_name: "账户状态"
    description: "0:default, 1:active, 2:inactive"
    enum_values:
      - {value: 0, label: "default"}
      - {value: 1, label: "active"}
      - {value: 2, label: "inactive"}

  - name: "auth_decision_status"
    type: "tinyint(1)"
    display_name: "授权决策开关"
    description: "授权决策开关：0=关,1=开"
    enum_values:
      - {value: 0, label: "关"}
      - {value: 1, label: "开"}

  - name: "auth_decision_key"
    type: "text"
    display_name: "授权决策公钥"
    description: "授权决策公钥"
    skip_index: true

  - name: "main_email"
    type: "varchar(120)"
    display_name: "开户邮箱"
    description: "开户邮箱"
    sensitive: true

  - name: "sync_to_uq"
    type: "int"
    display_name: "同步到UQ状态"
    description: "同步到UQ表标记：0=未同步，1=已同步，2=暂不处理"
    enum_values:
      - {value: 0, label: "未同步"}
      - {value: 1, label: "已同步"}
      - {value: 2, label: "暂不处理"}

  - name: "white_label_status"
    type: "tinyint(1)"
    display_name: "白标状态"
    description: "白标状态： 0=未开通，1=已开通"
    enum_values:
      - {value: 0, label: "未开通"}
      - {value: 1, label: "已开通"}

  - name: "restrict_id"
    type: "int"
    display_name: "约束ID"
    description: "约束ID：找1001类型的"

  - name: "inherit_type"
    type: "int"
    display_name: "账户继承类型"
    description: "账户继承类型：0=默认；账户类型: 1=master 2=sub_same_uen 3=sub_diff_uen 4=sub_personal"
    enum_values:
      - {value: 0, label: "默认,账户类型:"}
      - {value: 1, label: "master"}
      - {value: 2, label: "sub_same_uen"}
      - {value: 3, label: "sub_diff_uen"}
      - {value: 4, label: "sub_personal"}

relations: []

common_queries:
  - question: "商户账户表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account`;
    tables: ["pmt_account"]
    difficulty: "easy"
  - question: "最近30天商户账户表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_account"]
    difficulty: "easy"
  - question: "商户账户表按状态分布"
    sql: |
      SELECT
          CASE verification_status
            WHEN -1 THEN '拒绝'
            WHEN 0 THEN '默认/未认证'
            WHEN 1 THEN '已通过'
            WHEN 2 THEN '审核中'
            ELSE CONCAT('其他:', CAST(verification_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_account`
      GROUP BY verification_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_account"]
    difficulty: "medium"
  - question: "商户账户表按customer_id分布最多的是哪些"
    sql: |
      SELECT customer_id AS "customer_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account`
      WHERE customer_id IS NOT NULL AND customer_id != ''
      GROUP BY customer_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_account"]
    difficulty: "easy"

