table:
  name: "sys_key_value_mapping"
  database: "dwd_banking"
  display_name: "映射表"
  description: |
    这张表记录系统侧的映射。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "key", "value", "映射", "sys_key_value_mapping"]
  query_tips: "时间范围优先使用 updated_at 字段。"

columns:
  - name: "id"
    type: "int"
    display_name: "主键ID"
    description: "映射表字段 id。"

  - name: "mapping_key"
    type: "varchar(255)"
    display_name: "映射的键"
    description: "映射的键"
    sensitive: true

  - name: "mapping_value"
    type: "varchar(500)"
    display_name: "映射的值"
    description: "映射的值"
    sensitive: true

  - name: "description"
    type: "text"
    display_name: "description"
    description: "映射表字段 description。"
    skip_index: true

relations: []

common_queries:
  - question: "映射表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_key_value_mapping`;
    tables: ["sys_key_value_mapping"]
    difficulty: "easy"
  - question: "最近30天映射表每天新增多少"
    sql: |
      SELECT DATE(updated_at) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_key_value_mapping`
      WHERE updated_at >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(updated_at)
      ORDER BY DATE(updated_at) DESC;
    tables: ["sys_key_value_mapping"]
    difficulty: "easy"
  - question: "映射表最近创建的记录有哪些"
    sql: |
      SELECT *
      FROM dwd_banking.`sys_key_value_mapping`
      ORDER BY updated_at DESC
      LIMIT 100;
    tables: ["sys_key_value_mapping"]
    difficulty: "easy"

