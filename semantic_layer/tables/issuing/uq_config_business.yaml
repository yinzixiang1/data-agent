table:
  name: "uq_config_business"
  database: "dwd_banking"
  display_name: "业务编码配置表"
  description: |
    这张表记录业务编码配置相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uq", "配置", "业务", "uq_config_business"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "main_bus_id"
    type: "varchar(36)"
    display_name: "0"
    description: "0"

  - name: "bus_id"
    type: "varchar(36)"
    display_name: "业务ID"
    description: "业务ID"

  - name: "bus_secret"
    type: "varchar(100)"
    display_name: "业务密钥"
    description: "业务密钥"
    sensitive: true

  - name: "bus_type"
    type: "int"
    display_name: "主业务类型"
    description: "主业务类型：0=默认，VA=1000，FX=2000，AC=3000，IC=4000"
    enum_values:
      - {value: 0, label: "默认,VA=1000,FX=2000,AC=3000,IC=4000"}

  - name: "bus_rank"
    type: "int"
    display_name: "业务级别"
    description: "业务级别：0=默认，1=1级，2=2级"
    enum_values:
      - {value: 0, label: "默认"}
      - {value: 1, label: "1级"}
      - {value: 2, label: "2级"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "业务编码配置表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "业务编码配置表字段 update_time。"

  - name: "bus_status"
    type: "int"
    display_name: "业务状态"
    description: "业务状态：-1不可用，0默认，1可用"

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "创建者ID"
    description: "创建者ID"

relations: []

common_queries:
  - question: "业务编码配置表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_config_business`;
    tables: ["uq_config_business"]
    difficulty: "easy"
  - question: "最近30天业务编码配置表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_config_business`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uq_config_business"]
    difficulty: "easy"
  - question: "业务编码配置表按状态分布"
    sql: |
      SELECT
          bus_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uq_config_business`
      GROUP BY bus_status
      ORDER BY COUNT(*) DESC;
    tables: ["uq_config_business"]
    difficulty: "easy"

