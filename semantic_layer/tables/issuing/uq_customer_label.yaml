relations: []

common_queries:
  - question: "UQ_客户白标配置表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_label`;
    tables: ["uq_customer_label"]
    difficulty: "easy"
  - question: "最近30天UQ_客户白标配置表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_label`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uq_customer_label"]
    difficulty: "easy"
  - question: "UQ_客户白标配置表按状态分布"
    sql: |
      SELECT
          CASE label_status
            WHEN -1 THEN '关闭'
            WHEN 0 THEN '默认'
            WHEN 1 THEN '正常开通'
            ELSE CONCAT('其他:', CAST(label_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uq_customer_label`
      GROUP BY label_status
      ORDER BY COUNT(*) DESC;
    tables: ["uq_customer_label"]
    difficulty: "medium"
  - question: "UQ_客户白标配置表按customer_id分布最多的是哪些"
    sql: |
      SELECT customer_id AS "customer_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_label`
      WHERE customer_id IS NOT NULL AND customer_id != ''
      GROUP BY customer_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uq_customer_label"]
    difficulty: "easy"

