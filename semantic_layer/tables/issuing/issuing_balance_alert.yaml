table:
  name: "issuing_balance_alert"
  database: "dwd_banking"
  display_name: "账户余额报警表"
  description: |
    这张表记录 UQPAY 发卡业务中的账户余额报警。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "余额", "预警", "issuing_balance_alert"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(48)"
    display_name: "直属账户ID"
    description: "账户余额报警表字段 direct_id。"

  - name: "account_id"
    type: "varchar(48)"
    display_name: "账户ID"
    description: "账户余额报警表字段 account_id。"

  - name: "target_account_id"
    type: "varchar(48)"
    display_name: "目标ACID"
    description: "目标ACID"

  - name: "short_account_id"
    type: "varchar(36)"
    display_name: "账户短号"
    description: "目标account短号"

  - name: "alert_id"
    type: "varchar(48)"
    display_name: "通知ID"
    description: "通知ID"

  - name: "alert_amount1"
    type: "decimal(16,2)"
    display_name: "报警金额第一档位"
    description: "报警金额第一档位"

  - name: "alert_currency1"
    type: "varchar(4)"
    display_name: "第一档位币种"
    description: "第一档位币种"

  - name: "alert_status1"
    type: "tinyint"
    display_name: "报警标识1"
    description: "报警标识1：0=未报警，1=已报警"
    enum_values:
      - {value: 0, label: "未报警"}
      - {value: 1, label: "已报警"}

  - name: "alert_amount2"
    type: "decimal(16,2)"
    display_name: "报警金额第二档位"
    description: "报警金额第二档位"

  - name: "alert_currency2"
    type: "varchar(4)"
    display_name: "第二档位币种"
    description: "第二档位币种"

  - name: "alert_status2"
    type: "tinyint"
    display_name: "报警标识2"
    description: "报警标识2：0=未报警，1=已报警"
    enum_values:
      - {value: 0, label: "未报警"}
      - {value: 1, label: "已报警"}

  - name: "alert_amount3"
    type: "decimal(16,2)"
    display_name: "报警金额第三档位"
    description: "报警金额第三档位"

  - name: "alert_currency3"
    type: "varchar(4)"
    display_name: "第三档位币种"
    description: "第三档位币种"

  - name: "alert_status3"
    type: "tinyint"
    display_name: "报警标识3"
    description: "报警标识3：0=未报警，1=已报警"
    enum_values:
      - {value: 0, label: "未报警"}
      - {value: 1, label: "已报警"}

  - name: "alert_email"
    type: "varchar(255)"
    display_name: "报警通知邮箱"
    description: "报警通知邮箱"
    sensitive: true

  - name: "short_reference_id"
    type: "varchar(20)"
    display_name: "系统短号ID"
    description: "系统短号ID"

  - name: "create_time"
    type: "datetime(3)"
    display_name: "创建时间"
    description: "账户余额报警表字段 create_time。"

  - name: "update_time"
    type: "datetime(3)"
    display_name: "更新时间"
    description: "账户余额报警表字段 update_time。"

  - name: "status"
    type: "tinyint"
    display_name: "状态"
    description: "报警开启状态 0=CLOSED，1=OPENED"
    enum_values:
      - {value: 0, label: "CLOSED"}
      - {value: 1, label: "OPENED"}

relations: []

common_queries:
  - question: "账户余额报警表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_balance_alert`;
    tables: ["issuing_balance_alert"]
    difficulty: "easy"
  - question: "最近30天账户余额报警表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_balance_alert`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_balance_alert"]
    difficulty: "easy"
  - question: "账户余额报警表按状态分布"
    sql: |
      SELECT
          CASE alert_status1
            WHEN 0 THEN '未报警'
            WHEN 1 THEN '已报警'
            ELSE CONCAT('其他:', CAST(alert_status1 AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_balance_alert`
      GROUP BY alert_status1
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_balance_alert"]
    difficulty: "medium"
  - question: "账户余额报警表按币种汇总金额"
    sql: |
      SELECT alert_currency1 AS "币种", COUNT(*) AS "笔数", SUM(alert_amount1) AS "金额"
      FROM dwd_banking.`issuing_balance_alert`
      GROUP BY alert_currency1
      ORDER BY SUM(alert_amount1) DESC;
    tables: ["issuing_balance_alert"]
    difficulty: "medium"
  - question: "账户余额报警表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_balance_alert`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_balance_alert"]
    difficulty: "easy"

