    type: "bigint unsigned"
    display_name: "主键ID"
    description: "拦截交易白名单规则表字段 id。"

  - name: "rule_id"
    type: "varchar(64)"
    display_name: "规则唯一ID"
    description: "规则唯一ID（雪花ID）"

