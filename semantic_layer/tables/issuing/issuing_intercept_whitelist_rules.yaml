relations: []

common_queries:
  - question: "拦截交易白名单规则表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_intercept_whitelist_rules`;
    tables: ["issuing_intercept_whitelist_rules"]
    difficulty: "easy"
  - question: "最近30天拦截交易白名单规则表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_intercept_whitelist_rules`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_intercept_whitelist_rules"]
    difficulty: "easy"
  - question: "拦截交易白名单规则表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN 0 THEN '禁用'
            WHEN 1 THEN '启用'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_intercept_whitelist_rules`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_intercept_whitelist_rules"]
    difficulty: "medium"

