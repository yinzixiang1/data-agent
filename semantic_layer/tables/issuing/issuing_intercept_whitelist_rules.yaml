      - {value: 2, label: "Account"}
      - {value: 3, label: "Card"}

  - name: "subject_id"
    type: "varchar(64)"
    display_name: "主体ID"
    description: "主体ID（Master ID / Account ID / Card ID）"

  - name: "merchant_id"
    type: "varchar(128)"
    display_name: "Merchant ID"
