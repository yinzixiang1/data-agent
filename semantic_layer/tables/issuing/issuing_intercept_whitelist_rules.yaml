table:
  name: "issuing_intercept_whitelist_rules"
  database: "dwd_banking"
  display_name: "拦截交易白名单规则表"
  description: |
    这张表记录 UQPAY 发卡业务中的拦截交易白名单规则。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "拦截", "白名单", "规则", "issuing_intercept_whitelist_rules"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
