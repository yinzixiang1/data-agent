table:
  name: "pmt_card_transactions"
  database: "dwd_banking"
  display_name: "卡交易明细表"
  description: |
    这张表记录支付/银行账户业务中的卡交易明细。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "卡片", "交易", "pmt_card_transactions"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "card_id"
    type: "varchar(36)"
    display_name: "卡片ID"
    description: "TripLink专用卡标识 卡关联ID"

  - name: "direct_id"
    type: "varchar(48)"
    display_name: "直属账户ID"
    description: "卡交易明细表字段 direct_id。"

  - name: "account_id"
    type: "varchar(48)"
    display_name: "账户ID"
    description: "卡交易明细表字段 account_id。"

  - name: "card_holder_id"
    type: "varchar(36)"
    display_name: "持卡人ID"
    description: "卡交易明细表字段 card_holder_id。"

  - name: "transaction_id"
    type: "varchar(36)"
    display_name: "系统内TXID"
    description: "系统内TXID"

  - name: "transaction_type"
    type: "smallint"
    display_name: "交易类型"
    description: "参考LARK编码表"

  - name: "card_number"
    type: "varchar(36)"
    display_name: "卡号"
    description: "蒙遮卡号 4001-35xx-xxxx-1950"
    sensitive: true

  - name: "local_amount"
    type: "decimal(16,2)"
    display_name: "本地交易金额"
    description: "本地交易金额	"

  - name: "local_currency"
    type: "varchar(4)"
    display_name: "本地交易币种"
    description: "本地交易币种	"

  - name: "transaction_amount"
    type: "decimal(16,2)"
    display_name: "账单金额"
    description: "账单金额"

  - name: "transaction_currency"
    type: "varchar(4)"
    display_name: "账单币种"
    description: "账单币种"

  - name: "txn_basic_currency"
    type: "varchar(6)"
    display_name: "txnbasic币种"
    description: "卡交易明细表字段 txn_basic_currency。"

  - name: "txn_markup_currency"
    type: "varchar(6)"
    display_name: "txnmarkup币种"
    description: "卡交易明细表字段 txn_markup_currency。"

  - name: "balance_transaction_id"
    type: "varchar(36)"
    display_name: "账户余额明细ID，关联finance_trans"
    description: "账户余额明细ID，关联finance_transactions表，shared模式下启用"

  - name: "merchant_id"
    type: "varchar(100)"
    display_name: "商户ID"
    description: "商户ID	"

  - name: "channel_resp_body"
    type: "text"
    display_name: "渠道respbody"
    description: "卡交易明细表字段 channel_resp_body。"
    skip_index: true

  - name: "channel_transaction_id"
    type: "varchar(255)"
    display_name: "关联渠道的TXID"
    description: "关联渠道的TXID"

  - name: "short_account_id"
    type: "varchar(20)"
    display_name: "账户短号"
    description: "account短号"

  - name: "short_reference_id"
    type: "varchar(20)"
    display_name: "系统短号ID"
    description: "系统短号ID"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "卡交易明细表字段 create_time。"

  - name: "posted_status"
    type: "smallint"
    display_name: "交易是否已经入账 -1=失败，1=成功"
    description: "交易是否已经入账 -1=失败，1=成功"
    enum_values:
      - {value: -1, label: "失败"}
      - {value: 1, label: "成功"}

  - name: "settlement_status"
    type: "smallint"
    display_name: "结算状态 0=pending，1=settled"
    description: "结算状态 0=pending，1=settled"
    enum_values:
      - {value: 0, label: "pending"}
      - {value: 1, label: "settled"}

  - name: "reversal_status"
    type: "int"
    display_name: "冲正状态"
    description: "冲正状态, 默认状态0, 1: 已冲正"
    enum_values:
      - {value: 1, label: "已冲正"}

  - name: "reconciliation_status"
    type: "int"
    display_name: "对账状态"
    description: "对账状态, 默认0, 已对账:1"

  - name: "debit_credit_status"
    type: "int"
    display_name: "是否完成Debit/Credit"
    description: "是否完成Debit/Credit, 默认0, 已完成: 1"

  - name: "transaction_status"
    type: "smallint"
    display_name: "参考LARK编码表"
    description: "参考LARK编码表"
    enum_values:
      - {value: -2, label: "已删除"}
      - {value: -1, label: "失败"}
      - {value: 0, label: "处理中/待处理"}
      - {value: 1, label: "完成/成功"}

relations: []

common_queries:
  - question: "卡交易明细表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_card_transactions`;
    tables: ["pmt_card_transactions"]
    difficulty: "easy"
  - question: "最近30天卡交易明细表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_card_transactions`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_card_transactions"]
    difficulty: "easy"
  - question: "卡交易明细表按状态分布"
    sql: |
      SELECT
          CASE settlement_status
            WHEN 0 THEN 'pending'
            WHEN 1 THEN 'settled'
            ELSE CONCAT('其他:', CAST(settlement_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_card_transactions`
      GROUP BY settlement_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_card_transactions"]
    difficulty: "medium"
  - question: "卡交易明细表按币种汇总金额"
    sql: |
      SELECT transaction_currency AS "币种", COUNT(*) AS "笔数", SUM(transaction_amount) AS "金额"
      FROM dwd_banking.`pmt_card_transactions`
      GROUP BY transaction_currency
      ORDER BY SUM(transaction_amount) DESC;
    tables: ["pmt_card_transactions"]
    difficulty: "medium"
  - question: "卡交易明细表按card_id分布最多的是哪些"
    sql: |
      SELECT card_id AS "card_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_card_transactions`
      WHERE card_id IS NOT NULL AND card_id != ''
      GROUP BY card_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_card_transactions"]
    difficulty: "easy"

review_required:
  - "未在 Go 代码中找到明确表名或实体引用，字段含义主要来自 DDL COMMENT，需要业务确认。"
  - "未发现可确认的真实代码 JOIN，relations 暂不配置，避免猜测关联。"
