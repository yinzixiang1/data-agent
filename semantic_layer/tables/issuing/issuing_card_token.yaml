table:
  name: "issuing_card_token"
  database: "dwd_banking"
  display_name: "VTS卡Token表"
  description: |
    这张表记录 UQPAY 发卡业务中的VTS卡Token。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "卡片", "钱包令牌", "issuing_card_token"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "token_id"
    type: "varchar(36)"
    display_name: "钱包令牌id"
    description: "VTS卡Token表字段 token_id。"
    sensitive: true

  - name: "card_id"
    type: "varchar(36)"
    display_name: "卡片ID"
    description: "Card ID"

  - name: "token"
    type: "varchar(100)"
    display_name: "钱包令牌"
    description: "VTS卡Token表字段 token。"
    sensitive: true

  - name: "token_requestor_id"
    type: "varchar(100)"
    display_name: "钱包令牌requestorid"
    description: "VTS卡Token表字段 token_requestor_id。"
    sensitive: true
    skip_index: true

  - name: "token_requestor"
    type: "varchar(64)"
    display_name: "Apple Pay、Google Pay、Sam"
    description: "Apple Pay、Google Pay、Samsung Pay、..."
    sensitive: true
    skip_index: true

  - name: "token_assurance_method"
    type: "varchar(2)"
    display_name: "Spaces"
    description: "Spaces (No value set)\\n00 = No issuer ID&V\\n10 = Card issuer account verification\\n11 = Card issuer interactive cardholder authentication - 1 factor\\n12 = Card issuer interactive cardholder authentication - 2 factor\\n13 = Card issuer risk oriented noninteractive cardholder authentication\\n14 = Card issuer asserted authentication"
    sensitive: true

  - name: "token_reference_id"
    type: "varchar(100)"
    display_name: "Token reference ID."
    description: "Token reference ID."
    sensitive: true

  - name: "expire_date"
    type: "varchar(4)"
    display_name: "token expire date"
    description: "token expire date, yymm"
    sensitive: true

  - name: "token_type"
    type: "varchar(2)"
    display_name: "01 = ECOM/COF"
    description: "01 = ECOM/COF (e-commerce/card on file)\\n02 = SE (secure element)\\n03 = CBP (cloud-based payment) <-  HCE \\n05 = E-commerce enabler\\n06 = Pseudo account"
    sensitive: true

  - name: "token_status"
    type: "varchar(5)"
    display_name: "A = Active for payment\\n"
    description: "A = Active for payment\\nI = Inactive for payment (not yet active)\\nS = Temporarily suspended for payments\\nD = Deactivated for consumer-initiated transaction payments,\\nlimited time use for merchantinitiated transaction payments and follow-on transactions\\nP = Pending deactivated"
    sensitive: true

  - name: "pan_reference_id"
    type: "varchar(32)"
    display_name: "Unique reference ID gene"
    description: "Unique reference ID generated by Visa for the card account number."
    sensitive: true

  - name: "status"
    type: "int"
    display_name: "状态"
    description: "状态"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "记录创建时间"

  - name: "pan_source"
    type: "varchar(32)"
    display_name: "01 = Key-entered.\\r\\n02 "
    description: "01 = Key-entered.\\r\\n02 = On file.\\r\\n03 = Mobile banking app.\\r\\n04 = Token.\\r\\n05 = Chip dip\\r\\n06 = Contactless tap"
    sensitive: true

relations: []

common_queries:
  - question: "VTS卡Token表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_token`;
    tables: ["issuing_card_token"]
    difficulty: "easy"
  - question: "最近30天VTS卡Token表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_token`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_card_token"]
    difficulty: "easy"
  - question: "VTS卡Token表按状态分布"
    sql: |
      SELECT
          status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_card_token`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_card_token"]
    difficulty: "easy"
  - question: "VTS卡Token表按card_id分布最多的是哪些"
    sql: |
      SELECT card_id AS "card_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_token`
      WHERE card_id IS NOT NULL AND card_id != ''
      GROUP BY card_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_card_token"]
    difficulty: "easy"

