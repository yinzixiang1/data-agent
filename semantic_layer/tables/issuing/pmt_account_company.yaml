  name: "pmt_account_company"
  database: "dwd_banking"
  display_name: "支付账户企业表"
  description: |
    这张表记录支付/银行账户业务中的支付账户企业。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "账户", "企业", "pmt_account_company"]
  query_tips: "时间范围优先使用 create_time 字段。"

