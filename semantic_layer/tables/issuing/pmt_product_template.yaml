table:
  name: "pmt_product_template"
  database: "dwd_banking"
  display_name: "渠道自己表"
  description: |
    这张表记录支付/银行账户业务中的渠道自己。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "产品", "模板", "pmt_product_template"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "添加时间"

  - name: "update_time"
    type: "datetime(3)"
    display_name: "更新时间"
    description: "更新时间"

  - name: "warning_status"
    type: "tinyint"
    display_name: "预警状态码"
    description: "预警状态码：0=关闭，1=开启"
    enum_values:
      - {value: 0, label: "关闭"}
      - {value: 1, label: "开启"}

  - name: "warning_info"
    type: "text"
    display_name: "预警配置"
    description: "预警配置"
    skip_index: true

relations: []

common_queries:
  - question: "渠道自己表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_product_template`;
    tables: ["pmt_product_template"]
    difficulty: "easy"
  - question: "最近30天渠道自己表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_product_template`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_product_template"]
    difficulty: "easy"
  - question: "渠道自己表按状态分布"
    sql: |
      SELECT
          CASE warning_status
            WHEN 0 THEN '关闭'
            WHEN 1 THEN '开启'
            ELSE CONCAT('其他:', CAST(warning_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_product_template`
      GROUP BY warning_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_product_template"]
    difficulty: "medium"

review_required:
