table:
  name: "uq_customer_attach"
  database: "dwd_banking"
  display_name: "UQ-客户资料表"
  description: |
    这张表记录UQ-客户资料相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uq", "客户", "附件", "uq_customer_attach"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "attach_id"
    type: "varchar(36)"
    display_name: "长ID"
    description: "长ID"

  - name: "attach_type"
    type: "int"
    display_name: "附件适用对象"
    description: "附件适用对象：1000=customer，1001=account"
    enum_values:
      - {value: 1000, label: "customer"}
      - {value: 1001, label: "account"}

  - name: "short_reference_id"
    type: "varchar(36)"
    display_name: "文件短号"
    description: "文件短号"

  - name: "master_id"
    type: "varchar(36)"
    display_name: "父ID"
    description: "父ID"

  - name: "customer_id"
    type: "varchar(36)"
    display_name: "系统内部客户ID"
    description: "系统内部客户ID"

  - name: "short_customer_id"
    type: "varchar(20)"
    display_name: "客户短号"
    description: "客户短号"

  - name: "origin_mode"
    type: "int"
    display_name: "【待删除】来源方式"
    description: "【待删除】来源方式：0默认，1=协议，10=基础，11=额外附件"
    enum_values:
      - {value: 1, label: "协议"}
      - {value: 10, label: "基础"}
      - {value: 11, label: "额外附件"}

  - name: "attach_source"
    type: "smallint"
    display_name: "附件来源"
    description: "附件来源：10=白标配置，1000=基础KYC资料，2000=权益人资料，3000=额外KYB资料，8000=RFI资料，9000=协议附件"
    enum_values:
      - {value: 10, label: "白标配置"}
      - {value: 1000, label: "基础KYC资料"}
      - {value: 2000, label: "权益人资料"}
      - {value: 3000, label: "额外KYB资料"}
      - {value: 8000, label: "RFI资料"}
      - {value: 9000, label: "协议附件"}

  - name: "attach_type_name"
    type: "text"
    display_name: "类型名字"
    description: "类型名字"
    skip_index: true

  - name: "attach_file_type"
    type: "varchar(45)"
    display_name: "文件类型"
    description: "文件类型：文件后缀名 "

  - name: "attach_status"
    type: "tinyint(1)"
    display_name: "附件状态"
    description: "附件状态：0 pending(waiting upload), 1 completed  -1 failed"

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "creatorid"
    description: "UQ-客户资料表字段 creator_id。"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "UQ-客户资料表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "UQ-客户资料表字段 update_time。"

  - name: "attach_config_id"
    type: "varchar(36)"
    display_name: "配置关联ID"
    description: "配置关联ID"

  - name: "ref_reference_id"
    type: "varchar(36)"
    display_name: "关联ID"
    description: "关联ID"

  - name: "ref_short_reference_id"
    type: "varchar(36)"
    display_name: "短号"
    description: "短号"

  - name: "review_status"
    type: "tinyint(1)"
    display_name: "-1"
    description: " -1:审核失败；0:pending；1:审核成功【废弃】"
    enum_values:
      - {value: -1, label: "审核失败"}
      - {value: 0, label: "pending"}
      - {value: 1, label: "审核成功【废弃】"}

  - name: "storage_location"
    type: "tinyint(1)"
    display_name: "1"
    description: "1:cloud;2:local;3:cloud+local"
    enum_values:
      - {value: 1, label: "cloud"}
      - {value: 2, label: "local"}
      - {value: 3, label: "cloud+local"}

  - name: "ref_info_id"
    type: "varchar(36)"
    display_name: "关联info ID"
    description: "关联info ID"
    skip_index: true

  - name: "is_deleted"
    type: "tinyint(1)"
    display_name: "是否删除"
    description: "是否删除:0默认，1=删除，2=正常"
    enum_values:
      - {value: 1, label: "删除"}
      - {value: 2, label: "正常"}

relations: []

common_queries:
  - question: "UQ-客户资料表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_attach`;
    tables: ["uq_customer_attach"]
    difficulty: "easy"
  - question: "最近30天UQ-客户资料表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_attach`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uq_customer_attach"]
    difficulty: "easy"
  - question: "UQ-客户资料表按状态分布"
    sql: |
      SELECT
          attach_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uq_customer_attach`
      GROUP BY attach_status
      ORDER BY COUNT(*) DESC;
    tables: ["uq_customer_attach"]
    difficulty: "easy"
  - question: "UQ-客户资料表按customer_id分布最多的是哪些"
    sql: |
      SELECT customer_id AS "customer_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_attach`
      WHERE customer_id IS NOT NULL AND customer_id != ''
      GROUP BY customer_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uq_customer_attach"]
    difficulty: "easy"

