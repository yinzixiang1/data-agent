common_queries:
  - question: "卡渠道webhook通知记录表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_webhook_record`;
    tables: ["issuing_channel_webhook_record"]
    difficulty: "easy"
  - question: "最近30天卡渠道webhook通知记录表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_webhook_record`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_channel_webhook_record"]
    difficulty: "easy"
  - question: "卡渠道webhook通知记录表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_webhook_record`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_channel_webhook_record"]
    difficulty: "easy"

