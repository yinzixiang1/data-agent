table:
  name: "pmt_developer_webhook"
  database: "dwd_banking"
  display_name: "开发者webhook表"
  description: |
    这张表记录支付/银行账户业务中的开发者webhook。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "开发者", "Webhook", "pmt_developer_webhook"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "开发者webhook表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "开发者webhook表字段 account_id。"

  - name: "webhook_id"
    type: "varchar(36)"
    display_name: "Webhookid"
    description: "开发者webhook表字段 webhook_id。"

  - name: "webhook_events"
    type: "text"
    display_name: "事件类型集合"
    description: "事件类型集合"
    skip_index: true

  - name: "secret_key"
    type: "varchar(64)"
    display_name: "签名算法密钥"
    description: "签名算法密钥"
    sensitive: true

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "开发者webhook表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "开发者webhook表字段 update_time。"

  - name: "webhook_status"
    type: "tinyint(1)"
    display_name: "Webhookstatus"
    description: "开发者webhook表字段 webhook_status。"

relations: []

common_queries:
  - question: "开发者webhook表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_developer_webhook`;
    tables: ["pmt_developer_webhook"]
    difficulty: "easy"
  - question: "最近30天开发者webhook表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_developer_webhook`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_developer_webhook"]
    difficulty: "easy"
  - question: "开发者webhook表按状态分布"
    sql: |
      SELECT
          webhook_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_developer_webhook`
      GROUP BY webhook_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_developer_webhook"]
    difficulty: "easy"
  - question: "开发者webhook表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_developer_webhook`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_developer_webhook"]
    difficulty: "easy"

