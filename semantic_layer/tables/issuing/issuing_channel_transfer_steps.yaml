common_queries:
  - question: "渠道模式转账步骤流水表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_transfer_steps`;
    tables: ["issuing_channel_transfer_steps"]
    difficulty: "easy"
  - question: "最近30天渠道模式转账步骤流水表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_transfer_steps`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_channel_transfer_steps"]
    difficulty: "easy"
  - question: "渠道模式转账步骤流水表按状态分布"
    sql: |
      SELECT
          step_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_channel_transfer_steps`
      GROUP BY step_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_channel_transfer_steps"]
    difficulty: "easy"
  - question: "渠道模式转账步骤流水表按币种汇总金额"
    sql: |
      SELECT transfer_currency AS "币种", COUNT(*) AS "笔数", SUM(fee_amount) AS "金额"
      FROM dwd_banking.`issuing_channel_transfer_steps`
      GROUP BY transfer_currency
      ORDER BY SUM(fee_amount) DESC;
    tables: ["issuing_channel_transfer_steps"]
    difficulty: "medium"
  - question: "渠道模式转账步骤流水表按order_id分布最多的是哪些"
    sql: |
      SELECT order_id AS "order_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_transfer_steps`
      WHERE order_id IS NOT NULL AND order_id != ''
      GROUP BY order_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_channel_transfer_steps"]
    difficulty: "easy"

