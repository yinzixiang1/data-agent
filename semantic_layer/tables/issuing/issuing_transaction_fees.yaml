table:
  name: "issuing_transaction_fees"
  database: "dwd_banking"
  display_name: "发卡交易费用表"
  description: |
    这张表记录 UQPAY 发卡业务中的发卡交易费用。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "交易", "fees", "issuing_transaction_fees"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "发卡交易费用表字段 account_id。"

  - name: "parent_account_id"
    type: "varchar(36)"
    display_name: "parent账户id"
    description: "发卡交易费用表字段 parent_account_id。"

  - name: "transaction_fee_id"
    type: "varchar(36)"
    display_name: "交易feeid"
    description: "发卡交易费用表字段 transaction_fee_id。"

  - name: "card_transaction_id"
    type: "varchar(36)"
    display_name: "交易唯一标识符"
    description: "交易唯一标识符"

  - name: "transaction_amount"
    type: "decimal(12,2)"
    display_name: "交易金额"
    description: "交易金额"

  - name: "transaction_currency"
    type: "varchar(4)"
    display_name: "交易币种"
    description: "交易币种"

  - name: "billing_amount"
    type: "decimal(16,4)"
    display_name: "billingamount"
    description: "发卡交易费用表字段 billing_amount。"

  - name: "billing_currency"
    type: "varchar(4)"
    display_name: "billing币种"
    description: "发卡交易费用表字段 billing_currency。"

  - name: "fee_type"
    type: "smallint"
    display_name: "fee类型"
    description: "fee类型:\\n1000=payin, 1001=deposit, 1002=transfer in, 2000=payout, 2001=transfer out, 4000=issuing purchase, 4001=issuing reversal, 4002= issuing refund, 4003=DISPUTE, 4008=card recharge, 4009=card withdraw, \\n\\n"
    enum_values:
      - {value: 1001, label: "deposit"}
      - {value: 1002, label: "transfer in"}
      - {value: 2000, label: "payout"}
      - {value: 2001, label: "transfer out"}
      - {value: 4000, label: "issuing purchase"}
      - {value: 4001, label: "issuing reversal"}
      - {value: 4002, label: "issuing refund"}
      - {value: 4003, label: "DISPUTE"}
      - {value: 4008, label: "card recharge"}
      - {value: 4009, label: "card withdraw, \\n\\n"}
    skip_index: true

  - name: "fee_amount"
    type: "decimal(16,4)"
    display_name: "授权成功/失败费、争议费，退款费，取现费，注销费"
    description: "授权成功/失败费、争议费，退款费，取现费，注销费等等。非转嫁模式下的。"

  - name: "fee_currency"
    type: "varchar(4)"
    display_name: "Fees币种"
    description: "Fees币种"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "发卡交易费用表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "发卡交易费用表字段 update_time。"

relations: []

common_queries:
  - question: "发卡交易费用表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_transaction_fees`;
    tables: ["issuing_transaction_fees"]
    difficulty: "easy"
  - question: "最近30天发卡交易费用表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_transaction_fees`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_transaction_fees"]
    difficulty: "easy"
  - question: "发卡交易费用表按币种汇总金额"
    sql: |
      SELECT transaction_currency AS "币种", COUNT(*) AS "笔数", SUM(transaction_amount) AS "金额"
      FROM dwd_banking.`issuing_transaction_fees`
      GROUP BY transaction_currency
      ORDER BY SUM(transaction_amount) DESC;
    tables: ["issuing_transaction_fees"]
    difficulty: "medium"
  - question: "发卡交易费用表按account_id分布最多的是哪些"
    sql: |
      SELECT account_id AS "account_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_transaction_fees`
      WHERE account_id IS NOT NULL AND account_id != ''
      GROUP BY account_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_transaction_fees"]
    difficulty: "easy"

