table:
  name: "sys_operation_log"
  database: "dwd_banking"
  display_name: "操作日志表"
  description: |
    这张表记录系统侧的操作日志。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "operation", "日志", "sys_operation_log"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "id"
    type: "bigint"
    display_name: "主键ID"
    description: "操作日志表字段 id。"

  - name: "params"
    type: "text"
    display_name: "请求参数"
    description: "请求参数"
    skip_index: true

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "操作者"
    description: "操作者"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

relations: []

common_queries:
  - question: "操作日志表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_operation_log`;
    tables: ["sys_operation_log"]
    difficulty: "easy"
  - question: "最近30天操作日志表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_operation_log`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["sys_operation_log"]
    difficulty: "easy"
  - question: "操作日志表最近创建的记录有哪些"
    sql: |
      SELECT *
      FROM dwd_banking.`sys_operation_log`
      ORDER BY create_time DESC
      LIMIT 100;
    tables: ["sys_operation_log"]
    difficulty: "easy"

