common_queries:
  - question: "开发者秘钥表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_developer_apikey`;
    tables: ["uq_developer_apikey"]
    difficulty: "easy"
  - question: "最近30天开发者秘钥表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_developer_apikey`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uq_developer_apikey"]
    difficulty: "easy"
  - question: "开发者秘钥表按状态分布"
    sql: |
      SELECT
          apikey_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uq_developer_apikey`
      GROUP BY apikey_status
      ORDER BY COUNT(*) DESC;
    tables: ["uq_developer_apikey"]
    difficulty: "easy"
  - question: "开发者秘钥表按customer_id分布最多的是哪些"
    sql: |
      SELECT customer_id AS "customer_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_developer_apikey`
      WHERE customer_id IS NOT NULL AND customer_id != ''
      GROUP BY customer_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uq_developer_apikey"]
    difficulty: "easy"

