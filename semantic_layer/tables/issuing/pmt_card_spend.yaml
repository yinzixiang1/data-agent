  display_name: "卡消费金额记录表"
  description: |
    这张表记录支付/银行账户业务中的卡消费金额记录。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "卡片", "消费", "pmt_card_spend"]
