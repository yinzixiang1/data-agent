table:
  name: "uq_user_role"
  database: "dwd_banking"
  display_name: "uq用户角色表"
  description: |
    这张表记录uq用户角色相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uq", "用户", "角色", "uq_user_role"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "master_id"
    type: "varchar(36)"
    display_name: "主ID"
    description: "主ID"

  - name: "customer_id"
    type: "varchar(36)"
    display_name: "关联customer_id"
    description: "关联customer_id"

  - name: "role_id"
    type: "varchar(36)"
    display_name: "角色ID"
    description: "角色ID"

  - name: "role_type"
    type: "int"
    display_name: "角色类型"
    description: "角色类型：0默认，1自定义"

  - name: "role_status"
    type: "int"
    display_name: "角色状态"
    description: "角色状态：0默认，1正常， -1禁用"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

relations: []

common_queries:
  - question: "uq用户角色表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_user_role`;
    tables: ["uq_user_role"]
    difficulty: "easy"
  - question: "最近30天uq用户角色表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_user_role`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uq_user_role"]
    difficulty: "easy"
  - question: "uq用户角色表按状态分布"
    sql: |
      SELECT
          role_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uq_user_role`
      GROUP BY role_status
      ORDER BY COUNT(*) DESC;
    tables: ["uq_user_role"]
    difficulty: "easy"
  - question: "uq用户角色表按customer_id分布最多的是哪些"
    sql: |
      SELECT customer_id AS "customer_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_user_role`
      WHERE customer_id IS NOT NULL AND customer_id != ''
      GROUP BY customer_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uq_user_role"]
    difficulty: "easy"

