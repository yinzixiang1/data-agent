table:
  name: "sys_check_aml"
  database: "dwd_banking"
  display_name: "AML表"
  description: |
    这张表记录系统侧的AML。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "检查", "AML检查", "sys_check_aml"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "id"
    type: "bigint"
    display_name: "主键ID"
    description: "AML表字段 id。"

  - name: "first_name"
    type: "varchar(45)"
    display_name: "姓 个人需要填"
    description: "姓 个人需要填"
    sensitive: true

  - name: "last_name"
    type: "varchar(45)"
    display_name: "名称"
    description: "名称"
    sensitive: true

  - name: "entity_type"
    type: "int"
    display_name: "主体类型"
    description: "1000=PERSONAL, 2000=COMPANY"
    enum_values:
      - {value: 1000, label: "PERSONAL"}
      - {value: 2000, label: "COMPANY"}

  - name: "overall_status"
    type: "varchar(20)"
    display_name: "可疑状态"
    description: "可疑状态"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "AML表字段 create_time。"

  - name: "idenfy_body"
    type: "text"
    display_name: "API结果"
    description: "API结果"
    skip_index: true

  - name: "reference_id"
    type: "varchar(48)"
    display_name: "关联ID"
    description: "关联ID"

  - name: "batch_id"
    type: "varchar(32)"
    display_name: "批次号"
    description: "批次号"

  - name: "sumsub_response"
    type: "text"
    display_name: "sumsub API response"
    description: "sumsub API response"
    skip_index: true

relations: []

common_queries:
  - question: "AML表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_check_aml`;
    tables: ["sys_check_aml"]
    difficulty: "easy"
  - question: "最近30天AML表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_check_aml`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["sys_check_aml"]
    difficulty: "easy"
  - question: "AML表按状态分布"
    sql: |
      SELECT
          overall_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`sys_check_aml`
      GROUP BY overall_status
      ORDER BY COUNT(*) DESC;
    tables: ["sys_check_aml"]
    difficulty: "easy"

