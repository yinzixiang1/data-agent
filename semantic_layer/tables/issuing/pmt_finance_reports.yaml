table:
  name: "pmt_finance_reports"
  database: "dwd_banking"
  display_name: "报告生成记录表"
  description: |
    这张表记录支付/银行账户业务中的报告生成记录。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "资金", "报表", "pmt_finance_reports"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "报告生成记录表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "报告生成记录表字段 account_id。"

  - name: "report_id"
    type: "varchar(36)"
    display_name: "长号"
    description: "长号"

  - name: "report_type"
    type: "varchar(200)"
    display_name: "1000=payin"
    description: "1000=payin, 1001=deposit, 2000=payout, 2001=transfer, 3000=conversion，4000=card fee, 4001=card charge，8000=fee, 9000=adjustment"
    enum_values:
      - {value: 1000, label: "payin"}
      - {value: 1001, label: "deposit"}
      - {value: 2000, label: "payout"}
      - {value: 2001, label: "transfer"}
      - {value: 3000, label: "conversion"}
      - {value: 4000, label: "card fee"}
      - {value: 4001, label: "card charge"}
      - {value: 8000, label: "fee"}
      - {value: 9000, label: "adjustment"}

  - name: "currency"
    type: "varchar(200)"
    display_name: "币种"
    description: "币种"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "报告生成记录表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "报告生成记录表字段 update_time。"

  - name: "report_to_email"
    type: "varchar(255)"
    display_name: "报告邮箱"
    description: "报告邮箱"
    sensitive: true

  - name: "report_parameters"
    type: "text"
    display_name: "{\\n        \"from_create_"
    description: " {\\n        \"from_create_time”: \"2022-02-22\",\\n        \"to_create_time\": \"2022-02-25\",\\n        \"transaction_type\": \"conversion\"\\n}"
    skip_index: true

  - name: "short_reference_id"
    type: "varchar(36)"
    display_name: "短号"
    description: "短号"

  - name: "short_account_id"
    type: "varchar(36)"
    display_name: "账户短号"
    description: "报告生成记录表字段 short_account_id。"

  - name: "report_status"
    type: "tinyint(1)"
    display_name: "-1=failed"
    description: "-1=failed, 0=pending,1=success"
    enum_values:
      - {value: -1, label: "failed"}
      - {value: 0, label: "pending"}
      - {value: 1, label: "success"}

relations: []

common_queries:
  - question: "报告生成记录表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_reports`;
    tables: ["pmt_finance_reports"]
    difficulty: "easy"
  - question: "最近30天报告生成记录表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_reports`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_finance_reports"]
    difficulty: "easy"
  - question: "报告生成记录表按状态分布"
    sql: |
      SELECT
          CASE report_status
            WHEN -1 THEN 'failed'
            WHEN 0 THEN 'pending'
            WHEN 1 THEN 'success'
            ELSE CONCAT('其他:', CAST(report_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_finance_reports`
      GROUP BY report_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_finance_reports"]
    difficulty: "medium"
  - question: "报告生成记录表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_reports`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_finance_reports"]
    difficulty: "easy"

