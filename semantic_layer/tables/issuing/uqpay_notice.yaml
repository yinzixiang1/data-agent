table:
  name: "uqpay_notice"
  database: "dwd_banking"
  display_name: "客户通知表"
  description: |
    这张表记录客户通知相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uqpay", "公告", "uqpay_notice"]
  query_tips: "按业务主键、状态字段和创建时间过滤可减少扫描范围。"

columns:
  - name: "user_id"
    type: "varchar(36)"
    display_name: "用户id"
    description: "客户通知表字段 user_id。"

relations: []

common_queries:
  - question: "客户通知表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_notice`;
    tables: ["uqpay_notice"]
    difficulty: "easy"
  - question: "客户通知表按user_id分布最多的是哪些"
    sql: |
      SELECT user_id AS "user_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_notice`
      WHERE user_id IS NOT NULL AND user_id != ''
      GROUP BY user_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uqpay_notice"]
    difficulty: "easy"
  - question: "客户通知表按主键倒序查看最新记录"
    sql: |
      SELECT *
      FROM dwd_banking.`uqpay_notice`
      ORDER BY nid DESC
      LIMIT 100;
    tables: ["uqpay_notice"]
    difficulty: "easy"

