table:
  name: "issuing_keys"
  database: "dwd_banking"
  display_name: "发卡密钥表"
  description: |
    这张表记录 UQPAY 发卡业务中的发卡密钥。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "密钥", "issuing_keys"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "发卡密钥表字段 create_time。"

relations: []

common_queries:
  - question: "发卡密钥表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_keys`;
    tables: ["issuing_keys"]
    difficulty: "easy"
  - question: "最近30天发卡密钥表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_keys`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_keys"]
    difficulty: "easy"
  - question: "发卡密钥表最近创建的记录有哪些"
    sql: |
      SELECT *
      FROM dwd_banking.`issuing_keys`
      ORDER BY create_time DESC
      LIMIT 100;
    tables: ["issuing_keys"]
    difficulty: "easy"

