table:
  name: "pmt_finance_adjustment"
  database: "dwd_banking"
  display_name: "调账记录表"
  description: |
    这张表记录支付/银行账户业务中的调账记录。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "资金", "调账", "pmt_finance_adjustment"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "调账记录表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "调整前账户ID"

  - name: "adjustment_id"
    type: "varchar(36)"
    display_name: "调账单号UUID"
    description: "调账单号UUID"

  - name: "adjustment_type"
    type: "int"
    display_name: "调账类型"
    description: "调账类型：9001-差额加款 9002-差额扣款 9003-冲正加款 9004-冲正扣款"
    enum_values:
      - {value: 9001, label: "差额加款"}
      - {value: 9002, label: "差额扣款"}
      - {value: 9003, label: "冲正加款"}
      - {value: 9004, label: "冲正扣款"}

  - name: "balance_type"
    type: "int"
    display_name: "账户余额类型 1000=VA 2000=FX"
    description: "账户余额类型 1000=VA 2000=FX(预留), 3000=AC, 4000=IC"
    enum_values:
      - {value: 1000, label: "VA"}
      - {value: 2000, label: "FX(预留)"}
      - {value: 3000, label: "AC"}
      - {value: 4000, label: "IC"}

  - name: "balance_currency"
    type: "varchar(3)"
    display_name: "调整币种"
    description: "调整币种"

  - name: "adjustment_amount"
    type: "decimal(16,4)"
    display_name: "调账金额"
    description: "调账金额"

  - name: "short_account_id"
    type: "varchar(20)"
    display_name: "账户短号"
    description: "商户短ID"

  - name: "short_reference_id"
    type: "varchar(20)"
    display_name: "调账短单号"
    description: "调账短单号"

  - name: "reference_type"
    type: "int"
    display_name: "关联类型"
    description: "关联类型：1000=payin, 1001=deposit, 2000=payout, 2001=transfer, 3000=conversion，4000=card fee, 4001=card charge，8000=fee, 9000=adjustment"
    enum_values:
      - {value: 1000, label: "payin"}
      - {value: 1001, label: "deposit"}
      - {value: 2000, label: "payout"}
      - {value: 2001, label: "transfer"}
      - {value: 3000, label: "conversion"}
      - {value: 4000, label: "card fee"}
      - {value: 4001, label: "card charge"}
      - {value: 8000, label: "fee"}
      - {value: 9000, label: "adjustment"}

  - name: "reference_id"
    type: "varchar(48)"
    display_name: "关联ID"
    description: "关联ID"

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "creatorid"
    description: "调账记录表字段 creator_id。"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

  - name: "review_status"
    type: "tinyint(1)"
    display_name: "审查状态"
    description: "审查状态：1=passed, 0=in_review, -1=rejected"
    enum_values:
      - {value: 1, label: "passed"}
      - {value: 0, label: "in_review"}
      - {value: -1, label: "rejected"}

  - name: "adjustment_status"
    type: "tinyint(1)"
    display_name: "调账状态 0=默认 1=成功 -1=失败"
    description: "调账状态 0=默认 1=成功 -1=失败"
    enum_values:
      - {value: 0, label: "默认"}
      - {value: 1, label: "成功"}
      - {value: -1, label: "失败"}

relations: []

common_queries:
  - question: "调账记录表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_adjustment`;
    tables: ["pmt_finance_adjustment"]
    difficulty: "easy"
  - question: "最近30天调账记录表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_adjustment`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_finance_adjustment"]
    difficulty: "easy"
  - question: "调账记录表按状态分布"
    sql: |
      SELECT
          CASE review_status
            WHEN 1 THEN 'passed'
            WHEN 0 THEN 'in_review'
            WHEN -1 THEN 'rejected'
            ELSE CONCAT('其他:', CAST(review_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_finance_adjustment`
      GROUP BY review_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_finance_adjustment"]
    difficulty: "medium"
  - question: "调账记录表按币种汇总金额"
    sql: |
      SELECT balance_currency AS "币种", COUNT(*) AS "笔数", SUM(balance_type) AS "金额"
      FROM dwd_banking.`pmt_finance_adjustment`
      GROUP BY balance_currency
      ORDER BY SUM(balance_type) DESC;
    tables: ["pmt_finance_adjustment"]
    difficulty: "medium"
  - question: "调账记录表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_adjustment`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_finance_adjustment"]
    difficulty: "easy"

