table:
  name: "uqpay_customer_attach"
  database: "dwd_banking"
  display_name: "客户附件表"
  description: |
    这张表记录客户附件相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uqpay", "客户", "附件", "uqpay_customer_attach"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "account_id"

  - name: "short_account_id"
    type: "varchar(200)"
    display_name: "账户短号"
    description: "短号"

  - name: "customer_id"
    type: "varchar(36)"
    display_name: "客户ID"
    description: "客户ID"

  - name: "profile_id"
    type: "varchar(36)"
    display_name: "资料ID"
    description: "资料ID"

  - name: "attach_id"
    type: "varchar(36)"
    display_name: "长ID"
    description: "长ID"

  - name: "short_reference_id"
    type: "varchar(20)"
    display_name: "文件短号"
    description: "文件短号"

  - name: "attach_source"
    type: "smallint"
    display_name: "附件来源"
    description: "附件来源：1000=基础资料，2000=KYC资料，2001=权益人资料，3000=KYB资料，8000=RFI资料"
    enum_values:
      - {value: 1000, label: "基础资料"}
      - {value: 2000, label: "KYC资料"}
      - {value: 2001, label: "权益人资料"}
      - {value: 3000, label: "KYB资料"}
      - {value: 8000, label: "RFI资料"}

  - name: "attach_type_name"
    type: "text"
    display_name: "类型名字"
    description: "类型名字"
    skip_index: true

  - name: "attach_file_type"
    type: "varchar(45)"
    display_name: "文件类型"
    description: "文件类型：文件后缀名"

  - name: "attach_status"
    type: "tinyint(1)"
    display_name: "附件状态"
    description: "附件状态：0=pending(waiting upload), 1=completed  -1=failed"
    enum_values:
      - {value: 0, label: "pending(waiting upload)"}
      - {value: 1, label: "completed"}
      - {value: -1, label: "failed"}

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "创建者ID"
    description: "创建者ID"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "客户附件表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "客户附件表字段 update_time。"

  - name: "ref_reference_id"
    type: "varchar(36)"
    display_name: "关联ID"
    description: "关联ID"

  - name: "storage_location"
    type: "tinyint(1)"
    display_name: "1"
    description: "1:cloud; 2:local; 3:cloud+local"
    enum_values:
      - {value: 1, label: "cloud"}
      - {value: 2, label: "local"}
      - {value: 3, label: "cloud+local"}

  - name: "is_deleted"
    type: "tinyint(1)"
    display_name: "是否删除"
    description: "是否删除:0=正常，1=删除"
    enum_values:
      - {value: 0, label: "正常"}
      - {value: 1, label: "删除"}

  - name: "review_status"
    type: "tinyint(1)"
    display_name: "-1"
    description: " -1:审核失败；0:pending；1:审核成功"
    enum_values:
      - {value: -1, label: "审核失败"}
      - {value: 0, label: "pending"}
      - {value: 1, label: "审核成功"}

relations: []

common_queries:
  - question: "客户附件表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_customer_attach`;
    tables: ["uqpay_customer_attach"]
    difficulty: "easy"
  - question: "最近30天客户附件表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_customer_attach`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uqpay_customer_attach"]
    difficulty: "easy"
  - question: "客户附件表按状态分布"
    sql: |
      SELECT
          CASE attach_status
            WHEN 0 THEN 'pending(waiting upload)'
            WHEN 1 THEN 'completed'
            WHEN -1 THEN 'failed'
            ELSE CONCAT('其他:', CAST(attach_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uqpay_customer_attach`
      GROUP BY attach_status
      ORDER BY COUNT(*) DESC;
    tables: ["uqpay_customer_attach"]
    difficulty: "medium"
  - question: "客户附件表按account_id分布最多的是哪些"
    sql: |
      SELECT account_id AS "account_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_customer_attach`
      WHERE account_id IS NOT NULL AND account_id != ''
      GROUP BY account_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uqpay_customer_attach"]
    difficulty: "easy"

