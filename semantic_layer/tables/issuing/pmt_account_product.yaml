table:
  name: "pmt_account_product"
  database: "dwd_banking"
  display_name: "账户-产品表"
  description: |
    这张表记录支付/银行账户业务中的账户-产品。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "账户", "产品", "pmt_account_product"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "acc_prod_id"
    type: "varchar(36)"
    display_name: "长号"
    description: "长号"

  - name: "short_reference_id"
    type: "varchar(36)"
    display_name: "短号"
    description: "短号"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "机构ID"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "商户ID"

  - name: "route_id"
    type: "int"
    display_name: "关联路由ID"
    description: "关联路由ID"

  - name: "restrict_id"
    type: "int"
    display_name: "关联约束ID"
    description: "关联约束ID"

  - name: "rate_scheme_id"
    type: "varchar(36)"
    display_name: "费率方案ID"
    description: "费率方案ID"

  - name: "auth_trade_type"
    type: "text"
    display_name: "产品交易授权类型"
    description: "产品交易授权类型"
    skip_index: true

  - name: "commission_rate_id"
    type: "int"
    display_name: "佣金方案ID"
    description: "佣金方案ID"

  - name: "currency_setting_params"
    type: "text"
    display_name: "交易、渠道、结算币种"
    description: "交易、渠道、结算币种"
    skip_index: true

  - name: "settlement_period_params"
    type: "text"
    display_name: "结算规则"
    description: "结算规则"
    skip_index: true

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "product_status"
    type: "tinyint(1)"
    display_name: "产品状态"
    description: "产品状态：0=关闭 1=开通"
    enum_values:
      - {value: 0, label: "关闭"}
      - {value: 1, label: "开通"}

relations: []

common_queries:
  - question: "账户-产品表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_product`;
    tables: ["pmt_account_product"]
    difficulty: "easy"
  - question: "最近30天账户-产品表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_product`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_account_product"]
    difficulty: "easy"
  - question: "账户-产品表按状态分布"
    sql: |
      SELECT
          CASE product_status
            WHEN 0 THEN '关闭'
            WHEN 1 THEN '开通'
            ELSE CONCAT('其他:', CAST(product_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_account_product`
      GROUP BY product_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_account_product"]
    difficulty: "medium"
  - question: "账户-产品表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_product`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_account_product"]
    difficulty: "easy"

review_required:
