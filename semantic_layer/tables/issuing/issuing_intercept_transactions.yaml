table:
  name: "issuing_intercept_transactions"
  database: "dwd_banking"
  display_name: "拦截交易表"
  description: |
    这张表记录 UQPAY 发卡业务中的拦截交易。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "交易", "拦截", "issuing_intercept_transactions"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "short_reference_id"
    type: "varchar(36)"
    display_name: "短 Id"
    description: "短 Id（Release 操作成功后，进入交易表是否沿用此短 Id？）"

  - name: "transaction_type"
    type: "smallint"
    display_name: "交易类型"
    description: "3000:reversal   2000:refund"
    enum_values:
      - {value: 3000, label: "reversal"}
      - {value: 2000, label: "refund"}

  - name: "account_id"
    type: "varchar(48)"
    display_name: "账户ID"
    description: "账户 Id"

  - name: "card_number"
    type: "varchar(36)"
    display_name: "卡号"
    description: "卡号"
    sensitive: true

  - name: "mask_card_number"
    type: "varchar(36)"
    display_name: "脱敏卡号"
    description: "脱敏后的卡号"
    sensitive: true

  - name: "pan_hash"
    type: "varchar(64)"
    display_name: "PAN哈希"
    description: "卡号哈希值"
    sensitive: true

  - name: "channel_card_id"
    type: "varchar(220)"
    display_name: "渠道卡号"
    description: "渠道卡号"

  - name: "card_id"
    type: "varchar(36)"
    display_name: "卡片ID"
    description: "卡号"

  - name: "merchant_id"
    type: "varchar(255)"
    display_name: "商户 Id"
    description: "商户 Id"

  - name: "transaction_amount"
    type: "decimal(16,2)"
    display_name: "交易金额"
    description: "交易金额"

  - name: "transaction_currency"
    type: "varchar(4)"
    display_name: "交易币种"
    description: "交易币种"

  - name: "billing_amount"
    type: "decimal(16,2)"
    display_name: "账单金额"
    description: "账单金额"

  - name: "billing_currency"
    type: "varchar(4)"
    display_name: "账单币种"
    description: "账单币种"

  - name: "status"
    type: "smallint"
    display_name: "状态"
    description: "0:On Hold    1:Processing  2:Posted  3:Failed"
    enum_values:
      - {value: 0, label: "On Hold"}
      - {value: 1, label: "Processing"}
      - {value: 2, label: "Posted"}
      - {value: 3, label: "Failed"}

  - name: "channel_resp_body"
    type: "text"
    display_name: "渠道推送数据"
    description: "渠道推送数据"
    skip_index: true

  - name: "message_queue_body"
    type: "text"
    display_name: "释放时的 message"
    description: "释放时的 message（更新下时间参数，改成当前时间，就能被消费了）"
    skip_index: true

  - name: "create_time"
    type: "datetime(3)"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime(3)"
    display_name: "更新时间"
    description: "更新时间"

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "创建者 Id"
    description: "创建者 Id"

  - name: "auditor_id"
    type: "varchar(36)"
    display_name: "审核者 Id"
    description: "审核者 Id"

  - name: "network_transaction_id"
    type: "varchar(255)"
    display_name: "网络交易ID"
    description: "网络交易ID"

  - name: "intercept_transaction_id"
    type: "varchar(36)"
    display_name: "拦截交易ID"
    description: "拦截交易ID"

  - name: "intercept_reason_code"
    type: "smallint"
    display_name: "拦截原因代码"
    description: "拦截原因代码：1001-未请求的冲正, 1002-冲正溢出, 1003-未请求的结算, 1004-结算溢出, 1005-未请求的退款, 1006-结算冲正, 1007-退款冲正, 1008-财务冲正, 1009-未请求的调整"
    enum_values:
      - {value: 1001, label: "未请求的冲正"}
      - {value: 1002, label: "冲正溢出"}
      - {value: 1003, label: "未请求的结算"}
      - {value: 1004, label: "结算溢出"}
      - {value: 1005, label: "未请求的退款"}
      - {value: 1006, label: "结算冲正"}
      - {value: 1007, label: "退款冲正"}
      - {value: 1008, label: "财务冲正"}
      - {value: 1009, label: "未请求的调整"}

  - name: "card_transaction_id"
    type: "varchar(36)"
    display_name: "card transaction id"
    description: "card transaction id"

  - name: "finance_transaction_id"
    type: "varchar(36)"
    display_name: "finance transaction id"
    description: "finance transaction id"

relations: []

common_queries:
  - question: "拦截交易表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_intercept_transactions`;
    tables: ["issuing_intercept_transactions"]
    difficulty: "easy"
  - question: "最近30天拦截交易表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_intercept_transactions`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_intercept_transactions"]
    difficulty: "easy"
  - question: "拦截交易表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN 0 THEN 'On Hold'
            WHEN 1 THEN 'Processing'
            WHEN 2 THEN 'Posted'
            WHEN 3 THEN 'Failed'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_intercept_transactions`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_intercept_transactions"]
    difficulty: "medium"
  - question: "拦截交易表按币种汇总金额"
    sql: |
      SELECT transaction_currency AS "币种", COUNT(*) AS "笔数", SUM(transaction_amount) AS "金额"
      FROM dwd_banking.`issuing_intercept_transactions`
      GROUP BY transaction_currency
      ORDER BY SUM(transaction_amount) DESC;
    tables: ["issuing_intercept_transactions"]
    difficulty: "medium"
  - question: "拦截交易表按account_id分布最多的是哪些"
    sql: |
      SELECT account_id AS "account_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_intercept_transactions`
      WHERE account_id IS NOT NULL AND account_id != ''
      GROUP BY account_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_intercept_transactions"]
    difficulty: "easy"

review_required:
