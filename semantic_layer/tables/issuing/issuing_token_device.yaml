    type: "int"
    display_name: "状态"
    description: "1000  bind\\r\\n2000  pending\\r\\n3000  removed\\r\\n9000  nodevice"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "记录创建时间"

relations: []

common_queries:
  - question: "发卡钱包令牌device表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_token_device`;
    tables: ["issuing_token_device"]
    difficulty: "easy"
  - question: "最近30天发卡钱包令牌device表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_token_device`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_token_device"]
    difficulty: "easy"
  - question: "发卡钱包令牌device表按状态分布"
    sql: |
      SELECT
          status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_token_device`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_token_device"]
    difficulty: "easy"
  - question: "发卡钱包令牌device表按card_id分布最多的是哪些"
    sql: |
      SELECT card_id AS "card_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_token_device`
      WHERE card_id IS NOT NULL AND card_id != ''
      GROUP BY card_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_token_device"]
    difficulty: "easy"

