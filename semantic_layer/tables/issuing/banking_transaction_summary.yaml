table:
  name: "banking_transaction_summary"
  database: "dwd_banking"
  display_name: "银行账户交易汇总表"
  description: |
    这张表记录支付/银行账户业务中的银行账户交易汇总。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["交易", "银行账户", "汇总", "banking_transaction_summary"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "id"
    type: "int"
    display_name: "主键ID"
    description: "银行账户交易汇总表字段 id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "银行账户交易汇总表字段 account_id。"

  - name: "info_type"
    type: "tinyint"
    display_name: "存储类型"
    description: "存储类型(0-日，1-月，2-年)"
    enum_values:
      - {value: 0, label: "日"}
      - {value: 1, label: "月"}
      - {value: 2, label: "年)"}
    skip_index: true

  - name: "info"
    type: "json"
    display_name: "统计数据"
    description: "统计数据"
    skip_index: true

  - name: "transaction_type"
    type: "tinyint"
    display_name: "交易类型"
    description: "交易类型(0-payout,1-deposit)"
    enum_values:
      - {value: 0, label: "payout"}
      - {value: 1, label: "deposit)"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "银行账户交易汇总表字段 create_time。"

relations: []

common_queries:
  - question: "银行账户交易汇总表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`banking_transaction_summary`;
    tables: ["banking_transaction_summary"]
    difficulty: "easy"
  - question: "最近30天银行账户交易汇总表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`banking_transaction_summary`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["banking_transaction_summary"]
    difficulty: "easy"
  - question: "银行账户交易汇总表按account_id分布最多的是哪些"
    sql: |
      SELECT account_id AS "account_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`banking_transaction_summary`
      WHERE account_id IS NOT NULL AND account_id != ''
      GROUP BY account_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["banking_transaction_summary"]
    difficulty: "easy"

