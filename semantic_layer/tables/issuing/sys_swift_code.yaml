table:
  name: "sys_swift_code"
  database: "dwd_banking"
  display_name: "Swift Code表"
  description: |
    这张表记录系统侧的Swift Code。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "SWIFT", "code", "sys_swift_code"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "bank_name_data"
    type: "text"
    display_name: "映射各渠道bank_name"
    description: "映射各渠道bank_name"
    skip_index: true

  - name: "bank_address"
    type: "varchar(255)"
    display_name: "注册地址"
    description: "注册地址"
    sensitive: true

  - name: "operational_address"
    type: "varchar(255)"
    display_name: "运营地址"
    description: "运营地址"
    sensitive: true

  - name: "branch_address"
    type: "varchar(255)"
    display_name: "支行地址"
    description: "支行地址"
    sensitive: true

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "系统创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "Swift Code表字段 update_time。"

  - name: "status"
    type: "tinyint"
    display_name: "状态"
    description: "状态：-1删除，0=关闭，1=启用"
    enum_values:
      - {value: 0, label: "关闭"}
      - {value: 1, label: "启用"}

relations: []

common_queries:
  - question: "Swift Code表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_swift_code`;
    tables: ["sys_swift_code"]
    difficulty: "easy"
  - question: "最近30天Swift Code表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_swift_code`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["sys_swift_code"]
    difficulty: "easy"
  - question: "Swift Code表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN 0 THEN '关闭'
            WHEN 1 THEN '启用'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`sys_swift_code`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["sys_swift_code"]
    difficulty: "medium"

review_required:
