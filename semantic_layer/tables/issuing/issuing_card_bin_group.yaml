table:
  name: "issuing_card_bin_group"
  database: "dwd_banking"
  display_name: "卡池分组表"
  description: |
    这张表记录 UQPAY 发卡业务中的卡池分组。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "卡片", "BIN", "分组", "issuing_card_bin_group"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "cbg_id"
    type: "bigint"
    display_name: "主键"
    description: "主键"

  - name: "pool_id"
    type: "varchar(36)"
    display_name: "池唯一标识"
    description: "池唯一标识"

  - name: "pool_mode"
    type: "tinyint"
    display_name: "0=SHARE共享池"
    description: "0=SHARE共享池, 1=EXCLUSIVE专享池"
    enum_values:
      - {value: 0, label: "SHARE共享池"}
      - {value: 1, label: "EXCLUSIVE专享池"}

  - name: "usage_type"
    type: "tinyint"
    display_name: "卡使用类型"
    description: "0=NORMAL, 1=ONE_TIME"
    enum_values:
      - {value: 0, label: "NORMAL"}
      - {value: 1, label: "ONE_TIME"}

  - name: "status"
    type: "tinyint"
    display_name: "状态"
    description: "0=INACTIVE, 1=ACTIVE, 2=FULL"
    enum_values:
      - {value: 0, label: "INACTIVE"}
      - {value: 1, label: "ACTIVE"}
      - {value: 2, label: "FULL"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

relations: []

common_queries:
  - question: "卡池分组表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_bin_group`;
    tables: ["issuing_card_bin_group"]
    difficulty: "easy"
  - question: "最近30天卡池分组表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_bin_group`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_card_bin_group"]
    difficulty: "easy"
  - question: "卡池分组表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN 0 THEN 'INACTIVE'
            WHEN 1 THEN 'ACTIVE'
            WHEN 2 THEN 'FULL'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_card_bin_group`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_card_bin_group"]
    difficulty: "medium"

