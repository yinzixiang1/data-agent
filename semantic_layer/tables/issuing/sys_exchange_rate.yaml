table:
  name: "sys_exchange_rate"
  database: "dwd_banking"
  display_name: "法币/数字货币汇率(最新报价)表"
  description: |
    这张表记录系统侧的法币/数字货币汇率(最新报价)。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "汇率", "费率", "sys_exchange_rate"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "currency_type"
    type: "int"
    display_name: "1000=fiat 2000=crypto"
    description: "1000=fiat 2000=crypto"
    enum_values:
      - {value: 1000, label: "fiat"}
      - {value: 2000, label: "crypto"}

  - name: "currency_network"
    type: "varchar(24)"
    display_name: "币种网络"
    description: "币种网络"

  - name: "currency_pair"
    type: "varchar(20)"
    display_name: "eg."
    description: "eg.: USDEUR"

  - name: "sell_currency"
    type: "varchar(12)"
    display_name: "原始币种"
    description: "原始币种"

  - name: "buy_currency"
    type: "varchar(12)"
    display_name: "目标币种"
    description: "目标币种"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "rate_status"
    type: "tinyint(1)"
    display_name: "1"
    description: "1:可用；-1:不可用"
    enum_values:
      - {value: 1, label: "可用"}
      - {value: -1, label: "不可用"}

relations: []

common_queries:
  - question: "法币/数字货币汇率(最新报价)表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_exchange_rate`;
    tables: ["sys_exchange_rate"]
    difficulty: "easy"
  - question: "最近30天法币/数字货币汇率(最新报价)表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_exchange_rate`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["sys_exchange_rate"]
    difficulty: "easy"
  - question: "法币/数字货币汇率(最新报价)表按状态分布"
    sql: |
      SELECT
          CASE rate_status
            WHEN 1 THEN '可用'
            WHEN -1 THEN '不可用'
            ELSE CONCAT('其他:', CAST(rate_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`sys_exchange_rate`
      GROUP BY rate_status
      ORDER BY COUNT(*) DESC;
    tables: ["sys_exchange_rate"]
    difficulty: "medium"

review_required:
