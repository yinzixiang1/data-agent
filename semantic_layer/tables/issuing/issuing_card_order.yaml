table:
  name: "issuing_card_order"
  database: "dwd_banking"
  display_name: "卡订单表"
  description: |
    这张表记录 UQPAY 发卡业务中的卡订单。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "卡片", "订单", "issuing_card_order"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "卡订单表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "卡订单表字段 account_id。"

  - name: "order_id"
    type: "varchar(36)"
    display_name: "订单id"
    description: "卡订单表字段 order_id。"

  - name: "order_type"
    type: "int"
    display_name: "1000"
    description: "1000: 开卡；2000：充值；3000：提现, 4000=更新卡， 8001=refund"
    enum_values:
      - {value: 1000, label: "开卡"}
      - {value: 2000, label: "充值"}
      - {value: 3000, label: "提现"}
      - {value: 4000, label: "更新卡"}
      - {value: 8001, label: "refund"}

  - name: "card_mode"
    type: "smallint"
    display_name: "卡模式"
    description: "SINGLE MODE - 1000;SHARE MODE - 2000"
    enum_values:
      - {value: 1000, label: "SINGLE/单卡模式"}
      - {value: 2000, label: "SHARE/共享模式"}

  - name: "card_id"
    type: "varchar(36)"
    display_name: "卡片ID"
    description: "卡ID"

  - name: "card_type"
    type: "smallint"
    display_name: "卡类型"
    description: "Card type - 1000=PREPAID 2000=DEBIT"
    enum_values:
      - {value: 1000, label: "PREPAID"}
      - {value: 2000, label: "DEBIT"}

  - name: "card_number"
    type: "varchar(38)"
    display_name: "卡号"
    description: "卡订单表字段 card_number。"
    sensitive: true

  - name: "pan_hash"
    type: "varchar(64)"
    display_name: "PAN哈希"
    description: "PAN sha256 hash值"
    sensitive: true

  - name: "mask_card_number"
    type: "varchar(36)"
    display_name: "脱敏卡号"
    description: "脱敏后的card number"
    sensitive: true

  - name: "form_factor"
    type: "smallint"
    display_name: "卡介质类型"
    description: "1000=VIRTUAL, 2000=PHYSICAL"
    enum_values:
      - {value: 1000, label: "VIRTUAL"}
      - {value: 2000, label: "PHYSICAL"}

  - name: "card_currency"
    type: "varchar(4)"
    display_name: "卡片币种"
    description: "卡订单表字段 card_currency。"

  - name: "card_scheme"
    type: "smallint"
    display_name: "卡组织"
    description: "卡品牌 1000=VISA  2000=MASTER"
    enum_values:
      - {value: 1000, label: "VISA"}
      - {value: 2000, label: "MASTER"}

  - name: "card_holder_id"
    type: "varchar(36)"
    display_name: "持卡人ID"
    description: "卡持有人ID"

  - name: "card_limit_type"
    type: "int"
    display_name: "限额类型"
    description: "限额类型：1000=banking模式，4000=Issuing模式"
    enum_values:
      - {value: 1000, label: "banking模式"}
      - {value: 4000, label: "Issuing模式"}

  - name: "order_source_amount"
    type: "decimal(16,2)"
    display_name: "订单sourceamount"
    description: "卡订单表字段 order_source_amount。"

  - name: "order_source_currency"
    type: "varchar(4)"
    display_name: "订单source币种"
    description: "卡订单表字段 order_source_currency。"

  - name: "order_target_amount"
    type: "decimal(16,2)"
    display_name: "订单targetamount"
    description: "卡订单表字段 order_target_amount。"

  - name: "order_target_currency"
    type: "varchar(4)"
    display_name: "订单target币种"
    description: "卡订单表字段 order_target_currency。"

  - name: "fee_amount"
    type: "decimal(16,2)"
    display_name: "USD为单位"
    description: "USD为单位"

  - name: "fee_details"
    type: "varchar(1000)"
    display_name: "fee 详情"
    description: "fee 详情, {\"open_card_fee\":\"0.1\", \"recharge_card_fee\":\"0.15\"}"
    skip_index: true

  - name: "channel_card_id"
    type: "varchar(255)"
    display_name: "渠道卡ID，全局唯一关联"
    description: "渠道卡ID，全局唯一关联"

  - name: "channel_resp_id"
    type: "varchar(36)"
    display_name: "渠道唯一单号"
    description: "渠道唯一单号"

  - name: "channel_resp_body"
    type: "text"
    display_name: "渠道respbody"
    description: "卡订单表字段 channel_resp_body。"
    skip_index: true

  - name: "ref_transaction_id"
    type: "varchar(36)"
    display_name: "关联账户流水ID"
    description: "关联账户流水ID"

  - name: "unique_request_id"
    type: "varchar(36)"
    display_name: "唯一请求ID"
    description: "唯一请求ID"
    skip_index: true

  - name: "short_account_id"
    type: "varchar(36)"
    display_name: "账户短号"
    description: "卡订单表字段 short_account_id。"

  - name: "short_reference_id"
    type: "varchar(36)"
    display_name: "shortreferenceid"
    description: "卡订单表字段 short_reference_id。"

  - name: "update_time"
    type: "datetime(3)"
    display_name: "更新时间"
    description: "卡订单表字段 update_time。"

  - name: "create_time"
    type: "datetime(3)"
    display_name: "创建时间"
    description: "卡订单表字段 create_time。"

  - name: "credit_debit_status"
    type: "tinyint(1)"
    display_name: "加扣款状态"
    description: "加扣款状态，1：成功；-1：失败"
    enum_values:
      - {value: 1, label: "成功"}
      - {value: -1, label: "失败"}

  - name: "refund_status"
    type: "int"
    display_name: "退款状态"
    description: "退款状态，1:成功；-1失败"
    enum_values:
      - {value: 1, label: "成功,-1失败"}

  - name: "order_status"
    type: "tinyint(1)"
    display_name: "订单状态"
    description: "1：成功；-1：失败；2：处理中；"
    enum_values:
      - {value: 1, label: "成功"}
      - {value: -1, label: "失败"}
      - {value: 2, label: "处理中"}

  - name: "order_remark"
    type: "text"
    display_name: "订单备注"
    description: "订单备注"
    skip_index: true

  - name: "balance_id"
    type: "varchar(36)"
    display_name: "扣款钱包ID"
    description: "扣款钱包ID"

relations: []

common_queries:
  - question: "卡订单表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_order`;
    tables: ["issuing_card_order"]
    difficulty: "easy"
  - question: "最近30天卡订单表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_order`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_card_order"]
    difficulty: "easy"
  - question: "卡订单表按状态分布"
    sql: |
      SELECT
          CASE order_status
            WHEN 1 THEN '成功'
            WHEN -1 THEN '失败'
            WHEN 2 THEN '处理中'
            ELSE CONCAT('其他:', CAST(order_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_card_order`
      GROUP BY order_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_card_order"]
    difficulty: "medium"
  - question: "卡订单表按币种汇总金额"
    sql: |
      SELECT card_currency AS "币种", COUNT(*) AS "笔数", SUM(order_source_amount) AS "金额"
      FROM dwd_banking.`issuing_card_order`
      GROUP BY card_currency
      ORDER BY SUM(order_source_amount) DESC;
    tables: ["issuing_card_order"]
    difficulty: "medium"
  - question: "卡订单表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_order`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_card_order"]
    difficulty: "easy"

