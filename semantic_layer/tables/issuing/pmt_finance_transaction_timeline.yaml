table:
  name: "pmt_finance_transaction_timeline"
  database: "dwd_banking"
  display_name: "资金交易时间线表"
  description: |
    这张表记录支付/银行账户业务中的资金交易时间线。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "交易", "资金", "时间线", "pmt_finance_transaction_timeline"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "资金交易时间线表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "资金交易时间线表字段 account_id。"

  - name: "timeline_type"
    type: "smallint"
    display_name: "1000=payin"
    description: "1000=payin, 1001=deposit, 1002=transfer in, 2000=payout, 2001=transfer out, 3000=conversion，4000=card purchase, 4001=card recharge, 4002=card withdraw,  8000=fee, 8001=refund，9000=adjustment"
    enum_values:
      - {value: 1000, label: "payin"}
      - {value: 1001, label: "deposit"}
      - {value: 1002, label: "transfer in"}
      - {value: 2000, label: "payout"}
      - {value: 2001, label: "transfer out"}
      - {value: 3000, label: "conversion"}
      - {value: 4000, label: "card purchase"}
      - {value: 4001, label: "card recharge"}
      - {value: 4002, label: "card withdraw"}
      - {value: 8000, label: "fee"}
      - {value: 8001, label: "refund"}
      - {value: 9000, label: "adjustment"}
    skip_index: true

  - name: "timeline_id"
    type: "varchar(36)"
    display_name: "时间线id"
    description: "资金交易时间线表字段 timeline_id。"

  - name: "req_id"
    type: "varchar(200)"
    display_name: "请求唯一ID"
    description: "请求唯一ID"

  - name: "req_body"
    type: "text"
    display_name: "请求body"
    description: "请求body"
    skip_index: true

  - name: "req_amount"
    type: "decimal(16,4)"
    display_name: "请求交易金额"
    description: "请求交易金额"

  - name: "resp_id"
    type: "varchar(200)"
    display_name: "渠道响应ID"
    description: "渠道响应ID"

  - name: "resp_body"
    type: "text"
    display_name: "渠道响应body"
    description: "渠道响应body"
    skip_index: true

  - name: "resp_status"
    type: "varchar(20)"
    display_name: "渠道响应状态"
    description: "渠道响应状态"

  - name: "execute_reason"
    type: "text"
    display_name: "对应失败原因"
    description: "对应失败原因"
    skip_index: true

  - name: "ref_reference_id"
    type: "varchar(36)"
    display_name: "关联长号id，payout_id、deposit"
    description: "关联长号id，payout_id、deposit_id"

  - name: "ref_short_reference_id"
    type: "varchar(30)"
    display_name: "关联短号id"
    description: "关联短号id"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "is_customer_visible"
    type: "smallint"
    display_name: "对客户"
    description: "对客户：1=是，0否"
    enum_values:
      - {value: 1, label: "是,0否"}

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "如果是对渠道，空"
    description: "如果是对渠道，空"

relations: []

common_queries:
  - question: "资金交易时间线表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_transaction_timeline`;
    tables: ["pmt_finance_transaction_timeline"]
    difficulty: "easy"
  - question: "最近30天资金交易时间线表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_transaction_timeline`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_finance_transaction_timeline"]
    difficulty: "easy"
  - question: "资金交易时间线表按状态分布"
    sql: |
      SELECT
          resp_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_finance_transaction_timeline`
      GROUP BY resp_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_finance_transaction_timeline"]
    difficulty: "easy"
  - question: "资金交易时间线表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_transaction_timeline`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_finance_transaction_timeline"]
    difficulty: "easy"

