relations: []

common_queries:
  - question: "卡池绑定表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_bin_group_binding`;
    tables: ["issuing_card_bin_group_binding"]
    difficulty: "easy"
  - question: "最近30天卡池绑定表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_bin_group_binding`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_card_bin_group_binding"]
    difficulty: "easy"
  - question: "卡池绑定表按account_id分布最多的是哪些"
    sql: |
      SELECT account_id AS "account_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_bin_group_binding`
      WHERE account_id IS NOT NULL AND account_id != ''
      GROUP BY account_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_card_bin_group_binding"]
    difficulty: "easy"

