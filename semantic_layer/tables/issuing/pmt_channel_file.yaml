table:
  name: "pmt_channel_file"
  database: "dwd_banking"
  display_name: "渠道文件表"
  description: |
    这张表记录支付/银行账户业务中的渠道文件。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "渠道", "文件", "pmt_channel_file"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "file_id"
    type: "varchar(36)"
    display_name: "文件ID"
    description: "文件ID"

  - name: "short_reference_id"
    type: "varchar(36)"
    display_name: "短号"
    description: "短号"

  - name: "file_type"
    type: "varchar(30)"
    display_name: "文件类别"
    description: "文件类别:STATEMENT"

  - name: "file_status"
    type: "tinyint(1)"
    display_name: "文件状态"
    description: "文件状态：Pending=0、Failed=-1、Success=1"

  - name: "create_time"
    type: "datetime(3)"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime(3)"
    display_name: "更新时间"
    description: "更新时间"

relations: []

common_queries:
  - question: "渠道文件表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_channel_file`;
    tables: ["pmt_channel_file"]
    difficulty: "easy"
  - question: "最近30天渠道文件表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_channel_file`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_channel_file"]
    difficulty: "easy"
  - question: "渠道文件表按状态分布"
    sql: |
      SELECT
          file_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_channel_file`
      GROUP BY file_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_channel_file"]
    difficulty: "easy"

