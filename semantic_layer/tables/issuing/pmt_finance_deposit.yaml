table:
  name: "pmt_finance_deposit"
  database: "dwd_banking"
  display_name: "入金订单表"
  description: |
    这张表记录支付/银行账户业务中的入金订单。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "资金", "入金", "pmt_finance_deposit"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "入金订单表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "入金订单表字段 account_id。"

  - name: "deposit_id"
    type: "varchar(36)"
    display_name: "入金id"
    description: "入金订单表字段 deposit_id。"

  - name: "deposit_currency"
    type: "varchar(3)"
    display_name: "币种"
    description: "币种"

  - name: "deposit_amount"
    type: "decimal(16,4)"
    display_name: "金额"
    description: "金额"

  - name: "channel_resp_id"
    type: "varchar(48)"
    display_name: "渠道响应唯一ID"
    description: "渠道响应唯一ID(短)"

  - name: "channel_related_id"
    type: "varchar(36)"
    display_name: "关联CC的related_entity_id，便"
    description: "关联CC的related_entity_id，便于查询sender"

  - name: "channel_related_info"
    type: "text"
    display_name: "主要存sender"
    description: "主要存sender"
    skip_index: true

  - name: "channel_related_status"
    type: "int"
    display_name: "sender验证状态"
    description: "sender验证状态：-1=验证失败 0=待验证，1=验证成功"
    enum_values:
      - {value: -1, label: "验证失败"}
      - {value: 0, label: "待验证"}
      - {value: 1, label: "验证成功"}

  - name: "channel_resp_status"
    type: "varchar(20)"
    display_name: "上游返回状态"
    description: "上游返回状态"

  - name: "channel_resp_body"
    type: "text"
    display_name: "上游返回报文"
    description: "上游返回报文"
    skip_index: true

  - name: "execute_reason"
    type: "text"
    display_name: "对应失败原因"
    description: "对应失败原因"
    skip_index: true

  - name: "short_reference_id"
    type: "varchar(20)"
    display_name: "shortreferenceid"
    description: "入金订单表字段 short_reference_id。"

  - name: "short_account_id"
    type: "varchar(20)"
    display_name: "账户短号"
    description: "入金订单表字段 short_account_id。"

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "creatorid"
    description: "入金订单表字段 creator_id。"

  - name: "transaction_id"
    type: "varchar(36)"
    display_name: "交易id"
    description: "入金订单表字段 transaction_id。"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "入金订单表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "入金订单表字段 update_time。"

  - name: "review_status"
    type: "tinyint(1)"
    display_name: "审查状态"
    description: "审查状态：1=passed, 0=in_review, -1=rejected"
    enum_values:
      - {value: 1, label: "passed"}
      - {value: 0, label: "in_review"}
      - {value: -1, label: "rejected"}

  - name: "deposit_status"
    type: "tinyint(1)"
    display_name: "0"
    description: "0: pending，1: completed, -1=failed"
    enum_values:
      - {value: 0, label: "pending"}
      - {value: 1, label: "completed"}
      - {value: -1, label: "failed"}

  - name: "account_channel_id"
    type: "varchar(36)"
    display_name: "关联用户渠道ID"
    description: "关联用户渠道ID"

  - name: "deposit_way"
    type: "int"
    display_name: "0=外部创建，1=payout创建，2=手动创建"
    description: "0=外部创建，1=payout创建，2=手动创建"
    enum_values:
      - {value: 0, label: "外部创建"}
      - {value: 1, label: "payout创建"}
      - {value: 2, label: "手动创建"}

  - name: "risk_remark"
    type: "text"
    display_name: "风险备注"
    description: "风险备注"
    skip_index: true

  - name: "risk_level"
    type: "int"
    display_name: "风险等级 0=无风险"
    description: "风险等级 0=无风险,>0风险等级,数值越大，风险越高"
    enum_values:
      - {value: 0, label: "无风险,>0风险等级,数值越大,风险越高"}

  - name: "ext_applicant_id"
    type: "varchar(36)"
    display_name: "extapplicantid"
    description: "入金订单表字段 ext_applicant_id。"

relations: []

common_queries:
  - question: "入金订单表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_deposit`;
    tables: ["pmt_finance_deposit"]
    difficulty: "easy"
  - question: "最近30天入金订单表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_deposit`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_finance_deposit"]
    difficulty: "easy"
  - question: "入金订单表按状态分布"
    sql: |
      SELECT
          CASE channel_related_status
            WHEN -1 THEN '验证失败'
            WHEN 0 THEN '待验证'
            WHEN 1 THEN '验证成功'
            ELSE CONCAT('其他:', CAST(channel_related_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_finance_deposit`
      GROUP BY channel_related_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_finance_deposit"]
    difficulty: "medium"
  - question: "入金订单表按币种汇总金额"
    sql: |
      SELECT deposit_currency AS "币种", COUNT(*) AS "笔数", SUM(deposit_amount) AS "金额"
      FROM dwd_banking.`pmt_finance_deposit`
      GROUP BY deposit_currency
      ORDER BY SUM(deposit_amount) DESC;
    tables: ["pmt_finance_deposit"]
    difficulty: "medium"
  - question: "入金订单表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_deposit`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_finance_deposit"]
    difficulty: "easy"

review_required:
