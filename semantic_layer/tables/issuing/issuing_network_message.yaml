table:
  name: "issuing_network_message"
  database: "dwd_banking"
  display_name: "卡组原始信息（非交易）表"
  description: |
    这张表记录 UQPAY 发卡业务中的卡组原始信息（非交易）。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "卡组织", "消息", "issuing_network_message"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "message_id"
    type: "varchar(36)"
    display_name: "消息id"
    description: "卡组原始信息（非交易）表字段 message_id。"

  - name: "message_type"
    type: "varchar(10)"
    display_name: "消息类型"
    description: "消息类型"

  - name: "network_response_body"
    type: "text"
    display_name: "请求报文"
    description: "请求报文"
    skip_index: true

  - name: "network_request_body"
    type: "text"
    display_name: "返回报文"
    description: "返回报文"
    skip_index: true

  - name: "response_code"
    type: "varchar(5)"
    display_name: "返回码"
    description: "返回码"
    skip_index: true

  - name: "related_type"
    type: "varchar(16)"
    display_name: "relatedtype"
    description: "卡组原始信息（非交易）表字段 related_type。"

  - name: "related_id"
    type: "varchar(36)"
    display_name: "relatedid"
    description: "卡组原始信息（非交易）表字段 related_id。"

  - name: "status"
    type: "smallint"
    display_name: "状态"
    description: "1000 - Authorized (授权成功) \\n1001 - Declined (授权拒绝) \\n1002 - Partial Authorized (部分授权) \\n2000 - Completed (交易完成) \\n3000 - Refunded (已退款) \\n3001 - Partial Refunded (部分退款) \\n4000 - Reversed (已冲正) \\n9000 - Error (错误) \\n9001 - Expired (过期) \\n9999 - Unknown (未知状态)"
    enum_values:
      - {value: 1000, label: "Authorized (授权成功) \\n"}

  - name: "create_time"
    type: "datetime(3)"
    display_name: "创建时间"
    description: "卡组原始信息（非交易）表字段 create_time。"

  - name: "response_time"
    type: "datetime(3)"
    display_name: "responsetime"
    description: "卡组原始信息（非交易）表字段 response_time。"
    skip_index: true

relations: []

common_queries:
  - question: "卡组原始信息（非交易）表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_network_message`;
    tables: ["issuing_network_message"]
    difficulty: "easy"
  - question: "最近30天卡组原始信息（非交易）表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_network_message`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_network_message"]
    difficulty: "easy"
  - question: "卡组原始信息（非交易）表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN 1000 THEN 'Authorized (授权成功) \n'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_network_message`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_network_message"]
    difficulty: "medium"

