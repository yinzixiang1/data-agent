table:
  name: "uqpay_customer_owners"
  database: "dwd_banking"
  display_name: "客户权益人表"
  description: |
    这张表记录客户权益人相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uqpay", "客户", "受益人", "uqpay_customer_owners"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "account ID"

  - name: "profile_id"
    type: "varchar(36)"
    display_name: "kyc id"
    description: "kyc id"

  - name: "customer_id"
    type: "varchar(36)"
    display_name: "客户ID"
    description: "客户ID"

  - name: "owners_id"
    type: "varchar(36)"
    display_name: "权益人ID"
    description: "权益人ID"

  - name: "owners_type"
    type: "int"
    display_name: "权益类型"
    description: "权益类型：1000=董事Director，2000=受益人Beneficial owner（有股份），3000=董事&受益人，4000=申请人APPLICANT"
    enum_values:
      - {value: 1000, label: "董事Director"}
      - {value: 2000, label: "受益人Beneficial owner（有股份）"}
      - {value: 3000, label: "董事&受益人"}
      - {value: 4000, label: "申请人APPLICANT"}

  - name: "email"
    type: "varchar(120)"
    display_name: "邮箱"
    description: "邮箱号"
    sensitive: true

  - name: "phone_number"
    type: "varchar(36)"
    display_name: "手机号"
    description: "手机号"
    sensitive: true

  - name: "first_name"
    type: "varchar(120)"
    display_name: "名字"
    description: "名字"
    sensitive: true

  - name: "last_name"
    type: "varchar(255)"
    display_name: "姓"
    description: "姓"
    sensitive: true

  - name: "date_of_birth"
    type: "date"
    display_name: "生日"
    description: "生日"
    sensitive: true

  - name: "identification_type"
    type: "int"
    display_name: "证件类型"
    description: "1000-passport, 1001-Drivers License; 1002=National ID；1099=OTHER；2000=注册号UEN-暂缓"
    sensitive: true

  - name: "identification_value"
    type: "varchar(48)"
    display_name: "identification_type值"
    description: "identification_type值"
    sensitive: true

  - name: "identification_expiry_date"
    type: "varchar(10)"
    display_name: "对应证书过期时间 Format"
    description: "对应证书过期时间 Format：YYYY-MM-DD"
    sensitive: true

  - name: "identification_issue_date"
    type: "varchar(10)"
    display_name: "对应证书签发时间 Format"
    description: "对应证书签发时间 Format：YYYY-MM-DD"
    sensitive: true

  - name: "identification_remark"
    type: "varchar(255)"
    display_name: "identification备注"
    description: "identification备注"
    sensitive: true

  - name: "address"
    type: "varchar(255)"
    display_name: "address"
    description: "客户权益人表字段 address。"
    sensitive: true

  - name: "address2"
    type: "varchar(255)"
    display_name: "地址2"
    description: "地址2"
    sensitive: true

  - name: "citizenship_status"
    type: "smallint"
    display_name: "0=Non resident"
    description: "0=Non resident, 1=Singapore Citizen, 2=Permanent resident"
    enum_values:
      - {value: 0, label: "Non resident"}
      - {value: 1, label: "Singapore Citizen"}
      - {value: 2, label: "Permanent resident"}

  - name: "owners_status"
    type: "tinyint(1)"
    display_name: "0=Incompleted，1=Complete"
    description: "0=Incompleted，1=Completed"
    enum_values:
      - {value: 0, label: "Incompleted"}
      - {value: 1, label: "Completed"}

  - name: "is_deleted"
    type: "tinyint(1)"
    display_name: "是否删除"
    description: "是否删除:0=正常，1=删除【废弃】"
    enum_values:
      - {value: 0, label: "正常"}
      - {value: 1, label: "删除【废弃】"}

  - name: "attach_status"
    type: "tinyint(1)"
    display_name: "是否有附件"
    description: "是否有附件"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

  - name: "third_kyc_response"
    type: "text"
    display_name: "第三方Check返回resp"
    description: "第三方Check返回resp"
    skip_index: true

  - name: "aml_check_id"
    type: "varchar(36)"
    display_name: "关联aml_check_id"
    description: "关联aml_check_id"

  - name: "verification_status"
    type: "varchar(30)"
    display_name: "KYC/KYB认证状态"
    description: "认证状态：已过期 (EXPIRED)，不通过 (REJECTED)，未开始 (NOT_STARTED)，已通过 (APPROVED)，待处理 (ACTION_REQUIRED & 等待客户下一步操作)，豁免 (EXEMPTED)"
    enum_values:
      - {value: -1, label: "拒绝"}
      - {value: 0, label: "默认/未认证"}
      - {value: 1, label: "已通过"}
      - {value: 2, label: "审核中"}

relations: []

common_queries:
  - question: "客户权益人表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_customer_owners`;
    tables: ["uqpay_customer_owners"]
    difficulty: "easy"
  - question: "最近30天客户权益人表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_customer_owners`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uqpay_customer_owners"]
    difficulty: "easy"
  - question: "客户权益人表按状态分布"
    sql: |
      SELECT
          CASE verification_status
            WHEN -1 THEN '拒绝'
            WHEN 0 THEN '默认/未认证'
            WHEN 1 THEN '已通过'
            WHEN 2 THEN '审核中'
            ELSE CONCAT('其他:', CAST(verification_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uqpay_customer_owners`
      GROUP BY verification_status
      ORDER BY COUNT(*) DESC;
    tables: ["uqpay_customer_owners"]
    difficulty: "medium"
  - question: "客户权益人表按account_id分布最多的是哪些"
    sql: |
      SELECT account_id AS "account_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_customer_owners`
      WHERE account_id IS NOT NULL AND account_id != ''
      GROUP BY account_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uqpay_customer_owners"]
    difficulty: "easy"

