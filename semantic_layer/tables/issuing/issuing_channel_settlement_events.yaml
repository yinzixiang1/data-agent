  description: |
    这张表记录 UQPAY 发卡业务中的渠道结算事件通用：StraitsX 三类 Webhook 用，后续其他通道复用。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "渠道", "清算", "事件", "issuing_channel_settlement_events"]
