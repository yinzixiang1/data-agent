relations: []

common_queries:
  - question: "渠道结算事件通用：StraitsX 三类 Webhook 用，后续其他通道复用表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_settlement_events`;
    tables: ["issuing_channel_settlement_events"]
    difficulty: "easy"
  - question: "最近30天渠道结算事件通用：StraitsX 三类 Webhook 用，后续其他通道复用表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_settlement_events`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_channel_settlement_events"]
    difficulty: "easy"
  - question: "渠道结算事件通用：StraitsX 三类 Webhook 用，后续其他通道复用表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN 1 THEN 'Received,预留扩展'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_channel_settlement_events`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_channel_settlement_events"]
    difficulty: "medium"
  - question: "渠道结算事件通用：StraitsX 三类 Webhook 用，后续其他通道复用表按transaction_id分布最多的是哪些"
    sql: |
      SELECT transaction_id AS "transaction_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_settlement_events`
      WHERE transaction_id IS NOT NULL AND transaction_id != ''
      GROUP BY transaction_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_channel_settlement_events"]
    difficulty: "easy"

