table:
  name: "pmt_account_bank_details"
  database: "dwd_banking"
  display_name: "账户银行信息表"
  description: |
    这张表记录支付/银行账户业务中的账户银行信息。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "账户", "银行", "详情", "pmt_account_bank_details"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "账户银行信息表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "账户银行信息表字段 account_id。"

  - name: "account_bank_id"
    type: "varchar(36)"
    display_name: "账户银行内部ID"
    description: "账户银行内部ID"

  - name: "country_code"
    type: "char(2)"
    display_name: "2-letter ISO 3166-2 coun"
    description: "2-letter ISO 3166-2 country code"
    enum_values:
      - {value: 2, label: "letter ISO"}
      - {value: 3166, label: "2 country code"}

  - name: "currency_code"
    type: "char(3)"
    display_name: "3-letter ISO-4217 code"
    description: "3-letter ISO-4217 code"
    enum_values:
      - {value: 3, label: "letter ISO-4217 code"}

  - name: "payment_method"
    type: "int"
    display_name: "1000=LOCAL"
    description: "1000=LOCAL, 2000=SWIFT"
    enum_values:
      - {value: 1000, label: "LOCAL"}
      - {value: 2000, label: "SWIFT"}

  - name: "clearing_system_type"
    type: "varchar(20)"
    display_name: "SG-FAST"
    description: "SG-FAST, RTGS, GIRO, US-ACH, Fedwire, SEPA, Faster Payments, CHAPS, Bacs, Zengin, , Bank, FPS, MEPS  —SWIFT"

  - name: "bank_address"
    type: "varchar(255)"
    display_name: "银行address"
    description: "账户银行信息表字段 bank_address。"
    sensitive: true

  - name: "deposit_conversion_currency"
    type: "varchar(3)"
    display_name: "外汇管制国，例如印尼，马来西亚等无法直接收。需要"
    description: "外汇管制国，例如印尼，马来西亚等无法直接收。需要存入转换"

  - name: "ref_cc_account_id"
    type: "varchar(48)"
    display_name: "refcc账户id"
    description: "账户银行信息表字段 ref_cc_account_id。"

  - name: "status"
    type: "tinyint(1)"
    display_name: "状态"
    description: "1-ACTIVE, 0-INACTIVE, -1=CLOSED"
    enum_values:
      - {value: 1, label: "ACTIVE"}
      - {value: 0, label: "INACTIVE"}
      - {value: -1, label: "CLOSED"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "account_channel_id"
    type: "varchar(36)"
    display_name: "关联用户渠道ID"
    description: "关联用户渠道ID"

  - name: "account_bank_type"
    type: "int"
    display_name: "账户余额类型 1000=VA 2000=FX"
    description: "账户余额类型 1000=VA 2000=FX(预留), 3000=AC, 4000=IC"
    enum_values:
      - {value: 1000, label: "VA"}
      - {value: 2000, label: "FX(预留)"}
      - {value: 3000, label: "AC"}
      - {value: 4000, label: "IC"}

relations: []

common_queries:
  - question: "账户银行信息表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_bank_details`;
    tables: ["pmt_account_bank_details"]
    difficulty: "easy"
  - question: "最近30天账户银行信息表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_bank_details`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_account_bank_details"]
    difficulty: "easy"
  - question: "账户银行信息表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN 1 THEN 'ACTIVE'
            WHEN 0 THEN 'INACTIVE'
            WHEN -1 THEN 'CLOSED'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_account_bank_details`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_account_bank_details"]
    difficulty: "medium"
  - question: "账户银行信息表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_bank_details`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_account_bank_details"]
    difficulty: "easy"

