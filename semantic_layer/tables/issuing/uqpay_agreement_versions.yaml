table:
  name: "uqpay_agreement_versions"
  database: "dwd_banking"
  display_name: "客户协议内容表"
  description: |
    这张表记录客户协议内容相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uqpay", "协议", "版本", "uqpay_agreement_versions"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "agreement_id"
    type: "varchar(36)"
    display_name: "协议ID"
    description: "协议ID"

  - name: "agreement_version_id"
    type: "varchar(36)"
    display_name: "协议版本ID"
    description: "协议版本ID"

  - name: "agreement_type"
    type: "int"
    display_name: "协议类型"
    description: "协议类型：0默认，1000=通用协议，2000=业务协议(2001=Banking，2002=Foreign，2003=Acquiring，2004=Issuing)"
    enum_values:
      - {value: 1000, label: "通用协议"}
      - {value: 2000, label: "业务协议("}
      - {value: 2001, label: "Banking"}
      - {value: 2002, label: "Foreign"}
      - {value: 2003, label: "Acquiring"}
      - {value: 2004, label: "Issuing)"}

  - name: "signing_type"
    type: "varchar(255)"
    display_name: "签约类型"
    description: "签约类型：0默认，1=强制签署，2=非强制签署"
    enum_values:
      - {value: 1, label: "强制签署"}
      - {value: 2, label: "非强制签署"}

  - name: "push_method"
    type: "varchar(40)"
    display_name: "推送方式"
    description: "推送方式：[\"WEBSITE\", \"EMAIL\"]"
    sensitive: true

  - name: "push_object_ids"
    type: "text"
    display_name: "推送具体对象"
    description: "推送具体对象：{\"ALL\": \"\", \"PARTIAL\": \"FI、KA\", \"SPECIFIED\": [\"acdfadf0-0a53-4ade-a3f9-7ee5a3e32ca9\"]}"
    skip_index: true

  - name: "agreement_status"
    type: "tinyint"
    display_name: "协议状态"
    description: "协议状态：-1=删除; 0:default, 1:active, 2:inactive"
    enum_values:
      - {value: -1, label: "删除"}
      - {value: 0, label: "default"}
      - {value: 1, label: "active"}
      - {value: 2, label: "inactive"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "create_id"
    type: "varchar(36)"
    display_name: "创建者ID"
    description: "创建者ID"

  - name: "agreement_content"
    type: "longtext"
    display_name: "协议内容"
    description: "协议内容"
    skip_index: true

  - name: "attach_file_type"
    type: "varchar(45)"
    display_name: "文件类型"
    description: "文件类型：文件后缀名"

relations: []

common_queries:
  - question: "客户协议内容表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_agreement_versions`;
    tables: ["uqpay_agreement_versions"]
    difficulty: "easy"
  - question: "最近30天客户协议内容表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_agreement_versions`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uqpay_agreement_versions"]
    difficulty: "easy"
  - question: "客户协议内容表按状态分布"
    sql: |
      SELECT
          CASE agreement_status
            WHEN -1 THEN '删除'
            WHEN 0 THEN 'default'
            WHEN 1 THEN 'active'
            WHEN 2 THEN 'inactive'
            ELSE CONCAT('其他:', CAST(agreement_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uqpay_agreement_versions`
      GROUP BY agreement_status
      ORDER BY COUNT(*) DESC;
    tables: ["uqpay_agreement_versions"]
    difficulty: "medium"

review_required:
