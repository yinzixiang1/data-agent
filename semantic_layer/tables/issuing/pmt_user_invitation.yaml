table:
  name: "pmt_user_invitation"
  database: "dwd_banking"
  display_name: "商户-用户邀请码表"
  description: |
    这张表记录支付/银行账户业务中的商户-用户邀请码。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "用户", "invitation", "pmt_user_invitation"]
  query_tips: "时间范围优先使用 update_time 字段。"

columns:
  - name: "user_id"
    type: "varchar(36)"
    display_name: "用户ID"
    description: "用户ID"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "商户-用户邀请码表字段 account_id。"

  - name: "invited_user_id"
    type: "varchar(36)"
    display_name: "被邀请进来的用户"
    description: "被邀请进来的用户"

  - name: "invited_email"
    type: "varchar(120)"
    display_name: "invitedemail"
    description: "商户-用户邀请码表字段 invited_email。"
    sensitive: true

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "过期时间"

  - name: "status"
    type: "tinyint(1)"
    display_name: "状态"
    description: "商户-用户邀请码表字段 status。"

relations: []

common_queries:
  - question: "商户-用户邀请码表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_user_invitation`;
    tables: ["pmt_user_invitation"]
    difficulty: "easy"
  - question: "最近30天商户-用户邀请码表每天新增多少"
    sql: |
      SELECT DATE(update_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_user_invitation`
      WHERE update_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(update_time)
      ORDER BY DATE(update_time) DESC;
    tables: ["pmt_user_invitation"]
    difficulty: "easy"
  - question: "商户-用户邀请码表按状态分布"
    sql: |
      SELECT
          status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_user_invitation`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_user_invitation"]
    difficulty: "easy"
  - question: "商户-用户邀请码表按user_id分布最多的是哪些"
    sql: |
      SELECT user_id AS "user_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_user_invitation`
      WHERE user_id IS NOT NULL AND user_id != ''
      GROUP BY user_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_user_invitation"]
    difficulty: "easy"

