table:
  name: "uq_customer_app"
  database: "dwd_banking"
  display_name: "UQ-客户开通业务产品表"
  description: |
    这张表记录UQ-客户开通业务产品相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uq", "客户", "应用", "uq_customer_app"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "app_id"
    type: "varchar(36)"
    display_name: "当前ID - uuid"
    description: "当前ID - uuid"

  - name: "master_id"
    type: "varchar(36)"
    display_name: "上级ID"
    description: "上级ID"

  - name: "customer_id"
    type: "varchar(36)"
    display_name: "客户ID"
    description: "客户ID"

  - name: "short_customer_id"
    type: "varchar(20)"
    display_name: "客户号"
    description: "客户号"

  - name: "bus_type"
    type: "int"
    display_name: "主业务类型"
    description: "主业务类型：VA=1000, FX=2000, AC=3000, IC=4000"

  - name: "app_status"
    type: "int"
    display_name: "-1=注销关闭，0=默认不可用，1=可用"
    description: "-1=注销关闭，0=默认不可用，1=可用"
    enum_values:
      - {value: -1, label: "注销关闭"}
      - {value: 0, label: "默认不可用"}
      - {value: 1, label: "可用"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

  - name: "app_data"
    type: "text"
    display_name: "可配置参数"
    description: "可配置参数"
    skip_index: true

  - name: "terms_policies_req"
    type: "text"
    display_name: "条款协议请求痕迹"
    description: "条款协议请求痕迹"
    skip_index: true

  - name: "terms_policies_html"
    type: "longtext"
    display_name: "协议文本内容"
    description: "协议文本内容"
    skip_index: true

  - name: "review_status"
    type: "int"
    display_name: "审核状态"
    description: "审核状态：-1=REJECT，0=NOT_OPERATED，1=COMPLETE，2=WAITING，3=RETURN，4=EXPIRE，5=AGREE_AGREEMENT"
    enum_values:
      - {value: -1, label: "REJECT"}
      - {value: 0, label: "NOT_OPERATED"}
      - {value: 1, label: "COMPLETE"}
      - {value: 2, label: "WAITING"}
      - {value: 3, label: "RETURN"}
      - {value: 4, label: "EXPIRE"}
      - {value: 5, label: "AGREE_AGREEMENT"}

  - name: "allow_check_subcustomer"
    type: "smallint"
    display_name: "审查级别；0=默认，1=审核，2=免审核"
    description: "审查级别；0=默认，1=审核，2=免审核"
    enum_values:
      - {value: 0, label: "默认"}
      - {value: 1, label: "审核"}
      - {value: 2, label: "免审核"}

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "creatorid"
    description: "UQ-客户开通业务产品表字段 creator_id。"

relations: []

common_queries:
  - question: "UQ-客户开通业务产品表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_app`;
    tables: ["uq_customer_app"]
    difficulty: "easy"
  - question: "最近30天UQ-客户开通业务产品表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_app`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uq_customer_app"]
    difficulty: "easy"
  - question: "UQ-客户开通业务产品表按状态分布"
    sql: |
      SELECT
          CASE app_status
            WHEN -1 THEN '注销关闭'
            WHEN 0 THEN '默认不可用'
            WHEN 1 THEN '可用'
            ELSE CONCAT('其他:', CAST(app_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uq_customer_app`
      GROUP BY app_status
      ORDER BY COUNT(*) DESC;
    tables: ["uq_customer_app"]
    difficulty: "medium"
  - question: "UQ-客户开通业务产品表按customer_id分布最多的是哪些"
    sql: |
      SELECT customer_id AS "customer_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_customer_app`
      WHERE customer_id IS NOT NULL AND customer_id != ''
      GROUP BY customer_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uq_customer_app"]
    difficulty: "easy"

