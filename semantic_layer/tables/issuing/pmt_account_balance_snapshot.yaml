table:
  name: "pmt_account_balance_snapshot"
  database: "dwd_banking"
  display_name: "账户余额快照表"
  description: |
    这张表记录支付/银行账户业务中的账户余额快照。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "余额", "账户", "快照", "pmt_account_balance_snapshot"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "机构ID"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "系统内部账户ID"

  - name: "balance_id"
    type: "varchar(36)"
    display_name: "余额账户ID"
    description: "余额账户ID"

  - name: "balance_type"
    type: "int"
    display_name: "账户余额类型 1000=VA 2000=FX"
    description: "账户余额类型 1000=VA 2000=FX(预留), 3000=AC, 4000=IC"
    enum_values:
      - {value: 1000, label: "VA"}
      - {value: 2000, label: "FX(预留)"}
      - {value: 3000, label: "AC"}
      - {value: 4000, label: "IC"}

  - name: "balance_currency"
    type: "varchar(6)"
    display_name: "账户币种"
    description: "账户币种"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "账户余额快照表字段 create_time。"

  - name: "balance_status"
    type: "tinyint(1)"
    display_name: "0"
    description: "0:default, 1:active, closed:2, processing:3"
    enum_values:
      - {value: 0, label: "default"}
      - {value: 1, label: "active, closed:2, processing:3"}

relations:
  - column: "account_id"
    target_table: "pmt_account"
    target_column: "account_id"
    join_type: "LEFT JOIN"
    description: "余额快照报表按账户ID关联账户主表，来源 uqpay-issuing-task/tasks/report/balance_snapshot_report.go"
  - column: "direct_id"
    target_table: "pmt_account"
    target_column: "account_id"
    join_type: "LEFT JOIN"
    description: "余额快照报表按直属账户ID关联主账户，来源 uqpay-issuing-task/tasks/report/balance_snapshot_report.go"

common_queries:
  - question: "账户余额快照表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_balance_snapshot`;
    tables: ["pmt_account_balance_snapshot"]
    difficulty: "easy"
  - question: "最近30天账户余额快照表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_balance_snapshot`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_account_balance_snapshot"]
    difficulty: "easy"
  - question: "账户余额快照表按状态分布"
    sql: |
      SELECT
          CASE balance_status
            WHEN 0 THEN 'default'
            WHEN 1 THEN 'active, closed:2, processing:3'
            ELSE CONCAT('其他:', CAST(balance_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_account_balance_snapshot`
      GROUP BY balance_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_account_balance_snapshot"]
    difficulty: "medium"
  - question: "账户余额快照表按币种汇总金额"
    sql: |
      SELECT balance_currency AS "币种", COUNT(*) AS "笔数", SUM(available_balance) AS "金额"
      FROM dwd_banking.`pmt_account_balance_snapshot`
      GROUP BY balance_currency
      ORDER BY SUM(available_balance) DESC;
    tables: ["pmt_account_balance_snapshot"]
    difficulty: "medium"
  - question: "账户余额快照表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_account_balance_snapshot`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_account_balance_snapshot"]
    difficulty: "easy"

review_required: []

code_sources:
  - "uqpay-issuing-admincp-api/internal/domain/entity/pmt_account_balance_snapshot.go"
  - "uqpay-issuing-admincp-api/internal/repo/account_balance_snapshot_repo.go"
  - "uqpay-issuing-admincp-api/internal/service/pmt_account_balance_snapshot_service.go"
  - "uqpay-issuing-task/internal/domain/entity/pmt_account_balance_snapshot.go"
  - "uqpay-issuing-task/tasks/report/balance_snapshot_report.go"
  - "uqpay-issuing-admincp-api/internal/data/pmt_account_balance_snapshot_data.go"
  - "uqpay-task/internal/job/issuing/task_balance_snapshot_report.go"
  - "uqpay-issuing-admincp-api/pkg/tools/balance_snapshot/snapshot_test.go"
