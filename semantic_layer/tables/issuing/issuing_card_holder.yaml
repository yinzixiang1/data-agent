common_queries:
  - question: "发卡持卡人表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_holder`;
    tables: ["issuing_card_holder"]
    difficulty: "easy"
  - question: "最近30天发卡持卡人表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_holder`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_card_holder"]
    difficulty: "easy"
  - question: "发卡持卡人表按状态分布"
    sql: |
      SELECT
          CASE verification_status
            WHEN -1 THEN '拒绝'
            WHEN 0 THEN '默认/未认证'
            WHEN 1 THEN '已通过'
            WHEN 2 THEN '审核中'
            ELSE CONCAT('其他:', CAST(verification_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_card_holder`
      GROUP BY verification_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_card_holder"]
    difficulty: "medium"
  - question: "发卡持卡人表按user_id分布最多的是哪些"
    sql: |
      SELECT user_id AS "user_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_holder`
      WHERE user_id IS NOT NULL AND user_id != ''
      GROUP BY user_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_card_holder"]
    difficulty: "easy"

