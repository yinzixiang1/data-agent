table:
  name: "pmt_finance_collection"
  database: "dwd_banking"
  display_name: "资金归集记录表"
  description: |
    这张表记录支付/银行账户业务中的资金归集记录。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "资金", "收款", "pmt_finance_collection"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "collection_id"
    type: "varchar(36)"
    display_name: "收款id"
    description: "资金归集记录表字段 collection_id。"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "资金归集记录表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "资金归集记录表字段 account_id。"

  - name: "currency"
    type: "varchar(6)"
    display_name: "币种"
    description: "资金归集记录表字段 currency。"

  - name: "amount"
    type: "decimal(16,2)"
    display_name: "金额"
    description: "资金归集记录表字段 amount。"

  - name: "collection_type"
    type: "int"
    display_name: "1000"
    description: "1000: deposit; 2000: payout; 2001:payout refund"
    enum_values:
      - {value: 1000, label: "deposit"}
      - {value: 2000, label: "payout"}
      - {value: 2001, label: "payout refund"}

  - name: "inbound_type"
    type: "int"
    display_name: "1000"
    description: "1000: to house; 2000: to client"
    enum_values:
      - {value: 1000, label: "to house"}
      - {value: 2000, label: "to client"}

  - name: "ref_cc_client_id"
    type: "varchar(36)"
    display_name: "refccclientid"
    description: "资金归集记录表字段 ref_cc_client_id。"

  - name: "ref_cc_house_id"
    type: "varchar(36)"
    display_name: "refcchouseid"
    description: "资金归集记录表字段 ref_cc_house_id。"

  - name: "channel_resp_id"
    type: "varchar(100)"
    display_name: "渠道respid"
    description: "资金归集记录表字段 channel_resp_id。"

  - name: "channel_resp_status"
    type: "varchar(20)"
    display_name: "渠道respstatus"
    description: "资金归集记录表字段 channel_resp_status。"

  - name: "channel_resp_body"
    type: "text"
    display_name: "渠道respbody"
    description: "资金归集记录表字段 channel_resp_body。"
    skip_index: true

  - name: "short_account_id"
    type: "varchar(20)"
    display_name: "账户短号"
    description: "account id短号"

  - name: "reference_id"
    type: "varchar(36)"
    display_name: "关联原始订单 长单号"
    description: "关联原始订单 长单号"

  - name: "short_reference_id"
    type: "varchar(20)"
    display_name: "关联原始订单 短单号"
    description: "关联原始订单 短单号"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "资金归集记录表字段 update_time。"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "资金归集记录表字段 create_time。"

  - name: "status"
    type: "tinyint(1)"
    display_name: "状态"
    description: "-1: failed，1:successful, 2: processing"
    enum_values:
      - {value: -1, label: "failed"}
      - {value: 1, label: "successful"}
      - {value: 2, label: "processing"}

relations: []

common_queries:
  - question: "资金归集记录表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_collection`;
    tables: ["pmt_finance_collection"]
    difficulty: "easy"
  - question: "最近30天资金归集记录表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_collection`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_finance_collection"]
    difficulty: "easy"
  - question: "资金归集记录表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN -1 THEN 'failed'
            WHEN 1 THEN 'successful'
            WHEN 2 THEN 'processing'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_finance_collection`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_finance_collection"]
    difficulty: "medium"
  - question: "资金归集记录表按币种汇总金额"
    sql: |
      SELECT currency AS "币种", COUNT(*) AS "笔数", SUM(amount) AS "金额"
      FROM dwd_banking.`pmt_finance_collection`
      GROUP BY currency
      ORDER BY SUM(amount) DESC;
    tables: ["pmt_finance_collection"]
    difficulty: "medium"
  - question: "资金归集记录表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_collection`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_finance_collection"]
    difficulty: "easy"

review_required:
  - "未在 Go 代码中找到明确表名或实体引用，字段含义主要来自 DDL COMMENT，需要业务确认。"
  - "未发现可确认的真实代码 JOIN，relations 暂不配置，避免猜测关联。"
