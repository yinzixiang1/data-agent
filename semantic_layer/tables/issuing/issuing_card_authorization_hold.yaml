table:
  name: "issuing_card_authorization_hold"
  database: "dwd_banking"
  display_name: "授权保留表"
  description: |
    这张表记录 UQPAY 发卡业务中的授权保留。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "卡片", "授权", "冻结", "issuing_card_authorization_hold"]
  query_tips: "时间范围优先使用 auth_hold_create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "授权保留表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "授权保留表字段 account_id。"

  - name: "transaction_id"
    type: "varchar(36)"
    display_name: "交易id"
    description: "授权保留表字段 transaction_id。"

  - name: "auth_hold_id"
    type: "varchar(36)"
    display_name: "auth冻结id"
    description: "授权保留表字段 auth_hold_id。"

  - name: "auth_hold_type"
    type: "smallint"
    display_name: "授权HOLD类型，1000=消费，2000=退款"
    description: "授权HOLD类型，1000=消费，2000=退款"
    enum_values:
      - {value: 1000, label: "消费"}
      - {value: 2000, label: "退款"}

  - name: "auth_hold_amount"
    type: "decimal(16,4)"
    display_name: "auth冻结amount"
    description: "授权保留表字段 auth_hold_amount。"

  - name: "auth_hold_currency"
    type: "varchar(3)"
    display_name: "auth冻结币种"
    description: "授权保留表字段 auth_hold_currency。"

  - name: "auth_hold_status"
    type: "smallint"
    display_name: "状态 1=活动，0=释放"
    description: "状态 1=活动，0=释放"
    enum_values:
      - {value: 1, label: "活动"}
      - {value: 0, label: "释放"}

relations: []

common_queries:
  - question: "授权保留表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_authorization_hold`;
    tables: ["issuing_card_authorization_hold"]
    difficulty: "easy"
  - question: "最近30天授权保留表每天新增多少"
    sql: |
      SELECT DATE(auth_hold_create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_authorization_hold`
      WHERE auth_hold_create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(auth_hold_create_time)
      ORDER BY DATE(auth_hold_create_time) DESC;
    tables: ["issuing_card_authorization_hold"]
    difficulty: "easy"
  - question: "授权保留表按状态分布"
    sql: |
      SELECT
          CASE auth_hold_status
            WHEN 1 THEN '活动'
            WHEN 0 THEN '释放'
            ELSE CONCAT('其他:', CAST(auth_hold_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_card_authorization_hold`
      GROUP BY auth_hold_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_card_authorization_hold"]
    difficulty: "medium"
  - question: "授权保留表按币种汇总金额"
    sql: |
      SELECT auth_hold_currency AS "币种", COUNT(*) AS "笔数", SUM(auth_hold_amount) AS "金额"
      FROM dwd_banking.`issuing_card_authorization_hold`
      GROUP BY auth_hold_currency
      ORDER BY SUM(auth_hold_amount) DESC;
    tables: ["issuing_card_authorization_hold"]
    difficulty: "medium"
  - question: "授权保留表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_authorization_hold`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_card_authorization_hold"]
    difficulty: "easy"

review_required:
  - "未在 Go 代码中找到明确表名或实体引用，字段含义主要来自 DDL COMMENT，需要业务确认。"
  - "未发现可确认的真实代码 JOIN，relations 暂不配置，避免猜测关联。"
