table:
  name: "uq_risk_prompts"
  database: "dwd_banking"
  display_name: "客户风险提示表"
  description: |
    这张表记录客户风险提示相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uq", "风险", "提示词", "uq_risk_prompts"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "master_id"
    type: "varchar(36)"
    display_name: "上级ID"
    description: "上级ID"

  - name: "customer_id"
    type: "varchar(36)"
    display_name: "客户ID"
    description: "客户ID"

  - name: "short_customer_id"
    type: "varchar(20)"
    display_name: "客户号"
    description: "客户号"

  - name: "risk_id"
    type: "varchar(36)"
    display_name: "风险ID"
    description: "风险ID"

  - name: "short_reference_id"
    type: "varchar(20)"
    display_name: "短号"
    description: "短号"

  - name: "risk_factor_type"
    type: "varchar(255)"
    display_name: "分享因素类型"
    description: "分享因素类型：1000=customer，2000=订单类"
    enum_values:
      - {value: 1000, label: "customer"}
      - {value: 2000, label: "订单类"}

  - name: "risk_status"
    type: "int"
    display_name: "风险状态"
    description: "风险状态：0默认，1已处理，2未处理"

  - name: "ref_reference_id"
    type: "varchar(36)"
    display_name: "关联ID"
    description: "关联ID"

  - name: "ref_short_reference_id"
    type: "varchar(20)"
    display_name: "短号"
    description: "短号"

  - name: "ref_reference_value"
    type: "text"
    display_name: "处理值"
    description: "处理值"
    skip_index: true

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

relations: []

common_queries:
  - question: "客户风险提示表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_risk_prompts`;
    tables: ["uq_risk_prompts"]
    difficulty: "easy"
  - question: "最近30天客户风险提示表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_risk_prompts`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uq_risk_prompts"]
    difficulty: "easy"
  - question: "客户风险提示表按状态分布"
    sql: |
      SELECT
          risk_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uq_risk_prompts`
      GROUP BY risk_status
      ORDER BY COUNT(*) DESC;
    tables: ["uq_risk_prompts"]
    difficulty: "easy"
  - question: "客户风险提示表按customer_id分布最多的是哪些"
    sql: |
      SELECT customer_id AS "customer_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_risk_prompts`
      WHERE customer_id IS NOT NULL AND customer_id != ''
      GROUP BY customer_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uq_risk_prompts"]
    difficulty: "easy"

