table:
  name: "sys_schedule_job_log"
  database: "dwd_banking"
  display_name: "定时任务日志【废弃】表"
  description: |
    这张表记录系统侧的定时任务日志【废弃】。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "调度", "任务", "日志", "sys_schedule_job_log"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "log_id"
    type: "bigint"
    display_name: "任务日志id"
    description: "任务日志id"

  - name: "job_id"
    type: "bigint"
    display_name: "任务id"
    description: "任务id"

  - name: "params"
    type: "text"
    display_name: "参数"
    description: "参数"
    skip_index: true

  - name: "status"
    type: "tinyint"
    display_name: "状态"
    description: "任务状态 ：0=失败；1=成功"
    enum_values:
      - {value: 0, label: "失败"}
      - {value: 1, label: "成功"}

  - name: "error"
    type: "text"
    display_name: "失败信息"
    description: "失败信息"
    skip_index: true

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

relations: []

common_queries:
  - question: "定时任务日志【废弃】表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_schedule_job_log`;
    tables: ["sys_schedule_job_log"]
    difficulty: "easy"
  - question: "最近30天定时任务日志【废弃】表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_schedule_job_log`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["sys_schedule_job_log"]
    difficulty: "easy"
  - question: "定时任务日志【废弃】表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN 0 THEN '失败'
            WHEN 1 THEN '成功'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`sys_schedule_job_log`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["sys_schedule_job_log"]
    difficulty: "medium"

review_required:
  - "未发现可确认的真实代码 JOIN，relations 暂不配置，避免猜测关联。"
  - "通用问题由字段结构自动生成，建议数仓补充真实高频问法和标准 SQL。"

