table:
  name: "uq_workflow_config"
  database: "dwd_banking"
  display_name: "UQ-工作流设置表"
  description: |
    这张表记录UQ-工作流设置相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uq", "工作流", "配置", "uq_workflow_config"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "id"
    type: "bigint"
    display_name: "主键ID"
    description: "UQ-工作流设置表字段 id。"

  - name: "wf_config_id"
    type: "varchar(36)"
    display_name: "设置UUID"
    description: "设置UUID"

  - name: "flow_type"
    type: "int"
    display_name: "流类型，1=customer类，2=KYC/KY"
    description: "流类型，1=customer类，2=KYC/KYB类，1000=商户类，2000=财务类，9000=配置类，9001=批量邮件类"
    enum_values:
      - {value: 1, label: "customer类"}
      - {value: 2, label: "KYC/KYB类"}
      - {value: 1000, label: "商户类"}
      - {value: 2000, label: "财务类"}
      - {value: 9000, label: "配置类"}
      - {value: 9001, label: "批量邮件类"}

  - name: "meta_data"
    type: "text"
    display_name: "元数据"
    description: "元数据"
    skip_index: true

  - name: "flow_admin"
    type: "text"
    display_name: "审查用户集合[{\"uid\""
    description: "审查用户集合[{\"uid\": \"1\", \"nickname\": \"admin\"}]"
    skip_index: true

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "创建者ID"
    description: "创建者ID"

  - name: "status"
    type: "tinyint"
    display_name: "状态"
    description: "-1=关闭，0=默认，1=可用"
    enum_values:
      - {value: -1, label: "关闭"}
      - {value: 0, label: "默认"}
      - {value: 1, label: "可用"}

relations: []

common_queries:
  - question: "UQ-工作流设置表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_workflow_config`;
    tables: ["uq_workflow_config"]
    difficulty: "easy"
  - question: "最近30天UQ-工作流设置表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uq_workflow_config`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uq_workflow_config"]
    difficulty: "easy"
  - question: "UQ-工作流设置表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN -1 THEN '关闭'
            WHEN 0 THEN '默认'
            WHEN 1 THEN '可用'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uq_workflow_config`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["uq_workflow_config"]
    difficulty: "medium"

