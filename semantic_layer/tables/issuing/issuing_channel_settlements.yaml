table:
  name: "issuing_channel_settlements"
  database: "dwd_banking"
  display_name: "渠道清算表"
  description: |
    这张表记录 UQPAY 发卡业务中的渠道清算。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "渠道", "清算", "issuing_channel_settlements"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "file_id"
    type: "bigint"
    display_name: "文件ID"
    description: "文件ID"

  - name: "message_type"
    type: "varchar(4)"
    display_name: "消息type"
    description: "渠道清算表字段 message_type。"

  - name: "card_number"
    type: "varchar(19)"
    display_name: "卡号"
    description: "卡号"
    sensitive: true

  - name: "pan_hash"
    type: "varchar(64)"
    display_name: "PAN哈希"
    description: "PAN sha256 hash值"
    sensitive: true

  - name: "mask_card_number"
    type: "varchar(36)"
    display_name: "脱敏卡号"
    description: "脱敏后的card number"
    sensitive: true

  - name: "transaction_amount"
    type: "decimal(16,2)"
    display_name: "交易金额"
    description: "交易金额"

  - name: "transaction_currency"
    type: "varchar(4)"
    display_name: "交易币种"
    description: "交易币种"

  - name: "billing_amount"
    type: "decimal(16,2)"
    display_name: "账单交易金额"
    description: "账单交易金额"

  - name: "billing_currency"
    type: "varchar(4)"
    display_name: "账单交易币种"
    description: "账单交易币种"

  - name: "merchant_id"
    type: "varchar(128)"
    display_name: "merchantid"
    description: "渠道清算表字段 merchant_id。"

  - name: "network_transaction_id"
    type: "varchar(96)"
    display_name: "卡组织交易id"
    description: "渠道清算表字段 network_transaction_id。"

  - name: "channel_resp_body"
    type: "text"
    display_name: "渠道响应体"
    description: "渠道响应体"
    skip_index: true

  - name: "settlement_status"
    type: "varchar(35)"
    display_name: "结算状态"
    description: "结算状态"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "card_id"
    type: "varchar(120)"
    display_name: "卡片ID"
    description: "渠道card id"

  - name: "reconciliation_status"
    type: "tinyint"
    display_name: "对账状态"
    description: "对账状态, 默认0, 已对账:1"

relations: []

common_queries:
  - question: "渠道清算表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_settlements`;
    tables: ["issuing_channel_settlements"]
    difficulty: "easy"
  - question: "最近30天渠道清算表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_settlements`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_channel_settlements"]
    difficulty: "easy"
  - question: "渠道清算表按状态分布"
    sql: |
      SELECT
          settlement_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_channel_settlements`
      GROUP BY settlement_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_channel_settlements"]
    difficulty: "easy"
  - question: "渠道清算表按币种汇总金额"
    sql: |
      SELECT transaction_currency AS "币种", COUNT(*) AS "笔数", SUM(transaction_amount) AS "金额"
      FROM dwd_banking.`issuing_channel_settlements`
      GROUP BY transaction_currency
      ORDER BY SUM(transaction_amount) DESC;
    tables: ["issuing_channel_settlements"]
    difficulty: "medium"
  - question: "渠道清算表按card_id分布最多的是哪些"
    sql: |
      SELECT card_id AS "card_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_settlements`
      WHERE card_id IS NOT NULL AND card_id != ''
      GROUP BY card_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_channel_settlements"]
    difficulty: "easy"

review_required:
