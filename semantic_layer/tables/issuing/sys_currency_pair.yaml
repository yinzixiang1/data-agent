table:
  name: "sys_currency_pair"
  database: "dwd_banking"
  display_name: "货币币种对表"
  description: |
    这张表记录系统侧的货币币种对。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "币种", "pair", "sys_currency_pair"]
  query_tips: "时间范围优先使用 update_time 字段。"

columns:
  - name: "currency_type"
    type: "int"
    display_name: "1000=fiat 2000=crypto 30"
    description: "1000=fiat 2000=crypto 3000=hybird"
    enum_values:
      - {value: 1000, label: "fiat"}
      - {value: 2000, label: "crypto"}
      - {value: 3000, label: "hybird"}

  - name: "currency_network"
    type: "varchar(24)"
    display_name: "币种网络 fiat hybird"
    description: "币种网络 fiat hybird,其他数字货币"

  - name: "currency_pair_code"
    type: "varchar(12)"
    display_name: "币种paircode"
    description: "货币币种对表字段 currency_pair_code。"

  - name: "original_currency"
    type: "varchar(12)"
    display_name: "原始币种"
    description: "原始币种"

  - name: "target_currency"
    type: "varchar(12)"
    display_name: "目标币种"
    description: "目标币种"

  - name: "conversion_dates"
    type: "text"
    display_name: "fx不可交易日"
    description: "fx不可交易日"
    skip_index: true

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "创建时间"

  - name: "status"
    type: "tinyint(1)"
    display_name: "状态"
    description: "1:可用；-1:不可用"
    enum_values:
      - {value: 1, label: "可用"}
      - {value: -1, label: "不可用"}

  - name: "exchange"
    type: "int"
    display_name: "0"
    description: "0:不可以兑换 1:可以兑换"
    enum_values:
      - {value: 0, label: "不可以兑换"}
      - {value: 1, label: "可以兑换"}

relations: []

common_queries:
  - question: "货币币种对表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_currency_pair`;
    tables: ["sys_currency_pair"]
    difficulty: "easy"
  - question: "最近30天货币币种对表每天新增多少"
    sql: |
      SELECT DATE(update_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_currency_pair`
      WHERE update_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(update_time)
      ORDER BY DATE(update_time) DESC;
    tables: ["sys_currency_pair"]
    difficulty: "easy"
  - question: "货币币种对表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN 1 THEN '可用'
            WHEN -1 THEN '不可用'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`sys_currency_pair`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["sys_currency_pair"]
    difficulty: "medium"

review_required:
