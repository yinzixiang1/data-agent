table:
  name: "pmt_finance_refund"
  database: "dwd_banking"
  display_name: "退款记录表"
  description: |
    这张表记录支付/银行账户业务中的退款记录。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "资金", "退款", "pmt_finance_refund"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "refund_id"
    type: "varchar(36)"
    display_name: "退款id"
    description: "退款记录表字段 refund_id。"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "退款记录表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "退款记录表字段 account_id。"

  - name: "refund_currency"
    type: "varchar(6)"
    display_name: "原订单币种"
    description: "原订单币种"

  - name: "refund_amount"
    type: "decimal(16,2)"
    display_name: "原订单本金"
    description: "原订单本金"

  - name: "refund_type"
    type: "int"
    display_name: "同交易类型"
    description: "同交易类型"

  - name: "fee_amount"
    type: "decimal(16,2)"
    display_name: "退款手续费"
    description: "退款手续费"

  - name: "returned_amount"
    type: "decimal(16,2)"
    display_name: "实际退回金额"
    description: "实际退回金额"

  - name: "short_reference_id"
    type: "varchar(36)"
    display_name: "shortreferenceid"
    description: "退款记录表字段 short_reference_id。"

  - name: "short_account_id"
    type: "varchar(36)"
    display_name: "账户短号"
    description: "退款记录表字段 short_account_id。"

  - name: "ref_reference_id"
    type: "varchar(36)"
    display_name: "关联订单ID"
    description: "关联订单ID"

  - name: "ref_short_reference_id"
    type: "varchar(20)"
    display_name: "关联订单短ID"
    description: "关联订单短ID"

  - name: "transaction_id"
    type: "varchar(36)"
    display_name: "关联流水ID"
    description: "关联流水ID"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "退款记录表字段 update_time。"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "退款记录表字段 create_time。"

  - name: "review_status"
    type: "int"
    display_name: "1"
    description: "1: 审核通过 -1: 审核拒绝"
    enum_values:
      - {value: 1, label: "审核通过"}
      - {value: -1, label: "审核拒绝"}

  - name: "refund_status"
    type: "tinyint(1)"
    display_name: "退款状态"
    description: "-1失败，1成功"

relations: []

common_queries:
  - question: "退款记录表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_refund`;
    tables: ["pmt_finance_refund"]
    difficulty: "easy"
  - question: "最近30天退款记录表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_refund`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_finance_refund"]
    difficulty: "easy"
  - question: "退款记录表按状态分布"
    sql: |
      SELECT
          CASE review_status
            WHEN 1 THEN '审核通过'
            WHEN -1 THEN '审核拒绝'
            ELSE CONCAT('其他:', CAST(review_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_finance_refund`
      GROUP BY review_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_finance_refund"]
    difficulty: "medium"
  - question: "退款记录表按币种汇总金额"
    sql: |
      SELECT refund_currency AS "币种", COUNT(*) AS "笔数", SUM(fee_amount) AS "金额"
      FROM dwd_banking.`pmt_finance_refund`
      GROUP BY refund_currency
      ORDER BY SUM(fee_amount) DESC;
    tables: ["pmt_finance_refund"]
    difficulty: "medium"
  - question: "退款记录表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_refund`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_finance_refund"]
    difficulty: "easy"

