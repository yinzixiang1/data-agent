table:
  name: "uqpay_user_account_related"
  database: "dwd_banking"
  display_name: "User与Account关系表"
  description: |
    这张表记录User与Account关系相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "账户", "uqpay", "用户", "related", "uqpay_user_account_related"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "id"
    type: "bigint"
    display_name: "主键ID"
    description: "User与Account关系表字段 id。"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "上级ID"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "User与Account关系表字段 account_id。"

  - name: "short_account_id"
    type: "varchar(20)"
    display_name: "账户短号"
    description: "短ID：C_11位数字"

  - name: "user_id"
    type: "varchar(36)"
    display_name: "用户id"
    description: "User与Account关系表字段 user_id。"

  - name: "role_id"
    type: "varchar(36)"
    display_name: "角色ID"
    description: "角色ID"

  - name: "is_owner"
    type: "tinyint(1)"
    display_name: "0-no"
    description: "0-no, 1=yes"
    enum_values:
      - {value: 0, label: "no"}
      - {value: 1, label: "yes"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "User与Account关系表字段 create_time。"

  - name: "account_status"
    type: "tinyint(1)"
    display_name: "账户状态"
    description: "0:default, 1:active, 2:inactive"
    enum_values:
      - {value: 0, label: "default"}
      - {value: 1, label: "active"}
      - {value: 2, label: "inactive"}

  - name: "user_email"
    type: "varchar(100)"
    display_name: "用户email"
    description: "User与Account关系表字段 user_email。"
    sensitive: true

relations: []

common_queries:
  - question: "User与Account关系表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_user_account_related`;
    tables: ["uqpay_user_account_related"]
    difficulty: "easy"
  - question: "最近30天User与Account关系表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_user_account_related`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uqpay_user_account_related"]
    difficulty: "easy"
  - question: "User与Account关系表按状态分布"
    sql: |
      SELECT
          CASE account_status
            WHEN 0 THEN 'default'
            WHEN 1 THEN 'active'
            WHEN 2 THEN 'inactive'
            ELSE CONCAT('其他:', CAST(account_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uqpay_user_account_related`
      GROUP BY account_status
      ORDER BY COUNT(*) DESC;
    tables: ["uqpay_user_account_related"]
    difficulty: "medium"
  - question: "User与Account关系表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_user_account_related`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uqpay_user_account_related"]
    difficulty: "easy"

