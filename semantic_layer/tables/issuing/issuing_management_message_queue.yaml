table:
  name: "issuing_management_message_queue"
  database: "dwd_banking"
  display_name: "管理类消息对列表"
  description: |
    这张表记录 UQPAY 发卡业务中的管理类消息对列。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "管理", "消息", "队列", "issuing_management_message_queue"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "msg_type"
    type: "int"
    display_name: "MSG TYPE"
    description: "MSG TYPE: 1000=VA, 2000=FX, 3000=AC, 4000=IC, 9000=GENERAL"
    enum_values:
      - {value: 1000, label: "VA"}
      - {value: 2000, label: "FX"}
      - {value: 3000, label: "AC"}
      - {value: 4000, label: "IC"}
      - {value: 9000, label: "GENERAL"}

  - name: "msg_body"
    type: "text"
    display_name: "msgbody"
    description: "管理类消息对列表字段 msg_body。"
    skip_index: true

  - name: "server_id"
    type: "varchar(64)"
    display_name: "服务器 server id"
    description: "服务器 server id"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "管理类消息对列表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "管理类消息对列表字段 update_time。"

  - name: "msg_status"
    type: "int"
    display_name: "-1处理失败 2"
    description: "-1处理失败 2:处理中"
    enum_values:
      - {value: 2, label: "处理中"}

  - name: "msg_reason"
    type: "text"
    display_name: "对内说明原因"
    description: "对内说明原因"
    skip_index: true

relations: []

common_queries:
  - question: "管理类消息对列表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_management_message_queue`;
    tables: ["issuing_management_message_queue"]
    difficulty: "easy"
  - question: "最近30天管理类消息对列表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_management_message_queue`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_management_message_queue"]
    difficulty: "easy"
  - question: "管理类消息对列表按状态分布"
    sql: |
      SELECT
          CASE msg_status
            WHEN 2 THEN '处理中'
            ELSE CONCAT('其他:', CAST(msg_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_management_message_queue`
      GROUP BY msg_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_management_message_queue"]
    difficulty: "medium"

