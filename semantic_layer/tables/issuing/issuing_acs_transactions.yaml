  - name: "purchase_currency"
    type: "varchar(4)"
    display_name: "purchase币种"
    description: "发卡3DS认证交易表字段 purchase_currency。"

  - name: "purchase_currency_numeric"
    type: "varchar(4)"
    display_name: "purchase币种numeric"
