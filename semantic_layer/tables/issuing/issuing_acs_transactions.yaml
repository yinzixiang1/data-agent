  - name: "otp"
    type: "varchar(10)"
    display_name: "一次性验证码"
    description: "发卡3DS认证交易表字段 otp。"
    sensitive: true

  - name: "otp_option"
    type: "varchar(5)"
    display_name: "验证码option"
    description: "发卡3DS认证交易表字段 otp_option。"
