relations: []

common_queries:
  - question: "发卡3DS认证交易表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_acs_transactions`;
    tables: ["issuing_acs_transactions"]
    difficulty: "easy"
  - question: "最近30天发卡3DS认证交易表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_acs_transactions`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_acs_transactions"]
    difficulty: "easy"
  - question: "发卡3DS认证交易表按状态分布"
    sql: |
      SELECT
          status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_acs_transactions`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_acs_transactions"]
    difficulty: "easy"
  - question: "发卡3DS认证交易表按币种汇总金额"
    sql: |
      SELECT purchase_currency AS "币种", COUNT(*) AS "笔数", SUM(purchase_amount) AS "金额"
      FROM dwd_banking.`issuing_acs_transactions`
      GROUP BY purchase_currency
      ORDER BY SUM(purchase_amount) DESC;
    tables: ["issuing_acs_transactions"]
    difficulty: "medium"
  - question: "发卡3DS认证交易表按card_id分布最多的是哪些"
    sql: |
      SELECT card_id AS "card_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_acs_transactions`
      WHERE card_id IS NOT NULL AND card_id != ''
      GROUP BY card_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_acs_transactions"]
    difficulty: "easy"

