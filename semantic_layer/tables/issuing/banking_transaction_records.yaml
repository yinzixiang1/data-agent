table:
  name: "banking_transaction_records"
  database: "dwd_banking"
  display_name: "银行账户交易记录"
  description: |
    这张表记录支付/银行账户业务中的银行账户交易记录。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["交易", "银行账户", "记录", "banking_transaction_records"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "id"
    type: "int"
    display_name: "主键ID"
    description: "银行账户交易记录字段 id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "付款人账户id"

  - name: "payee_id"
    type: "varchar(36)"
    display_name: "收款人账户Id"
    description: "收款人账户Id"

  - name: "trading_type"
    type: "binary(1)"
    display_name: "交易类型"
    description: "交易类型(枚举类型)"

  - name: "trading_id"
    type: "varchar(36)"
    display_name: "交易账单id"
    description: "交易账单id"

  - name: "currency"
    type: "varchar(3)"
    display_name: "币种"
    description: "币种"

  - name: "amount"
    type: "decimal(16,4)"
    display_name: "金额"
    description: "金额"

  - name: "integer_flag"
    type: "tinyint(1)"
    display_name: "金额是否为整数"
    description: "金额是否为整数(0-不是，1-是整数)"
    enum_values:
      - {value: 0, label: "不是"}
      - {value: 1, label: "是整数)"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

relations: []

common_queries:
  - question: "银行账户交易记录有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`banking_transaction_records`;
    tables: ["banking_transaction_records"]
    difficulty: "easy"
  - question: "最近30天银行账户交易记录每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`banking_transaction_records`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["banking_transaction_records"]
    difficulty: "easy"
  - question: "银行账户交易记录按币种汇总金额"
    sql: |
      SELECT currency AS "币种", COUNT(*) AS "笔数", SUM(amount) AS "金额"
      FROM dwd_banking.`banking_transaction_records`
      GROUP BY currency
      ORDER BY SUM(amount) DESC;
    tables: ["banking_transaction_records"]
    difficulty: "medium"
  - question: "银行账户交易记录按account_id分布最多的是哪些"
    sql: |
      SELECT account_id AS "account_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`banking_transaction_records`
      WHERE account_id IS NOT NULL AND account_id != ''
      GROUP BY account_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["banking_transaction_records"]
    difficulty: "easy"

