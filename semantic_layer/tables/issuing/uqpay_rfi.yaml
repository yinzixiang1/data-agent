table:
  name: "uqpay_rfi"
  database: "dwd_banking"
  display_name: "uqpay补件表"
  description: |
    这张表记录uqpay补件相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uqpay", "补件", "uqpay_rfi"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "rfi_id"
    type: "varchar(36)"
    display_name: "补件id"
    description: "uqpay补件表字段 rfi_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "AccountId"

  - name: "questions"
    type: "text"
    display_name: "RFI问题"
    description: "RFI问题（数组）"
    skip_index: true

  - name: "answer"
    type: "text"
    display_name: "RFI回答"
    description: "RFI回答（数组）"
    skip_index: true

  - name: "customer_id"
    type: "varchar(36)"
    display_name: "客户ID"
    description: "客户ID"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

  - name: "rfi_status"
    type: "varchar(20)"
    display_name: "状态"
    description: "状态：拒绝(REJECTED), 通过(APPROVED), 已提交(SUBMITTED_PENDING)，待处理(ACTION_REQUIRED)"

  - name: "short_reference_id"
    type: "varchar(64)"
    display_name: "短号"
    description: "短号"

  - name: "rfi_type"
    type: "varchar(100)"
    display_name: "RFI类型"
    description: "RFI类型：onboarding，transaction"

  - name: "business_code"
    type: "smallint"
    display_name: "1000=Banking，2000=Foreig"
    description: "1000=Banking，2000=Foreign，3000=Acquiring，4000=Issuing，5000=Ramp"
    enum_values:
      - {value: 1000, label: "Banking"}
      - {value: 2000, label: "Foreign"}
      - {value: 3000, label: "Acquiring"}
      - {value: 4000, label: "Issuing"}
      - {value: 5000, label: "Ramp"}

  - name: "ref_reference_id"
    type: "varchar(36)"
    display_name: "关联长号"
    description: "关联长号"

  - name: "ref_short_reference_id"
    type: "varchar(30)"
    display_name: "关联短号"
    description: "关联短号"

relations: []

common_queries:
  - question: "uqpay补件表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_rfi`;
    tables: ["uqpay_rfi"]
    difficulty: "easy"
  - question: "最近30天uqpay补件表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_rfi`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uqpay_rfi"]
    difficulty: "easy"
  - question: "uqpay补件表按状态分布"
    sql: |
      SELECT
          rfi_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uqpay_rfi`
      GROUP BY rfi_status
      ORDER BY COUNT(*) DESC;
    tables: ["uqpay_rfi"]
    difficulty: "easy"
  - question: "uqpay补件表按account_id分布最多的是哪些"
    sql: |
      SELECT account_id AS "account_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_rfi`
      WHERE account_id IS NOT NULL AND account_id != ''
      GROUP BY account_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uqpay_rfi"]
    difficulty: "easy"

