table:
  name: "pmt_service_product"
  database: "dwd_banking"
  display_name: "产品表"
  description: |
    这张表记录支付/银行账户业务中的产品。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "服务", "产品", "pmt_service_product"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "product_id"
    type: "int"
    display_name: "产品id"
    description: "产品表字段 product_id。"

  - name: "restrict_id"
    type: "int"
    display_name: "关联约束ID"
    description: "关联约束ID"

  - name: "rate_scheme_id"
    type: "varchar(36)"
    display_name: "费率ID"
    description: "费率ID"

  - name: "auth_trade_type"
    type: "text"
    display_name: "授权交易类型JSON"
    description: "授权交易类型JSON"
    skip_index: true

  - name: "meta_data"
    type: "text"
    display_name: "元数据"
    description: "元数据"
    skip_index: true

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "产品表字段 update_time。"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "产品表字段 create_time。"

  - name: "product_status"
    type: "tinyint(1)"
    display_name: "产品状态"
    description: "产品状态：0=关闭 1=开通"
    enum_values:
      - {value: 0, label: "关闭"}
      - {value: 1, label: "开通"}

  - name: "review_status"
    type: "tinyint(1)"
    display_name: "审查状态"
    description: "审查状态：1=passed, 0=in_review, -1=rejected"
    enum_values:
      - {value: 1, label: "passed"}
      - {value: 0, label: "in_review"}
      - {value: -1, label: "rejected"}

relations: []

common_queries:
  - question: "产品表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_service_product`;
    tables: ["pmt_service_product"]
    difficulty: "easy"
  - question: "最近30天产品表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_service_product`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_service_product"]
    difficulty: "easy"
  - question: "产品表按状态分布"
    sql: |
      SELECT
          CASE product_status
            WHEN 0 THEN '关闭'
            WHEN 1 THEN '开通'
            ELSE CONCAT('其他:', CAST(product_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_service_product`
      GROUP BY product_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_service_product"]
    difficulty: "medium"

review_required:
