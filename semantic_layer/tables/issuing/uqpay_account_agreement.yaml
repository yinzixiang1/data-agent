table:
  name: "uqpay_account_agreement"
  database: "dwd_banking"
  display_name: "客户协议记录表"
  description: |
    这张表记录客户协议记录相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "账户", "uqpay", "协议", "uqpay_account_agreement"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "account_agreement_id"
    type: "varchar(36)"
    display_name: "主ID"
    description: "主ID"

  - name: "agreement_id"
    type: "varchar(36)"
    display_name: "协议ID"
    description: "协议ID"

  - name: "agreement_version_id"
    type: "varchar(36)"
    display_name: "协议版本ID"
    description: "协议版本ID"

  - name: "user_id"
    type: "varchar(36)"
    display_name: "userid"
    description: "userid"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "account ID"

  - name: "pushed_method"
    type: "varchar(36)"
    display_name: "推送方式"
    description: "推送方式：\"WEBSITE\", \"EMAIL\""
    sensitive: true

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "更新时间"

  - name: "signed_status"
    type: "smallint"
    display_name: "签署状态"
    description: "签署状态：-1=expired，0=pending，1=signed，2=未签署"
    enum_values:
      - {value: -1, label: "expired"}
      - {value: 0, label: "pending"}
      - {value: 1, label: "signed"}
      - {value: 2, label: "未签署"}

  - name: "signed_user_id"
    type: "varchar(36)"
    display_name: "签署者user"
    description: "签署者user"

  - name: "signed_tos_acceptance"
    type: "text"
    display_name: "签署痕迹"
    description: "签署痕迹：ip+agent+time+device"
    skip_index: true

  - name: "attach_file"
    type: "text"
    display_name: "签署文件"
    description: "签署文件：{\"storage_location\": 0, \"type\": \"\", \"name\": \"\", \"path\": \"\", \"size\": \"\"}"
    skip_index: true

relations: []

common_queries:
  - question: "客户协议记录表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_account_agreement`;
    tables: ["uqpay_account_agreement"]
    difficulty: "easy"
  - question: "最近30天客户协议记录表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_account_agreement`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uqpay_account_agreement"]
    difficulty: "easy"
  - question: "客户协议记录表按状态分布"
    sql: |
      SELECT
          CASE signed_status
            WHEN -1 THEN 'expired'
            WHEN 0 THEN 'pending'
            WHEN 1 THEN 'signed'
            WHEN 2 THEN '未签署'
            ELSE CONCAT('其他:', CAST(signed_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uqpay_account_agreement`
      GROUP BY signed_status
      ORDER BY COUNT(*) DESC;
    tables: ["uqpay_account_agreement"]
    difficulty: "medium"
  - question: "客户协议记录表按user_id分布最多的是哪些"
    sql: |
      SELECT user_id AS "user_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_account_agreement`
      WHERE user_id IS NOT NULL AND user_id != ''
      GROUP BY user_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uqpay_account_agreement"]
    difficulty: "easy"

