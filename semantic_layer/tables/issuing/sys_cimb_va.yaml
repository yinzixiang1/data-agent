table:
  name: "sys_cimb_va"
  database: "dwd_banking"
  display_name: "CIMB VA预备号表"
  description: |
    这张表记录系统侧的CIMB VA预备号。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "CIMB", "虚拟账户", "sys_cimb_va"]
  query_tips: "时间范围优先使用 update_time 字段。"

columns:
  - name: "client_id"
    type: "varchar(4)"
    display_name: "Client ID=101701"
    description: "Client ID=101701"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "CIMB VA预备号表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "CIMB VA预备号表字段 account_id。"

  - name: "short_account_id"
    type: "varchar(36)"
    display_name: "账户短号"
    description: "CIMB VA预备号表字段 short_account_id。"

  - name: "status"
    type: "tinyint"
    display_name: "状态"
    description: "0: default; 2:pending; 1:actived"
    enum_values:
      - {value: 0, label: "default"}
      - {value: 2, label: "pending"}
      - {value: 1, label: "actived"}

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "CIMB VA预备号表字段 update_time。"

relations: []

common_queries:
  - question: "CIMB VA预备号表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_cimb_va`;
    tables: ["sys_cimb_va"]
    difficulty: "easy"
  - question: "最近30天CIMB VA预备号表每天新增多少"
    sql: |
      SELECT DATE(update_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_cimb_va`
      WHERE update_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(update_time)
      ORDER BY DATE(update_time) DESC;
    tables: ["sys_cimb_va"]
    difficulty: "easy"
  - question: "CIMB VA预备号表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN 0 THEN 'default'
            WHEN 2 THEN 'pending'
            WHEN 1 THEN 'actived'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`sys_cimb_va`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["sys_cimb_va"]
    difficulty: "medium"
  - question: "CIMB VA预备号表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_cimb_va`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["sys_cimb_va"]
    difficulty: "easy"

