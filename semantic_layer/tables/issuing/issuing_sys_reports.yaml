table:
  name: "issuing_sys_reports"
  database: "dwd_banking"
  display_name: "HUB报告生成记录表"
  description: |
    这张表记录 UQPAY 发卡业务中的HUB报告生成记录。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "系统", "报表", "issuing_sys_reports"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "report_id"
    type: "varchar(36)"
    display_name: "长号"
    description: "长号"

  - name: "report_type"
    type: "text"
    display_name: "报表type"
    description: "HUB报告生成记录表字段 report_type。"
    skip_index: true

  - name: "currency"
    type: "varchar(255)"
    display_name: "币种"
    description: "币种"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "HUB报告生成记录表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "HUB报告生成记录表字段 update_time。"

  - name: "report_to_email"
    type: "varchar(255)"
    display_name: "报告邮箱"
    description: "报告邮箱"
    sensitive: true

  - name: "report_parameters"
    type: "text"
    display_name: "{\\n        \"from_create_"
    description: " {\\n        \"from_create_time”: \"2022-02-22\",\\n        \"to_create_time\": \"2022-02-25\",\\n        \"transaction_type\": \"conversion\"\\n}"
    skip_index: true

  - name: "short_reference_id"
    type: "varchar(36)"
    display_name: "shortreferenceid"
    description: "HUB报告生成记录表字段 short_reference_id。"

  - name: "report_status"
    type: "tinyint(1)"
    display_name: "-1=failed"
    description: "-1=failed, 0=pending,1=success"
    enum_values:
      - {value: -1, label: "failed"}
      - {value: 0, label: "pending"}
      - {value: 1, label: "success"}

  - name: "failed_reason"
    type: "text"
    display_name: "失败原因"
    description: "失败原因"
    skip_index: true

relations: []

common_queries:
  - question: "HUB报告生成记录表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_sys_reports`;
    tables: ["issuing_sys_reports"]
    difficulty: "easy"
  - question: "最近30天HUB报告生成记录表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_sys_reports`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_sys_reports"]
    difficulty: "easy"
  - question: "HUB报告生成记录表按状态分布"
    sql: |
      SELECT
          CASE report_status
            WHEN -1 THEN 'failed'
            WHEN 0 THEN 'pending'
            WHEN 1 THEN 'success'
            ELSE CONCAT('其他:', CAST(report_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_sys_reports`
      GROUP BY report_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_sys_reports"]
    difficulty: "medium"

