table:
  name: "issuing_channel_card_pool"
  database: "dwd_banking"
  display_name: "发卡渠道卡片池表"
  description: |
    这张表记录 UQPAY 发卡业务中的发卡渠道卡片池。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "卡片", "渠道", "池", "issuing_channel_card_pool"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "master_id"
    type: "varchar(36)"
    display_name: "分配给某个机构"
    description: "分配给某个机构"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "发卡渠道卡片池表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "发卡渠道卡片池表字段 account_id。"

  - name: "mask_card_number"
    type: "varchar(36)"
    display_name: "脱敏卡号"
    description: "发卡渠道卡片池表字段 mask_card_number。"
    sensitive: true

  - name: "pan_encrypted"
    type: "varchar(128)"
    display_name: "加密PAN"
    description: "加密的PAN number"
    sensitive: true

  - name: "pan_last_digits"
    type: "varchar(4)"
    display_name: "PAN number 后4位"
    description: "PAN number 后4位"
    sensitive: true

  - name: "pan_hash"
    type: "varchar(64)"
    display_name: "PAN哈希"
    description: "PAN sha256 hash值"
    sensitive: true

  - name: "status"
    type: "tinyint"
    display_name: "状态"
    description: "0:未使用；1:已使用；"
    enum_values:
      - {value: 0, label: "未使用"}
      - {value: 1, label: "已使用"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "发卡渠道卡片池表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "发卡渠道卡片池表字段 update_time。"

relations: []

common_queries:
  - question: "发卡渠道卡片池表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_card_pool`;
    tables: ["issuing_channel_card_pool"]
    difficulty: "easy"
  - question: "最近30天发卡渠道卡片池表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_card_pool`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_channel_card_pool"]
    difficulty: "easy"
  - question: "发卡渠道卡片池表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN 0 THEN '未使用'
            WHEN 1 THEN '已使用'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_channel_card_pool`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_channel_card_pool"]
    difficulty: "medium"
  - question: "发卡渠道卡片池表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_channel_card_pool`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_channel_card_pool"]
    difficulty: "easy"

