table:
  name: "issuing_card_refund_order"
  database: "dwd_banking"
  display_name: "ISSUING card 退款记录表"
  description: |
    这张表记录 UQPAY 发卡业务中的ISSUING card 退款记录。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "卡片", "退款", "订单", "issuing_card_refund_order"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "refund_id"
    type: "varchar(36)"
    display_name: "退款id"
    description: "ISSUING card 退款记录表字段 refund_id。"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "ISSUING card 退款记录表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "ISSUING card 退款记录表字段 account_id。"

  - name: "refund_amount"
    type: "decimal(16,2)"
    display_name: "原订单本金"
    description: "原订单本金"

  - name: "refund_currency"
    type: "varchar(6)"
    display_name: "原订单币种"
    description: "原订单币种"

  - name: "refund_type"
    type: "int"
    display_name: "1000=开卡 2000=卡充值 3000=卡提"
    description: "1000=开卡 2000=卡充值 3000=卡提现"
    enum_values:
      - {value: 1000, label: "开卡"}
      - {value: 2000, label: "卡充值"}
      - {value: 3000, label: "卡提现"}

  - name: "short_account_id"
    type: "varchar(36)"
    display_name: "账户短号"
    description: "ISSUING card 退款记录表字段 short_account_id。"

  - name: "short_reference_id"
    type: "varchar(36)"
    display_name: "shortreferenceid"
    description: "ISSUING card 退款记录表字段 short_reference_id。"

  - name: "ref_reference_id"
    type: "varchar(36)"
    display_name: "关联订单ID"
    description: "关联订单ID"

  - name: "ref_short_reference_id"
    type: "varchar(36)"
    display_name: "关联订单短ID"
    description: "关联订单短ID"

  - name: "transaction_id"
    type: "varchar(36)"
    display_name: "关联流水ID"
    description: "关联流水ID"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "ISSUING card 退款记录表字段 update_time。"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "ISSUING card 退款记录表字段 create_time。"

  - name: "review_status"
    type: "int"
    display_name: "1"
    description: "1: 审核通过 -1: 审核拒绝"
    enum_values:
      - {value: 1, label: "审核通过"}
      - {value: -1, label: "审核拒绝"}

  - name: "refund_status"
    type: "tinyint(1)"
    display_name: "退款状态"
    description: "-1失败，1成功"

relations: []

common_queries:
  - question: "ISSUING card 退款记录表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_refund_order`;
    tables: ["issuing_card_refund_order"]
    difficulty: "easy"
  - question: "最近30天ISSUING card 退款记录表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_refund_order`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_card_refund_order"]
    difficulty: "easy"
  - question: "ISSUING card 退款记录表按状态分布"
    sql: |
      SELECT
          CASE review_status
            WHEN 1 THEN '审核通过'
            WHEN -1 THEN '审核拒绝'
            ELSE CONCAT('其他:', CAST(review_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_card_refund_order`
      GROUP BY review_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_card_refund_order"]
    difficulty: "medium"
  - question: "ISSUING card 退款记录表按币种汇总金额"
    sql: |
      SELECT refund_currency AS "币种", COUNT(*) AS "笔数", SUM(refund_amount) AS "金额"
      FROM dwd_banking.`issuing_card_refund_order`
      GROUP BY refund_currency
      ORDER BY SUM(refund_amount) DESC;
    tables: ["issuing_card_refund_order"]
    difficulty: "medium"
  - question: "ISSUING card 退款记录表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_refund_order`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_card_refund_order"]
    difficulty: "easy"

