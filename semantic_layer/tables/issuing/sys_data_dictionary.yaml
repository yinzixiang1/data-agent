table:
  name: "sys_data_dictionary"
  database: "dwd_banking"
  display_name: "数据字典表"
  description: |
    这张表记录系统侧的数据字典。
    每行代表一个系统配置、字典、任务、权限或操作记录。
    查询时应区分业务事实表和系统配置表，避免将配置记录误当作交易流水。
  tags: ["系统配置", "sys", "系统", "data", "dictionary", "sys_data_dictionary"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "id"
    type: "bigint"
    display_name: "主键ID"
    description: "数据字典表字段 id。"

  - name: "dict_value"
    type: "text"
    display_name: "字典值，可存储动态内容"
    description: "字典值，可存储动态内容"
    skip_index: true

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "添加时间"

  - name: "status"
    type: "tinyint"
    display_name: "状态"
    description: "状态：1-启用，-1-禁用"
    enum_values:
      - {value: 1, label: "启用"}
      - {value: -1, label: "禁用"}

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "数据字典表字段 update_time。"

relations: []

common_queries:
  - question: "数据字典表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_data_dictionary`;
    tables: ["sys_data_dictionary"]
    difficulty: "easy"
  - question: "最近30天数据字典表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`sys_data_dictionary`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["sys_data_dictionary"]
    difficulty: "easy"
  - question: "数据字典表按状态分布"
    sql: |
      SELECT
          CASE status
            WHEN 1 THEN '启用'
            WHEN -1 THEN '禁用'
            ELSE CONCAT('其他:', CAST(status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`sys_data_dictionary`
      GROUP BY status
      ORDER BY COUNT(*) DESC;
    tables: ["sys_data_dictionary"]
    difficulty: "medium"

review_required:
  - "未发现可确认的真实代码 JOIN，relations 暂不配置，避免猜测关联。"
