table:
  name: "pmt_channel_transactions_record"
  database: "dwd_banking"
  display_name: "渠道交易记录表"
  description: |
    这张表记录支付/银行账户业务中的渠道交易记录。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "交易", "渠道", "记录", "pmt_channel_transactions_record"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "id"
    type: "bigint"
    display_name: "主键ID"
    description: "渠道交易记录表字段 id。"

  - name: "record_id"
    type: "varchar(36)"
    display_name: "记录id"
    description: "渠道交易记录表字段 record_id。"

  - name: "record_type"
    type: "smallint"
    display_name: "记录类型"
    description: "记录类型：1000=payin, 1001=deposit, 1002=transfer in,  2000=payout, 2001=transfer out, 3000=conversion，8001=refund"
    enum_values:
      - {value: 1000, label: "payin"}
      - {value: 1001, label: "deposit"}
      - {value: 1002, label: "transfer in"}
      - {value: 2000, label: "payout"}
      - {value: 2001, label: "transfer out"}
      - {value: 3000, label: "conversion"}
      - {value: 8001, label: "refund"}

  - name: "channel_req_id"
    type: "varchar(100)"
    display_name: "渠道reqid"
    description: "渠道交易记录表字段 channel_req_id。"

  - name: "channel_req_body"
    type: "text"
    display_name: "渠道reqbody"
    description: "渠道交易记录表字段 channel_req_body。"
    skip_index: true

  - name: "channel_resp_id"
    type: "varchar(100)"
    display_name: "渠道respid"
    description: "渠道交易记录表字段 channel_resp_id。"

  - name: "channel_resp_status"
    type: "varchar(20)"
    display_name: "渠道respstatus"
    description: "渠道交易记录表字段 channel_resp_status。"

  - name: "channel_resp_body"
    type: "text"
    display_name: "渠道respbody"
    description: "渠道交易记录表字段 channel_resp_body。"
    skip_index: true

  - name: "execute_reason"
    type: "text"
    display_name: "对应失败原因"
    description: "对应失败原因"
    skip_index: true

  - name: "ref_reference_id"
    type: "varchar(36)"
    display_name: "refreferenceid"
    description: "渠道交易记录表字段 ref_reference_id。"

  - name: "ref_short_reference_id"
    type: "varchar(30)"
    display_name: "refshortreferenceid"
    description: "渠道交易记录表字段 ref_short_reference_id。"

  - name: "record_status"
    type: "smallint"
    display_name: "记录状态"
    description: "记录状态：-1=失败，0=pending，1=completed"
    enum_values:
      - {value: -1, label: "失败"}
      - {value: 0, label: "pending"}
      - {value: 1, label: "completed"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

relations: []

common_queries:
  - question: "渠道交易记录表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_channel_transactions_record`;
    tables: ["pmt_channel_transactions_record"]
    difficulty: "easy"
  - question: "最近30天渠道交易记录表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_channel_transactions_record`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_channel_transactions_record"]
    difficulty: "easy"
  - question: "渠道交易记录表按状态分布"
    sql: |
      SELECT
          channel_resp_status AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_channel_transactions_record`
      GROUP BY channel_resp_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_channel_transactions_record"]
    difficulty: "easy"

