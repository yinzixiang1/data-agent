table:
  name: "pmt_finance_transfer"
  database: "dwd_banking"
  display_name: "账户内部转账表"
  description: |
    这张表记录支付/银行账户业务中的账户内部转账。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "资金", "转账", "pmt_finance_transfer"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "账户内部转账表字段 direct_id。"

  - name: "transfer_id"
    type: "varchar(36)"
    display_name: "转账id"
    description: "账户内部转账表字段 transfer_id。"

  - name: "source_account_id"
    type: "varchar(36)"
    display_name: "source账户id"
    description: "账户内部转账表字段 source_account_id。"

  - name: "short_account_id"
    type: "varchar(36)"
    display_name: "账户短号"
    description: "对应的是source account的短号"

  - name: "source_balance_type"
    type: "int"
    display_name: "transfer来源账户余额类型 1000=VA"
    description: "transfer来源账户余额类型 1000=VA 2000=FX(预留), 3000=AC, 4000=IC"
    enum_values:
      - {value: 1000, label: "VA"}
      - {value: 2000, label: "FX(预留)"}
      - {value: 3000, label: "AC"}
      - {value: 4000, label: "IC"}

  - name: "target_account_id"
    type: "varchar(36)"
    display_name: "target账户id"
    description: "账户内部转账表字段 target_account_id。"

  - name: "target_balance_type"
    type: "int"
    display_name: "transfer目标账户余额类型 1000=VA"
    description: "transfer目标账户余额类型 1000=VA 2000=FX(预留), 3000=AC, 4000=IC"
    enum_values:
      - {value: 1000, label: "VA"}
      - {value: 2000, label: "FX(预留)"}
      - {value: 3000, label: "AC"}
      - {value: 4000, label: "IC"}

  - name: "transfer_currency"
    type: "varchar(6)"
    display_name: "转账币种"
    description: "账户内部转账表字段 transfer_currency。"

  - name: "transfer_amount"
    type: "decimal(16,2)"
    display_name: "转账amount"
    description: "账户内部转账表字段 transfer_amount。"

  - name: "fee_amount"
    type: "decimal(16,2)"
    display_name: "手续费"
    description: "手续费"

  - name: "short_reference_id"
    type: "varchar(36)"
    display_name: "shortreferenceid"
    description: "账户内部转账表字段 short_reference_id。"

  - name: "unique_request_id"
    type: "varchar(36)"
    display_name: "uniquerequestid"
    description: "账户内部转账表字段 unique_request_id。"
    skip_index: true

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "creatorid"
    description: "账户内部转账表字段 creator_id。"

  - name: "transaction_id"
    type: "varchar(36)"
    display_name: "交易记录表id"
    description: "交易记录表id"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "账户内部转账表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "账户内部转账表字段 update_time。"

  - name: "debit_status"
    type: "tinyint(1)"
    display_name: "扣款状态 -1=异常 0=默认 1=已扣款"
    description: "扣款状态 -1=异常 0=默认 1=已扣款"
    enum_values:
      - {value: -1, label: "异常"}
      - {value: 0, label: "默认"}
      - {value: 1, label: "已扣款"}

  - name: "review_status"
    type: "tinyint(1)"
    display_name: "审查状态"
    description: "审查状态：1=passed, 0=in_review, -1=rejected （Transfer In 不做审查）"
    enum_values:
      - {value: 1, label: "passed"}
      - {value: 0, label: "in_review"}
      - {value: -1, label: "rejected （Transfer In 不做审查）"}

  - name: "transfer_status"
    type: "tinyint(1)"
    display_name: "-1失败，1成功"
    description: "-1失败，1成功"

  - name: "ref_reference_id"
    type: "varchar(36)"
    display_name: "关联ID，有就存"
    description: "关联ID，有就存"

relations: []

common_queries:
  - question: "账户内部转账表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_transfer`;
    tables: ["pmt_finance_transfer"]
    difficulty: "easy"
  - question: "最近30天账户内部转账表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_transfer`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_finance_transfer"]
    difficulty: "easy"
  - question: "账户内部转账表按状态分布"
    sql: |
      SELECT
          CASE debit_status
            WHEN -1 THEN '异常'
            WHEN 0 THEN '默认'
            WHEN 1 THEN '已扣款'
            ELSE CONCAT('其他:', CAST(debit_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_finance_transfer`
      GROUP BY debit_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_finance_transfer"]
    difficulty: "medium"
  - question: "账户内部转账表按币种汇总金额"
    sql: |
      SELECT transfer_currency AS "币种", COUNT(*) AS "笔数", SUM(fee_amount) AS "金额"
      FROM dwd_banking.`pmt_finance_transfer`
      GROUP BY transfer_currency
      ORDER BY SUM(fee_amount) DESC;
    tables: ["pmt_finance_transfer"]
    difficulty: "medium"
  - question: "账户内部转账表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_transfer`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_finance_transfer"]
    difficulty: "easy"

