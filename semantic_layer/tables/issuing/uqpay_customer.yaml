table:
  name: "uqpay_customer"
  database: "dwd_banking"
  display_name: "客户主表"
  description: |
    这张表记录客户主相关数据。
    每行代表一个独立业务对象或处理记录，具体粒度以主键和业务ID字段为准。
    字段语义主要来自 DDL 注释和 issuing 代码扫描结果。
  tags: ["客户中心", "UQPAY", "uqpay", "客户", "uqpay_customer"]
  query_tips: "查询业务有效数据时通常需要增加 is_delete = 0。时间范围优先使用 create_time 字段。"

columns:
  - name: "parent_id"
    type: "varchar(36)"
    display_name: "上级ID"
    description: "上级ID"

  - name: "customer_id"
    type: "varchar(36)"
    display_name: "客户ID"
    description: "客户ID"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "上级ID"

  - name: "account_id"
    type: "varchar(50)"
    display_name: "账户ID"
    description: "外部ID记录存储"

  - name: "short_account_id"
    type: "varchar(20)"
    display_name: "账户短号"
    description: "短ID"

  - name: "business_code"
    type: "smallint"
    display_name: "1000=Banking，2000=Foreig"
    description: "1000=Banking，2000=Foreign，3000=Acquiring，4000=Issuing，5000=Ramp"
    enum_values:
      - {value: 1000, label: "Banking"}
      - {value: 2000, label: "Foreign"}
      - {value: 3000, label: "Acquiring"}
      - {value: 4000, label: "Issuing"}
      - {value: 5000, label: "Ramp"}

  - name: "entity_type"
    type: "smallint"
    display_name: "主体类型"
    description: "1000=individual 2000=company"
    enum_values:
      - {value: 1000, label: "individual"}
      - {value: 2000, label: "company"}

  - name: "identification_type"
    type: "smallint"
    display_name: "证件类型"
    description: "1000=passport, 1001=Drivers License，1002=National ID，2000=UEN"
    sensitive: true

  - name: "identification_value"
    type: "varchar(255)"
    display_name: "identification_type值"
    description: "identification_type值"
    sensitive: true

  - name: "contact_email"
    type: "varchar(240)"
    display_name: "联系email"
    description: "联系email"
    sensitive: true

  - name: "contact_phone"
    type: "varchar(32)"
    display_name: "联系手机号"
    description: "联系手机号"
    sensitive: true

  - name: "risk_status_code"
    type: "varchar(100)"
    display_name: "商户资料进入风控系统结果"
    description: "商户资料进入风控系统结果：000-pass；001-reject；002-warn；999-系统异常"
    enum_values:
      - {value: 000, label: "pass"}
      - {value: 001, label: "reject"}
      - {value: 002, label: "warn"}
      - {value: 999, label: "系统异常"}

  - name: "kyc_id"
    type: "varchar(36)"
    display_name: "KYC资料ID"
    description: "KYC资料ID"

  - name: "kyc_status"
    type: "varchar(20)"
    display_name: "KYC状态"
    description: "KYC状态：已过期(EXPIRED)，不通过(REJECTED)，审查中(UNDER_REVIEW)，已通过(APPROVED)，豁免(EXEMPTED)，待处理(ACTION_REQUIRED)"

  - name: "kyb_id"
    type: "varchar(36)"
    display_name: "KYB资料ID"
    description: "KYB资料ID"

  - name: "kyb_status"
    type: "varchar(20)"
    display_name: "KYB状态"
    description: "KYB状态：已过期(EXPIRED)，不通过(REJECTED)，审查中(UNDER_REVIEW)，已通过(APPROVED)，豁免(EXEMPTED)，待处理(ACTION_REQUIRED)"

  - name: "create_time"
    type: "datetime(3)"
    display_name: "创建时间"
    description: "创建时间"

  - name: "update_time"
    type: "datetime(3)"
    display_name: "更新时间"
    description: "最后更新时间"

  - name: "customer_status"
    type: "varchar(20)"
    display_name: "状态[对外]"
    description: "状态[对外]：已过期(EXPIRED)，拒绝(REJECTED)，未开始(NOT_STARTED), 通过(APPROVED), 草稿进行中(DRAFT_IN_PROGRESS)，已提交(SUBMITTED_PENDING)，待处理(ACTION_REQUIRED)"

  - name: "risk_review_status"
    type: "varchar(20)"
    display_name: "风控审查状态[对内]"
    description: "风控审查状态[对内]：可重启(SUSPEND)，已过期(EXPIRED)，拒绝/不通过(REJECTED)，默认待审查(PENDING_REVIEW)，审查中(UNDER_REVIEW)，已通过(APPROVED)，需关注 (ATTENTION_REQUIRED)，暂缓(ON_HOLD)，豁免(EXEMPTED)，待更新(UPDATE_REQUIRED)"

  - name: "risk_review_reason"
    type: "text"
    display_name: "风控审查原因"
    description: "风控审查原因"
    skip_index: true

  - name: "tab_step"
    type: "varchar(255)"
    display_name: "前端页面步骤存储json"
    description: "前端页面步骤存储json"
    skip_index: true

  - name: "risk_level"
    type: "int"
    display_name: "风险等级 0=无风险"
    description: "风险等级 0=无风险,>0风险等级,数值越大，风险越高"
    enum_values:
      - {value: 0, label: "无风险,>0风险等级,数值越大,风险越高"}

  - name: "external_id"
    type: "varchar(50)"
    display_name: "外部ID记录存储"
    description: "外部ID记录存储"

relations: []

common_queries:
  - question: "客户主表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_customer`;
    tables: ["uqpay_customer"]
    difficulty: "easy"
  - question: "最近30天客户主表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_customer`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["uqpay_customer"]
    difficulty: "easy"
  - question: "客户主表按状态分布"
    sql: |
      SELECT
          CASE risk_status_code
            WHEN 000 THEN 'pass'
            WHEN 001 THEN 'reject'
            WHEN 002 THEN 'warn'
            WHEN 999 THEN '系统异常'
            ELSE CONCAT('其他:', CAST(risk_status_code AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`uqpay_customer`
      GROUP BY risk_status_code
      ORDER BY COUNT(*) DESC;
    tables: ["uqpay_customer"]
    difficulty: "medium"
  - question: "客户主表按customer_id分布最多的是哪些"
    sql: |
      SELECT customer_id AS "customer_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`uqpay_customer`
      WHERE customer_id IS NOT NULL AND customer_id != ''
      GROUP BY customer_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["uqpay_customer"]
    difficulty: "easy"

