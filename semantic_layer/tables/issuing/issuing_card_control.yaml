table:
  name: "issuing_card_control"
  database: "dwd_banking"
  display_name: "卡控制表"
  description: |
    这张表记录 UQPAY 发卡业务中的卡控制。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "卡片", "控制", "issuing_card_control"]
  query_tips: "按业务主键、状态字段和创建时间过滤可减少扫描范围。"

columns:
