    type: "text"
    display_name: "卡控制规则\"limits\""
    description: "卡控制规则\"limits\": {\"currency\": \"SGD\",\"spendingLimits\": [{\"interval\": \"MONTHLY\",\"amount\": 1000,},{\"interval\": \"PER_TRANSACTION\",\"amount\": 75000,}],},"
    skip_index: true

relations: []

common_queries:
  - question: "卡控制表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_card_control`;
    tables: ["issuing_card_control"]
    difficulty: "easy"
  - question: "卡控制表按主键倒序查看最新记录"
    sql: |
      SELECT *
      FROM dwd_banking.`issuing_card_control`
      ORDER BY ccid DESC
      LIMIT 100;
    tables: ["issuing_card_control"]
    difficulty: "easy"
  - question: "查看卡控制表样例记录"
    sql: |
      SELECT *
      FROM dwd_banking.`issuing_card_control`
      LIMIT 100;
    tables: ["issuing_card_control"]
    difficulty: "easy"

