table:
  name: "pmt_service_rate_scheme_log"
  database: "dwd_banking"
  display_name: "费率方案记录表"
  description: |
    这张表记录支付/银行账户业务中的费率方案记录。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "服务", "费率", "scheme", "日志", "pmt_service_rate_scheme_log"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "rate_id"
    type: "varchar(36)"
    display_name: "费率ID"
    description: "费率ID"

  - name: "rate_type"
    type: "varchar(32)"
    display_name: "费率类型"
    description: "费率类型：FIXED_FEE=固定费用，FIXED_RATE=固定费率，TIERED_FEE=阶梯费用，TIERED_RATE=阶梯费率, MONTHLY_RATE=包月费率, BLENDED_RATE=混合费率, CAPPED_RATE=封顶费率"

  - name: "rate_target"
    type: "int"
    display_name: "适用对象"
    description: "适用对象：1000-merchant, 3000-product, 4000-channel"
    enum_values:
      - {value: 1000, label: "merchant"}
      - {value: 3000, label: "product"}
      - {value: 4000, label: "channel"}

  - name: "product_type"
    type: "int"
    display_name: "类型"
    description: "类型：1000=VA, 2000=FX, 3000=AC, 4000=IC"
    enum_values:
      - {value: 1000, label: "VA"}
      - {value: 2000, label: "FX"}
      - {value: 3000, label: "AC"}
      - {value: 4000, label: "IC"}

  - name: "auth_trade_type"
    type: "varchar(60)"
    display_name: "授权代码"
    description: "授权代码"

  - name: "scheme_params"
    type: "text"
    display_name: "费率参数-json值"
    description: "费率参数-json值"
    skip_index: true

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "费率方案记录表字段 create_time。"

  - name: "entity_id"
    type: "varchar(36)"
    display_name: "0=系统默认费率方案  !0=指定机构/代理费率"
    description: "0=系统默认费率方案  !0=指定机构/代理费率方案"
    enum_values:
      - {value: 0, label: "系统默认费率方案  !"}
      - {value: 0, label: "指定机构/代理费率方案"}

  - name: "entity_type"
    type: "int"
    display_name: "主体类型"
    description: "1000=普通账户；2000=License Payment Service Provider（LPSP）；2001=Technical Payment Service Provider（TPSP）；3000=Referral Payment Service  Provider（RPSP）"
    enum_values:
      - {value: 1000, label: "普通账户"}
      - {value: 2000, label: "License Payment Service Provider（LPSP）"}
      - {value: 2001, label: "Technical Payment Service Provider（TPSP）"}
      - {value: 3000, label: "Referral Payment Service  Provider（RPSP）"}

  - name: "allow_reverse_status"
    type: "tinyint(1)"
    display_name: "费率倒挂反转允许状态"
    description: "费率倒挂反转允许状态：0=默认正向费率， 1=允许倒挂反转"
    enum_values:
      - {value: 0, label: "默认正向费率"}
      - {value: 1, label: "允许倒挂反转"}

  - name: "short_reference_id"
    type: "varchar(20)"
    display_name: "短号"
    description: "短号"

  - name: "rate_status"
    type: "tinyint(1)"
    display_name: "-1"
    description: "-1:删除; 1:可用;"
    enum_values:
      - {value: -1, label: "删除"}
      - {value: 1, label: "可用"}

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "创建者ID"
    description: "创建者ID"

relations: []

common_queries:
  - question: "费率方案记录表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_service_rate_scheme_log`;
    tables: ["pmt_service_rate_scheme_log"]
    difficulty: "easy"
  - question: "最近30天费率方案记录表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_service_rate_scheme_log`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_service_rate_scheme_log"]
    difficulty: "easy"
  - question: "费率方案记录表按状态分布"
    sql: |
      SELECT
          CASE allow_reverse_status
            WHEN 0 THEN '默认正向费率'
            WHEN 1 THEN '允许倒挂反转'
            ELSE CONCAT('其他:', CAST(allow_reverse_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_service_rate_scheme_log`
      GROUP BY allow_reverse_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_service_rate_scheme_log"]
    difficulty: "medium"

