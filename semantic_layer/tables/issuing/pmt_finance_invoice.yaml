table:
  name: "pmt_finance_invoice"
  database: "dwd_banking"
  display_name: "账户invoice表"
  description: |
    这张表记录支付/银行账户业务中的账户invoice。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "资金", "账单", "pmt_finance_invoice"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "账户invoice表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "账户invoice表字段 account_id。"

  - name: "short_account_id"
    type: "varchar(20)"
    display_name: "账户短号"
    description: "商户短号"

  - name: "account_address"
    type: "varchar(255)"
    display_name: "账户address"
    description: "账户invoice表字段 account_address。"
    sensitive: true

  - name: "invoice_id"
    type: "varchar(36)"
    display_name: "invoice编号"
    description: "invoice编号"

  - name: "short_invoice_id"
    type: "varchar(20)"
    display_name: "invoice短编号"
    description: "invoice短编号"

  - name: "invoice_type"
    type: "int"
    display_name: "类型 1000=VA 2000=FX"
    description: "类型 1000=VA 2000=FX(预留), 3000=AC, 4000=IC"
    enum_values:
      - {value: 1000, label: "VA"}
      - {value: 2000, label: "FX(预留)"}
      - {value: 3000, label: "AC"}
      - {value: 4000, label: "IC"}

  - name: "invoice_email"
    type: "varchar(255)"
    display_name: "邮箱"
    description: "邮箱"
    sensitive: true

  - name: "currency"
    type: "varchar(3)"
    display_name: "币种"
    description: "币种"

  - name: "items"
    type: "text"
    display_name: "收费明细数组[pmt_service_invoi"
    description: "收费明细数组[pmt_service_invoice_scheme]"
    skip_index: true

  - name: "invoice_amount"
    type: "decimal(16,4)"
    display_name: "总费"
    description: "总费"

  - name: "debit_status"
    type: "int"
    display_name: "扣款状态 -1=异常，0=默认，1=已扣款"
    description: "扣款状态 -1=异常，0=默认，1=已扣款"
    enum_values:
      - {value: -1, label: "异常"}
      - {value: 0, label: "默认"}
      - {value: 1, label: "已扣款"}

  - name: "invoice_status"
    type: "int"
    display_name: "状态"
    description: "状态：-1=作废，0=默认草稿，1=正常"
    enum_values:
      - {value: -1, label: "作废"}
      - {value: 0, label: "默认草稿"}
      - {value: 1, label: "正常"}

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "创建时间"

  - name: "review_status"
    type: "tinyint(1)"
    display_name: "审查状态"
    description: "审查状态：1=passed，0=in_review，-1=rejected"
    enum_values:
      - {value: 1, label: "passed"}
      - {value: 0, label: "in_review"}
      - {value: -1, label: "rejected"}

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "账户invoice表字段 update_time。"

relations: []

common_queries:
  - question: "账户invoice表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_invoice`;
    tables: ["pmt_finance_invoice"]
    difficulty: "easy"
  - question: "最近30天账户invoice表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_invoice`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_finance_invoice"]
    difficulty: "easy"
  - question: "账户invoice表按状态分布"
    sql: |
      SELECT
          CASE debit_status
            WHEN -1 THEN '异常'
            WHEN 0 THEN '默认'
            WHEN 1 THEN '已扣款'
            ELSE CONCAT('其他:', CAST(debit_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_finance_invoice`
      GROUP BY debit_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_finance_invoice"]
    difficulty: "medium"
  - question: "账户invoice表按币种汇总金额"
    sql: |
      SELECT currency AS "币种", COUNT(*) AS "笔数", SUM(invoice_amount) AS "金额"
      FROM dwd_banking.`pmt_finance_invoice`
      GROUP BY currency
      ORDER BY SUM(invoice_amount) DESC;
    tables: ["pmt_finance_invoice"]
    difficulty: "medium"
  - question: "账户invoice表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_finance_invoice`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_finance_invoice"]
    difficulty: "easy"

review_required:
