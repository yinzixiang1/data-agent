table:
  name: "issuing_transaction_stats"
  database: "dwd_banking"
  display_name: "发卡交易统计表"
  description: |
    这张表记录 UQPAY 发卡业务中的发卡交易统计。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "交易", "统计", "issuing_transaction_stats"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "stats_type"
    type: "varchar(50)"
    display_name: "统计type"
    description: "发卡交易统计表字段 stats_type。"

  - name: "target_type"
    type: "varchar(20)"
    display_name: "对象 CARD/ACCOUNT"
    description: "对象 CARD/ACCOUNT "

  - name: "currency"
    type: "varchar(10)"
    display_name: "币种"
    description: "发卡交易统计表字段 currency。"

  - name: "total_amount"
    type: "decimal(18,2)"
    display_name: "当前统计总金额"
    description: "当前统计总金额"

  - name: "total_amount_history"
    type: "decimal(18,2)"
    display_name: "历史统计总金额"
    description: "历史统计总金额"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "发卡交易统计表字段 create_time。"

  - name: "total_amount_usd"
    type: "decimal(18,2)"
    display_name: "totalamountusd"
    description: "发卡交易统计表字段 total_amount_usd。"

relations: []

common_queries:
  - question: "发卡交易统计表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_transaction_stats`;
    tables: ["issuing_transaction_stats"]
    difficulty: "easy"
  - question: "最近30天发卡交易统计表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_transaction_stats`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_transaction_stats"]
    difficulty: "easy"
  - question: "发卡交易统计表按币种汇总金额"
    sql: |
      SELECT currency AS "币种", COUNT(*) AS "笔数", SUM(total_amount) AS "金额"
      FROM dwd_banking.`issuing_transaction_stats`
      GROUP BY currency
      ORDER BY SUM(total_amount) DESC;
    tables: ["issuing_transaction_stats"]
    difficulty: "medium"

