table:
  name: "pmt_message_notification"
  database: "dwd_banking"
  display_name: "商户-消息通知表"
  description: |
    这张表记录支付/银行账户业务中的商户-消息通知。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "消息", "通知", "pmt_message_notification"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "商户-消息通知表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "商户-消息通知表字段 account_id。"

  - name: "user_id"
    type: "varchar(36)"
    display_name: "用户id"
    description: "商户-消息通知表字段 user_id。"

  - name: "notification_type"
    type: "varchar(120)"
    display_name: "通知类型，名字即关联相应的模版文件"
    description: "通知类型，名字即关联相应的模版文件"

  - name: "notification_params"
    type: "text"
    display_name: "通知参数KV模式"
    description: "通知参数KV模式"
    skip_index: true

  - name: "notification_content"
    type: "longtext"
    display_name: "发送内容"
    description: "发送内容"
    skip_index: true

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "商户-消息通知表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "商户-消息通知表字段 update_time。"

  - name: "short_account_id"
    type: "varchar(20)"
    display_name: "账户短号"
    description: "商户-消息通知表字段 short_account_id。"

  - name: "notification_verified"
    type: "tinyint(1)"
    display_name: "0=default"
    description: "0=default, 1=verified, -1=failed"
    enum_values:
      - {value: 0, label: "default"}
      - {value: 1, label: "verified"}
      - {value: -1, label: "failed"}

  - name: "notification_status"
    type: "tinyint(1)"
    display_name: "0=pending，1=success"
    description: "0=pending，1=success, -1=failed"
    enum_values:
      - {value: 0, label: "pending"}
      - {value: 1, label: "success"}
      - {value: -1, label: "failed"}

  - name: "batch_id"
    type: "varchar(32)"
    display_name: "批次号"
    description: "批次号"

  - name: "email_no"
    type: "varchar(120)"
    display_name: "emailno"
    description: "商户-消息通知表字段 email_no。"
    sensitive: true

  - name: "email_cc"
    type: "varchar(255)"
    display_name: "自定义通知邮件"
    description: "自定义通知邮件"
    sensitive: true

  - name: "receipt_id"
    type: "varchar(64)"
    display_name: "Receipt ID"
    description: "Receipt ID"

relations: []

common_queries:
  - question: "商户-消息通知表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_message_notification`;
    tables: ["pmt_message_notification"]
    difficulty: "easy"
  - question: "最近30天商户-消息通知表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_message_notification`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_message_notification"]
    difficulty: "easy"
  - question: "商户-消息通知表按状态分布"
    sql: |
      SELECT
          CASE notification_status
            WHEN 0 THEN 'pending'
            WHEN 1 THEN 'success'
            WHEN -1 THEN 'failed'
            ELSE CONCAT('其他:', CAST(notification_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`pmt_message_notification`
      GROUP BY notification_status
      ORDER BY COUNT(*) DESC;
    tables: ["pmt_message_notification"]
    difficulty: "medium"
  - question: "商户-消息通知表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_message_notification`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["pmt_message_notification"]
    difficulty: "easy"

