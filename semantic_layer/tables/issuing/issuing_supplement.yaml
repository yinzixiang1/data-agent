table:
  name: "issuing_supplement"
  database: "dwd_banking"
  display_name: "发卡补单表"
  description: |
    这张表记录 UQPAY 发卡业务中的发卡补单。
    每行代表一个独立业务对象、交易事件、配置项或处理流水，具体粒度以主键和业务ID字段为准。
    常用于发卡账户、卡片、交易、清算、对账、报表或渠道处理场景的查询分析。
  tags: ["发卡", "issuing", "补单", "issuing_supplement"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "id"
    type: "bigint"
    display_name: "主键ID"
    description: "发卡补单表字段 id。"

  - name: "supplement_id"
    type: "varchar(36)"
    display_name: "补单id"
    description: "发卡补单表字段 supplement_id。"

  - name: "direct_id"
    type: "varchar(36)"
    display_name: "直属账户ID"
    description: "发卡补单表字段 direct_id。"

  - name: "account_id"
    type: "varchar(36)"
    display_name: "账户ID"
    description: "发卡补单表字段 account_id。"

  - name: "card_id"
    type: "varchar(36)"
    display_name: "卡片ID"
    description: "发卡补单表字段 card_id。"

  - name: "card_number"
    type: "varchar(20)"
    display_name: "卡号"
    description: "发卡补单表字段 card_number。"
    sensitive: true

  - name: "pan_hash"
    type: "varchar(64)"
    display_name: "PAN哈希"
    description: "PAN sha256 hash值"
    sensitive: true

  - name: "mask_card_number"
    type: "varchar(36)"
    display_name: "脱敏卡号"
    description: "脱敏后的card number"
    sensitive: true

  - name: "card_mode"
    type: "int"
    display_name: "卡模式"
    description: "SINGLE MODE - 1000;SHARE MODE - 2000"
    enum_values:
      - {value: 1000, label: "SINGLE/单卡模式"}
      - {value: 2000, label: "SHARE/共享模式"}

  - name: "auth_amount"
    type: "decimal(16,2)"
    display_name: "auth amount"
    description: "auth amount"

  - name: "auth_currency"
    type: "varchar(4)"
    display_name: "auth currency"
    description: "auth currency"

  - name: "transaction_type"
    type: "int"
    display_name: "交易类型"
    description: "交易类型 6000=Settlement_Debit：补单为扣款操作; 6100=Settlement_Credit：补单为加款操作"
    enum_values:
      - {value: 6000, label: "Settlement_Debit：补单为扣款操作"}
      - {value: 6100, label: "Settlement_Credit：补单为加款操作"}

  - name: "transaction_amount"
    type: "decimal(16,4)"
    display_name: "交易amount"
    description: "发卡补单表字段 transaction_amount。"

  - name: "transaction_currency"
    type: "varchar(4)"
    display_name: "交易币种"
    description: "发卡补单表字段 transaction_currency。"

  - name: "short_account_id"
    type: "varchar(20)"
    display_name: "账户短号"
    description: "发卡补单表字段 short_account_id。"

  - name: "reference_id"
    type: "varchar(36)"
    display_name: "referenceid"
    description: "发卡补单表字段 reference_id。"

  - name: "original_txn_id"
    type: "varchar(36)"
    display_name: "原交易长ID"
    description: "原交易长ID"

  - name: "original_short_reference_id"
    type: "varchar(36)"
    display_name: "原交易短ID"
    description: "原交易短ID"

  - name: "reference_txn_id"
    type: "varchar(36)"
    display_name: "补单关联的卡交易表的transaction id"
    description: "补单关联的卡交易表的transaction id"

  - name: "reference_short_txn_id"
    type: "varchar(36)"
    display_name: "补单关联的卡交易表的short referenc"
    description: "补单关联的卡交易表的short reference id"

  - name: "audit_status"
    type: "int"
    display_name: "复核状态 1000=Pending"
    description: "复核状态 1000=Pending：待审核; 2000=Approved：审核通过; 3000=Rejected：审核拒绝"
    enum_values:
      - {value: 1000, label: "Pending：待审核"}
      - {value: 2000, label: "Approved：审核通过"}
      - {value: 3000, label: "Rejected：审核拒绝"}

  - name: "creator_id"
    type: "varchar(36)"
    display_name: "创建者ID"
    description: "创建者ID"

  - name: "auditor_id"
    type: "varchar(36)"
    display_name: "审核者ID"
    description: "审核者ID"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "发卡补单表字段 create_time。"

  - name: "update_time"
    type: "datetime"
    display_name: "更新时间"
    description: "发卡补单表字段 update_time。"

  - name: "supplement_status"
    type: "tinyint"
    display_name: "补单状态 0=pending; 1=comple"
    description: "补单状态 0=pending; 1=complete; -1=failed; 3=approved，awaiting settlement"
    enum_values:
      - {value: 0, label: "pending"}
      - {value: 1, label: "complete"}
      - {value: -1, label: "failed"}
      - {value: 3, label: "approved,awaiting settlement"}

  - name: "balance_type"
    type: "varchar(16)"
    display_name: "balance type"
    description: "balance type: card account "

  - name: "channel_transaction_type"
    type: "varchar(96)"
    display_name: "channel transaction type"
    description: "channel transaction type"

  - name: "channel_transaction_info"
    type: "text"
    display_name: "channel transaction deta"
    description: "channel transaction details"
    skip_index: true

  - name: "channel_transaction_id"
    type: "varchar(96)"
    display_name: "渠道交易id"
    description: "发卡补单表字段 channel_transaction_id。"

  - name: "order_type"
    type: "varchar(50)"
    display_name: "补单类型"
    description: "补单类型"

  - name: "amount"
    type: "decimal(16,2)"
    display_name: "金额"
    description: "补单金额（大账户）"

  - name: "balance_currency"
    type: "varchar(4)"
    display_name: "币种"
    description: "币种（大账户）"

  - name: "finance_reference_id"
    type: "varchar(36)"
    display_name: "issuing_finance_transact"
    description: "issuing_finance_transactions表的short_reference_id"

relations: []

common_queries:
  - question: "发卡补单表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_supplement`;
    tables: ["issuing_supplement"]
    difficulty: "easy"
  - question: "最近30天发卡补单表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_supplement`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["issuing_supplement"]
    difficulty: "easy"
  - question: "发卡补单表按状态分布"
    sql: |
      SELECT
          CASE audit_status
            WHEN 1000 THEN 'Pending：待审核'
            WHEN 2000 THEN 'Approved：审核通过'
            WHEN 3000 THEN 'Rejected：审核拒绝'
            ELSE CONCAT('其他:', CAST(audit_status AS STRING))
          END AS "状态",
          COUNT(*) AS "数量"
      FROM dwd_banking.`issuing_supplement`
      GROUP BY audit_status
      ORDER BY COUNT(*) DESC;
    tables: ["issuing_supplement"]
    difficulty: "medium"
  - question: "发卡补单表按币种汇总金额"
    sql: |
      SELECT transaction_currency AS "币种", COUNT(*) AS "笔数", SUM(transaction_amount) AS "金额"
      FROM dwd_banking.`issuing_supplement`
      GROUP BY transaction_currency
      ORDER BY SUM(transaction_amount) DESC;
    tables: ["issuing_supplement"]
    difficulty: "medium"
  - question: "发卡补单表按direct_id分布最多的是哪些"
    sql: |
      SELECT direct_id AS "direct_id", COUNT(*) AS "记录数"
      FROM dwd_banking.`issuing_supplement`
      WHERE direct_id IS NOT NULL AND direct_id != ''
      GROUP BY direct_id
      ORDER BY COUNT(*) DESC
      LIMIT 100;
    tables: ["issuing_supplement"]
    difficulty: "easy"

review_required:
