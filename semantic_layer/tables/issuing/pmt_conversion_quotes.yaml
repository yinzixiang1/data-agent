table:
  name: "pmt_conversion_quotes"
  database: "dwd_banking"
  display_name: "汇兑报价表"
  description: |
    这张表记录支付/银行账户业务中的汇兑报价。
    每行代表一个账户、订单、资金交易、配置或关联对象，具体粒度以业务ID字段为准。
    常用于账户、资金、付款、收款、换汇、产品配置和运营报表查询。
  tags: ["支付", "pmt", "换汇", "报价", "pmt_conversion_quotes"]
  query_tips: "时间范围优先使用 create_time 字段。"

columns:
  - name: "quote_id"
    type: "varchar(36)"
    display_name: "quoteid"
    description: "汇兑报价表字段 quote_id。"

  - name: "currency_pair"
    type: "varchar(8)"
    display_name: "交易对"
    description: "交易对"

  - name: "sell_currency"
    type: "varchar(6)"
    display_name: "sell币种"
    description: "汇兑报价表字段 sell_currency。"

  - name: "sell_amount"
    type: "decimal(16,2)"
    display_name: "sellamount"
    description: "汇兑报价表字段 sell_amount。"

  - name: "buy_currency"
    type: "varchar(6)"
    display_name: "buy币种"
    description: "汇兑报价表字段 buy_currency。"

  - name: "buy_amount"
    type: "decimal(16,2)"
    display_name: "buyamount"
    description: "汇兑报价表字段 buy_amount。"

  - name: "create_time"
    type: "datetime"
    display_name: "创建时间"
    description: "汇兑报价表字段 create_time。"

relations: []

common_queries:
  - question: "汇兑报价表有多少条记录"
    sql: |
      SELECT COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_conversion_quotes`;
    tables: ["pmt_conversion_quotes"]
    difficulty: "easy"
  - question: "最近30天汇兑报价表每天新增多少"
    sql: |
      SELECT DATE(create_time) AS "日期", COUNT(*) AS "记录数"
      FROM dwd_banking.`pmt_conversion_quotes`
      WHERE create_time >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
      GROUP BY DATE(create_time)
      ORDER BY DATE(create_time) DESC;
    tables: ["pmt_conversion_quotes"]
    difficulty: "easy"
  - question: "汇兑报价表按币种汇总金额"
    sql: |
      SELECT currency_pair AS "币种", COUNT(*) AS "笔数", SUM(sell_amount) AS "金额"
      FROM dwd_banking.`pmt_conversion_quotes`
      GROUP BY currency_pair
      ORDER BY SUM(sell_amount) DESC;
    tables: ["pmt_conversion_quotes"]
    difficulty: "medium"

