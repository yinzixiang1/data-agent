[project]
name = "data-agent"
version = "0.1.0"
requires-python = ">=3.11"
description = "NL2SQL Data Agent - RAG 检索体系"

dependencies = [
    "FlagEmbedding>=1.3",
    "faiss-cpu>=1.9",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pydantic>=2.10",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.0",
    "pymilvus>=2.4",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "anthropic>=0.40",
    "jieba>=0.42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
