[project]
name = "data-agent"
version = "0.1.0"
requires-python = ">=3.11"
description = "NL2SQL Data Agent - RAG 检索体系"

dependencies = [
    "numpy>=1.26",
    "pydantic>=2.10",
    "sqlalchemy>=2.0",
    "pymysql[rsa]>=1.1",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anyio>=4.0",
    "openai>=1.0",
    "openai-codex==0.147.0",
    "pymilvus>=2.4",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "anthropic>=0.40",
    "jieba>=0.42",
    "sqlglot>=26.0",
    "redshift-connector>=2.1.16",
    "sqlalchemy-redshift>=1.0.0",
    "cryptography>=43",
]

[project.optional-dependencies]
local-models = [
    "FlagEmbedding>=1.3",
    "faiss-cpu>=1.9",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]
